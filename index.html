 for free?"',bin:"specific change"},{t:'"Could you do something on the price?"',bin:"easy to brush off"},{t:'"Could you get it down to \xA328?"',bin:"specific change"}],expl:{card:"The card: name your number, or ask for one specific extra.",items:[{label:"Specific change",text:`"match the \xA324", "extra data" and "down to \xA328" each give them one thing to say yes to. Say they answer: "I can do \xA330." Now you can say: "Make it \xA329 and I'll stay."`,subs:[]},{label:"Easy to brush off",text:"",subs:['"Is that your best price?" just gets "Yes."','"Any chance of a discount?" makes "no" easy.','"Could you do something on the price?" is the trap: yes/no, so "No" ends it, and your \xA324 quote goes unused.']}]},bins:["easy to brush off","specific change"]},{n:4,fmt:"Type it",stem:["A plumber is standing in your kitchen. He's quoted \xA3380 to fix your boiler and is waiting for a yes. You've no idea what that job usually costs. Type what you'd say to ask for a better price without guessing a number."],quote:[],options:[],model:"What could you do on that price for me?",checks:`contains one of: what, how; contains one of: price, that, it, do, better, discount, less; ends with "?"; 15 words or fewer; no \xA3 and no digits; contains none of: lowest, best price, your best, the most, minimum, at least, budget, afford, don't suppose, any chance, no worries, if not, sorry, just wondering. Whole words, any case.`,after:["The card: don't know the fair price? Ask what they can do. Don't guess: a guess could be higher than he'd have taken.",`The model answer is open, so he answers with a number, not "no". Say he answers: "I could do \xA3340." Now you know there's room: "Could you do \xA3320 if I pay today?" If he says "That's the price, mate", you've lost nothing by asking.`,"Fails: any number (that's guessing), asking his lowest, and the card's soft openers."],modelRaw:'"What could you do on that price for me?"'},{n:5,fmt:"Say it",stem:["You want a sofa that's \xA3499 at a furni e",text:'"What problems does it have?"'}]},{h:"When to use it",items:[{t:"p",text:"You're checking something out before you commit, and they'd rather not mention the bad bits."},{t:"sit",text:"Buying second-hand, viewing a flat, the end of a job interview."}]},{h:"Why it works",items:[{t:"p",text:"Leaving a fault out is easy. Dodging a question that assumes one feels like lying, so most people own up."}]},{h:"Example",items:[{t:"sit",text:`A neighbour is selling her washing machine for \xA390. She says it's "great".`},{t:"say",who:"You",text:'"What problems does it have?"'},{t:"say",who:"Neighbour",text:`"The spin's a bit loud, and the door seal leaks."`},{t:"p",text:"Two faults you'd never have heard about. You offer \xA360."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:'Ask "what", never yes/no.',rest:""},{t:"good",text:'"What problems does it have?"'},{t:"bad",text:`"Is there anything wrong with it?" \u2192 "No, it's fine."`},{t:"bad",text:'"No problems, right?" \u2192 "Never had an issue."'},{t:"tip",n:2,title:"Flat, job or club? Ask what's worst or hardest about it.",rest:""},{t:"sit",text:"You're thinking of joining a five-a-side team. You ask one of the players:"},{t:"quote",text:`"What's the most annoying thing about the team?"`},{t:"tip",n:3,title:"Only assume a problem that's common for that kind of thing.",rest:""},{t:"sit",text:"You're buying a two-year-old phone."},{t:"bad",text:'"How bad was the water damage?" \u2192 you sound rude, and learn nothing.'}]},{h:"Avoid",items:[{t:"bad",text:`"Tell me about it" or "What's it like?" Broad questions get you the highlights, not the faults.`}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Across four studies, a question that assumed a problem got far more people to own up than a broad one. It didn't work for rare problems, and the asker came across as less warm (Minson, VanEpps, Yip and Schweitzer, 2018)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You're viewing a 2016 Ford Fiesta with 70,000 miles, for \xA34,800. The seller has spent five minutes on how reliable it's been. Which question gets you the catch?"],quote:[],options:[{k:"A",t:'"What problems does it have?"',ok:!0},{k:"B",t:`"It's been reliable, has it?"`,ok:!1},{k:"C",t:'"What problems has the engine rebuild caused?"',ok:!1},{k:"D",t:'"Is there anything wrong with it?"',ok:!1}],expl:{card:"The card: ask as if there's a problem, but only one that's common for that kind of thing.",items:[{k:"A",ok:!0,text:`Right. It assumes there's something, without guessing what. Say they answer: "The air con doesn't work, and the clutch is getting heavy." Now you can say: "That's a few hundred quid to fix. Would you do \xA34,385?"`,subs:[]},{k:"B",ok:!1,text:`The "no problems, right?" question. You'll usually get: "Never had an issue."`,subs:[]},{k:"C",ok:!1,text:"Assumes something unlikely, so you look rude and learn nothing.",subs:[]},{k:"D",ok:!1,text:`Yes/no, so "No, it's fine" is the easy answer.`,subs:[]}]}},{n:2,fmt:"Say it",stem:["You're at a flat viewing and the current tenant is in. Which question gets you the real downsides?"],quote:[],options:[{k:"A",t:`"What's it like living here?"`,ok:!1},{k:"B",t:'"Do you like living here?"',ok:!1},{k:"C",t:'"Have you had any issues with the landlord?"',ok:!1},{k:"D",t:`"What's the worst thing about living here?"`,ok:!0}],expl:{card:"The card: viewing a flat? Ask what's worst about it.",items:[{k:"D",ok:!0,text:`Right. It assumes there's a worst thing, so they name it. Say they answer: "The boiler packs in every winter and the landlord takes weeks to fix it." Now you can ask the agent: "Can the boiler be serviced before I move in?"`,subs:[]},{k:"A",ok:!1,text:"Broad, so you'll usually get the highlights, not the faults.",subs:[]},{k:"B",ok:!1,text:`Yes/no. You'll usually get: "Yeah, it's fine."`,subs:[]},{k:"C",ok:!1,text:`Yes/no again. You'll usually get: "No, he's alright."`,subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're at the end of a job interview and they ask: "Any questions for us?" Which question gets you the real downside of the job?`],quote:[],options:[{k:"A",t:`"What's the culture like here?"`,ok:!1},{k:"B",t:'"Would you say people are happy in this team?"',ok:!1},{k:"C",t:'"What do people find hardest about this role?"',ok:!0},{k:"D",t:'"Is there anything I should know before accepting?"',ok:!1}],expl:{card:"The card: for a job, ask what's hardest about it.",items:[{k:"C",ok:!0,text:'Right. It assumes something is hard, so they tell you what. Say they answer: "Honestly, the busy season. It can be 60-hour weeks in March." When they offer, you can say: "Given the busy season, could we look at the salary?"',subs:[]},{k:"A",ok:!1,text:`Broad, so you'll usually get the highlights: "Really friendly, lots of socials."`,subs:[]},{k:"B",ok:!1,text:`The "no problems, right?" kind of question. You'll usually get: "Yeah, everyone's great."`,subs:[]},{k:"D",ok:!1,text:'Yes/no, so "Not really" is the easy answer.',subs:[]}]}},{n:4,fmt:"Type it",stem:["You're buying a used e-bike on Marketplace for \xA3450. Type the question you'd send to find the catch."],quote:[],options:[],model:"What problems does it have?",checks:"contains one of: what, what's, whats, how, how's; first word (ignoring an opening hi, hey, hiya, hello, so, ok, okay, right or oh) is not a yes/no opener (is, are, was, do, does, did, can, could, would, will, has, have, any, no, it's); contains one of: problem, problems, issue, issues, wrong, fault, faults, broken, worst, catch, fixing, fixed, repair, repairs; contains none of: no problems, any problems, lowest, best price, would you take; no \xA3; 15 words or fewer. Whole words, any case.",after:[`The card: ask "what", as if there's a problem. Never yes/no.`,`The model answer gets the faults out. Say they answer: "The battery only does about 20 miles now." Now you can say: "A new battery's about \xA3150. Would you do \xA3350?"`,'Fails: yes/no openers ("Is there\u2026", "Any\u2026") and "no problems" questions, because they make "no" the easy answer.'],modelRaw:'"What problems does it have?"'}],mission:'next time you buy something second-hand or view a flat, ask "What problems does it have?", or at your next interview, "What do people find hardest about this role?", and count what comes out.'},{id:"1.3",title:"Ask the expert what they'd do",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"quote",text:'"If you were me, what would you do?"'},{t:"p",text:"Then stay quiet and let them answer."}]},{h:"When to use it",items:[{t:"p",text:"They know far more than you about what you're paying for, and you don't know what's fair."},{t:"sit",text:"A mechanic, a letting agent, your manager when you want a pay rise."}]},{h:"Why it works",items:[{t:"p",text:"Asked about the price, people defend it. Asked for advice, they start solving your problem, and they often suggest a cheaper option you didn't know existed."}]},{h:"Example",items:[{t:"sit",text:"The bike shop quotes \xA3120 for a full service."},{t:"say",who:"You",text:'"If it were your bike, what would you do?"'},{t:"say",who:"Them",text:'"Honestly? Just new brake pads. The rest is fine."'},{t:"p",text:"You pay \xA325, not \xA3120."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Keep it open.",rest:'Start with "what" or "how", never a yes/no question.'},{t:"good",text:'"If you were me, what would you do?"'},{t:"bad",text:'"If you were me, would you pay that?" \u2192 "Yeah, probably."'},{t:"tip",n:2,title:"Vague answer? Give one fact about you, then ask again.",rest:""},{t:"sit",text:`The mechanic says "I'd get it all done." You're selling the car next year.`},{t:"quote",text:`"I'm selling it next year. Which bits would you do now?"`}]},{h:"Don't use it when",items:[{t:"li",text:`**You already know the normal price.** Just say your number instead (lesson 1.1): "I've been quoted \xA324 elsewhere. Can you match it?"`},{t:"li",text:`**They've just brushed you off.** You'll get "Pay what I asked."`}]},{h:"Avoid",items:[{t:"bad",text:'"Why is it so much?" It sounds like a challenge, so they defend the price.'},{t:"bad",text:`"What's the lowest he'd take?" It asks for their limit, even dressed up as advice, so they won't help.`}]},{h:"Other ways to say it",items:[{t:"p",text:'"What would you do in my position?" \xB7 "How would you go about it?"'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"A classic move from *Getting to Yes*, untested."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["Your 2014 Fiesta is in for its MOT. The mechanic rings: it needs two front tyres, a new exhaust and front brake pads, \xA3620 all in. You've no idea what any of that should cost, and he's always been straight with you. What's your best reply?"],quote:[],options:[{k:"A",t:`"\xA3620? Why's it so expensive?"`,ok:!1},{k:"B",t:'"If it were your car, what would you do?"',ok:!0},{k:"C",t:'"If it were your car, would you get all that done?"',ok:!1},{k:"D",t:`"What's the cheapest you could do all that for?"`,ok:!1}],expl:{card:"The card: they know far more than you, so ask what they'd do. Keep it open.",items:[{k:"B",ok:!0,text:'Right. He switches to solving your problem. Say he answers: "Honestly? The tyres have to be done to pass. The exhaust and pads will last till spring." Now you can say: "Just the tyres for now, then."',subs:[]},{k:"A",ok:!1,text:`"Why" sounds like a challenge: "That's what parts cost."`,subs:[]},{k:"C",ok:!1,text:'The yes/no version: "Yeah, I would."',subs:[]},{k:"D",ok:!1,text:`Asks his limit, so that's the best you'll get: "\xA3600, and that's me being nice."`,subs:[]}]}},{n:2,fmt:"Say it",stem:["Your phone screen's cracked. The repair shop quotes \xA3140. You've checked online: two shops nearby do the same screen for \xA395 and \xA3110. The guy behind the counter is friendly and clearly knows phones. What's your best reply?"],quote:[],options:[{k:"A",t:'"If you were me, would you pay \xA3140 for it?"',ok:!1},{k:"B",t:`"What's the least you could do it for?"`,ok:!1},{k:"C",t:'"If you were me, what would you do about the screen?"',ok:!1},{k:"D",t:'"Another shop does it for \xA395. Could you match that?"',ok:!0}],expl:{card:"The card: don't use it when you already know the normal price. Just say your number (lesson 1.1).",items:[{k:"D",ok:!0,text:`Right. One number, with a reason. Say he answers: "I can do \xA3115." Now you can say: "Meet me at \xA3100 and it's a deal."`,subs:[]},{k:"A",ok:!1,text:`The yes/no version. You'll usually get: "Yeah, it's a fair price."`,subs:[]},{k:"B",ok:!1,text:`Asks for his lowest. You'll usually get: "\xA3130, best I can do."`,subs:[]},{k:"C",ok:!1,text:`The card's line, but you already know the price, so he picks: "Honestly? Get it done here, mate."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're applying through a letting agent for a one-bed listed at \xA31,300 a month. She's friendly, and she's let this landlord's flats for years. You'd like to pay less, and you've no idea what he'd accept. Which lines get her working out how to help you, and which get a short answer or a defence?"],quote:[],options:[],sort:[{t:'"If you were me, would you offer less?"',bin:"short answer or defence"},{t:`"You've let his flats for years. What would you do in my position?"`,bin:"gets her helping"},{t:'"Why is it \xA31,300 for a one-bed?"',bin:"short answer or defence"},{t:'"If you were me, how would you get him to come down a bit?"',bin:"gets her helping"},{t:`"If you were me, what's the lowest he'd take?"`,bin:"short answer or defence"},{t:'"What would you suggest I do to get the rent down?"',bin:"gets her helping"}],expl:{card:"The card: ask her advice, and keep it open.",items:[{label:"Gets her helping",text:`the three open advice questions. Say she answers: "He hates it sitting empty. Move in on the 1st and I'd put \xA31,250 to him." Now you can say: "Let's offer \xA31,250 from the 1st, then."`,subs:[]},{label:"Short answer or defence",text:"",subs:[`"Would you offer less?" is yes/no: "I wouldn't."`,`"What's the lowest he'd take?" is his lowest, dressed up: "I couldn't say."`,`"Why is it \xA31,300?" makes her defend the price: "That's the market round here."`]}]},bins:["short answer or defence","gets her helping"]},{n:4,fmt:"Say it",stem:[`You're in a phone shop, after a SIM-only plan. You've never had SIM-only, and you haven't looked at prices. You asked the adviser: "If you were me, which plan would you go for?" She says: "Honestly? Unlimited data, \xA330 a month. Everyone goes unlimited." You use about 8GB a month. What's your best next move?`],quote:[],options:[{k:"A",t:`"OK, fair enough. I'll go with unlimited, then."`,ok:!1},{k:"B",t:'"I only use about 8GB. Would you really pay \xA330 for that?"',ok:!1},{k:"C",t:'"Could you do me the unlimited one for \xA320 a month?"',ok:!1},{k:"D",t:'"I only use about 8GB a month. Which one would you go for?"',ok:!0}],expl:{card:"The card: vague answer? Give one fact about you, then ask again.",items:[{k:"D",ok:!0,text:`Right. Now she's solving your problem. Say she answers: "Then the 10GB plan at \xA312 is plenty." That's about \xA3216 a year less than her first answer.`,subs:[]},{k:"A",ok:!1,text:"Takes the standard answer. You'll usually pay \xA330 a month for data you don't use.",subs:[]},{k:"B",ok:!1,text:'Uses your fact, but as a yes/no challenge: "Yeah, I would."',subs:[]},{k:"C",ok:!1,text:'Guesses a number without knowing prices (lesson 1.1): "Sorry, \xA330 is the price."',subs:[]}]}},{n:5,fmt:"Type it",stem:["You've been at a small marketing agency for a year, on \xA324,000. You'd like a pay rise, but you don't know how rises work there or what's realistic. Your manager has always been in your corner. Type a question asking her advice on getting one."],quote:[],options:[],model:"If you were me, how would you go about getting a pay rise here?",checks:`contains one of: were me, was me, my shoes, my position, my place, my situation, if it was you, if it were you, you suggest, you recommend, you advise, your advice; contains one of: what, what's, how; first word (ignoring an opening hi, hey, hiya, so, ok, okay, right, honestly or quick) is not a yes/no opener (is, are, was, do, does, did, can, could, would, will, should, shall, has, have, any); ends with "?" (trailing emojis ignored); no \xA3, and no salary figure (a number with k, a comma, or four or more digits); contains none of: lowest, least, the most, max, maximum, budget, minimum, at least, afford, skint, why, deserve, owe, how much, what figure, what number, what amount, highest, top, ceiling; 25 words or fewer. Whole words, any case.`,after:["The card: she knows how rises work there, so ask what she'd do in your place.",`Say she answers: "Reviews are in March, and people who've run a client get bumped up. I'd ask for the Hughes account." If she says "Just keep doing what you're doing", ask again, more narrowly: "What would you need to see from me before the review?"`,`Fails: yes/no versions ("If you were me, would you ask?"), asking how much you could get, "why", and naming a figure you can't back up.`],modelRaw:'"If you were me, how would you go about getting a pay rise here?"'}],mission:`this week, ask one person who knows more than you about something you pay for or want (your phone provider, a mechanic, your manager): "If you were me, what would you do?" Write down one option they gave you that you didn't know existed.`},{id:"1.4",title:"Repeat their key words back",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When they give you a reason or a no, repeat their one to three key words back as a question, then stay quiet. That's a mirror."}]},{h:"When to use it",items:[{t:"p",text:"Someone gives a reason or a flat no, and you want to know what's behind it."},{t:"sit",text:"A seller who won't drop the price, a landlord raising the rent, a mate who can't pay you back yet."}]},{h:"Why it works",items:[{t:"p",text:"Hearing their own words as a question, people explain more. You haven't argued, and you haven't agreed to anything."}]},{h:"Example",items:[{t:"sit",text:'You ask your manager for Saturdays off. She says: "Weekends are tricky with the rota."'},{t:"say",who:"You",text:'"Tricky with the rota?"'},{t:"say",who:"Manager",text:'"Well, Jen wants Sundays off. If you two swap, it works."'},{t:"p",text:"You get your Saturdays without arguing."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Mirror the words you want explained, not just the last ones.",rest:""},{t:"sit",text:`The garage says: "The part's on back order, so it'll be next Friday."`},{t:"good",text:'"On back order?" \u2192 "Well, I could try another supplier."'},{t:"bad",text:'"Next Friday?" \u2192 "Yep, Friday."'},{t:"p",text:'Mirror their "no" and you just get the no again.'},{t:"tip",n:2,title:"Then stay quiet.",rest:"Don't add a reason, an apology or a number. Count to three in your head and let them fill the silence."},{t:"sit",text:'After "On back order?", say nothing until the garage does.'}]},{h:"Avoid",items:[{t:"bad",text:`"Really?" It isn't their words, so it sounds like you're calling them a liar.`},{t:"bad",text:"Three mirrors in a row. You sound like a parrot."}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick (Chris Voss)",text:"Taught by former FBI hostage negotiator Chris Voss. Repeating people's words is linked to more trust (waitresses who repeated orders got bigger tips), but nobody has tested whether it gets you a better price."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`Your landlord rings: "I'm going to need to put the rent up. Costs have gone up a lot this year." What's your best reply?`],quote:[],options:[{k:"A",t:'"Costs have gone up a lot?"',ok:!0},{k:"B",t:'"I understand. How much are we talking?"',ok:!1},{k:"C",t:`"That's fair, everything's more expensive now."`,ok:!1},{k:"D",t:'"This year?"',ok:!1}],expl:{card:"The card: mirror the words you want explained, not just the last ones.",items:[{k:"A",ok:!0,text:`Right. It gets them spelling out which costs. Say they answer: "Mainly the mortgage, and I had to replace the boiler." Now you can say: "The boiler's a one-off, so could we keep the rise smaller this year?"`,subs:[]},{k:"B",ok:!1,text:"Accepts the rise and only asks how big.",subs:[]},{k:"C",ok:!1,text:"Agrees it's justified before you've heard a number.",subs:[]},{k:"D",ok:!1,text:`A mirror, but of the wrong words. You'll usually get: "Yeah, it's been a bad one."`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`A seller messages: "I've had loads of interest, so I'm not really dropping the price." What's your best reply?`],quote:[],options:[{k:"A",t:'"Not dropping the price?"',ok:!1},{k:"B",t:'"Loads of interest?"',ok:!0},{k:"C",t:`"Fair enough. What's the lowest you'd go?"`,ok:!1},{k:"D",t:'"Really?"',ok:!1}],expl:{card:"The card: mirror the words you want explained.",items:[{k:"B",ok:!0,text:`Right. They have to back it up. Say they answer: "A couple of people messaged, but nobody's come to see it yet." Now you can say: "I'm free tonight. Would \xA3120 work?" If they say "Three are viewing tomorrow", move fast or let it go.`,subs:[]},{k:"A",ok:!1,text:'Mirrors the wrong words, so they repeat the "no".',subs:[]},{k:"C",ok:!1,text:"Asks their limit (lesson 1.1), so they'll name something near the asking price.",subs:[]},{k:"D",ok:!1,text:"Not a mirror. It sounds like you're calling them a liar.",subs:[]}]}},{n:3,fmt:"Type it",stem:[`On Vinted: "Can't go lower sorry, I've got other buyers interested." Type a mirror.`],quote:[],options:[],model:"Other buyers interested?",checks:`one to five words, all taken from their message; contains one of: other, buyers, interested; contains none of: lower, can't, sorry; ends with "?" (trailing emojis ignored); nothing added.`,after:[`The card: mirror the words you want them to explain. Here that's the other buyers, not the "can't go lower".`,`Say they answer: "Well, someone asked if it's still available." That's one maybe. Now you can make your offer.`,`Fails: mirroring "can't go lower" (they just repeat the no), or adding your own words.`],modelRaw:'"Other buyers interested?"'},{n:4,fmt:"Say it",stem:[`You've just said "Lower than \xA3500?" and the seller hasn't answered yet. What's your best next move?`],quote:[],options:[{k:"A",t:"Stay quiet and let them answer",ok:!0},{k:"B",t:'"Because I saw one online for \xA3420."',ok:!1},{k:"C",t:'"Would \xA3450 work for you?"',ok:!1},{k:"D",t:`"Sorry, I just mean it's a bit high."`,ok:!1}],expl:{card:"The card: after the mirror, stay quiet. It only works if they fill the space.",items:[{k:"A",ok:!0,text:`Right. Say they answer: "Well, I'd take \xA3460 if you can collect this week." That's \xA340 off without you asking.`,subs:[]},{k:"B",ok:!1,text:"Turns it into an argument, so they defend the \xA3500.",subs:[]},{k:"C",ok:!1,text:"Offers \xA3450 before you've heard what they'd actually take.",subs:[]},{k:"D",ok:!1,text:"Apologises, so they never have to explain the \xA3500.",subs:[]}]}}],mission:"mirror someone once today, then count three seconds in your head. See if they add more."},{id:"1.5",title:"Revive a deal that's gone quiet",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When someone goes quiet on something they started, send one line, then wait:"},{t:"quote",text:'"Have you given up on the [thing]?"'}]},{h:"When to use it",items:[{t:"p",text:"They started it, ignored a normal follow-up, and you need an answer."},{t:"sit",text:"A buyer who agreed a price, a client who asked for a quote, a recruiter who got in touch."}]},{h:"Why it works",items:[{t:"p",text:'"Are you still interested?" asks for a yes, which commits them, so silence is easier. Here the easy answer is "No", which means they still want it.'}]},{h:"Example",items:[{t:"sit",text:"A neighbour asked you to walk her dog. You quoted \xA360, chased once, then nothing for a week."},{t:"say",who:"You",text:'"Have you given up on the dog walking?"'},{t:"say",who:"Neighbour",text:`"No! Sorry, it's been mad. The 3rd to the 10th?"`},{t:"p",text:"Back on, at \xA360."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Wait until a normal chase has been ignored.",rest:"Send it first, and it sounds passive-aggressive."},{t:"sit",text:'The dog-walking neighbour went quiet. First: "Did my quote come through OK?" Ignored? Now send it.'},{t:"tip",n:2,title:"Don't add a way out.",rest:'"No" keeps them in. A way out lets them leave.'},{t:"bad",text:'"Have you given up on the dog walking? Totally fine if so!" \u2192 "Yes, sorry."'},{t:"tip",n:3,title:'If they say "Yes", stop chasing.',rest:"You've got your answer. Never sweeten it with a lower price."},{t:"sit",text:`She replies: "Yeah, sorry, my sister's doing it." Leave it there.`}]},{h:"Don't use it when",items:[{t:"li",text:"**They never started anything,** like someone you've cold-messaged. It sounds passive-aggressive."},{t:"li",text:"**They're senior to you,** like a hiring manager or your boss's boss. Same problem."},{t:"li",text:"**It's only been a few hours.** Same again."}]},{h:"Avoid",items:[{t:"bad",text:'"Just checking in!" or "Any update?" Easy to leave on read.'},{t:"bad",text:'"Are you still interested?" It asks for a yes.'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick (Chris Voss)",text:"Voss says it almost always gets a reply. Nobody has tested it."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You design websites on the side. A caf\xE9 owner asked you for a quote for a new site. You sent one (\xA3400) ten days ago and followed up once, with no reply. What's your best next message?"],quote:[],options:[{k:"A",t:'"Hi! Just checking you got my quote? \u{1F60A}"',ok:!1},{k:"B",t:'"Are you still keen to go ahead with the site?"',ok:!1},{k:"C",t:'"Have you given up on the website?"',ok:!0},{k:"D",t:'"Have you given up on the website? No worries if so!"',ok:!1}],expl:{card:"The card: they've gone quiet on something they started, so ask if they've given up, with no way out.",items:[{k:"C",ok:!0,text:`Right. The easy answer, "No", means she still wants the site. Say she replies: "Kind of. \xA3400 is more than we'd budgeted." Now you can mirror the real problem (lesson 1.4): "More than you'd budgeted?"`,subs:[]},{k:"A",ok:!1,text:'"Just checking" is easy to leave on read, like your first chase.',subs:[]},{k:"B",ok:!1,text:"Asks for a yes, so silence is easier.",subs:[]},{k:"D",ok:!1,text:`The right line, then the way out: "Yes, sorry, we'll leave it."`,subs:[]}]}},{n:2,fmt:"Spot it",stem:["Priya agreed to sell her bike for \xA3120. The buyer said he'd collect it on Saturday, then went quiet:","None of them got a reply. What should she have sent on Tuesday?"],quote:['Sunday, Priya: "Hi! Are you still coming for the bike?"','Tuesday, Priya: "Just checking in \u{1F60A}"',`Thursday, Priya: "No worries if you've changed your mind!"`],options:[{k:"A",t:'"Are you still OK to collect it this week?"',ok:!1},{k:"B",t:'"Have you given up on the bike?"',ok:!0},{k:"C",t:'"Sorry to chase! When are you able to collect?"',ok:!1},{k:"D",t:'"Let me know either way, no stress!"',ok:!1}],expl:{card:"The card: once a normal chase has been ignored, ask if they've given up on the thing they started.",items:[{k:"B",ok:!0,text:`Right. The easy answer, "No", means he still wants the bike. Say he replies: "No, sorry! Mad week. Can I come Saturday?" Now you can say: "Saturday's great. 10am?"`,subs:[]},{k:"A",ok:!1,text:"Asks for a yes again, like Sunday's message. You'll usually get more silence.",subs:[]},{k:"C",ok:!1,text:"Asks him to commit to a time, the reply he's been dodging. More silence.",subs:[]},{k:"D",ok:!1,text:`"No stress" hands him the way out: "Sorry, I'll leave it."`,subs:[]}]}},{n:3,fmt:"Say it",stem:["A recruiter messaged you on LinkedIn about a junior marketing job at a Leeds agency, and put you forward. Ten days ago, the agency's head of marketing interviewed you. Since then, nothing from either of them, and the recruiter hasn't answered your email on Monday asking for news. What's your best move?"],quote:[],options:[{k:"A",t:'Message the recruiter: "Have you given up on the Leeds role?"',ok:!0},{k:"B",t:'Email the head of marketing: "Have you given up on me for the role?"',ok:!1},{k:"C",t:'Message the recruiter: "Hi, is there any news on the Leeds job?"',ok:!1},{k:"D",t:'Email the head of marketing: "Are you still considering me for the role?"',ok:!1}],expl:{card:"The card: don't use it on someone who never started anything, or on someone senior.",items:[{k:"A",ok:!0,text:`Right. The recruiter came to you, so this is their deal, and they're not senior. The easy answer is "No". Say they reply: "No! They've been slow, sorry. They're deciding Friday, and you're one of two."`,subs:[]},{k:"B",ok:!1,text:"The right line to the wrong person. She's senior, so it sounds passive-aggressive.",subs:[]},{k:"C",ok:!1,text:`"Any news?" is the follow-up that's already been ignored.`,subs:[]},{k:"D",ok:!1,text:"Asks a busy, senior person for a yes. You'll usually get silence.",subs:[]}]}},{n:4,fmt:"Type it",stem:[`Someone on your course said she'd buy your spare ticket for Friday's gig, at the \xA345 you paid, and send the money "tonight". That was Sunday. On Tuesday you messaged asking if she still wanted it. No reply. It's Wednesday. Type your next message.`],quote:[],options:[],model:"Have you given up on the gig ticket?",checks:'contains one of: given up, giving up, give up, gave up, gone off; contains one of: ticket, gig, it; ends with "?" (trailing emojis ignored); no \xA3 and no digits; contains none of: no worries, no stress, no problem, no bother, if so, if not, or not, totally fine, all good, either way, still interested, still keen, still want, checking in, any update, any news, relist, someone else, other buyers, sell it to, lower, cheaper, discount, on me, why; 15 words or fewer. Whole words, any case.',after:["The card: your normal follow-up's been ignored on something she started, so ask if she's given up, with no way out.",`Say she replies: "No!! Sorry, payday's Friday, I'll send it then." Now you know she still wants it, and when. If she replies "Yeah, sorry, can't make it now", you've lost nothing: resell it today, with two days to spare.`,'Fails: "Still want it?", "Any update?", adding a way out, and dropping the price.'],modelRaw:'"Have you given up on the gig ticket?"'}],mission:`this week, find one thing someone else started that's gone quiet (a buyer, a client, a mate's plan for a trip, a recruiter), and send "Have you given up on\u2026?" Note how fast they reply. If nothing's gone quiet, write the line you'd have sent the last time someone ghosted you.`},{id:"1.6",title:"Ask what's behind a nosy question",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When someone asks your budget, your pay or whether you've had other offers, don't answer yet. Ask lightly:"},{t:"quote",text:'"What makes you ask?"'},{t:"p",text:"Then listen."}]},{h:"When to use it",items:[{t:"p",text:"Your honest answer would hand them a number to hold you to."},{t:"sit",text:"A salesperson asking your budget, a recruiter asking what you earn, a buyer asking about other offers."}]},{h:"Why it works",items:[{t:"p",text:"You give nothing away, and their answer shows what they're after: fitting you to a budget, finding your limit, or checking you're serious. Then answer that, without the number."}]},{h:"Example",items:[{t:"sit",text:`Booking a room for your society's dinner, the manager asks: "What's your budget?"`},{t:"say",who:"You",text:'"What makes you ask?"'},{t:"say",who:"Manager",text:`"We've got two menus, \xA328 and \xA335 a head."`},{t:"p",text:"Now you know their prices, and they don't know yours."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Say it with a smile in your voice.",rest:"Said flat, it sounds like you're hiding something."},{t:"p",text:'*To the venue manager, warmly:* "Ha, good question. What makes you ask?"'},{t:"tip",n:2,title:"If they push for a number, give the going rate, not your own figure.",rest:""},{t:"sit",text:'A salesperson presses: "Roughly what were you hoping to spend?"'},{t:"good",text:'"Ones like this usually go for about \xA3600."'},{t:"bad",text:`"My max is \xA3750." \u2192 that's what you'll pay.`},{t:"tip",n:3,title:'Asked "What are you looking for?" and you know the going rate? Name your number.',rest:"It's your chance to go first."},{t:"sit",text:"A caf\xE9 asks what you'd want an hour to run their Instagram. Similar jobs pay \xA312 to \xA314."},{t:"good",text:'"\xA314 an hour, the top of what these jobs pay."'},{t:"bad",text:'"What makes you ask?" \u2192 you waste your chance.'}]},{h:"Avoid",items:[{t:"bad",text:`Giving the number: "I'm on \xA322,000." Offers then start near it.`},{t:"bad",text:`"I'd rather not say." It sounds cagey.`},{t:"bad",text:'"Why do you want to know?" "Why" sounds like a challenge.'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick (Chris Voss)",text:"Taught by Chris Voss and other negotiation trainers. Nobody has tested it."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`A recruiter asks: "And what are you earning at the moment?" You're on \xA324,000, and you've seen the new role advertised at up to \xA332,000. What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!0},{k:"B",t:`"\xA324,000, but I'm hoping for a decent jump."`,ok:!1},{k:"C",t:`"I'd rather not say, if that's OK."`,ok:!1},{k:"D",t:`"What's the most the role could pay?"`,ok:!1}],expl:{card:`The card: asked what you earn, don't answer yet. Ask "What makes you ask?"`,items:[{k:"A",ok:!0,text:`Right. Say they answer: "Just to check we're in the right ballpark." They're fitting you to a budget, so now you can say: "Similar roles are paying around \xA332,000." If they push ("I do need a number"), give the going rate, not your \xA324,000.`,subs:[]},{k:"B",ok:!1,text:"Hands them the number that caps you: offers will start near \xA324,000.",subs:[]},{k:"C",ok:!1,text:"Refuses, and sounds cagey.",subs:[]},{k:"D",ok:!1,text:"Asks their limit, so their answer is your ceiling.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling a jacket on Vinted for \xA360. A buyer messages: "Have you had any other offers?" You haven't. What's your best reply?`],quote:[],options:[{k:"A",t:`"No, you're the first one to ask!"`,ok:!1},{k:"B",t:'"Why do you want to know?"',ok:!1},{k:"C",t:'"What makes you ask?"',ok:!0},{k:"D",t:`"Not yet, but I'm sure I will."`,ok:!1}],expl:{card:`The card: ask what's behind it, lightly. Don't ask "why".`,items:[{k:"C",ok:!0,text:`Right. Say they answer: "Just wondering if you'd take less." They're keen, and your \xA360 listing is your opening number, so hold it: "It's \xA360, and it's barely worn." If they offer \xA345, you can meet them at \xA355.`,subs:[]},{k:"A",ok:!1,text:"Tells them nobody else wants it, so they'll offer low.",subs:[]},{k:"B",ok:!1,text:'"Why" sounds like a challenge: "Just asking!", and a cooler buyer.',subs:[]},{k:"D",ok:!1,text:"Admits there are none, plus a bluff. You'll still usually get a low offer.",subs:[]}]}},{n:3,fmt:"Type it",stem:['At a flat viewing, the agent asks: "What are you paying at your current place?" Type your reply.'],quote:[],options:[],model:"What makes you ask?",checks:"contains one of: makes you ask, what's behind, whats behind, what's the reason, prompted, reason you ask; no \xA3 and no digits; contains none of: why, rather not, none of your business, not telling, private, around, about, roughly. Whole words, any case. 12 words or fewer.",after:["The card: ask what's behind the question instead of handing over a number that caps you.",'Say they answer: "The landlord likes to know people can afford it." Now you can say: "I can afford the asking rent comfortably." That reassures them without giving away your current rent.',`Fails: any number, "why", or a flat refusal ("I'd rather not say").`],modelRaw:'"What makes you ask?"'},{n:4,fmt:"Say it",stem:[`This time the recruiter asks: "What salary are you looking for?" You've checked, and similar roles pay \xA330,000 to \xA334,000. What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!1},{k:"B",t:`"Similar roles pay up to \xA334,000, so I'm looking for \xA334,000."`,ok:!0},{k:"C",t:'"Around \xA330,000 would be fine for me."',ok:!1},{k:"D",t:`"What's the budget for the role?"`,ok:!1}],expl:{card:'The card: asked "What are you looking for?" and you know the going rate? Name your number.',items:[{k:"B",ok:!0,text:`Right. The top of the going rate, with a reason. Say they answer: "We were thinking more like \xA331,000." You're negotiating from \xA334,000, not their number: "Could we meet at \xA333,000?"`,subs:[]},{k:"A",ok:!1,text:'Right for "What are you earning?", but here it wastes your chance to go first.',subs:[]},{k:"C",ok:!1,text:"The bottom of the range, so that's the most you'll get.",subs:[]},{k:"D",ok:!1,text:"Asks their limit, and their budget becomes your ceiling.",subs:[]}]}}],mission:`next time someone asks your budget, what you earn or whether you've had other offers, say "What makes you ask?" and notice what they tell you.`}]},{n:2,title:"The First Number",tagline:"The first number anyone says pulls the final price towards it. Learn when to say yours first, how to say it, and how to stop theirs pulling you.",lessons:[{id:"2.1",title:"Go first if you know the price",guess:{stem:["In a role-play negotiation, a businessperson haggled with a taxi driver over what to pay him to wait. Only the driver knew what waiting usually costs. What happened to the final price when the businessperson named a number first, instead of the driver?"],options:[{k:"A",t:"About the same either way",ok:!1},{k:"B",t:"About a fifth higher",ok:!1},{k:"C",t:"About twice as high",ok:!1},{k:"D",t:"About four times as high",ok:!0}],reveal:"about four times as high: $49.50 when the businessperson went first, against $11.36 when the driver did. Guess a number when the other side knows more, and you can be miles out without ever finding out."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:'Before anyone names a price, ask yourself: "Do I know what this is worth as well as they do?"'},{t:"li",text:"Yes \u2192 say your number first, with a reason."},{t:"li",text:"No \u2192 get them to say a number first."}]},{h:"When to use it",items:[{t:"p",text:"Nobody's named a price yet."},{t:"sit",text:"Selling your phone, buying a used car, a shop asking what you want for your old camera."}]},{h:"Why it works",items:[{t:"p",text:"The first number anyone says pulls the final price towards it. Know the price? That pull works for you. Don't? Your guess could be hundreds too low."}]},{h:"Example",items:[{t:"sit",text:'A buyer messages about your drone: "How much?" Similar ones sold for \xA3280 to \xA3330.'},{t:"say",who:"You",text:'"\xA3330. It comes with two spare batteries."'},{t:"say",who:"Buyer",text:'"Would you do \xA3300?"'},{t:"p",text:"You're haggling from your number, not theirs."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Going first? Selling: near the top. Buying: near the bottom. Always give a reason.",rest:""},{t:"sit",text:"Buying a used camera that sells for \xA3180 to \xA3230:"},{t:"good",text:`"\xA3185. That's what the last one sold for."`},{t:"bad",text:'"\xA3205?" \u2192 you start in the middle and finish near the top.'},{t:"bad",text:`"\xA3120." \u2192 below anything that's sold: "Not a chance."`},{t:"tip",n:2,title:`Asked "What's the lowest you'd take?" Repeat your opening number and reason, never your limit.`,rest:""},{t:"good",text:'"\xA3330. It comes with two spare batteries."'},{t:"bad",text:`"\xA3300's my lowest." \u2192 \xA3300 becomes the most you'll get.`},{t:"tip",n:3,title:"Don't know what it's worth? Get their number, then ask what it's based on.",rest:""},{t:"sit",text:"A collector asks what you want for your old Pok\xE9mon cards. You can't find prices online."},{t:"quote",text:'"What would you give me for them?" Then: "How did you land on that figure?"'}]},{h:"Avoid",items:[{t:"bad",text:`"What were you thinking?" when you know the price. You'd haggle from their number.`},{t:"bad",text:`"\u2026or nearest offer" or "I'm open to offers." It invites them below your number.`},{t:"bad",text:`"What's the salary range?" You'll be offered the bottom of it.`}]},{h:"Evidence",items:[{t:"ev",label:"Proven",text:"Across 90 studies, going first usually won the better deal; ambitious ones won more but more often ended in no deal (Petrowsky and colleagues, 2025). When only one side knew the value, the other did far better letting them go first (Maaravi and Levy, 2017)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You've posted in your uni's buy-and-sell group that you're selling your electric scooter, no price yet. The same model has sold for \xA3220 to \xA3260 on eBay. Someone messages: "How much are you after for it?" What's your best reply?`],quote:[],options:[{k:"A",t:'"What would you be willing to pay for it?"',ok:!1},{k:"B",t:`"\xA3240. It's barely been used, honestly."`,ok:!1},{k:"C",t:'"\xA3260. Still boxed, with the charger."',ok:!0},{k:"D",t:`"Around \xA3250, but I'm open to offers."`,ok:!1}],expl:{card:"The card: you know what it sells for, so go first, near the top, with a reason.",items:[{k:"C",ok:!0,text:`Right. The top of the range, backed by the box and charger. Say they answer: "Would you take \xA3230?" Now you can say: "\xA3250 and I'll throw in the lock."`,subs:[]},{k:"A",ok:!1,text:`For when you don't know what it's worth. You'll usually get: "\xA3150?"`,subs:[]},{k:"B",ok:!1,text:"Starts mid-range. You'll usually finish around \xA3225.",subs:[]},{k:"D",ok:!1,text:`Invites them below your number. You'll usually get: "\xA3200?"`,subs:[]}]}},{n:2,fmt:"Spot it",stem:["At a car boot sale, Chloe finds a used Fender acoustic guitar with no price on it. She checks on her phone: similar ones have sold for \xA3120 to \xA3170.","What should Chloe have said instead?"],quote:['Seller: "What are you offering?"',`Chloe: "Would \xA3165 be OK? Don't want to be cheeky."`,`Seller: "Make it \xA3175 and it's yours."`],options:[{k:"A",t:'"\xA3125. One sold for that last week."',ok:!0},{k:"B",t:`"What's the lowest you'd go to on it?"`,ok:!1},{k:"C",t:`"\xA3145. That's about what they go for."`,ok:!1},{k:"D",t:`"\xA380. I've seen them go for way less."`,ok:!1}],expl:{card:"The card: buying, so go first near the bottom, with a reason. Chloe went first near the top, and apologised.",items:[{k:"A",ok:!0,text:`Right. Low, but backed by a real sale. Say the seller answers: "I could do \xA3150." Now you can say: "\xA3135, and I'll take it now."`,subs:[]},{k:"B",ok:!1,text:`Asks his limit. You'll usually get: "\xA3170."`,subs:[]},{k:"C",ok:!1,text:"Starts mid-range, so you'll usually end up near the top.",subs:[]},{k:"D",ok:!1,text:`Below anything that's sold. You'll usually get: "Not a chance."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're clearing out your stuff before moving abroad. For each sale, should you say a price first, or get them to name a number first?"],quote:[],options:[],sort:[{t:`"Your iPhone 14 on eBay. You've checked 20 sold listings."`,bin:"say a price first"},{t:`"A signed football shirt, to a memorabilia dealer. You can't find a single price for it online."`,bin:"get their number first"},{t:'"Your car, to a dealer. Three valuation sites all say about \xA34,300."',bin:"say a price first"},{t:`"Your uncle's old vinyl, to a record shop. You don't recognise most of the bands."`,bin:"get their number first"},{t:'"Your sofa on Marketplace. The same model has sold for \xA3180 to \xA3220."',bin:"say a price first"},{t:`"A painting you were given, to an antiques dealer. It's signed, but you can't read the name."`,bin:"get their number first"}],expl:{card:'The card: ask "Do I know what this is worth as well as they do?"',items:[{label:"Say a price first",text:"the iPhone, the car and the sofa. You've seen what they sell for. The car is the trap: the dealer's an expert, but after three valuation sites you know the number too.",subs:[]},{label:"Get their number first",text:`the shirt, the vinyl and the painting. Say the record shop offers \xA360 for the lot. Ask: "How did you land on \xA360?", and you'll learn which records he's after.`,subs:[]}]},bins:["say a price first","get their number first"]},{n:4,fmt:"Say it",stem:[`Your grandad left you his old Omega watch. You've no idea what it's worth and can't find one like it online. A vintage watch dealer looks it over: "Lovely piece. What are you looking to get for it?" What's your best reply?`],quote:[],options:[{k:"A",t:`"I was thinking maybe \xA3300, if that's OK?"`,ok:!1},{k:"B",t:`"Do you think it's worth much at all?"`,ok:!1},{k:"C",t:'"\xA31,200. Vintage Omegas are really sought after."',ok:!1},{k:"D",t:'"What would you offer for it?"',ok:!0}],expl:{card:"The card: don't know what it's worth? Get their number, then ask what it's based on.",items:[{k:"D",ok:!0,text:`Right. An expert's number, and you've given none. Say he answers: "\xA3600." Ask: "How did you land on \xA3600?" If he says "That's my offer", you've lost nothing: it's worth at least \xA3600.`,subs:[]},{k:"A",ok:!1,text:"A guess. If it's worth \xA3900, you'll never know.",subs:[]},{k:"B",ok:!1,text:`Tells him you've no idea. You'll usually get: "Not really."`,subs:[]},{k:"C",ok:!1,text:"Confident, but a guess. If it's worth \xA32,000, he says yes.",subs:[]}]}},{n:5,fmt:"Say it",stem:[`A recruiter rings about a junior role at a renewable energy start-up. It's a niche job and you can't find any salary figures for it. "Before we put an offer together, what salary are you looking for?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Around \xA325,000 would be great, if that works."',ok:!1},{k:"B",t:'"What did you have in mind for the role?"',ok:!0},{k:"C",t:`"What's the salary range for this role?"`,ok:!1},{k:"D",t:`"Whatever's standard is fine, I'm keen to start."`,ok:!1}],expl:{card:"The card: don't know what it's worth? Get their number first. Unlike lesson 1.6, you can't check the going rate.",items:[{k:"B",ok:!0,text:`Right. It asks for their offer, not their limit. Say they answer: "We're thinking \xA327,000." You'd have said \xA325,000. Now you can say: "With my placement year in solar, could we look at \xA328,500?"`,subs:[]},{k:"A",ok:!1,text:"A guess, maybe thousands under their budget.",subs:[]},{k:"C",ok:!1,text:"You'll usually be offered the bottom of the range.",subs:[]},{k:"D",ok:!1,text:"Tells them you'll take whatever they offer.",subs:[]}]}},{n:6,fmt:"Type it",stem:[`Someone at work hears you're selling your Apple Watch and asks: "What's the lowest you'd take?" Similar ones have sold for \xA3180 to \xA3210 on eBay. Type your reply: a price and a short reason.`],quote:[],options:[],model:"\xA3205. It's under two years old, with the box and two straps.",checks:`at least one \xA3 amount from 200 to 210, and no other \xA3 amount under 300; 4 to 20 words; contains one of: it's, its, has, with, comes, includes, included, barely, boxed, box, new, old, months, years, condition, sold, because, as, since, strap, straps, charger, battery, scratch, scratches, mint; no "about", "around" or "roughly" directly before an amount; contains none of: offer, offers, nearest, negotiable, ono, flexible, open to, take, below, can't go, cant go, can't do, cant do, any less, or less, for less, minimum, lower, lowest, limit, least, bottom, floor, what were you, I need, I'd need, most you, best price. Whole words, any case.`,after:[`The card: asked "What's the lowest you'd take?", give your opening number and reason, never your limit.`,`Say they answer: "Would you do \xA3185?" Now you're haggling near the top: "\xA3198, and I'll bring the charger in tomorrow."`,`Fails: a number under \xA3200 or over \xA3210, no reason, "or nearest offer", and anything that sounds like your limit ("lowest I'll go", "can't do less").`],modelRaw:`"\xA3205. It's under two years old, with the box and two straps."`}],mission:"this week, look up three sold prices for something you own, and write the price you'd say first with your reason."},{id:"2.2",title:"Write your target price before they speak",guess:{stem:[`Professional car mechanics and dealers valued the same used car. Beforehand, the "customer" casually mentioned either a high or a low price. How far apart were the experts' valuations?`],options:[{k:"A",t:"No real difference: they're experts",ok:!1},{k:"B",t:"About 5% apart",ok:!1},{k:"C",t:"About 40% apart",ok:!0},{k:"D",t:"The high price made them go lower",ok:!1}],reveal:"about 40% apart (3,563 against 2,520 Deutschmarks) for the same car. When the experts first listed reasons the customer's price might be wrong, the gap shrank by about two thirds."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Before they say a number, write down yours: the price you're aiming for, and why. When theirs comes, reply with yours, not a step from theirs."}]},{h:"When to use it",items:[{t:"p",text:"The other side is likely to name the first number."},{t:"sit",text:"A rent rise, a dealer's offer for your car, a pay review, a buyer's offer on your stuff."}]},{h:"Why it works",items:[{t:"p",text:"Their number pulls your thinking towards it, even when you know it's happening. A target written down beforehand weakens the pull."}]},{h:"Example",items:[{t:"sit",text:"Selling your guitar amp. Similar ones sold for up to \xA395, so you've written down \xA394."},{t:"say",who:"Buyer",text:`"I'll give you \xA360 for it."`},{t:"say",who:"You",text:`"They've sold for up to \xA395. You can have it for \xA394."`},{t:"say",who:"Buyer",text:'"\xA380?"'},{t:"p",text:"You're haggling near your number, not theirs."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Make it ambitious.",rest:"Selling or being paid: the top of what it sells for. Paying: the bottom. Never the middle, and never your minimum."},{t:"bad",text:`"Anything over \xA370 and I'm happy." \u2192 every offer over \xA370 feels like a win.`},{t:"tip",n:2,title:'When their number lands, ask yourself: "Why might that be wrong?" or "What happens to them if I say no?"',rest:""},{t:"p",text:'*A tutoring agency offers you \xA315 an hour.* "If I say no, who teaches my six students?"'},{t:"tip",n:3,title:"No idea what it's worth? Ask what their number is based on.",rest:""},{t:"p",text:`*A vet quotes \xA3380 for your dog's teeth:* "What's the \xA3380 made up of?"`},{t:"tip",n:4,title:"Afterwards, judge the deal against your walk-away, not your target.",rest:"Walk-away: what you'd do with no deal. A high target can make a good deal feel like a loss."},{t:"p",text:"*You aimed for \xA394 for the amp, got \xA385, and a shop would have paid \xA350.* A win: keep aiming high."}]},{h:"Avoid",items:[{t:"bad",text:`"Let's meet in the middle" after a number that's way off. So is the middle (lesson 3.5).`}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Thinking about your own target, or why their number might be wrong, weakened a first offer's pull (Galinsky and Mussweiler, 2001). Target-focused negotiators got better deals but felt worse, until they thought about their walk-away (Galinsky, Mussweiler and Medvec, 2002)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`The letting agent rings: "The landlord wants to put your rent up from \xA31,250 to \xA31,400 a month." You've checked: similar two-beds nearby are listed at \xA31,275 to \xA31,325. What's your best reply?`],quote:[],options:[{k:"A",t:'"Similar flats start at \xA31,275. I can do \xA31,280."',ok:!0},{k:"B",t:'"Could we meet in the middle, at \xA31,325 a month?"',ok:!1},{k:"C",t:'"Flats nearby go up to \xA31,325, so I can do \xA31,310."',ok:!1},{k:"D",t:`"That's a big jump. Could you do \xA31,375 instead?"`,ok:!1}],expl:{card:"The card: reply with your own number, not a step from theirs. You're paying, so aim at the bottom.",items:[{k:"A",ok:!0,text:`Right. It ignores \xA31,400. Say the agent answers: "He could do \xA31,320." Now you can say: "If he can do \xA31,300, I'll confirm by Friday."`,subs:[]},{k:"B",ok:!1,text:"\xA31,400 set the middle, so you land at the top of the market.",subs:[]},{k:"C",ok:!1,text:"Your own number, but near the top: \xA330 a month more than A.",subs:[]},{k:"D",ok:!1,text:"A step down from his number.",subs:[]}]}},{n:2,fmt:"Sort it",stem:[`Your manager says: "We're thinking a 2% rise, so \xA325,500." Job ads for your role pay \xA327,500 to \xA329,500. Before you reply, which thoughts weaken the pull of \xA325,500, and which pull you towards it?`],quote:[],options:[],sort:[{t:'"Why might \xA325,500 be wrong?"',bin:"weakens its pull"},{t:`"\xA325,500 isn't that far off, really."`,bin:"pulls you towards it"},{t:`"My target's \xA329,500, the top of the ads."`,bin:"weakens its pull"},{t:`"I'll ask for a bit more than \xA325,500."`,bin:"pulls you towards it"},{t:'"If I left, what would it cost her to hire and train someone new?"',bin:"weakens its pull"},{t:'"She must have a reason for that number."',bin:"pulls you towards it"}],expl:{card:'The card: write your target down, then ask "Why might that be wrong?" or "What happens to them if I say no?"',items:[{label:"Weakens its pull",text:`your target, reasons it's wrong, and the cost of replacing you. Say you reply: "Ads pay up to \xA329,500. Could we look at that?" and she offers \xA327,000: \xA31,500 more than her first number.`,subs:[]},{label:"Pulls you towards it",text:'"a bit more" starts from her number; the other two treat it as right.',subs:[]}]},bins:["weakens its pull","pulls you towards it"]},{n:3,fmt:"Say it",stem:[`A pub manager wants a DJ for a one-off New Year's Eve party: "We usually pay \xA3100 for a set." DJs round here get \xA3250 to \xA3350, and more on New Year's Eve. Last New Year's, Cellar Bar paid you \xA3385. What's your best reply?`],quote:[],options:[{k:"A",t:`"\xA3100's quite low. Could you go to \xA3200?"`,ok:!1},{k:"B",t:'"\xA3250, the going rate for DJs round here."',ok:!1},{k:"C",t:`"OK. What's the most you could stretch to, then?"`,ok:!1},{k:"D",t:`"\xA3385. Cellar Bar paid that last New Year's."`,ok:!0}],expl:{card:"The card: reply with your own ambitious number, not a step up from theirs.",items:[{k:"D",ok:!0,text:`Right. It starts from what you've been paid. Say they answer: "Could you do \xA3300?" Now you can say: "\xA3345, and I'll bring my own lights." If they say "\xA3150, tops", judge that against your walk-away.`,subs:[]},{k:"A",ok:!1,text:"Starts from their \xA3100, so you'll end up near it.",subs:[]},{k:"B",ok:!1,text:"The bottom of the rate, on New Year's.",subs:[]},{k:"C",ok:!1,text:"Asks their limit, which becomes your ceiling.",subs:[]}]}},{n:4,fmt:"Say it",stem:["Last month you sold your Switch for \xA3185. Your target was \xA3210, so it felt like a loss, but the best you'd have got otherwise was \xA3150 from a trade-in shop. Now you're selling your games. They've sold for \xA322 to \xA330 each, and the trade-in shop would give you \xA318 each. Which target do you write down?"],quote:[],options:[{k:"A",t:'"\xA324 each, roughly what most of them went for."',ok:!1},{k:"B",t:`"\xA320 each, so I'm not let down like last time."`,ok:!1},{k:"C",t:'"\xA330 each, the top of the sold prices."',ok:!0},{k:"D",t:'"\xA326 each, the middle, so they go quickly."',ok:!1}],expl:{card:"The card: aim at the top, and judge the deal against your walk-away, not your target. By that test, the Switch went well.",items:[{k:"C",ok:!0,text:`Right. The top, and you can back it up. Say a buyer offers \xA320: "\xA328. That's what the last one sold for." Settle at \xA325 and you've beaten trade-in by \xA37.`,subs:[]},{k:"A",ok:!1,text:"Aims at the middle, so \xA320 will feel close enough.",subs:[]},{k:"B",ok:!1,text:"Lowers the target because a good deal felt bad.",subs:[]},{k:"D",ok:!1,text:"Aims at the middle to sell faster.",subs:[]}]}},{n:5,fmt:"Say it",stem:["Your car's clutch is slipping. A garage quotes \xA3640 to replace it. You've no idea what a clutch usually costs. What's your best reply?"],quote:[],options:[{k:"A",t:'"I was hoping for more like \xA3450, to be honest."',ok:!1},{k:"B",t:'"How did you get to \xA3640?"',ok:!0},{k:"C",t:'"\xA3640? That seems a lot for a clutch."',ok:!1},{k:"D",t:`"What's the lowest you could do it for?"`,ok:!1}],expl:{card:"The card: no idea what it's worth? Ask what their number is based on.",items:[{k:"B",ok:!0,text:'Right. Say they answer: "\xA3280 for the kit, plus six hours at \xA360." Now you can say: "Could you do the labour at \xA350 an hour if I drop it in Monday?"',subs:[]},{k:"A",ok:!1,text:"A guess. If it's usually \xA3400, they'll take \xA3450.",subs:[]},{k:"C",ok:!1,text:`A hint, not a number (lesson 1.1). You'll usually get: "Clutches aren't cheap, mate."`,subs:[]},{k:"D",ok:!1,text:`Asks their limit. You'll usually get: "\xA3620."`,subs:[]}]}},{n:6,fmt:"Type it",stem:["A dealer offers you \xA32,900 in part-exchange for your Ford Ka. You'd checked beforehand: dealers are paying \xA33,400 to \xA33,700 for similar ones, and you'd written down \xA33,650. Type your reply."],quote:[],options:[],model:"Dealers are paying up to \xA33,700 for these. You can have it for \xA33,650.",checks:"the last \xA3 amount is from 3,500 to 3,700; 25 words or fewer; contains none of: halfway, middle, meet in, split, a bit more, a bit better, I need, I'd need, need at least, at least, minimum, can't go, cant go, below, most you, lowest, best price, best you, your best. Whole words, any case.",after:["The card: reply with your own number, not a step up from theirs.",`The model answer moves the talk from \xA32,900 to \xA33,650. Say he answers: "Best I can do is \xA33,300." Now you can say: "Make it \xA33,480 and we've got a deal."`,'Fails: halfway or "a bit more" (his number still sets the deal), a number below \xA33,500 or above what dealers pay, and anything that tells him your limit.'],modelRaw:'"Dealers are paying up to \xA33,700 for these. You can have it for \xA33,650."'}],mission:"this week, pick one price you see (a listing, a bill, a quote) and write your own target for it with a reason, plus two reasons their number might be wrong."},{id:"2.3",title:"Name a precise price, not a round one",guess:{stem:["In a used-car study, buyers opened with either a round number or a precise one. How did the sellers' replies differ?"],options:[{k:"A",t:"Sellers moved further from precise offers",ok:!1},{k:"B",t:"No real difference between the two",ok:!1},{k:"C",t:"Sellers moved less from precise offers",ok:!0},{k:"D",t:"Sellers walked away from precise offers more often",ok:!1}],reveal:"sellers moved less. On average, their replies moved about $3,200 away from a precise offer, against about $4,200 from a round one."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When you name one price for a one-off deal, make it precise, and give the reason behind it."},{t:"p",text:"Round means ending in 00 (\xA3500, \xA32,000). Precise is anything else (\xA3485, \xA32,385)."}]},{h:"When to use it",items:[{t:"p",text:"A single price for something one-off."},{t:"sit",text:"Your asking price on Marketplace, a quote for a one-off job, an offer on a used car."}]},{h:"Why it works",items:[{t:"p",text:"A precise number sounds worked out, so people assume you know something and push back less. A round one sounds like a guess, so they knock it down harder."}]},{h:"Example",items:[{t:"sit",text:"You're selling your 2015 Polo. Similar ones go for \xA34,000 to \xA34,600."},{t:"say",who:"You",text:`"\xA34,560. It's just had a new clutch."`},{t:"say",who:"Buyer",text:'"Would you take \xA34,400?"'},{t:"p",text:"A gentle push back, because it sounds worked out."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Don't blur it.",rest:'"About", "around" or "roughly" turns a precise number back into a guess.'},{t:"sit",text:"Selling a box of games:"},{t:"good",text:'"\xA368 for the lot, including postage."'},{t:"bad",text:'"Roughly \xA368, give or take." \u2192 they push hard.'},{t:"tip",n:2,title:"A reason doesn't rescue a round number.",rest:""},{t:"bad",text:`"\xA3500. It's in great condition." \u2192 still sounds like a guess.`},{t:"tip",n:3,title:"With professionals, give the reason and skip the pennies.",rest:'To a car dealer, "\xA32,384.50" looks naive.'},{t:"tip",n:4,title:"Their precise number isn't proof they worked it out.",rest:"Know what it sells for? Reply with your own number. Don't? Ask what it's based on."},{t:"sit",text:'A seller wants \xA3187 for a speaker, "priced to the penny". Similar ones sell for \xA3120 to \xA3150.'},{t:"good",text:`"\xA3125. That's what the last one went for."`},{t:"bad",text:`"\xA3187 is a lot. Could you do \xA3170?" \u2192 you're working from their number.`}]},{h:"Don't use it when",items:[{t:"li",text:"**It's pay, or a rate you'll charge the same person again.** Give a range instead (lesson 2.4)."}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Across six studies, including a live used-car haggle, people moved less from precise first offers than from round ones (Mason, Lee, Wiley and Ames, 2013). Estate agents were swayed by precision up to a point, then read very precise prices as naive (Loschelder and colleagues, 2016)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`A colleague hears you're selling your MacBook Air and asks: "What's your price?" Similar ones have sold for \xA3580 to \xA3700 on eBay. What's your best reply?`],quote:[],options:[{k:"A",t:'"Around \xA3700 or so, but happy to take offers."',ok:!1},{k:"B",t:`"\xA3685. Battery's at 89%, and it's boxed."`,ok:!0},{k:"C",t:`"\xA3700. Battery's at 89%, and it's boxed."`,ok:!1},{k:"D",t:'"What were you hoping to pay for it?"',ok:!1}],expl:{card:"The card: one precise price, with a reason. Round means ending in 00.",items:[{k:"B",ok:!0,text:'Right. Near the top, and precise, so it sounds worked out. Say they reply: "Would you do \xA3630?" Now you can say: "\xA3660 if you can take it tomorrow."',subs:[]},{k:"A",ok:!1,text:`Round, and invites offers. You'll usually get: "\xA3550?"`,subs:[]},{k:"C",ok:!1,text:"The same line, but round, so it gets pushed down further.",subs:[]},{k:"D",ok:!1,text:"Lets them go first when you know the price (lesson 2.1).",subs:[]}]}},{n:2,fmt:"Say it",stem:["A local hairdresser wants a simple booking website, a one-off job. Freelancers with your experience charge \xA3800 to \xA31,000 for it. They ask for your quote. What's your best reply?"],quote:[],options:[{k:"A",t:`"\xA3940, but I'm flexible on the price."`,ok:!1},{k:"B",t:'"Roughly \xA3950, give or take a bit."',ok:!1},{k:"C",t:'"\xA31,000, which is what freelancers charge."',ok:!1},{k:"D",t:'"\xA3960, including a logo tidy-up."',ok:!0}],expl:{card:"The card: a one-off job gets one precise number, with the reason behind it.",items:[{k:"D",ok:!0,text:`Right. Precise, near the top, with what's included. Say they reply: "Could you do \xA3850?" Now you can say: "I can do \xA3920 if you send the photos by Friday."`,subs:[]},{k:"A",ok:!1,text:`"Flexible" invites a lower offer. You'll usually get: "\xA3800?"`,subs:[]},{k:"B",ok:!1,text:`"Roughly" makes it a guess, so they'll push hard.`,subs:[]},{k:"C",ok:!1,text:"\xA340 higher, but round, so it usually gets pushed down further.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`A seller on Marketplace has a Garmin watch listed at \xA3347. You've checked: the same model has sold for \xA3240 to \xA3290 on eBay. You ask if it's still available. They reply: "Yes, and I've priced it carefully, it's worth every penny." What's your best reply?`],quote:[],options:[{k:"A",t:'"\xA3289. The last one on eBay went for that."',ok:!1},{k:"B",t:'"\xA3347 is a lot for it. Could you do \xA3320?"',ok:!1},{k:"C",t:`"\xA3245. That's what one went for on eBay."`,ok:!0},{k:"D",t:`"What's the lowest you'd actually take for it?"`,ok:!1}],expl:{card:"The card: their precise number isn't proof they worked it out. You know what it sells for, so reply with your own low number.",items:[{k:"C",ok:!0,text:`Right. Low, with proof. Say they answer: "I could do \xA3300." Now you can say: "\xA3262, and I'll come round today." If they say "Not below \xA3330", let them wait.`,subs:[]},{k:"A",ok:!1,text:"From the top when you're buying (lesson 2.1): \xA344 more than C.",subs:[]},{k:"B",ok:!1,text:"Treats \xA3347 as worked out.",subs:[]},{k:"D",ok:!1,text:`Asks their limit. You'll usually get: "\xA3330."`,subs:[]}]}},{n:4,fmt:"Sort it",stem:["You're selling your 2019 Honda moped. Similar ones have sold for \xA31,600 to \xA31,900. Which asking prices sound worked out, and which sound like a guess?"],quote:[],options:[],sort:[{t:'"\xA31,865. New tyres in March."',bin:"sounds worked out"},{t:'"\xA31,900 or nearest offer."',bin:"sounds like a guess"},{t:'"Roughly \xA31,850, give or take."',bin:"sounds like a guess"},{t:`"\xA31,840, as it's done 4,000 miles."`,bin:"sounds worked out"},{t:`"\xA31,800. It's in good nick."`,bin:"sounds like a guess"},{t:'"\xA31,870 with the top box included."',bin:"sounds worked out"}],expl:{card:`The card: precise means not ending in 00, "roughly" turns it back into a guess, and a reason doesn't rescue a round number.`,items:[{label:"Sounds worked out",text:'\xA31,865, \xA31,840 and \xA31,870, each with a reason. Say a buyer offers \xA31,700: "\xA31,820 if you take the helmet off my hands too."',subs:[]},{label:"Sounds like a guess",text:"",subs:[`"\xA31,800. It's in good nick." is the trap: a reason, but a round number.`,'"\xA31,900 or nearest offer" is round, and invites them below it.','"Roughly \xA31,850" is precise, then "roughly" makes it a guess.']}]},bins:["sounds worked out","sounds like a guess"]},{n:5,fmt:"Type it",stem:[`A new bakery wants a one-off promo video for its opening. You've worked it out: two days of filming and editing at your \xA3180 day rate, plus \xA325 for music, comes to \xA3385. They ask: "What would you charge?" Type your quote with the reason.`],quote:[],options:[],model:"\xA3385. That's two days at my \xA3180 day rate, plus \xA325 for the music.",checks:`the largest amount in the reply is from 375 to 399; contains one of: because, since, as it's, based on, works out, day, days, rate, plus, music, filming, editing; no "about", "around", "roughly" or "ish" directly before or after an amount; contains none of: or so, give or take, ish, lower, flexible, negotiable, open to, ono, less, cheaper, discount, go down, could do, at least, minimum, below, can't go, budget. Whole words, any case.`,after:["The card: a one-off job gets one precise number, with the reason behind it.",'The maths makes \xA3385 sound set by the work, not picked from the air. Say they answer: "Could you do \xA3300?" Now you can say: "I can do \xA3360 if I use a free music track instead."',`Fails: a round number like \xA3400, "about \xA3385", no reason, and anything that offers to come down before they've asked.`],modelRaw:`"\xA3385. That's two days at my \xA3180 day rate, plus \xA325 for the music."`}],mission:"this week, price one thing you could sell or one job you could do as a precise number, and write the reason you'd give."},{id:"2.4",title:"Quote a range for pay and rates",guess:{stem:["In a study, sellers either named one bumped-up price, or gave a range that started at their real target and went a bit higher. What happened with the single bumped-up price?"],options:[{k:"A",t:"Deals about 10% better",ok:!1},{k:"B",t:"No deal nearly twice as often",ok:!0},{k:"C",t:"Rated about a third more polite",ok:!1},{k:"D",t:"No deal only half as often",ok:!1}],reveal:"no deal nearly twice as often. The range also got better final deals, and came across as no less polite."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When someone you'll deal with again asks what you want, give a range. The bottom is the number you actually want. The top is 5 to 15% higher."},{t:"p",text:"Want \xA340 an hour? Say:"},{t:"quote",text:'"\xA340 to \xA345."'}]},{h:"When to use it",items:[{t:"p",text:"Pay, rates, and anyone you'll deal with again."},{t:"sit",text:"A manager asking your salary expectations, a regular client asking your rate."}]},{h:"Why it works",items:[{t:"p",text:"They use both ends of your range to guess your lowest, so their guess goes up. Going below your bottom feels rude, so they rarely do."}]},{h:"Example",items:[{t:"sit",text:"A family wants you to babysit on Fridays and asks your rate. You want \xA314 an hour."},{t:"say",who:"You",text:'"\xA314 to \xA316 an hour, depending on how late."'},{t:"say",who:"Parent",text:'"Could we say \xA315?"'},{t:"p",text:"Their counter is already \xA31 over your target."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"The bottom must be a number you'd be pleased with.",rest:"Expect to be offered it."},{t:"bad",text:'You want \xA332,000 and say "\xA328,000 to \xA332,000" \u2192 they offer \xA328,000.'},{t:"tip",n:2,title:"Keep it narrow.",rest:""},{t:"bad",text:'"\xA330,000 to \xA345,000" \u2192 it sounds made up, so they ignore the top.'},{t:"tip",n:3,title:"When they give you a range, reply with one number.",rest:"Treat their bottom as their real offer."},{t:"sit",text:"A caf\xE9 offers \xA311 to \xA313 an hour for weekend shifts. Similar jobs pay up to \xA313.50, and you've done barista work."},{t:"good",text:`"With my barista experience, I'm looking for \xA313.50."`},{t:"bad",text:`"Could we say \xA312 to \xA314?" \u2192 you'll get \xA312.`},{t:"tip",n:4,title:"One number at the top of the going rate is fine too (lesson 1.6).",rest:"A range starting there usually gets more."},{t:"p",text:'*Babysitters near you get up to \xA315:* "\xA315 an hour" works. "\xA315 to \xA317" usually gets more.'}]},{h:"Don't use it when",items:[{t:"li",text:"**It's a one-off sale or job.** Name one precise number instead (lesson 2.3). For pay, round thousands are fine."}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"A range starting at your target got better final deals than one number, and came across as no less polite. One bumped-up number ended in no deal nearly twice as often (Ames and Mason, 2015, five studies)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're a freelance photographer. A couple want an engagement shoot, and they've said they'd like you for their wedding next year if it goes well. Your target is \xA3300. They ask: "What do you charge for a shoot like this?" What's your best reply?`],quote:[],options:[{k:"A",t:'"\xA3300 to \xA3500, depending on what you want."',ok:!1},{k:"B",t:'"\xA3335 for a shoot like this, with 40 edited shots."',ok:!1},{k:"C",t:'"\xA3300 to \xA3345, depending on the edited shots."',ok:!0},{k:"D",t:'"Usually somewhere between \xA3250 and \xA3300, really."',ok:!1}],expl:{card:"The card: someone you'll deal with again gets a range: bottom at your target, top 5 to 15% higher.",items:[{k:"C",ok:!0,text:'Right. Say they ask: "Could you do \xA3315?" Now you can say: "\xA3315 if you pay the deposit this week." If they say "We hoped for \xA3250": "\xA3300 on a weekday."',subs:[]},{k:"A",ok:!1,text:"So wide it sounds made up.",subs:[]},{k:"B",ok:!1,text:"Fine for a one-off (lesson 2.3). Here, it risks no deal nearly twice as often.",subs:[]},{k:"D",ok:!1,text:"Starts below your target, so you'll get \xA3250.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["You edit videos for small businesses. A gym wants a short promo video every month, and you want \xA3380 a video. Which ranges are likely to get you more than \xA3380, and which \xA3380 or less?"],quote:[],options:[],sort:[{t:'"\xA3380 to \xA3420."',bin:"likely to get you more than \xA3380"},{t:'"\xA3340 to \xA3380."',bin:"likely to get you \xA3380 or less"},{t:'"\xA3380 to \xA3430, depending on the edits."',bin:"likely to get you more than \xA3380"},{t:'"\xA3380 to \xA3600."',bin:"likely to get you \xA3380 or less"},{t:'"Between \xA3380 and \xA3435."',bin:"likely to get you more than \xA3380"},{t:'"\xA3300 to \xA3450, depending."',bin:"likely to get you \xA3380 or less"}],expl:{card:"The card: expect to be offered the bottom, so the bottom must be your \xA3380, with the top 5 to 15% higher.",items:[{label:"More than \xA3380",text:`the three ranges starting at \xA3380. Say the gym answers: "Could you do \xA3400?" You're haggling above your target.`,subs:[]},{label:"\xA3380 or less",text:"",subs:[`"\xA3340 to \xA3380" starts below it, so you'll be offered \xA3340.`,'"\xA3300 to \xA3450" tells them \xA3300 is fine.',`"\xA3380 to \xA3600" sounds made up, so they'll treat \xA3380 as the price.`]}]},bins:["likely to get you more than \xA3380","likely to get you \xA3380 or less"]},{n:3,fmt:"Say it",stem:[`A recruiter for a small engineering firm says: "The role pays \xA326,000 to \xA330,000." You've checked: similar roles pay up to \xA332,000, and you already use the design software they need. What's your best reply?`],quote:[],options:[{k:"A",t:'"Great, the top of that range would work well for me."',ok:!1},{k:"B",t:`"What's the most the role could stretch to?"`,ok:!1},{k:"C",t:'"Could we say \xA328,000 to \xA332,000, then?"',ok:!1},{k:"D",t:`"As I already use your software, I'm looking for \xA332,000."`,ok:!0}],expl:{card:"The card: when they give you a range, treat their bottom as their real offer, and reply with one number.",items:[{k:"D",ok:!0,text:`Right. Your number sits above their top, with a reason. Say they answer: "That's above the band, but I could do \xA329,500." That's \xA33,500 over their bottom.`,subs:[]},{k:"A",ok:!1,text:"Sounds happy. You'll usually get \xA326,000 or \xA327,000.",subs:[]},{k:"B",ok:!1,text:"Asks their limit, so their answer is your ceiling.",subs:[]},{k:"C",ok:!1,text:"A range, not one number, starting at \xA328,000, so that's what you'll get.",subs:[]}]}},{n:4,fmt:"Type it",stem:['Your target for GCSE maths tutoring is \xA330 an hour. A parent wants weekly sessions and asks: "What do you charge?" Type a range that works for you.'],quote:[],options:[],model:"\xA330 to \xA334 an hour, depending on how many sessions a week.",checks:'contains two amounts joined directly by "to", "and", a hyphen or a dash (either can be written with or without \xA3); the lower is 30; the higher is from 31 to 35; every amount of 10 or more is from 30 to 35; no "about", "around" or "roughly" directly before an amount; contains none of: lower, flexible, negotiable, can go, minimum, less, budget, most you, at least, open to, offers, ono. Whole words, any case.',after:["The card: the bottom is the number you want, the top 5 to 15% higher.",'Say the parent answers: "Our last tutor was \xA325." Stay at your bottom, and give them something for it: "I can do \xA330 if we keep the same slot every week."',"Fails: a range starting below \xA330, a top well over 15% higher, like \xA340, and anything that offers to come down."],modelRaw:'"\xA330 to \xA334 an hour, depending on how many sessions a week."'}],mission:"this week, write the range you'd give for one thing you charge for, or one job you'd apply for, with the number you actually want at the bottom."},{id:"2.5",title:"Word your price as what they get",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When you put your own price down, say it as what they get, not what you want."}]},{h:"When to use it",items:[{t:"p",text:"You're naming your price for a sale or a job, in person or in a message."},{t:"sit",text:"Selling on Vinted, quoting for a one-off job, making an offer on Marketplace."}]},{h:"Why it works",items:[{t:"p",text:`"I want \xA3340" makes them think about what they'd lose, so they dig in. "You'd get the sofa for \xA3340" makes them think about what they'd gain, so they give more ground.`}]},{h:"Example",items:[{t:"sit",text:"A neighbour asks what you want for your old TV. Similar ones sold for \xA3140 to \xA3170."},{t:"say",who:"You",text:`"You'd get the TV and the wall bracket for \xA3168."`},{t:"p",text:"Same \xA3168, but they picture the TV, not their cash."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Buying? Lead with the money you're giving.",rest:""},{t:"sit",text:"You're after a bike rack listed at \xA360 on Marketplace."},{t:"good",text:'"I can give you \xA348 for it."'},{t:"bad",text:`"I'd like it for \xA348." \u2192 it's about what you want: their rack.`},{t:"tip",n:2,title:`Starting with "you" isn't enough. It has to be what they get.`,rest:""},{t:"bad",text:`"You'd be paying \xA3168 for the TV." \u2192 it's about the money they hand over.`},{t:"tip",n:3,title:"Nice wording doesn't fix a low number.",rest:"Pick the number first: near the top if you're selling (lesson 2.1)."},{t:"bad",text:`"You'd get the TV for \xA3145." \u2192 right words, mid-range number.`}]},{h:"Don't use it when",items:[{t:"li",text:"**It's your pay.** It was only tested on buying and selling, so say your number or range plainly (lesson 2.4)."},{t:"li",text:`**You're asking them to move from their price.** "Could you do \xA328 a month?" is fine there (lesson 1.1).`}]},{h:"Avoid",items:[{t:"bad",text:`"I'm looking for \xA3340" or "I want \xA3340". It's about what you want.`},{t:"bad",text:`"I'd need \xA3340." It also sounds like your limit.`}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:"One research team, eight experiments with 650 people: wording an offer as what the other side gets made them give more ground (Tr\xF6tschel, Loschelder, H\xF6hne and Majer, 2015). Salaries weren't tested."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`Your new flatmate sees the desk and chair you're getting rid of and asks: "How much for both?" Sets like it have sold for \xA380 to \xA3100, and you've decided on \xA395. What's your best reply?`],quote:[],options:[{k:"A",t:`"I'm looking for \xA395 for the pair."`,ok:!1},{k:"B",t:`"You'd get the desk and chair for \xA395."`,ok:!0},{k:"C",t:`"You'd be paying \xA395 for the desk and chair."`,ok:!1},{k:"D",t:`"\xA395 for both, if that's OK with you?"`,ok:!1}],expl:{card:`The card: say it as what they get, not what you want. Starting with "you" isn't enough.`,items:[{k:"B",ok:!0,text:`Right. They picture the desk and chair in their room, not their \xA395. Say they answer: "Would you do \xA385?" Now you can say: "You'd get both for \xA390, and I'll carry them up."`,subs:[]},{k:"A",ok:!1,text:`About what you want. You'll usually get: "\xA375?"`,subs:[]},{k:"C",ok:!1,text:"About the money they hand over.",subs:[]},{k:"D",ok:!1,text:`Makes no the easy answer (lesson 1.1). You'll usually get: "\xA370?"`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're after a PS5 on Marketplace, listed at \xA3320. Similar ones have sold for \xA3260 to \xA3300, and you've decided on \xA3270. You message, and the seller replies: "Make me an offer." What's your best message?`],quote:[],options:[{k:"A",t:'"I can pay you \xA3270, and collect it today."',ok:!0},{k:"B",t:`"I'd like to get it for \xA3270, and I can collect today."`,ok:!1},{k:"C",t:`"I know it's \xA350 under, but would \xA3270 work?"`,ok:!1},{k:"D",t:'"\xA3270 would be my max for it, to be honest."',ok:!1}],expl:{card:"The card: buying? Lead with the money you're giving.",items:[{k:"A",ok:!0,text:`Right. It's about the \xA3270 they get. Say they reply: "It's \xA3320, end of." The wording hasn't moved them, so leave it there: "Fair enough. If it doesn't sell, my \xA3270 stands."`,subs:[]},{k:"B",ok:!1,text:"Same extras, but about what you want: their PS5.",subs:[]},{k:"C",ok:!1,text:"Reminds them of the \xA350 they're losing.",subs:[]},{k:"D",ok:!1,text:"Tells them your limit, so you've nowhere to go.",subs:[]}]}},{n:3,fmt:"Type it",stem:["A caf\xE9 asks your price for designing their new menu, a one-off job. You've decided on \xA3185, including two rounds of changes. Type your price, worded as what they get."],quote:[],options:[],model:"You'd get the full menu design, plus two rounds of changes, for \xA3185.",checks:"every \xA3 amount is \xA3185 and there is at l
