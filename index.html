sentences."},{t:"tip",n:4,title:`"That's difficult" isn't a maybe.`,rest:`The sentence after it is your answer. No "today" on the end: that's for saying their no back (lesson 4.4).`}]},{h:"Avoid",items:[{t:"bad",text:'"I think \xA390 is a really fair price." Calling your price fair starts a row about fairness.'},{t:"bad",text:'"\u2026is that OK?" Ending on a question invites another push.'},{t:"bad",text:`"That's my final price" or "That's my lowest." It sounds like a limit you've been pushed to, so they test it.`}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:'Skilled negotiators gave fewer reasons per point than average ones (about 1.8 against 3), and called their offers "fair" far less (Huthwaite, 103 real sessions: observed, not an experiment).'}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`A buyer has come round to look at the bike you're selling for \xA3295. Similar bikes have sold for \xA3280 to \xA3320. He's offered \xA3220 twice, and you've said no twice. Now he says: "Come on, \xA3220 is more than fair for a second-hand bike." What's your best reply?`],quote:[],options:[{k:"A",t:`"It's had a full service, it's got new tyres, and I paid \xA3600."`,ok:!1},{k:"B",t:`"That's difficult. Could you meet me nearer \xA3280?"`,ok:!1},{k:"C",t:`"That's difficult. I'm staying at \xA3295."`,ok:!0},{k:"D",t:'"Honestly, I think \xA3295 is a really fair price for it."',ok:!1}],expl:{card:`The card: "That's difficult", a pause, one short sentence. No arguments, no giving ground.`,items:[{k:"C",ok:!0,text:`Right. Nothing to argue with, and no sign pushing works. Say he answers: "OK, \xA3260?" He's moved \xA340 and you haven't moved. If he says "\xA3220 or I'm off", let him go: similar bikes sell for \xA3280 to \xA3320.`,subs:[]},{k:"A",ok:!1,text:`A pile of reasons. He'll attack the weakest: "What you paid doesn't matter."`,subs:[]},{k:"B",ok:!1,text:'Gives ground and ends on a question: "\xA3240 then."',subs:[]},{k:"D",ok:!1,text:"Calls your price fair, so now you're arguing about fairness.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["Your flatmate wants you to cover her \xA345 share of the electricity again this month. You've already said no once, and she's asking again. Which replies hold your no, and which invite another push?"],quote:[],options:[],sort:[{t:`"That's difficult. I can't cover it this month."`,bin:"holds your no"},{t:`"I'm skint, my insurance is due, and I covered you in March."`,bin:"invites another push"},{t:`"That's difficult. It's just not fair on me."`,bin:"invites another push"},{t:`"That's difficult. I'd like it in the kitty by Friday."`,bin:"holds your no"},{t:`"I covered March, so this one's yours."`,bin:"holds your no"},{t:`"That's difficult, I'm a bit skint, and I did cover March, so\u2026"`,bin:"invites another push"}],expl:{card:"The card: one short sentence, one reason at most. The sentence counts, not the opener.",items:[{label:"Holds your no",text:`"I can't cover it this month" (where you stand), "in the kitty by Friday" (your terms) and "I covered March, so this one's yours" (one reason, even without the opener).`,subs:[]},{label:"Invites another push",text:"",subs:[`"I'm skint, my insurance is due\u2026" is three reasons.`,`"That's difficult. It's just not fair\u2026" is the first trap: it argues about fairness.`,`"That's difficult, I'm a bit skint, and\u2026" is the second trap: it becomes a list.`]}]},bins:["holds your no","invites another push"]},{n:3,fmt:"Say it",stem:[`A regular client asked for five extra Instagram posts for free, and you said they weren't included. Now she writes: "Come on, we're such a good client. Could you just do them?" Your usual rate is \xA324 a post, and you'd happily do the five for \xA3120. What's your best reply?`],quote:[],options:[{k:"A",t:`"That's difficult. I don't do free work."`,ok:!1},{k:"B",t:`"I'd normally charge, but just this once, as it's you."`,ok:!1},{k:"C",t:`"It's a lot of work, I'm busy, and they each take an hour."`,ok:!1},{k:"D",t:`"That's difficult. The five extra posts would be \xA3120."`,ok:!0}],expl:{card:"The card: if you'd say yes on different terms, make those terms your one sentence.",items:[{k:"D",ok:!0,text:`Right. You'd do them for \xA3120, so say it. Say she answers: "Could you do \xA380?" Now you're haggling over a price, not over free work. If she says "Then leave it", you've lost nothing you were paid for.`,subs:[]},{k:"A",ok:!1,text:"A good flat no, but you wanted this work, so the \xA3120 is gone.",subs:[]},{k:"B",ok:!1,text:'Gives in, and "just this once" tells her pushing works.',subs:[]},{k:"C",ok:!1,text:`A pile of reasons: "They're only small posts."`,subs:[]}]}},{n:4,fmt:"Type it",stem:["A buyer on Marketplace has asked three times for \xA320 off the desk you've listed at \xA3120. You've already told him similar desks sell for \xA3110 to \xA3130, and you're not dropping it. Type a calm, flat no, as one short message with no more reasons (he's heard them)."],quote:[],options:[],model:"That's difficult. I'm staying at \xA3120.",checks:`contains 120 or one of: staying, sticking, stays, the price, not dropping, not moving, not budging, firm; any number in it is 120; doesn't end with "?"; no more than two sentences; no more than one comma (not counting one after an opening hi, hiya, hey, sorry or ah); contains none of: final, take it or leave it, fair, reasonable, generous, because, cos, since, so (except as the first word), also, plus, as well, and I, and I'm, and it's, and it, could, throw in, but can, but happy, but if, maybe, might, hope, hopefully, is that ok, lowest, best price, minimum, at least, below, can't go; 20 words or fewer. Whole words, any case.`,after:["The card: in a message, skip the pause. Two short sentences, no pile of reasons.",`Say he replies: "Fine, \xA3120. Can I collect tomorrow?" If he replies "Then I'll pass", you haven't dropped a penny, and the next buyer will usually pay near \xA3120.`,`Fails: a lower number, a question, more reasons, "fair", "final" or "take it or leave it" (lesson 4.4: "final" locks whoever says it in), throwing in extras, and "my lowest" (it sounds like a limit you've been pushed to, so they push to test it).`],modelRaw:`"That's difficult. I'm staying at \xA3120."`}],mission:`pick one thing you keep getting asked for (a favour, a discount, a lift). Write your calm, flat no: "That's difficult" plus one sentence. Say it out loud three times, letting your voice drop at the end, until it sounds calm, not snippy.`},{id:"4.3",title:"Ignore a weak plan B",guess:{stem:["In a study, people sold a used CD. Some had a backup buyer who'd pay $2 for it. Others had no backup buyer at all. Which group got the better deals?"],options:[{k:"A",t:"The $2 group, by a lot",ok:!1},{k:"B",t:"The $2 group, by a little",ok:!1},{k:"C",t:"About the same",ok:!1},{k:"D",t:"The group with no backup",ok:!0}],reveal:"the group with no backup. Sellers with the $2 backup opened lower and ended up with worse deals than sellers with nothing to fall back on."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Your plan B is what you'll do if this deal falls through. If it's weak, set your number from what the thing is worth, and keep the plan B to yourself."}]},{h:"When to use it",items:[{t:"p",text:"Your fallback is much worse than the going rate."},{t:"sit",text:"A trade-in price for your laptop, or a lower-paid job you'd stay in."}]},{h:"Why it works",items:[{t:"p",text:"A weak plan B drags your number down: with a \xA3150 trade-in offer, \xA3220 starts to feel good. And once they know it, anything above it looks like a win."}]},{h:"Example",items:[{t:"sit",text:"A trade-in site offers \xA3150 for your MacBook. Similar ones sell for \xA3380 to \xA3420 on eBay."},{t:"say",who:"Buyer",text:'"What do you want for it?"'},{t:"say",who:"You",text:`"You can have it for \xA3412. That's what they go for on eBay."`},{t:"p",text:"Your number comes from eBay, not the \xA3150."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"They bring up a low price? Answer with what it sells for.",rest:""},{t:"sit",text:'The buyer says: "Trade-in sites give \xA3150 for these."'},{t:"quote",text:'"They sell for \xA3380 to \xA3420 on eBay, not \xA3150."'},{t:"tip",n:2,title:"Ignore it when you pick your number, not when you decide.",rest:"Once they've made their best offer, check it beats your plan B."},{t:"p",text:"*Nobody will go above \xA3360 for the MacBook.* \u2192 \xA3360 beats the \xA3150 trade-in, so sell."},{t:"tip",n:3,title:"Only a strong plan B, close to the offer or better, should change what you do.",rest:""},{t:"p",text:"*Your landlord in England serves a Section 13 notice raising the rent. The First-tier Tribunal can review it, and can't go above his figure.* Say it calmly:"},{t:"quote",text:`"I'd rather sort it between us. Otherwise, it can go to the tribunal."`}]},{h:"Avoid",items:[{t:"bad",text:'"\xA3220? That beats the trade-in." A number just above your plan B.'},{t:"bad",text:`"I've only got a trade-in offer of \xA3150." Now they know your floor.`},{t:"bad",text:`"I've got loads of other options." A bluff: they'll ask who.`},{t:"bad",text:`"\u2026or I'll walk away," with nowhere to walk to. They'll let you.`}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Sellers with a weak $2 backup offer got worse deals than sellers with none (Schaerer, Swaab and Galinsky, 2015)."},{t:"ev",label:"Proven (UK law)",text:"The tribunal rule is in the Renters' Rights Act (England, from 1 May 2026)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're selling your old Samsung Galaxy S23. A trade-in site will give you \xA3120. On eBay, similar ones have sold for \xA3250 to \xA3280. Someone from your uni group chat messages: "What are you after for it?" What's your best reply?`],quote:[],options:[{k:"A",t:`"I've had a trade-in offer of \xA3120, so \xA3180 would do me."`,ok:!1},{k:"B",t:`"Make me an offer and I'll see what I think."`,ok:!1},{k:"C",t:`"I'm in no rush. I've got a trade-in offer to fall back on."`,ok:!1},{k:"D",t:`"\xA3278. That's what good ones have sold for on eBay."`,ok:!0}],expl:{card:"The card: ignore a weak plan B when you pick your number. Set it from what the thing is worth.",items:[{k:"D",ok:!0,text:`Right. Your number comes from eBay, not the trade-in. Say they reply: "Would you do \xA3240?" Now you're haggling between \xA3240 and \xA3278: "\xA3265, and you can have it tomorrow."`,subs:[]},{k:"A",ok:!1,text:'The \xA3120 has dragged your number down and shown your floor: "\xA3150?"',subs:[]},{k:"B",ok:!1,text:"You know what it's worth, so name it (lesson 2.1).",subs:[]},{k:"C",ok:!1,text:`Mentions a weak plan B, so you'll usually get just above it: "\xA3140?"`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`Back to the Samsung. You asked \xA3278. They reply: "Trade-in sites only give about \xA3120 for these. I'll do \xA3170." What's your best reply?`],quote:[],options:[{k:"A",t:'"Fair point. Would you meet me at \xA3220, then?"',ok:!1},{k:"B",t:'"These sell for \xA3250 to \xA3280 on eBay, not \xA3120. I can do \xA3268."',ok:!0},{k:"C",t:`"That's why I'd rather sell it to you than trade it in. Could you do \xA3200?"`,ok:!1},{k:"D",t:`"What's the most you could stretch to for it?"`,ok:!1}],expl:{card:"The card: if they bring up a low price, answer with what it sells for.",items:[{k:"B",ok:!0,text:`Right. You answer their \xA3120 with eBay prices, and make a small move. Say they reply: "\xA3240?" Now you can say: "\xA3262 and it's yours." If they say "No, \xA3170's plenty", list it on eBay.`,subs:[]},{k:"A",ok:!1,text:"Lets their \xA3120 drag you down \xA358 in one go.",subs:[]},{k:"C",ok:!1,text:`Makes the trade-in the yardstick, and tells them it's your plan B: "\xA3180, then."`,subs:[]},{k:"D",ok:!1,text:'Asks their limit (lesson 1.1): "\xA3180, tops."',subs:[]}]}},{n:3,fmt:"Say it",stem:[`Aisha has been offered a junior marketing role at a small agency. The recruiter says: "We'd love to have you. Are you happy to go ahead at \xA326,000?" Similar roles are advertised at \xA325,000 to \xA328,000. She has no other offers. If this fell through, she'd stay in her \xA321,000 admin job. What's her best reply?`],quote:[],options:[{k:"A",t:`"I'm weighing up a couple of other options, so I'd need more."`,ok:!1},{k:"B",t:`"It's a big step up from my \xA321,000 admin job. Could you do \xA326,500?"`,ok:!1},{k:"C",t:`"I'm really keen. Could we look at \xA328,000?"`,ok:!0},{k:"D",t:`"I'd need \xA330,000, or I'll have to walk away."`,ok:!1}],expl:{card:"The card: set your number from what the role pays, not your plan B.",items:[{k:"C",ok:!0,text:'Right. The top of the going rate, with nothing weak on show. Say they answer: "We could stretch to \xA327,200." If they hold at \xA326,000, she checks it against her plan B: \xA35,000 more than the admin job, so she takes it.',subs:[]},{k:"A",ok:!1,text:`A bluff. You'll usually get: "Oh, who with?"`,subs:[]},{k:"B",ok:!1,text:"The drag in action: now they know anything over \xA321,000 is a win.",subs:[]},{k:"D",ok:!1,text:"A threat with nowhere to walk.",subs:[]}]}},{n:4,fmt:"Type it",stem:[`You're selling your 2015 Vauxhall Corsa. A dealer will give you \xA31,800 in part-exchange. On AutoTrader, similar ones sell privately for \xA32,600 to \xA32,900. A mate of a mate texts: "What would you want for the Corsa?" Type your reply.`],quote:[],options:[],model:"You can have it for \xA32,880. That's what similar ones are selling for on AutoTrader.",checks:`contains an amount from 2,750 to 2,900 (with or without \xA3 or a comma); no other numbers except 2015 or the 2,600 to 2,900 range; contains one of: autotrader, sell, sells, selling, sold, go for, goes for, going for, gone for, worth, going rate, similar, privately; contains none of: dealer, part-exchange, part exchange, px, trade, trade-in, ono, or nearest, offers, open to, flexible, negotiable, lowest, minimum, at least, below, can't go; no "about", "around" or "roughly" in front of a number; 25 words or fewer. Whole words, any case.`,after:["The card: ignore the weak plan B, and set your number from what it sells for.",`Say they answer: "Would you do \xA32,500?" Now you're haggling between \xA32,500 and \xA32,880: "\xA32,790, and you can drive it away on Saturday." If they say "A dealer would only give you \xA31,800", answer with private prices again.`,"Fails: any number under \xA32,750 (the \xA31,800 dragging you down), mentioning the dealer's offer, no reason, and inviting lower offers."],modelRaw:`"You can have it for \xA32,880. That's what similar ones are selling for on AutoTrader."`},{n:5,fmt:"Say it",stem:[`You rent in England. Your landlord has served a Section 13 notice putting your rent up from \xA31,150 to \xA31,325 a month. Similar flats nearby are let at \xA31,180 to \xA31,230. You'd rather not move: it would mean a new deposit, a removal van and a longer commute. You've asked him to make it \xA31,185, and he says: "\xA31,325 is what's on the notice, and that's that." What's your best reply?`],quote:[],options:[{k:"A",t:`"If we can't agree, I'll ask the tribunal to look at it."`,ok:!0},{k:"B",t:`"Then I'll have to start looking for somewhere else to live."`,ok:!1},{k:"C",t:'"OK. Could we meet in the middle, at \xA31,255 a month?"',ok:!1},{k:"D",t:`"I suppose it's still cheaper than moving, so fine."`,ok:!1}],expl:{card:"The card: only a strong plan B should change what you do. Here that's the tribunal, not moving.",items:[{k:"A",ok:!0,text:`Right. Similar flats are \xA31,180 to \xA31,230, so a tribunal would likely land nearer your number, never above his \xA31,325. Say he answers: "Let's not involve tribunals. \xA31,225?"`,subs:[]},{k:"B",ok:!1,text:`Waves your weak plan B: "That's up to you."`,subs:[]},{k:"C",ok:!1,text:"Offers the middle yourself (lesson 3.6), of his inflated figure.",subs:[]},{k:"D",ok:!1,text:"The drag in action: your weak plan B has set your number at his.",subs:[]}]}}],mission:"this week, pick one thing you'll negotiate soon (pay, rent, something you're selling). Write down your plan B and what the thing is worth. If the plan B is much lower, cross it out, and write your opening number from what it's worth instead."},{id:"4.4",title:'What to say to "final offer"',guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:'When they say "final offer" or "take it or leave it", say it back softer, with a time limit:'},{t:"quote",text:'"I get that \xA3400 is hard to move on today."'},{t:"p",text:"Or carry on as if it wasn't said, and ask about something other than that number."}]},{h:"When to use it",items:[{t:"p",text:"Someone draws a line under their price."},{t:"sit",text:"A recruiter on salary, a letting agent on rent, a seller on Vinted."}]},{h:"Why it works",items:[{t:"p",text:`"Final" is often said for show. Swapping "final" for "hard", and "for good" for "today", lets them move later without admitting they didn't mean it.`}]},{h:"Example",items:[{t:"sit",text:`Buying a used e-bike. The seller says: "\xA3400. That's my final offer."`},{t:"say",who:"You",text:'"I get that \xA3400 is hard to move on today."'},{t:"say",who:"Seller",text:'"Look\u2026 \xA3380 if you take it now."'},{t:"p",text:'He came down without taking back "final".'}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:'Swap "final" for "hard", and add a time limit.',rest:"Any line that lets them move later without backing down works."},{t:"good",text:`"If it's still around next week, I'm still keen."`},{t:"bad",text:`"So \xA3400 is your final offer, then." \u2192 it's still "final", so it stays final.`},{t:"tip",n:2,title:"Or ask about something else:",rest:"a start date, a pay review, what's included."},{t:"sit",text:"A seller says \xA3120 for the watch is final."},{t:"quote",text:'"Fair enough. Could the spare strap come with it?"'},{t:"tip",n:3,title:'"Final" a second time? Take it seriously.',rest:"Stop pushing on that number. Ask for something else, or compare their offer with your plan B (lesson 4.3)."}]},{h:"Don't use it when",items:[{t:"li",text:'**"Final" comes with a real deadline,** like a job offer that ends on Friday. Ignore it and the deadline passes (lesson 4.5).'}]},{h:"Avoid",items:[{t:"bad",text:`"Is that really your final offer?" They say it again, and now they're stuck with it.`},{t:"bad",text:`"Come on, nobody means 'final'." Now they can't move without admitting they bluffed.`},{t:"bad",text:'"Then my final is \xA3300." Now one of you has to back down.'}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:"In six studies, people prompted to see their own actions as choices saw more room to negotiate after a take-it-or-leave-it offer, and got better deals (Ma, Yang and Savani, 2019). Saying it back softer is a pro trick (Deepak Malhotra), never tested."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're joining a small architecture practice. You asked for \xA333,000, and similar roles pay \xA330,000 to \xA333,000. The hiring manager says: "\xA330,500 is our final offer." You have no other offers. What's your best reply?`],quote:[],options:[{k:"A",t:'"Is \xA330,500 really your final offer, though?"',ok:!1},{k:"B",t:'"Understood. Could we review it in six months?"',ok:!0},{k:"C",t:'"So \xA330,500 is your final offer, then."',ok:!1},{k:"D",t:`"Then I'm afraid I'll have to look elsewhere, sorry."`,ok:!1}],expl:{card:`The card: carry on as if they hadn't said "final", and ask about something other than that number.`,items:[{k:"B",ok:!0,text:`Right. Their "final" salary stays untouched, and the talk carries on. Say they answer: "A six-month review we can do, and I'll add a \xA31,000 training budget."`,subs:[]},{k:"A",ok:!1,text:`Makes them repeat it. You'll usually get: "Yes, it is." Now it's locked in.`,subs:[]},{k:"C",ok:!1,text:'Says it back, but keeps the word "final", so it stays final.',subs:[]},{k:"D",ok:!1,text:"A threat with no plan B behind it (lesson 4.3).",subs:[]}]}},{n:2,fmt:"Sort it",stem:[`On Vinted, you've offered \xA350 for a jacket listed at \xA365. Similar jackets go for \xA350 to \xA360 on Vinted. The seller replies: "\xA355 is my final price, I've already dropped it twice." She's also selling a beanie for \xA315. Which replies give her room to move, and which back her into a corner?`],quote:[],options:[],sort:[{t:'"Is \xA355 really your final price?"',bin:"backs her into a corner"},{t:'"I get that \xA355 is hard to move on today, after two drops."',bin:"gives her room"},{t:'"OK, then my final offer is \xA350."',bin:"backs her into a corner"},{t:'"Fair. Could we do \xA360 for the jacket and the beanie?"',bin:"gives her room"},{t:`"Come on, everyone says 'final' on Vinted."`,bin:"backs her into a corner"},{t:`"Understood. If it's still here next week, I'm still keen."`,bin:"gives her room"}],expl:{card:"The card: say it back softer, or ask about something other than the \xA355.",items:[{label:"Gives her room",text:"",subs:['"Hard to move on today" turns "final" into "today".','"\xA360 for both" leaves her \xA355 alone, so the beanie costs you \xA35.',`"If it's still here next week" lets her come back later.`]},{label:"Backs her into a corner",text:"",subs:['"Is \xA355 really final?" makes her repeat it.',`"Everyone says 'final'" calls her a bluffer.`,'"My final offer is \xA350" is the trap: it feels firm, but now someone has to back down.']}]},bins:["backs her into a corner","gives her room"]},{n:3,fmt:"Say it",stem:[`You're buying a used Steam Deck. Similar ones sell for \xA3320 to \xA3380. He's also listed the case and a dock for \xA340. You offered \xA3320, and he said: "\xA3350, final." You replied: "I get that \xA3350 is hard to move on today." Now he says: "Honestly, mate, \xA3350 is final." What's your best next move?`],quote:[],options:[{k:"A",t:'"\xA3350 with the case and dock thrown in?"',ok:!0},{k:"B",t:`"I get it's hard to move today. Could you do \xA3335?"`,ok:!1},{k:"C",t:'"Is \xA3350 really the final figure, though?"',ok:!1},{k:"D",t:'"Fine. Then \xA3330 is my final offer, too."',ok:!1}],expl:{card:'The card: when "final" comes back a second time, ask for something other than that number.',items:[{k:"A",ok:!0,text:'Right. He keeps his \xA3350, and \xA340 of extras makes the Steam Deck \xA3310, under the going rate. Say he answers: "Go on, then." If he says "Case is extra", weigh \xA3350 against your plan B.',subs:[]},{k:"B",ok:!1,text:'The softer line is for the first "final": "Like I said, \xA3350."',subs:[]},{k:"C",ok:!1,text:'Makes him say "final" a third time.',subs:[]},{k:"D",ok:!1,text:'Matches his "final", so someone must back down.',subs:[]}]}},{n:4,fmt:"Type it",stem:[`The letting agent emails about a flat you want: "The landlord says \xA31,195 a month is final. Take it or leave it." Similar flats nearby are \xA31,095 to \xA31,195, you'd hoped for \xA31,095, and you want to keep talking. The flat's parking space is \xA350 a month extra, and you could move in on the 1st. Type a reply that says \xA31,195 is hard for him to move on right now (not never), then asks a question that keeps the talk going.`],quote:[],options:[],model:"I get that \xA31,195 is hard to move on right now. If I can move in on the 1st, could he include the parking?",checks:`contains one of: difficult, hard, tricky, can't move, can't shift, can't budge; contains one of: today, now, this week, this month, at the moment, for the moment, at this stage, currently, yet; contains "?" or one of: if, would; contains none of: final, take it or leave it, hard no, I'll take it, I accept, I'll accept, fine, I can't, we can't, afford, I need, we need, elsewhere, walk, other flats, keep looking, look around, or I'll, hard for me, difficult for me, too much for me, too high for me, hard for us, difficult for us, too much for us, too high for us, not paying, at least, minimum, below, can't go, max, lowest, the most, best price, bottom, sign for, fixed term, fixed-term, 12-month, minimum term; 30 words or fewer. Whole words, any case.`,after:['The card: say "final" back with a time limit, so the landlord can move later without backing down.',`Say they answer: "He'll include the parking if you're in on the 1st." That's \xA350 a month, with nobody backing down. If they reply "He won't budge on anything", that's "final" a second time: compare \xA31,195 with your plan B (lesson 4.3).`,`Fails: repeating "final", accepting, threats ("I'll look elsewhere"), your own money ("hard for me", "can't afford"), and offering to sign for a fixed term (new tenancies don't have them).`],modelRaw:'"I get that \xA31,195 is hard to move on right now. If I can move in on the 1st, could he include the parking?"'}],mission:`for three "final offer" lines you might hear (from a buyer, a recruiter and a letting agent), write a way of saying each one back with a time limit, like "I get that's hard to move on today", and say each one out loud.`},{id:"4.5",title:"Line up your job offers",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Two job offers, different deadlines? Tell the slower firm about your deadline. If they can't speed up, ask the faster one for a few more days, so you choose between real offers at once."}]},{h:"When to use it",items:[{t:"p",text:"One firm wants an answer by Friday; the one you'd rather join is still deciding."},{t:"sit",text:"A grad scheme and a start-up, or two internships."}]},{h:"Why it works",items:[{t:"p",text:"The slower firm can often speed up, but only if they know there's a clock. The faster one will usually give someone keen a few more days."}]},{h:"Example",items:[{t:"sit",text:"A recruitment firm wants an answer by Friday. The charity you'd prefer decides on Tuesday."},{t:"say",who:"You, to the firm",text:`"I'm really excited about this. Could I have until Wednesday to read the contract?"`},{t:"say",who:"Firm",text:`"Wednesday's fine."`},{t:"p",text:"Both answers now land before you choose."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Tell the slower firm first: your deadline, and that they're your first choice.",rest:""},{t:"good",text:`"I've had an offer with a Friday deadline, and you're still my first choice. Could you let me know before then?"`},{t:"bad",text:`"Just checking in on timings!" \u2192 they don't know there's a reason to hurry.`},{t:"bad",text:`"\u2026or I'll take the other one." \u2192 a threat, so they dig in.`},{t:"tip",n:2,title:"Their date's fixed? Ask the faster firm for one short, specific extension,",rest:"sounding keen, with a reason. Never tell them they're your second choice."},{t:"bad",text:`"Could I have a bit more time?" \u2192 you'll usually get a day.`},{t:"tip",n:3,title:"Both offers in? Tell your favourite about the other one, and why you'd still pick them.",rest:""},{t:"sit",text:"The charity offers \xA322,000. The recruitment firm offered \xA324,000."},{t:"quote",text:`"I'd rather join you, for the work itself. I've an offer at \xA324,000. Could you match it?"`}]},{h:"Don't use it when",items:[{t:"li",text:"**It's a graduate scheme salary.** Those are usually fixed, so line up the timings, not the pay."},{t:"li",text:"**The other offer is weaker, or you haven't really got it.** Keep it to yourself (lesson 4.3). They may ask who it's from."}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"From Deepak Malhotra's rules for job offers (Harvard Business Review, 2014) and Harvard's Program on Negotiation. Never tested in a study."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You've been offered a junior role at a small PR agency for \xA326,500, and they want your answer by Friday the 14th. You'd rather join a 20-person start-up, where you had your final interview on Monday. They said they'd decide "in the next couple of weeks". What's your best email to the start-up?`],quote:[],options:[{k:"A",t:`"I've had another offer, so I'll need your answer by this Friday, or I'll just have to accept it."`,ok:!1},{k:"B",t:`"Just checking in on timings. Do you have any idea when you'll be deciding?"`,ok:!1},{k:"C",t:`"I've got an offer with a Friday deadline, but you're my first choice. Can you speed things up?"`,ok:!0},{k:"D",t:`"I've just had an offer from another agency, so could you let me know where I stand with you?"`,ok:!1}],expl:{card:"The card: tell the slower one you have a deadline, and that you'd still rather join them.",items:[{k:"C",ok:!0,text:`Right. They learn there's a clock, and that you'd say yes. Say they answer: "Could you meet our founder on Wednesday?" If they say "Not before the 18th", ask the agency for a short extension.`,subs:[]},{k:"A",ok:!1,text:`A threat, so they'll usually dig in: "We can't rush our process."`,subs:[]},{k:"B",ok:!1,text:'No reason to hurry: "Should be the next week or two!"',subs:[]},{k:"D",ok:!1,text:`No deadline: "We'll be in touch soon."`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`The start-up's founder replies: "Thanks for telling us. Our hiring panel meets on Tuesday the 18th, and we can't decide before then." The agency's deadline is still Friday the 14th. What's your best move now?`],quote:[],options:[{k:"A",t:'Email the start-up: "Understood, but is there any way at all to speed things up before Friday?"',ok:!1},{k:"B",t:`Ring the agency: "I'm really excited. Could I have until Wednesday the 19th to read the contract?"`,ok:!0},{k:"C",t:`Ring the agency: "Could I have a bit more time to think it all over, please? I'm nearly there with it."`,ok:!1},{k:"D",t:`Ring the agency: "I'm still waiting to hear from a firm I'd prefer, so I'll need until the 19th."`,ok:!1}],expl:{card:"The card: if the slower one's date is fixed, ask the faster one for a short, specific extension.",items:[{k:"B",ok:!0,text:`Right. Keen, one specific date and a reason, landing the day after the panel. Say they answer: "We can do Wednesday." If they say "Sorry, Friday's firm", you choose on Friday: a real offer or a maybe.`,subs:[]},{k:"A",ok:!1,text:`They've just said why they can't: "The panel's on the 18th."`,subs:[]},{k:"C",ok:!1,text:"Vague, so you'll usually get one more day.",subs:[]},{k:"D",ok:!1,text:`Says they're your second choice: "Then we'll need your answer by Friday."`,subs:[]}]}},{n:3,fmt:"Say it",stem:["It worked: both offers are in. The agency offered \xA326,500. The start-up offers \xA325,000. Similar roles pay \xA324,000 to \xA326,500. You'd rather join the start-up, for the training and the team. What do you say to the start-up?"],quote:[],options:[{k:"A",t:`"I'd rather join you, for the training. I've an offer at \xA326,500. Could you match it?"`,ok:!0},{k:"B",t:`"I've got an offer at \xA326,500 from the agency, so you'll need to match it if you want me."`,ok:!1},{k:"C",t:`"I'd love to join you, for the training and the team. Could we look at \xA325,750?"`,ok:!1},{k:"D",t:`"I've had a better offer elsewhere, so what's the most you could do for me?"`,ok:!1}],expl:{card:"The card: tell your favourite about the other offer, and why you'd still pick them.",items:[{k:"A",ok:!0,text:`Right. A real offer, and a reason to win you. Say they answer: "We can do \xA326,000, and a review at six months." If they say "\xA325,000 is all we've got", weigh the training against \xA31,500 a year.`,subs:[]},{k:"B",ok:!1,text:'A threat, so they dig in: "Then the agency might suit you better."',subs:[]},{k:"C",ok:!1,text:"Asks for less than the offer you already hold.",subs:[]},{k:"D",ok:!1,text:'Asks their limit, with nothing to beat: "\xA325,500, tops."',subs:[]}]}},{n:4,fmt:"Type it",stem:[`You're in your final year. A consultancy's graduate scheme has offered you a place (fixed salary, like most schemes) and needs your answer by 5pm on 28 November. Your first choice, a policy think tank, interviewed you last week and said they'd "be in touch in December". Type the email you'd send the think tank.`],quote:[],options:[],model:"I've been offered a place elsewhere that I need to answer by 28 November. You're still my first choice. Could you let me know before then?",checks:`contains one of: offer, offered, place; contains one of: deadline, 28, 28th, November, expires, answer by, reply by, respond by, decide by; contains one of: first choice, top choice, rather, prefer, keen, favourite, really want, most excited, love to, still very interested, still really interested, number one; contains one of: speed, sooner, quicker, faster, earlier, before then, before the, let me know, decision, decide, timeline, timings, hear back; contains "?"; contains none of: or I'll, otherwise, I'll have to accept, I'll accept, or I'll take, I'll just take, go with them, final, I need an answer, I'll need an answer, need your answer, you must, unless, or else, salary, match, pay, \xA3, just checking, just wondering, no worries, if not, don't suppose, second choice; 45 words or fewer. Whole words, any case.`,after:["The card: tell the slower one about your deadline, and that you'd still rather join them.",`Say they answer: "Thanks for letting us know. Could you do a final call on Monday?" If they say "We can't decide before December", ask the consultancy for a short extension, sounding keen, with a reason.`,`Fails: threats ("or I'll accept it"), leaving out the deadline or that they're your first choice, a vague "just checking in", and asking about pay (the think tank isn't haggling yet; this message is about timing).`],modelRaw:`"I've been offered a place elsewhere that I need to answer by 28 November. You're still my first choice. Could you let me know before then?"`}],mission:`this week, draft and save the two emails from this lesson (the "speed things up" one and the "short extension" one), with the name of a firm you'd love to work for, so they're ready the day an offer lands.`}]},{n:5,title:"Getting to Yes",tagline:"Get them on your side before you ask, so yes is the easy answer.",lessons:[{id:"5.1",title:"Say their objection before they do",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Just before an ask they won't like, say the negative thing they're about to think, in one short line:"},{t:"quote",text:'"This is going to sound cheeky."'},{t:"p",text:"Then make a specific ask, and stop talking."}]},{h:"When to use it",items:[{t:"p",text:"You're about to ask for something they won't expect or won't like."},{t:"sit",text:"A low offer on a car, chasing a mate for money, a higher rate for a regular client."}]},{h:"Why it works",items:[{t:"p",text:`Once you've said it, there's little point in them saying it too. They'll often play it down instead: "Ha, it's fine."`}]},{h:"Example",items:[{t:"sit",text:"A mate borrowed \xA360 in March and hasn't mentioned it since."},{t:"say",who:"You",text:'"This is going to sound petty. Could you send the \xA360 by Friday?"'},{t:"say",who:"Mate",text:'"Ha, not petty at all. Sending it now."'},{t:"p",text:"She played it down for you."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:`Say "This is going to sound\u2026", never "I don't want this to sound\u2026".`,rest:""},{t:"bad",text:`"I don't want to sound rude, but\u2026" \u2192 now they wonder whether it is.`},{t:"tip",n:2,title:"Name what they'll think anyway, never a weak spot they haven't noticed.",rest:""},{t:"sit",text:"You're chasing a client's late invoice. They'll think you're being pushy. They don't know you're skint."},{t:"good",text:`"You'll probably think I'm being pushy."`},{t:"bad",text:`"I'm really skint this month." \u2192 you've handed them a weak spot.`},{t:"tip",n:3,title:"One line, then a specific ask, then stop.",rest:'No apologies, and no "but" plus a list of reasons. In a message, back your number with one reason.'},{t:"bad",text:'"Is there any chance you could\u2026?" \u2192 makes saying no easy (lesson 1.1).'}]},{h:"Avoid",items:[{t:"bad",text:`"Sorry, I know it's a big ask, and I totally get it if not\u2026" A string of apologies sounds like grovelling, and makes "no" easy.`}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:'Chris Voss calls it an "accusation audit". Never tested in a negotiation; in mock trials, admitting a weak point before the other side raised it made it do less damage (Williams, Bourgeois and Croyle, 1993).'}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You're messaging a seller on Facebook Marketplace about an electric guitar listed at \xA3200. Similar ones have sold for \xA3130 to \xA3170, and you want to offer \xA3130. Which message gives you the best shot?"],quote:[],options:[{k:"A",t:`"I don't want to offend you at all, but would you take \xA3130 for it?"`,ok:!1},{k:"B",t:`"Sorry, you've probably had much better offers already, but would \xA3130 work for you?"`,ok:!1},{k:"C",t:'"This is going to sound low. Similar ones sold for \xA3130. Would you take that?"',ok:!0},{k:"D",t:'"Would \xA3130 work for you? Happy to go up a bit if not."',ok:!1}],expl:{card:"The card: name what they're about to think, then a specific ask, with a reason in a message.",items:[{k:"C",ok:!0,text:`Right. They don't need to say "that's low", and the sold price backs your number. Say they reply: "Ha, it is a bit low. \xA3160?" Now you're haggling between \xA3130 and \xA3160: "\xA3140, and I'll collect tonight."`,subs:[]},{k:"A",ok:!1,text:`The "I don't want to\u2026" version, which plants "offend".`,subs:[]},{k:"B",ok:!1,text:"Apologises, and suggests they've had better offers.",subs:[]},{k:"D",ok:!1,text:"Tells them you'll pay more.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You're DJing a 21st for a friend of a friend, for your usual \xA3250 (DJs round here charge \xA3200 to \xA3300). You want \xA3100 up front to hold the date, and they won't be expecting it. What's your best way to say it?"],quote:[],options:[{k:"A",t:`"I know it's a bit formal, but is there any chance of \xA3100 up front?"`,ok:!1},{k:"B",t:`"You'll probably think a deposit's a bit formal. I take \xA3100 to hold the date."`,ok:!0},{k:"C",t:`"I don't want this to sound pushy, but I need \xA3100 up front to hold the date."`,ok:!1},{k:"D",t:'"Sorry to ask, but would a small deposit be possible at all?"',ok:!1}],expl:{card:`The card: say what they'll think, then ask for exactly what you want, without making "no" easy.`,items:[{k:"B",ok:!0,text:'Right. It names their likely thought, then states your terms. Say they answer: "Ha, fair enough. The last DJ wanted one too." Settled on your terms.',subs:[]},{k:"A",ok:!1,text:`"Is there any chance" makes no easy (lesson 1.1): "We'd rather pay on the night."`,subs:[]},{k:"C",ok:!1,text:`"I don't want this to sound pushy" makes them wonder.`,subs:[]},{k:"D",ok:!1,text:'Apologises and shrinks \xA3100 into "a small deposit".',subs:[]}]}},{n:3,fmt:"Say it",stem:["You want to ask your manager if you can finish at 3pm on Mondays for a course. Mondays are always the busiest shift. You've also been late twice this month, though she didn't seem to notice. Which line should you say just before you ask?"],quote:[],options:[{k:"A",t:`"You'll probably say I've been late a couple of times recently."`,ok:!1},{k:"B",t:`"I don't want this to sound like I'm not committed, but\u2026"`,ok:!1},{k:"C",t:`"Sorry, I know it's a big ask, and I totally get it if not\u2026"`,ok:!1},{k:"D",t:`"You'll probably say Mondays are when we're busiest."`,ok:!0}],expl:{card:"The card: name what they'll think anyway, never a weak spot they haven't noticed.",items:[{k:"D",ok:!0,text:`Right. She's bound to think of Mondays, so say it first, then answer it: "That's why I've asked Sam, and he's happy to cover 3 till close. Could I finish at 3 on Mondays?" If she still says no, ask: "What's the main worry with Mondays?"`,subs:[]},{k:"A",ok:!1,text:"Hands her a problem she hadn't spotted.",subs:[]},{k:"B",ok:!1,text:`"I don't want this to sound\u2026", so she wonders.`,subs:[]},{k:"C",ok:!1,text:'Apologises and makes "no" easy.',subs:[]}]}},{n:4,fmt:"Type it",stem:[`Your room is the smallest in the flat, but you and your two flatmates all pay the same rent. You want to ask if you could pay \xA340 a month less. You know they'll think: "You agreed to this when you moved in." Type the line you'd say just before you ask.`],quote:[],options:[],model:"You'll probably say it's a bit late to ask, since I agreed to the split.",checks:"contains one of: going to sound, gonna sound, might sound, will sound, probably think, probably thinking, you're thinking, you'll be thinking, you probably think, going to think, gonna think, you'll think, might think, you'll say, you'll probably say, you'd say, going to say, might say, sounds cheeky, this is cheeky, I know I agreed; contains none of: but, sorry, don't want, if not, no worries, totally understand, hate asking, awful, terrible, feel bad, desperate, skint, struggling, broke, tight, afford, lowest, best price, minimum, at least, below, can't go; no number other than 40; 15 words or fewer. Whole words, any case.",after:["The card: say the negative thing they're about to think, in one line, before you ask.",`Say they answer: "Ha, you did. But your room is tiny." Now they've made your case for you: "Could I pay \xA340 less, and you two \xA320 more each?"`,`Fails: "but" plus a reason, apologies, "I don't want this to sound\u2026", and money worries (a weak spot they hadn't thought about).`],modelRaw:`"You'll probably say it's a bit late to ask, since I agreed to the split."`},{n:5,fmt:"Spot it",stem:["Priya wants a bar to waive the \xA3100 fee for booking an area for her birthday:","What should she have said instead?"],quote:[`Priya: "Sorry, this is really annoying, and you must get asked this all the time, and I totally get it if you can't, but is there any way you could waive the fee?"`,`Manager: "Sorry, no, it's company policy."`],options:[{k:"A",t:`"You'll probably think I've got a cheek. Could you waive the \xA3100?"`,ok:!0},{k:"B",t:`"I know this is cheeky, but money's really tight this month. Could you waive it?"`,ok:!1},{k:"C",t:'"Could you waive the \xA3100? Even half off would really help."',ok:!1},{k:"D",t:'"Is there any chance at all you could waive the fee?"',ok:!1}],expl:{card:"The card: one short line for what they'll think, then the specific ask, then stop.",items:[{k:"A",ok:!0,text:`Right. Say the manager answers: "Ha, you have a bit! How many of you?" That's a maybe, not a no: "About 25, from eight. Could you drop the fee if we hit a minimum spend?"`,subs:[]},{k:"B",ok:!1,text:'"But" and her money worries turn it into a plea.',subs:[]},{k:"C",ok:!1,text:"Drops to \xA350 before he's answered.",subs:[]},{k:"D",ok:!1,text:'A yes/no that makes "no" easy: "No chance, sorry."',subs:[]}]}}],mission:`this week, ask for one small thing you've been putting off (a discount, a shift swap, a favour), and start with "This is going to sound\u2026".`},{id:"5.2",title:'Make "no" the answer you want',guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:'With someone wary, busy or a stranger, ask so that a plain "no" helps you.'},{t:"quote",text:'"Is now a bad time?" "No, go on."'}]},{h:"When to use it",items:[{t:"p",text:"Your first ask to someone who's on guard."},{t:"sit",text:"A lecturer rushing between classes, a landlord who's been short with you, someone you're messaging cold."}]},{h:"Why it works",items:[{t:"p",text:'To someone on guard, a question built for "yes" is easy to refuse: "Have you got a minute?" gets "Not really." Saying "no" feels safe, so they relax and keep talking.'}]},{h:"Example",items:[{t:"sit",text:"Your landlord's been short with you since the boiler row. You want to paint your room."},{t:"say",who:"You",text:'"Would you be against me painting my room a light grey?"'},{t:"say",who:"Landlord",text:`"No, as long as it's not dark."`},{t:"p",text:'His safe answer, "No", was a yes to you.'}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:'Before you ask, check: if they just say "no", does that help you?',rest:`This isn't making refusing easy (lesson 1.1). "No worries if not!" makes "no" turn you down. Asking for a no makes "no" say yes to you.`},{t:"good",text:'"Would it be ridiculous to ask for Friday off?" \u2192 "No, not ridiculous."'},{t:"bad",text:`"I don't suppose I could have Friday off?" \u2192 "No, sorry."`},{t:"tip",n:2,title:'"Is now a bad time?" only works live,',rest:`on the phone or face to face. In a message they'll read later, "now" means nothing.`},{t:"sit",text:"You're messaging a tutor you've never met."},{t:"quote",text:`"Would it be mad to ask for ten minutes after Thursday's lecture?"`},{t:"tip",n:3,title:"Use it to open.",rest:"Once they're listening, make your specific ask (lesson 1.1)."},{t:"sit",text:'Your manager says: "No, go on."'},{t:"quote",text:'"Could I leave at 4 on Fridays this month?"'}]},{h:"Avoid",items:[{t:"bad",text:'"Have you got a minute?" To someone busy, the easy answer is "Not really."'},{t:"bad",text:`"Is it OK if\u2026?" to someone wary. It asks for a yes they're not ready to give.`}]},{h:"Other ways to say it",items:[{t:"p",text:'"Is now a bad time?" \xB7 "Would it be mad to\u2026?" \xB7 "Are you against\u2026?" \xB7 "Would you mind if\u2026?"'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Chris Voss teaches it. Widely taught, never tested."}]}]}],know:!1},questions:[{n:1,fmt:"Sort it",stem:[`Your manager's been snowed under and short with everyone all week. You catch her by the coffee machine. You want to ask about working from home one day a week. Which openers make "no" the answer that helps you, and which make "no" the answer that ends it?`],quote:[],options:[],sort:[{t:'"Have you got a minute to chat about working from home?"',bin:'"no" ends it'},{t:'"Is now a bad time to talk about working from home?"',bin:'"no" helps you'},{t:`"I don't suppose I could work from home one day a week?"`,bin:'"no" ends it'},{t:'"Would it be ridiculous to try one day a week at home?"',bin:'"no" helps you'},{t:`"Could I work from home one day a week, if that's OK?"`,bin:'"no" ends it'},{t:'"Are you against me trying one day a week at home?"',bin:'"no" helps you'}],expl:{card:`The card: she's swamped, so check: if she just says "no", does that help you?`,items:[{label:'"No" helps you',text:`"bad time?", "ridiculous?" and "against?". Say she answers: "No, not ridiculous. Let's try it after the March deadline."`,subs:[]},{label:'"No" ends it',text:"",subs:[`"Got a minute?" asks for a yes, and a swamped manager's easy answer is "Not right now".`,`"I don't suppose\u2026?" is the trap: built for a "no", but the "no" refuses you (lesson 1.1).`,`"\u2026if that's OK?" asks a wary manager for a yes she's not ready to give.`]}]},bins:['"no" ends it','"no" helps you']},{n:2,fmt:"Say it",stem:["Your downstairs neighbour has complained about noise twice this term. You'd like to have eight friends round on Saturday until midnight. You knock on her door. What's your best opener?"],quote:[],options:[{k:"A",t:'"Is it OK if we have a few friends round on Saturday night, till about midnight?"',ok:!1},{k:"B",t:'"Would you be against us having a few friends round on Saturday, till midnight?"',ok:!0},{k:"C",t:`"I don't suppose we could have a few people round on Saturday night, could we?"`,ok:!1},{k:"D",t:'"Sorry to bother you again. Would a few people on Saturday be alright?"',ok:!1}],expl:{card:'The card: with someone wary, build your opener so a plain "no" helps you.',items:[{k:"B",ok:!0,text:`Right. Her safe answer, "No", means yes to you. Say she answers: "No, not if it's done by midnight." If she says "Actually, yes, I've got an early start", you've found the real problem: "Would you be against it if we wrapped up by 11?"`,subs:[]},{k:"A",ok:!1,text:`Asks a wary neighbour for a yes: "I'd rather you didn't."`,subs:[]},{k:"C",ok:!1,text:'No-shaped, but its "no" turns you down (lesson 1.1).',subs:[]},{k:"D",ok:!1,text:"Apologises, then asks for a yes.",subs:[]}]}},{n:3,fmt:"Say it",stem:["You've seen a junior designer job at a small studio. You've never spoken to anyone there. You're messaging the studio's owner on LinkedIn with one quick question: would they look at a portfolio from someone without agency experience? After a one-line intro, which opener should come just before your question?"],quote:[],options:[{k:"A",t:'"Would it be mad to ask you one quick question about the role?"',ok:!0},{k:"B",t:'"Is now a bad time to ask about the junior designer role?"',ok:!1},{k:"C",t:'"Have you got a minute for a quick question about the role?"',ok:!1},{k:"D",t:`"I don't suppose you'd have a minute for a quick question at all?"`,ok:!1}],expl:{card:'The card: ask a stranger for a no. But "Is now a bad time?" only works live; in a message, use "Would it be mad to\u2026?".',items:[{k:"A",ok:!0,text:'Right. Its "no" means yes, and your one question follows straight after. Say they reply: "Not mad at all. Yes, send it over."',subs:[]},{k:"B",ok:!1,text:`The right shape, but they'll read it tomorrow, so "now" means nothing.`,subs:[]},{k:"C",ok:!1,text:"Asks a stranger for a yes.",subs:[]},{k:"D",ok:!1,text:"Makes refusing easy (lesson 1.1).",subs:[]}]}},{n:4,fmt:"Type it",stem:[`Your manager is rushed off her feet today. You catch her on the shop floor. You want to ask about swapping your Saturday shift. Type the question you'd open with, built so that "no" is the answer that helps you.`],quote:[],options:[],model:"Is now a bad time to talk about my Saturday shift?",checks:`contains one of: bad time, terrible time, awful time, ridiculous, mad, crazy, silly, unreasonable, bad idea, too much, a pain, nightmare, against, be against, mind if, mind me, you mind, a problem if, an issue if, put you out; ends with "?"; contains none of: don't suppose, no worries, if not, got a minute, got a sec, got a second, have you got, any chance, is it ok, is that ok, is it okay; 20 words or fewer. Whole words, any case.`,after:['The card: to someone busy, open so a plain "no" helps you.',`Say she answers: "No, go on." She's said she's free, and she's usually more relaxed for it. Now make the specific ask (lesson 1.1): "Could I swap my Saturday for the Sunday?"`,`Fails: yes questions ("Have you got a minute?", "Is it OK if\u2026?"), and "I don't suppose\u2026" and "No worries if not" (they make refusing easy).`],modelRaw:'"Is now a bad time to talk about my Saturday shift?"'}],mission:'next time you message or ring someone busy (your manager, a client, a tutor), open with "Is now a bad time?" on the phone, or "Would it be mad to\u2026?" in a message, instead of "Have you got a minute?", and notice how they answer.'},{id:"5.3",title:"Check your chances before free work",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Before you do unpaid work to win a job, ask:"},{t:"quote",text:`"On a scale of 1 to 10, how likely is it you'll go with me?"`},{t:"p",text:"Then stop and listen."}]},{h:"When to use it",items:[{t:"p",text:"Someone wants free work from you before deciding."},{t:"sit",text:"A detailed quote, sample designs, a trial session."}]},{h:"Why it works",items:[{t:"p",text:"Sometimes they've already picked someone, and you're the comparison quote: there to push the other price down, or for free ideas. How they answer tells you which."}]},{h:"Example",items:[{t:"sit",text:"You photograph events for \xA3300. A society president wants a free sample edit before booking."},{t:"say",who:"You",text:`"On a scale of 1 to 10, how likely is it you'll go with me?"`},{t:"say",who:"President",text:`"Erm\u2026 hard to say. We're getting a few quotes."`},{t:"p",text:"That pause is the tell: skip the free edit."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Listen for the tell.",rest:""},{t:"li",text:`A quick number and a reason ("An 8, we loved your portfolio")? \u2192 You're the favourite. Put the work in, at your normal price.`},{t:"li",text:`A pause, "Hard to say" or "Whoever's cheapest"? \u2192 You're probably the comparison quote. No free work, and no price drop. Leave politely, with your price:`},{t:"quote",text:`"It seems like you're still shopping around. When you're ready, it's \xA3300 for the night."`},{t:"tip",n:2,title:"Free pitch work is fine when you're the favourite.",rest:"It's how you win the job, not an extra on one you've already got (lesson 3.1). It's only worth doing free when you're likely to win."},{t:"tip",n:3,title:"Ask after a first chat, not in your opening message.",rest:"Asked too early, it sounds presumptuous."},{t:"tip",n:4,title:"They're annoyed you won't work for free? Keep your price.",rest:"They were probably after the free work all along."},{t:"sit",text:'The president says: "Other photographers send free samples, you know."'},{t:"quote",text:`"No problem. The offer's there: \xA3300 for the night."`}]},{h:"Avoid",items:[{t:"bad",text:'"Am I your first choice?" Nobody says no to that.'},{t:"bad",text:'"Who else are you talking to?" You learn who, not where you stand.'},{t:"bad",text:"Dropping your price because they hesitated."}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:'Chris Voss calls it "favourite or fool". Never tested in a study.'}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You make promo videos for \xA3440 (others round here charge \xA3300 to \xA3450). After a first call, a gym owner emails: "Could you send a detailed proposal and a sample edit of our classes? We're comparing a few people." The sample would take you most of a day. What should you reply before you start?`],quote:[],options:[{k:"A",t:`"On a scale of 1 to 10, how likely is it you'll go with me?"`,ok:!0},{k:"B",t:'"Am I your first choice, or are you just comparing prices here?"',ok:!1},{k:"C",t:`"Sure! I'll get the proposal and a sample over by Friday."`,ok:!1},{k:"D",t:'"Out of interest, who else are you talking to about it?"',ok:!1}],expl:{card:"The card: before unpaid work, ask how likely they are to pick you, then listen for the tell.",items:[{k:"A",ok:!0,text:`Right. Asked before a day's work. Say they answer: "Maybe a 4. Our last video guy is the favourite." You're the comparison quote, so skip the sample: "If you want a second option, it's \xA3440."`,subs:[]},{k:"B",ok:!1,text:`Nobody says yes to "just comparing": "You're right up there!"`,subs:[]},{k:"C",ok:!1,text:"A day of free work before you know where you stand.",subs:[]},{k:"D",ok:!1,text:'Finds out who, not where you stand: "A couple of local people."',subs:[]}]}},{n:2,fmt:"Sort it",stem:[`You tutor GCSE maths at \xA338 an hour (tutors round here charge \xA330 to \xA340). A parent wants a free trial lesson before deciding. You asked: "On a scale of 1 to 10, how likely is it you'll go with me?" Which answers sound like you're the favourite, and which sound like the comparison quote?`],quote:[],options:[],sort:[{t:'"An 8. Your reviews are great, and you can do Tuesdays."',bin:"favourite"},{t:`"Erm\u2026 hard to say. We're trying out a few."`,bin:"comparison quote"},{t:`"Probably a 9. Maya's friend had you and loved it."`,bin:"favourite"},{t:`"Depends, really. Whoever's cheapest, probably."`,bin:"comparison quote"},{t:`"A 7. The last tutor kept cancelling, and you're local."`,bin:"favourite"},{t:`"Ha, I couldn't tell you yet!"`,bin:"comparison quote"}],expl:{card:"The card: a favourite gives a number and a reason; a pause or a vague answer is the tell.",items:[{label:"Favourite",text:"each gives a number and a real reason (your reviews, a friend's recommendation, a let-down by the last tutor).",subs:[]},{label:"Comparison quote",text:"",subs:['"Hard to say\u2026 trying out a few" is the pause and the vague answer.',`"Whoever's cheapest" means your free lesson is helping them shop on price.`,`"I couldn't tell you yet!" dodges the number. Say: "It seems like you're still shopping around. When you're ready, it's \xA338 an hour."`]}]},bins:["favourite","comparison quote"]},{n:3,fmt:"Say it",stem:[`You design logos for \xA3150 (others round here charge \xA3100 to \xA3160). A bakery owner wanted three free logo designs "to compare with a few other designers". You asked the 1 to 10 question, and she said: "Erm\u2026 hard to say. Maybe a 5?" You replied: "It seems like you're still shopping around. When you're ready, a logo's \xA3150, with two rounds of changes." Now she writes: "The other designers are happy to send free samples, you know." What's your best reply?`],quote:[],options:[{k:"A",t:`"Fair enough. I'll send over one quick sample by tomorrow morning, then."`,ok:!1},{k:"B",t:`"Of course. If you'd like me to, it's \xA3150 with two rounds of changes."`,ok:!0},{k:"C",t:'"OK, could I do it for \xA3100 instead, just this once, to win you over?"',ok:!1},{k:"D",t:'"Is that because you think \xA3150 is a bit too much for a logo, then?"',ok:!1}],expl:{card:"The card: if they're annoyed you won't work for free, they were probably after the free work. Keep your price.",items:[{k:"B",ok:!0,text:`Right. No free work, no price drop, and the offer stands. Say she answers: "Fine, we'll let you know." If she's back next week to book you, it's at \xA3150.`,subs:[]},{k:"A",ok:!1,text:"Free work for someone who's said you're the comparison quote.",subs:[]},{k:"C",ok:!1,text:`Drops your price because she hesitated: "I'll add it to the list."`,subs:[]},{k:"D",ok:!1,text:`Invites "Yes, a bit": now you're haggling over a job she won't give you.`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You build websites for \xA3640 (others charge \xA3500 to \xA3650 for a site like this). A florist wants a written proposal and a homepage mock-up before she decides who builds hers. After a first call, you asked the 1 to 10 question. She answered straight away: "A 9. The site you did for my friend is exactly what I want, and the other quote hasn't even come back." What's your best next move?`],quote:[],options:[{k:"A",t:`"It seems like you're still shopping around. My price is \xA3640, all in."`,ok:!1},{k:"B",t:'"Great. I could do \xA3540 for you if you book with me this week."',ok:!1},{k:"C",t:'"Great. Proposal and mock-up by Friday: \xA3640, live in three weeks."',ok:!0},{k:"D",t:'"Brilliant. So am I definitely your first choice, then?"',ok:!1}],expl:{card:"The card: a quick number with a reason means you're the favourite, so put the work in.",items:[{k:"C",ok:!0,text:`Right. She's told you why she wants you, so the proposal is worth a few hours. Say she answers: "Perfect, I'll look at it over the weekend."`,subs:[]},{k:"A",ok:!1,text:"The line for a vague answer, but hers was a quick 9 with a reason. You'd lose a client who'd already picked you.",subs:[]},{k:"B",ok:!1,text:"Drops \xA3100 when she already wants you.",subs:[]},{k:"D",ok:!1,text:'The "first choice" question the card warns about: "Yes, like I said."',subs:[]}]}},{n:5,fmt:"Type it",stem:[`A start-up founder wants you to write a detailed plan for running their social media, about a day's work, "so we can compare it with a couple of agencies". You've had one 20-minute call. Type the question you'd ask before you start the plan.`],quote:[],options:[],model:"On a scale of 1 to 10, how likely is it you'll go with me?",checks:`contains one of: 1 to 10, 1-10, one to ten, 1 and 10, out of 10, out of ten, scale; contains one of: likely, chance, chances, odds; ends with "?"; contains none of: first choice, top choice, am I your, am I the, are we your, are we the, serious, just comparing, just using, free, lowest, best price, budget, cheaper, cheapest, discount, who else, how many, why, don't suppose, no worries, if not; 25 words or fewer. Whole words, any case.`,after:["The card: before unpaid work, ask how likely they are to go with you, then stop and listen.",`Say they answer: "Hmm. Maybe a 3? The agencies have done this before." That's your tell: "It seems like you're still shopping around. When you're ready, here's my monthly price and what it includes." If they say "A 9, we loved your own account", write the plan.`,`Fails: yes/no questions ("Am I your first choice?"), asking who else they're talking to, and offering a lower price before they've answered.`],modelRaw:`"On a scale of 1 to 10, how likely is it you'll go with me?"`}],mission:`this week, think of the last time someone asked you for a free quote, a sample or a favour "to compare". Write down how you'd ask the 1 to 10 question, and what you'd say if they answered "Hard to say".`},{id:"5.4",title:"Work out their situation first",guess:{stem:["In a study, buyers negotiated a deal that was only possible with some creative thinking. Some were told to imagine what the seller was thinking, some to imagine what the seller was feeling, and some got no instruction. Which group reached the most deals?"],options:[{k:"A",t:"Imagined what the seller was thinking",ok:!0},{k:"B",t:"Imagined what the seller was feeling",ok:!1},{k:"C",t:"Got no instruction",ok:!1},{k:"D",t:"All about the same",ok:!1}],reveal:"thinking reached a deal 76% of the time, feeling 54%, and no instruction 39%."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Before you negotiate, think about their situation, not their feelings. Ask yourself:"},{t:"quote",text:'"What do they want? What pressure are they under? What happens to them if I say no?"'}]},{h:"When to use it",items:[{t:"p",text:"Before any money conversation you can plan for."},{t:"sit",text:"A higher rate from a client, a bike on Marketplace."}]},{h:"Why it works",items:[{t:"p",text:"The last one is their plan B (lesson 4.3): the worse it is, the more room you have. Thinking about feelings mostly makes you offer more."}]},{h:"Example",items:[{t:"sit",text:"A tutor charges \xA340 an hour. If you say no, he might have an empty slot, so you check."},{t:"say",who:"You",text:'"How full is your week at the moment?"'},{t:"say",who:"Tutor",text:'"Tuesdays are a bit quiet, to be honest."'},{t:"p",text:'Now you can offer: "If I take your Tuesday slot every week, could you do \xA334?"'}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Your answers are guesses. Check them with one question about their situation",rest:"before you build an offer on them."},{t:"sit",text:"A landlord's flat has sat empty for a month."},{t:"good",text:`"What happens if it's still empty next month?"`},{t:"tip",n:2,title:"Use what you work out, but don't say it.",rest:""},{t:"bad",text:`"You're desperate, so would you take less?" \u2192 they dig in.`},{t:"tip",n:3,title:"Know their plan B? Your offer only has to beat it,",rest:"not match their price. If their plan B is strong, expect little off."},{t:"sit",text:"A shop will buy the seller's camera back for \xA3200. She's asking \xA3260."},{t:"quote",text:'"I can do \xA3215, cash today."'}]},{h:"Avoid",items:[{t:"bad",text:'"They must be gutted to sell it." Feeling for them makes you offer more.'},{t:"bad",text:'"They just want as much as possible." True of everyone, so it tells you nothing.'},{t:"bad",text:`"How do I get them to like me?" You'll give in to avoid an awkward moment.`}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Buyers who imagined the seller's thoughts reached a deal 76% of the time, against 39% with no instruction (Galinsky, Maddux, Gilin and White, 2008). Their lead over imagining feelings (54%) was smaller and less certain; working out their plan B is a pro trick."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["Your landlord has said he wants to put the rent up from \xA31,050 to \xA31,150 a month. Similar flats nearby are \xA31,050 to \xA31,100. Before you ring him, which question, asked to yourself, gives you the most to work with?"],quote:[],options:[{k:"A",t:'"What are other landlords round here charging now?"',ok:!1},{k:"B",t:'"How much more is he hoping to get out of me?"',ok:!1},{k:"C",t:'"What happens to him if I say no and move out?"',ok:!0},{k:"D",t:'"How do I keep him on side during the call?"',ok:!1}],expl:{card:"The card: think about his situation, above all what he'll do if you say no.",items:[{k:"C",ok:!0,text:`Right. His plan B. Say your answer is: "A month or two empty, over \xA31,000 a month gone." Now offer what costs you nothing: "I'd like to stay long-term, so no gaps between tenants. Could we keep it at \xA31,050?"`,subs:[]},{k:"A",ok:!1,text:"About the market, which you already know.",subs:[]},{k:"B",ok:!1,text:"True of every landlord, so it gives you nothing.",subs:[]},{k:"D",ok:!1,text:"About the mood, so you'll give in to avoid an awkward call.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You're viewing a 2015 Mazda 2 listed at \xA35,200. Similar ones sell for \xA34,800 to \xA35,200. The seller mentions she's moving to Australia on the 14th. It's the 7th. What's the best thing to say before you make an offer?"],quote:[],options:[{k:"A",t:'"That must be so stressful, moving all that way."',ok:!1},{k:"B",t:`"Would you take \xA34,500, seeing as you're in a rush?"`,ok:!1},{k:"C",t:'"Is there any room on the price, with you leaving soon?"',ok:!1},{k:"D",t:`"What's the plan if it doesn't sell before you go?"`,ok:!0}],expl:{card:"The card: your answers are guesses, so check them with one question about her situation first.",items:[{k:"D",ok:!0,text:`Right. It finds her plan B. Say she answers: "I'd have to take whatever a dealer gives me." Now: "If you can do \xA34,825, I'll pay and drive it away Saturday." If she says "A mate will buy it", her plan B is strong, so expect little off.`,subs:[]},{k:"A",ok:!1,text:"About her feelings.",subs:[]},{k:"B",ok:!1,text:"An offer built on an unchecked guess, said out loud.",subs:[]},{k:"C",ok:!1,text:"A yes/no that shows you've spotted her deadline.",subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're buying a sofa on Marketplace, listed at \xA3150. Similar sofas have gone for \xA3100 to \xA3130, so you'd like to pay near the bottom. The seller is moving out this weekend. Before you message him, which thoughts are about his situation, and which are about his feelings?"],quote:[],options:[],sort:[{t:'"Why is he really selling?"',bin:"his situation"},{t:'"He must be sad to see it go."',bin:"his feelings"},{t:`"What's his problem if it's still there on moving day?"`,bin:"his situation"},{t:`"I don't want to offend him with a low offer."`,bin:"his feelings"},{t:'"What will he do with it if nobody buys it?"',bin:"his situation"},{t:`"He'll be relieved to get it sorted."`,bin:"his feelings"}],expl:{card:"The card: think about his situation, not his feelings.",items:[{label:"His situation",text:`"Why is he really selling?" (what he wants), "What will he do with it if nobody buys it?" (his plan B, probably paying to have it taken) and "What's his problem on moving day?" Say your answer is "a sofa that won't fit in the van". Now: "If you can do \xA3105, I'll collect tomorrow with a mate's van."`,subs:[]},{label:"His feelings",text:'"sad", "offend" and "relieved" are about his mood, and thinking like that mostly makes you offer more.',subs:[]}]},bins:["his situation","his feelings"]},{n:4,fmt:"Say it",stem:[`Back to the Mazda, listed at \xA35,200, with similar ones at \xA34,800 to \xA35,200. You asked: "What's the plan if it doesn't sell before you go?" She says: "A mate's said he'll give me \xA34,800 if nobody else does." What's your best offer?`],quote:[],options:[{k:"A",t:`"Would you take \xA34,500, seeing as you're off on the 14th?"`,ok:!1},{k:"B",t:`"I can do \xA34,850, and I'll transfer it today."`,ok:!0},{k:"C",t:'"That must be a relief. Would \xA35,000 help you out?"',ok:!1},{k:"D",t:`"What's the lowest you'd take before you fly, then?"`,ok:!1}],expl:{card:"The card: once you know their plan B, your offer only has to beat it.",items:[{k:"B",ok:!0,text:`Right. It beats her mate's \xA34,800 and is \xA3350 under her price. Say she answers: "\xA34,950?" Her only other option pays \xA34,800, so hold close: "\xA34,875, and it's done today."`,subs:[]},{k:"A",ok:!1,text:`Uses her deadline but ignores her plan B: "My mate's paying more."`,subs:[]},{k:"C",ok:!1,text:"Feelings, so you offer \xA3150 more than you needed to.",subs:[]},{k:"D",ok:!1,text:"Asks her floor (lesson 1.1).",subs:[]}]}},{n:5,fmt:"Type it",stem:["You're a caf\xE9 supervisor on \xA312.60 an hour, and you're about to ask your manager for \xA313.40. Other caf\xE9s nearby pay supervisors \xA313 to \xA313.50. Type one question you'd ask yourself beforehand about her situation: what she's after, what pressure she's under, or what happens to her if you leave."],quote:[],options:[],model:"What would it cost her to replace me if I left?",checks:`ends with "?"; contains one of: she, her, she's, they, them, their, manager, boss; contains one of: pressure, budget, budgets, worried, worry, worries, want, wants, need, needs, after, target, targets, cost, costs, deadline, deadlines, priority, priorities, stretched, replace, replacing, lose, losing, lose me, leave, left, quit, hire, hiring, recruit, short-staffed, struggle, achieve, trying, goal, goals, team, plan, happen, happens, say no, said no, keep, keeping; contains none of: feel, feels, feeling, feelings, upset, mood, gutted, sad, relieved, disappointed, hurt, offend, offended, annoyed, angry, react, she like me, they like me, to like me, like me less, like me more, think of me, happy, on side, just want, just wants, as little, as much, the most I, the least; 25 words or fewer. Whole words, any case.`,after:["The card: think about her situation, especially what happens to her if you say no.",`Say your answer is: "Weeks of hiring, and training someone new before the Christmas rush." Now you know what to lead with: "I'd like to stay through Christmas and train the new starters. Could we look at \xA313.40?"`,'Fails: questions about her mood ("Would she be gutted?"), about getting her to like you, and "She just wants to pay as little as possible" (true of every boss).'],modelRaw:'"What would it cost her to replace me if I left?"'}],mission:"this week, pick one person you'll deal with soon (landlord, manager, a seller) and write down what they want, what pressure they're under, and what they'll do if you say no."}]},{n:6,title:"Emotions as Tools",tagline:"Turn your nerves into energy, and find the words that get people on your side.",lessons:[{id:"6.1",title:"Call your nerves excitement",guess:{stem:["Before singing karaoke in front of strangers, people had to say one sentence out loud. Then their singing was scored for accuracy. Which sentence led to the best singing?"],options:[{k:"A",t:'"I am calm."',ok:!1},{k:"B",t:'"I am anxious."',ok:!1},{k:"C",t:'"I am excited."',ok:!0},{k:"D",t:'"I am angry."',ok:!1}],reveal:'"I am excited" scored 80%. "I am calm" (and "I am angry") scored 69%, and "I am anxious" 53%. Trying to calm down did worse than calling the nerves excitement.'},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Just before a money talk that makes your heart race, say out loud:"},{t:"quote",text:`"I'm excited."`},{t:"p",text:"Don't try to calm down."}]},{h:"When to use it",items:[{t:"p",text:"Any money talk that makes you nervous."},{t:"sit",text:"Asking for a pay rise, a salary call with a recruiter, haggling face to face."}]},{h:"Why it works",items:[{t:"p",text:"Nerves and excitement feel almost the same in your body, and a racing heart won't slow down on command. Calling it excitement keeps the energy and changes what it means."}]},{h:"Example",items:[{t:"sit",text:"Your SIM-only deal is ending. You're about to ring to haggle, heart pounding."},{t:"say",who:"You (out loud, before dialling)",text:`"I'm excited."`},{t:"say",who:"You (on the call)",text:`"I've been offered \xA312 a month elsewhere. Can you match it?"`},{t:"p",text:"Your heart's still racing, but you open with the number you planned."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:`Say "I'm excited", not "Calm down".`,rest:`Calm-down lines did worse, and "I'm anxious" did worst of all.`},{t:"good",text:`"I'm excited."`},{t:"bad",text:`"Just relax. Calm down." \u2192 you fight a feeling you can't switch off.`},{t:"tip",n:2,title:"Heart still racing? That's fine. Carry on.",rest:"The racing stays; you've changed what it means. Don't announce it."},{t:"bad",text:`"Sorry, I'm really nervous about this." \u2192 you've called it nerves again.`},{t:"tip",n:3,title:"Nerves make you ask for less and grab offers. Stick to the number you wrote down beforehand, and when an offer comes, pause, then counter.",rest:""},{t:"sit",text:"You're selling your camera, listed at \xA3260. You decided you'd counter low offers at \xA3240. A buyer offers \xA3200."},{t:"quote",text:'"Let me think. I could do \xA3240."'},{t:"tip",n:4,title:"Nerves make you give up after one no. Make one more ask before you go.",rest:"If they've said the price can't move, ask for one specific extra instead (lesson 1.1)."},{t:"sit",text:"A bike shop won't budge on a \xA3400 bike."},{t:"quote",text:'"Could you throw in a lock and lights, then?"'}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:`Saying "I'm excited" beat "I'm calm" before karaoke, a maths test and a speech (Brooks, 2014), but none was a negotiation and repeat studies have been mixed. In four studies, anxious negotiators made lower first offers, answered faster and walked out sooner (Brooks and Schweitzer, 2011).`}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["In five minutes you're going in to ask your manager for a pay rise. You've written down \xA327,500, the top of what similar jobs pay. Your heart's pounding and your hands are clammy. What should you say to yourself, out loud, just before you knock?"],quote:[],options:[{k:"A",t:`"Deep breath. It's only a chat, it's not a big deal."`,ok:!1},{k:"B",t:`"I'm excited."`,ok:!0},{k:"C",t:'"Just relax. Calm down."',ok:!1},{k:"D",t:`"Don't mess this up."`,ok:!1}],expl:{card:`The card: say "I'm excited", not "Calm down". Calm-down lines did worse.`,items:[{k:"B",ok:!0,text:`Right. Your heart races either way; this gives it a job. Say your manager asks: "So, what's up?" Now open with your planned number, not a nervous one: "I'm looking for \xA327,500."`,subs:[]},{k:"A",ok:!1,text:'A calm-down line; those did worse. "Not a big deal" invites a small ask.',subs:[]},{k:"C",ok:!1,text:"Fights a feeling you can't switch off.",subs:[]},{k:"D",ok:!1,text:'Treats the nerves as a threat. "I am anxious" did worst.',subs:[]}]}},{n:2,fmt:"Say it",stem:[`You've said "I'm excited" out loud before ringing a recruiter back about a job offer at a small firm. As the phone rings, your heart's still pounding. What do you do?`],quote:[],options:[{k:"A",t:"Hang up, wait until you've properly calmed down, and then ring back later.",ok:!1},{k:"B",t:"Carry on: the racing is meant to stay, and you've changed what it means.",ok:!0},{k:"C",t:`Switch to "I'm calm, I'm calm" under your breath until it slows.`,ok:!1},{k:"D",t:`Open with: "Sorry, I'm really nervous about this call."`,ok:!1}],expl:{card:"The card: heart still racing? That's fine. Carry on, and don't announce it.",items:[{k:"B",ok:!0,text:`Right. A racing heart doesn't mean it's failed. Say the recruiter asks: "Had a chance to think about the offer?" Now use the energy: "I have, and I'm keen. I'd like to talk about the salary."`,subs:[]},{k:"A",ok:!1,text:"Treats the racing as a sign to stop, which the card says it isn't.",subs:[]},{k:"C",ok:!1,text:"Back to calming down, which did worse.",subs:[]},{k:"D",ok:!1,text:'Calls it nerves out loud; "I am anxious" did worst.',subs:[]}]}},{n:3,fmt:"Spot it",stem:[`Sam's on a call about a job at a small design studio. Similar roles pay \xA328,000 to \xA330,000, and he'd written down \xA330,000. He said "I'm excited" out loud before he dialled.`,"What should Sam have said to the \xA328,000?"],quote:[`Recruiter: "We'd like to offer you \xA327,000."`,`Sam: "Similar roles are paying up to \xA330,000, so I'm looking for \xA330,000."`,'Recruiter: "I could stretch to \xA328,000."',`Sam: "Great, yes, I'll take it!"`],options:[{k:"A",t:`"That's still a bit under what I was hoping for."`,ok:!1},{k:"B",t:`"I'd need at least \xA329,000 to say yes."`,ok:!1},{k:"C",t:'"Let me think. Could we do \xA329,500?"',ok:!0},{k:"D",t:'"Is \xA328,000 the best you can do?"',ok:!1}],expl:{card:"The card: nerves make you grab offers. Pause, then counter.",items:[{k:"C",ok:!0,text:`Right. Say she answers: "I can do \xA329,000, but that's the top of the band." That's \xA31,000 a year more than his snap yes. If she won't move, he's lost nothing.`,subs:[]},{k:"A",ok:!1,text:`A hint, not an ask (lesson 1.1). You'll usually get: "I understand, but that's the band."`,subs:[]},{k:"B",ok:!1,text:"Gives away his limit. You'll usually get \xA329,000 exactly.",subs:[]},{k:"D",ok:!1,text:`Asks them to judge their own offer: "It is, I'm afraid."`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're at a dealer, nervous, about to buy a used Ford Focus for \xA36,495. Similar ones sell for \xA36,150 to \xA36,600. You asked: "Could you do \xA36,150?" He said: "Sorry, I can't move on the price." You just want to get it over with. What's your best next line?`],quote:[],options:[{k:"A",t:`"OK, no worries at all. I'll take it at \xA36,495, then."`,ok:!1},{k:"B",t:'"Could you meet me at \xA36,250, then?"',ok:!1},{k:"C",t:`"What's the most you could knock off it?"`,ok:!1},{k:"D",t:'"Could you throw in a new MOT and a service, then?"',ok:!0}],expl:{card:"The card: make one more ask before you go. If the price can't move, ask for one specific extra.",items:[{k:"D",ok:!0,text:`Right. Extras cost him less than cash. Say he answers: "I can do the MOT, not the service." That's an MOT for free.`,subs:[]},{k:"A",ok:!1,text:"Gives up to end the awkwardness. You pay full price.",subs:[]},{k:"B",ok:!1,text:`One more ask, but for the cash he's said won't move. You'll usually get: "The price is the price."`,subs:[]},{k:"C",ok:!1,text:'Asks his limit. "Maybe a hundred" becomes your ceiling.',subs:[]}]}},{n:5,fmt:"Type it",stem:[`You're selling your road bike face to face, listed at \xA3450. Similar ones have sold for \xA3420 to \xA3460. Before the buyer arrived, you decided that if he offered low, you'd counter at \xA3430. He says: "I'll give you \xA3380 cash, right now." Your gut says: just say \xA3400 and get it over with. Type your reply.`],quote:[],options:[],model:"Let me think. I could do \xA3430.",checks:"contains 430; no number other than 380, 430 or 450; contains none of: lowest, at least, minimum, the most, can't go, below, I need, need at least; 20 words or fewer. Whole words, any case.",after:["The card: nerves make you ask for less. Stick to the number you wrote down beforehand.",`Say he answers: "Meet me at \xA3410?" Now you're haggling near your number, not his: "\xA3425, and you can ride it home now."`,"Fails: taking the \xA3380, and any counter below \xA3430, like the \xA3400 your gut wanted."],modelRaw:'"Let me think. I could do \xA3430."'}],mission:`this week, before anything that makes your heart race (a call about a bill, a presentation, an interview), say "I'm excited" out loud first. If it's about money, write your number down beforehand and check you opened with it.`},{id:"6.2",title:"In the wrong? Apologise, don't pay",guess:{stem:["An eBay seller wrote to customers who'd left neutral or negative feedback, asking them to take it back. Some got a plain apology. Others were offered money. Which got the most people to take their feedback back?"],options:[{k:"A",t:"Offering \u20AC5",ok:!1},{k:"B",t:"Offering \u20AC2.50",ok:!1},{k:"C",t:"A plain apology",ok:!0},{k:"D",t:"All about the same",ok:!1}],reveal:"the apology got 44.8%. \u20AC2.50 got 19.3%, and \u20AC5 got 22.9%. Saying sorry worked about twice as well as paying, and doubling the money made no difference."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Say sorry for what you did, say plainly what happened, then ask. Don't offer money."},{t:"quote",text:`"Sorry, I completely forgot. That's on me."`}]},{h:"When to use it",items:[{t:"p",text:"You're in the wrong, they're annoyed, and you still want something from them."},{t:"sit",text:"A good review after you posted late, the next job after you missed a deadline."}]},{h:"Why it works",items:[{t:"p",text:"They're annoyed about h
