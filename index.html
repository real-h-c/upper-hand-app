"use strict";(window.NM_DATA=window.NM_DATA||{}).negotiation={id:"negotiation",title:"Negotiation",source:"negotiation/95-negotiation-module-final.md",units:[{n:1,title:"Get Them Talking",tagline:"Ask for more, and get them telling you things you can use.",lessons:[{id:"1.1",title:"Just ask",guess:{stem:["People collecting for charity had to ask strangers face to face until enough of them said yes. Before they started, they guessed they'd need to ask about 210 people. How many did they actually need to ask?"],options:[{k:"A",t:"About 260",ok:!1},{k:"B",t:"About 210",ok:!1},{k:"C",t:"About 165",ok:!1},{k:"D",t:"About 122",ok:!0}],reveal:"about 122, roughly 40% fewer than they guessed. People say yes to a face-to-face ask far more often than we expect."},card:{paras:[{t:"p",text:"Whenever you're about to pay a price, like a phone or broadband renewal, rent, something second-hand or a tradesperson's quote, ask for a better deal. Most people never ask. People say yes far more often than you'd guess, because saying no to someone is awkward."},{t:"p",text:"How: say exactly what you want changed, either a number or one specific extra. If you've seen it cheaper elsewhere, say so. Then stop talking and wait for their answer."},{t:"p",text:"If you don't know what a fair price would be, don't guess a number. Ask what they could do on the price, which gets them to make the first move."}],rows:[{label:"Say",text:`"Could you do \xA328 a month?" \xB7 "Can you knock off the delivery charge?" \xB7 "I've been quoted \xA324 elsewhere. Can you match it?" \xB7 If you don't know the going rate: "What could you do on the price?"`,subs:[]},{label:"Avoid",text:"",subs:[`"Is that your best price?" or "What's the lowest you can do?" Both ask them to name a floor and defend it, so you'll usually just get the same price back.`,`Making it easy to refuse: "I don't suppose\u2026?" or "No worries if not!" (Lesson 5.2 is different: with someone wary, busy or a stranger, an opener like "Would it be ridiculous to\u2026?" makes saying YES feel like saying no. Once they're listening, ask for the exact thing, as here.)`,`Hinting instead of asking: "It's a bit more than I wanted to spend."`]},{label:"Watch out",text:"ask out loud when you can, on the phone or face to face, because it's much harder to say no to a person than to a message. When it has to be a message (Vinted, Marketplace), be extra specific: a number and a reason. Some prices really are fixed, like most graduate scheme salaries.",subs:[]},{label:"Evidence",text:"Backed by studies. People asking strangers face to face needed about 40% fewer asks than they'd guessed (Flynn and Lake, 2008). Asking strangers in person to fill in a survey got far more yeses than asking by email (Roghanizad and Bohns, 2017). Only about 1 in 10 UK renters tried to negotiate their last rent rise. Of those who did, about 4 in 10 got a cut or a freeze (Which?).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["Your broadband deal has ended and the price is jumping from \xA328 to \xA341 a month. You've seen the same speed for \xA324 with another provider. You ring up. What's your best opening line?"],quote:[],options:[{k:"A",t:`"Hi, my bill's gone up to \xA341 this month. Is that right?"`,ok:!1},{k:"B",t:`"I've been quoted \xA324 elsewhere. Can you match that?"`,ok:!0},{k:"C",t:'"Is \xA341 really the best price you can do for me?"',ok:!1},{k:"D",t:'"OK, fine. Can you email me the new price?"',ok:!1}],expl:{card:"The card: say exactly what you want, and if you've seen it cheaper, say so.",items:[{k:"B",ok:!0,text:`Right. One exact number, and a reason. Say they answer: "I can't do \xA324, but I can do \xA330 on an 18-month contract." Now you can say: "Could you meet me at \xA327?"`,subs:[]},{k:"A",ok:!1,text:`Asks them to check the bill, not change it: "Yes, your deal's ended."`,subs:[]},{k:"C",ok:!1,text:`Asks them to judge their own price. You'll usually get: "Yes, that's our standard price."`,subs:[]},{k:"D",ok:!1,text:"Never asks at all. You pay \xA341.",subs:[]}]}},{n:2,fmt:"Spot it",stem:["Megan is joining a gym:","What should she have said instead?"],quote:[`Megan: "I don't suppose there's any discount at all? No worries if not!"`,'Staff: "Sorry, prices are set by head office."'],options:[{k:"A",t:'"Is there any flexibility on the price at all?"',ok:!1},{k:"B",t:`"It's a bit more than I was hoping to pay, to be honest."`,ok:!1},{k:"C",t:`"What's the lowest you can do on the monthly?"`,ok:!1},{k:"D",t:'"Could you waive the joining fee if I join today?"',ok:!0}],expl:{card:`The card: ask for one specific thing, without "I don't suppose\u2026" or "No worries if not!"`,items:[{k:"D",ok:!0,text:`Right. One specific extra, easy to say yes to. Say they answer: "Sorry, I can't touch the joining fee." Now you can ask for another: "Could you do my first month at half price, then?"`,subs:[]},{k:"A",ok:!1,text:'A yes/no question that makes "no" easy: "Not really, sorry."',subs:[]},{k:"B",ok:!1,text:"A hint, not an ask. They'll usually point you to off-peak membership.",subs:[]},{k:"C",ok:!1,text:`Asks for their floor. You'll usually get: "It's \xA334, I'm afraid."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["Your phone contract is ending and they've offered you \xA335 a month to stay. You've seen the same deal for \xA324 elsewhere. Which lines ask for a specific change, and which are easy to brush off?"],quote:[],options:[],sort:[{t:'"Any chance of a discount?"',bin:"easy to brush off"},{t:`"Can you match the \xA324 a month I've been quoted elsewhere?"`,bin:"specific change"},{t:'"Is that your best price?"',bin:"easy to brush off"},{t:'"Could you throw in extra data for free?"',bin:"specific change"},{t:'"Could you do something on the price?"',bin:"easy to brush off"},{t:'"Could you get it down to \xA328?"',bin:"specific change"}],expl:{card:"The card: say exactly what you want, a number or one extra.",items:[{label:"Specific change",text:`"match the \xA324", "extra data" and "down to \xA328" each give them one thing to say yes to. Say they answer: "I can do \xA330." Now you can say: "Make it \xA329 and I'll stay."`,subs:[]},{label:"Easy to brush off",text:"",subs:['"Is that your best price?" just gets "Yes."','"Any chance of a discount?" makes "no" easy.','"Could you do something on the price?" is the trap: it ignores your \xA324 quote, so they pick: "\xA32 off."']}]},bins:["easy to brush off","specific change"]},{n:4,fmt:"Type it",stem:["A plumber is standing in your kitchen. He's quoted \xA3380 to fix your boiler and is waiting for a yes. You've no idea what that job usually costs. Type what you'd say to ask for a better price without guessing a number."],quote:[],options:[],model:"What could you do on that price for me?",checks:`contains one of: what, how; contains one of: price, that, it, do, better, discount, less; ends with "?"; 15 words or fewer; no \xA3 and no digits; contains none of: lowest, best price, your best, the most, minimum, at least, budget, afford, don't suppose, any chance, no worries, if not, sorry, just wondering. Whole words, any case.`,after:["The card: if you don't know what a fair price is, ask what they could do instead of guessing. A guess could be higher than he'd have taken.",`The model answer makes him name the first discount. Say he answers: "I could do \xA3340." Now you know there's room: "Could you do \xA3320 if I pay today?" If he says "That's the price, mate", you've lost nothing by asking.`,"Fails: any number (that's guessing), asking his lowest, and the card's soft openers."],modelRaw:'"What could you do on that price for me?"'},{n:5,fmt:"Say it",stem:["You want a sofa that's \xA3499 at a furniture shop. The display model has a small scuff on the back, and you've seen ex-display ones like it go for about \xA3420. What gives you the best chance of paying less?"],quote:[],options:[{k:"A",t:'Ask a salesperson: "Could you do \xA3390 on the display one, given the scuff?"',ok:!0},{k:"B",t:'Ask a salesperson: "Could you do something on the display one, given the scuff?"',ok:!1},{k:"C",t:'Email customer services: "Could you do \xA3390 on the display sofa, given the scuff?"',ok:!1},{k:"D",t:'Ask at the till: "Is \xA3499 the best you can do on this one?"',ok:!1}],expl:{card:"The card: ask out loud when you can, and name an exact number when you know the going rate.",items:[{k:"A",ok:!0,text:`Right. Face to face, an exact number and a reason. Say they answer: "I can do \xA3430." Now you can say: "Meet me at \xA3410 and I'll take it today."`,subs:[]},{k:"B",ok:!1,text:`No number, so they choose the amount. You'll usually get: "\xA320 off."`,subs:[]},{k:"C",ok:!1,text:'The right ask, but by email, where no is easy: "Our prices are fixed."',subs:[]},{k:"D",ok:!1,text:`Asks them to judge their own price: "Yes, that's the price."`,subs:[]}]}}],mission:'this week, ring one company you pay every month (phone, broadband, insurance or gym). Ask for a specific lower price, using a cheaper quote if you have one, then stop talking and wait. Tip: if they say no, ask "Can you put me through to the team that deals with leaving?" These teams often have better offers.'},{id:"1.2",title:'"What problems does it have?"',guess:{stem:['Sellers in a study were selling a used item with a known fault. A buyer asked: "What can you tell me about it?" What share of sellers mentioned the fault?'],options:[{k:"A",t:"8%",ok:!0},{k:"B",t:"31%",ok:!1},{k:"C",t:"52%",ok:!1},{k:"D",t:"74%",ok:!1}],reveal:'just 8%. When the buyer asked "What problems does it have?", 89% owned up.'},card:{paras:[{t:"p",text:`When you're buying something second-hand, viewing a flat or weighing up a job, ask about problems as if you know there are some: "What problems does it have?" People find it easy to leave a fault out, and hard to dodge a question that assumes one. Broad questions like "Tell me about it" get you the good bits, not the faults.`}],rows:[{label:"Say",text:`"What problems does it have?" \xB7 For its history: "What's needed fixing?" \xB7 "What's the worst thing about living here?" \xB7 "What do people find hardest about this job?"`,subs:[]},{label:"Avoid",text:'"Tell me about it" (you get the highlights) \xB7 "No problems, right?" (it makes "no" the easy answer)',subs:[]},{label:"Watch out",text:"only assume problems that are common for that kind of thing. Assuming an unlikely one makes you look rude and gets no more truth.",subs:[]},{label:"Evidence",text:"Backed by studies (Minson, VanEpps, Yip and Schweitzer, 2018, four studies).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You're viewing a 2016 Ford Fiesta with 70,000 miles, for \xA34,800. The seller has spent five minutes on how reliable it's been. Which question gets you the catch?"],quote:[],options:[{k:"A",t:'"What problems does it have?"',ok:!0},{k:"B",t:`"It's been reliable, has it?"`,ok:!1},{k:"C",t:'"What problems has the engine rebuild caused?"',ok:!1},{k:"D",t:'"Is there anything wrong with it?"',ok:!1}],expl:{card:"The card: assume a problem, but only a common one.",items:[{k:"A",ok:!0,text:`Right. It assumes there's something, without guessing what. Say they answer: "The air con doesn't work, and the clutch is getting heavy." Now you can say: "That's a few hundred quid to fix. Would you do \xA34,385?"`,subs:[]},{k:"B",ok:!1,text:`The "no problems, right?" question. You'll usually get: "Never had an issue."`,subs:[]},{k:"C",ok:!1,text:"Assumes something unlikely, so you look rude and learn nothing.",subs:[]},{k:"D",ok:!1,text:`Yes/no, so "No, it's fine" is the easy answer.`,subs:[]}]}},{n:2,fmt:"Say it",stem:["You're at a flat viewing and the current tenant is in. Which question gets you the real downsides?"],quote:[],options:[{k:"A",t:`"What's it like living here?"`,ok:!1},{k:"B",t:'"Do you like living here?"',ok:!1},{k:"C",t:'"Have you had any issues with the landlord?"',ok:!1},{k:"D",t:`"What's the worst thing about living here?"`,ok:!0}],expl:{card:"The card: ask as if there's a downside.",items:[{k:"D",ok:!0,text:`Right. It assumes there's a worst thing, so they name it. Say they answer: "The boiler packs in every winter and the landlord takes weeks to fix it." Now you can ask the agent: "Can the boiler be serviced before I move in?"`,subs:[]},{k:"A",ok:!1,text:`Broad, so you'll usually get the nice story, not the faults (the card's "Tell me about it" warning).`,subs:[]},{k:"B",ok:!1,text:`Yes/no. You'll usually get: "Yeah, it's fine."`,subs:[]},{k:"C",ok:!1,text:`Yes/no again. You'll usually get: "No, he's alright."`,subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're at the end of a job interview and they ask: "Any questions for us?" Which question gets you the real downside of the job?`],quote:[],options:[{k:"A",t:`"What's the culture like here?"`,ok:!1},{k:"B",t:'"Would you say people are happy in this team?"',ok:!1},{k:"C",t:'"What do people find hardest about this role?"',ok:!0},{k:"D",t:'"Is there anything I should know before accepting?"',ok:!1}],expl:{card:"The card: ask as if there's a downside.",items:[{k:"C",ok:!0,text:'Right. It assumes something is hard, so they tell you what. Say they answer: "Honestly, the busy season. It can be 60-hour weeks in March." When they offer, you can say: "Given the busy season, could we look at the salary?"',subs:[]},{k:"A",ok:!1,text:`Broad, so you'll usually get the highlights: "Really friendly, lots of socials."`,subs:[]},{k:"B",ok:!1,text:`The "no problems, right?" kind of question. You'll usually get: "Yeah, everyone's great."`,subs:[]},{k:"D",ok:!1,text:'Yes/no, so "Not really" is the easy answer.',subs:[]}]}},{n:4,fmt:"Type it",stem:["You're buying a used e-bike on Marketplace for \xA3450. Type the question you'd send to find the catch."],quote:[],options:[],model:"What problems does it have?",checks:"contains one of: what, what's, whats, how, how's; first word (ignoring an opening hi, hey, hiya, hello, so, ok, okay, right or oh) is not a yes/no opener (is, are, was, do, does, did, can, could, would, will, has, have, any, no, it's); contains one of: problem, problems, issue, issues, wrong, fault, faults, broken, worst, catch, fixing, fixed, repair, repairs; contains none of: no problems, any problems, lowest, best price, would you take; no \xA3; 15 words or fewer. Whole words, any case.",after:["The card: assume there's a problem, and ask what it is.",`The model answer gets the faults out. Say they answer: "The battery only does about 20 miles now." Now you can say: "A new battery's about \xA3150. Would you do \xA3350?"`,'Fails: yes/no openers ("Is there\u2026", "Any\u2026") and "no problems" questions, because they make "no" the easy answer.'],modelRaw:'"What problems does it have?"'}],mission:'next time you buy something second-hand or view a flat, ask "What problems does it have?", or at your next interview, "What do people find hardest about this role?", and count what comes out.'},{id:"1.3",title:'"If you were me, what would you do?"',guess:null,card:{paras:[{t:"p",text:`When the person in front of you knows far more than you about what you're paying for or asking for, like a mechanic quoting a repair, a letting agent with a flat, or your manager when you want a pay rise, ask for their advice: "If you were me, what would you do?" It flips them from defending their price to solving your problem, and they'll often tell you what only an insider knows. You won't look clueless either: people who ask for advice come across as more competent, not less.`},{t:"p",text:`How: ask it as an open question, then stop talking. Make it specific, and say why you're asking them: "You know this landlord. If you were me, how would you get the rent down?" If they just give you the standard answer ("I'd get it all done"), give them one fact about you and ask again, more narrowly: "I'm selling it next year. Which bits would you do now?"`},{t:"p",text:`Which question when: "What could you do on the price?" (lesson 1.1) gets money off the same thing. "If you were me\u2026?" can change what you buy: a smaller repair, a cheaper plan, an offer the landlord will take. If you know the going rate, don't open with either: name your number (lesson 1.1). Once you've both named numbers and you're stuck, it works again, as long as there's a problem they understand better than you, like an MOT that's nearly due or a repair.`}],rows:[{label:"Say",text:'"If it were your car, what would you do?" \xB7 "If you were me, how would you get the landlord to say yes?" \xB7 "What would you do in my position?"',subs:[]},{label:"Avoid",text:"",subs:['Yes/no versions: "If you were me, would you pay that?" gets "Yeah, probably."',`Asking their lowest, dressed up as advice: "If you were me, what's the lowest he'd take?" They'll see straight through it.`,'"Why is it so much?" ("why" sounds like a challenge, so they defend their price)']},{label:"Watch out",text:`only ask someone who's on reasonable terms with you; someone who's just brushed you off will usually say "Pay what I asked." It works on you too: when a buyer asks "What would you do in my shoes?", give advice that also suits you: "Honestly? I'd grab it before the weekend."`,subs:[]},{label:"Evidence",text:"Some evidence. Asking for their advice is a Getting to Yes move. In studies, people who asked for advice were seen as more competent than people who didn't, especially on a hard problem and when they asked an expert (Brooks, Gino and Schweitzer, 2015). Nobody has properly tested whether it gets you a better price.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["Your 2014 Fiesta is in for its MOT. The mechanic rings: it needs two front tyres, a new exhaust and front brake pads, \xA3620 all in. You've no idea what any of that should cost, and he's always been straight with you. What's your best reply?"],quote:[],options:[{k:"A",t:`"\xA3620? Why's it so expensive?"`,ok:!1},{k:"B",t:'"If it were your car, what would you do?"',ok:!0},{k:"C",t:'"If it were your car, would you get all that done?"',ok:!1},{k:"D",t:`"What's the cheapest you could do all that for?"`,ok:!1}],expl:{card:"The card: when they know far more than you, ask what they'd do, as an open question.",items:[{k:"B",ok:!0,text:'Right. He switches to solving your problem. Say he answers: "Honestly? The tyres have to be done to pass. The exhaust and pads will last till spring." Now you can say: "Just the tyres for now, then."',subs:[]},{k:"A",ok:!1,text:`"Why" sounds like a challenge: "That's what parts cost."`,subs:[]},{k:"C",ok:!1,text:'The yes/no version the card warns about: "Yeah, I would."',subs:[]},{k:"D",ok:!1,text:`Asks his lowest: "\xA3600, and that's me being nice."`,subs:[]}]}},{n:2,fmt:"Say it",stem:["Your phone screen's cracked. The repair shop quotes \xA3140. You've checked online: two shops nearby do the same screen for \xA395 and \xA3110. The guy behind the counter is friendly and clearly knows phones. What's your best reply?"],quote:[],options:[{k:"A",t:'"If you were me, would you pay \xA3140 for it?"',ok:!1},{k:"B",t:`"What's the least you could do it for?"`,ok:!1},{k:"C",t:'"If you were me, what would you do about the screen?"',ok:!1},{k:"D",t:'"Another shop does it for \xA395. Could you match that?"',ok:!0}],expl:{card:"The card: if you know the going rate, don't open with advice: name your number (lesson 1.1).",items:[{k:"D",ok:!0,text:`Right. One number, with a reason. Say he answers: "I can do \xA3115." Now you can say: "Meet me at \xA3100 and it's a deal."`,subs:[]},{k:"A",ok:!1,text:`The yes/no version. You'll usually get: "Yeah, it's a fair price."`,subs:[]},{k:"B",ok:!1,text:`Asks for his lowest. You'll usually get: "\xA3130, best I can do."`,subs:[]},{k:"C",ok:!1,text:`The card's line, but you don't need his knowledge, so he picks: "Honestly? Get it done here, mate."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're applying through a letting agent for a one-bed listed at \xA31,300 a month. She's friendly, and she's let this landlord's flats for years. You'd like to pay less, and you've no idea what he'd accept. Which lines get her working out how to help you, and which get a short answer or a defence?"],quote:[],options:[],sort:[{t:'"If you were me, would you offer less?"',bin:"short answer or defence"},{t:'"You know this landlord. What would you do in my position?"',bin:"gets her helping"},{t:'"Why is it \xA31,300 for a one-bed?"',bin:"short answer or defence"},{t:'"If you were me, how would you get him to come down a bit?"',bin:"gets her helping"},{t:`"If you were me, what's the lowest he'd take?"`,bin:"short answer or defence"},{t:'"What would you suggest I do to get the rent down?"',bin:"gets her helping"}],expl:{card:"The card: ask her advice as an open question.",items:[{label:"Gets her helping",text:`the three open advice questions. Say she answers: "He hates it sitting empty. Move in on the 1st and I'd put \xA31,250 to him." Now you can say: "Let's offer \xA31,250 from the 1st, then."`,subs:[]},{label:"Short answer or defence",text:"",subs:[`"Would you offer less?" is yes/no: "I wouldn't."`,`"What's the lowest he'd take?" is his lowest, dressed up: "I couldn't say."`,`"Why is it \xA31,300?" makes her defend the price: "That's the market round here."`]}]},bins:["short answer or defence","gets her helping"]},{n:4,fmt:"Say it",stem:[`You're in a phone shop, after a SIM-only plan. You've never had SIM-only, and you haven't looked at prices. You asked the adviser: "If you were me, which plan would you go for?" She says: "Honestly? Unlimited data, \xA330 a month. Everyone goes unlimited." You use about 8GB a month. What's your best next move?`],quote:[],options:[{k:"A",t:`"OK, fair enough. I'll go with unlimited, then."`,ok:!1},{k:"B",t:'"I only use about 8GB. Would you really pay \xA330 for that?"',ok:!1},{k:"C",t:'"Could you do me the unlimited one for \xA320 a month?"',ok:!1},{k:"D",t:'"I only use about 8GB a month. Which one would you go for?"',ok:!0}],expl:{card:"The card: if they give the standard answer, add one fact about you and ask again.",items:[{k:"D",ok:!0,text:`Right. Now she's solving your problem. Say she answers: "Then the 10GB plan at \xA312 is plenty." That's about \xA3216 a year less than her first answer.`,subs:[]},{k:"A",ok:!1,text:"Takes the standard answer. You'll usually pay \xA330 a month for data you don't use.",subs:[]},{k:"B",ok:!1,text:'Uses your fact, but as a yes/no challenge: "Yeah, I would."',subs:[]},{k:"C",ok:!1,text:'Guesses a number without knowing prices (lesson 1.1): "Sorry, \xA330 is the price."',subs:[]}]}},{n:5,fmt:"Type it",stem:["You've been at a small marketing agency for a year, on \xA324,000. You'd like a pay rise, but you don't know how rises work there or what's realistic. Your manager has always been in your corner. Type a question asking her advice on getting one."],quote:[],options:[],model:"If you were me, how would you go about getting a pay rise here?",checks:`contains one of: were me, was me, my shoes, my position, my place, my situation, if it was you, if it were you, you suggest, you recommend, you advise, your advice; contains one of: what, what's, how; first word (ignoring an opening hi, hey, hiya, so, ok, okay, right, honestly or quick) is not a yes/no opener (is, are, was, do, does, did, can, could, would, will, should, shall, has, have, any); ends with "?" (trailing emojis ignored); no \xA3, and no salary figure (a number with k, a comma, or four or more digits); contains none of: lowest, least, the most, max, maximum, budget, minimum, at least, afford, skint, why, deserve, owe, how much, what figure, what number, what amount, highest, top, ceiling; 25 words or fewer. Whole words, any case.`,after:["The card: she knows how rises work there, so ask what she'd do in your place.",`Say she answers: "Reviews are in March, and people who've run a client get bumped up. I'd ask for the Hughes account." If she says "Just keep doing what you're doing", ask again, more narrowly: "What would you need to see from me before the review?"`,`Fails: yes/no versions ("If you were me, would you ask?"), asking how much you could get, "why", and naming a figure you can't back up.`],modelRaw:'"If you were me, how would you go about getting a pay rise here?"'}],mission:`this week, ask one person who knows more than you about something you pay for or want (your phone provider, a mechanic, your manager): "If you were me, what would you do?" Write down one option they gave you that you didn't know existed.`},{id:"1.4",title:"The mirror",guess:null,card:{paras:[{t:"p",text:"When someone gives you a reason or a flat no, like a seller saying they can't go lower or a landlord saying costs are up, use a mirror. A mirror: repeat the one to three most important words they just said, as a question, then stay quiet. They hear their own words and usually explain more, and you haven't argued or agreed to anything."},{t:"p",text:"- Pick the words you want them to say more about, not just the last ones."}],rows:[{label:"Say",text:`Them: "I can't go lower than \xA3500." You: "Lower than \xA3500?" Then silence.`,subs:[]},{label:"Watch out",text:"three in a row and you sound like a parrot.",subs:[]},{label:"Evidence",text:"Pro trick (Chris Voss, FBI hostage negotiators). Repeating people's words back is linked to more trust and generosity (waitresses who repeated orders got bigger tips). Nobody has tested whether it gets you a better price.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`Your landlord rings: "I'm going to need to put the rent up. Costs have gone up a lot this year." What's your best reply?`],quote:[],options:[{k:"A",t:'"Costs have gone up a lot?"',ok:!0},{k:"B",t:'"I understand. How much are we talking?"',ok:!1},{k:"C",t:`"That's fair, everything's more expensive now."`,ok:!1},{k:"D",t:'"This year?"',ok:!1}],expl:{card:"The card: repeat the words you want them to say more about, as a question.",items:[{k:"A",ok:!0,text:`Right. It gets them spelling out which costs. Say they answer: "Mainly the mortgage, and I had to replace the boiler." Now you can say: "The boiler's a one-off, so could we keep the rise smaller this year?"`,subs:[]},{k:"B",ok:!1,text:"Accepts the rise and only asks how big.",subs:[]},{k:"C",ok:!1,text:"Agrees it's justified before you've heard a number.",subs:[]},{k:"D",ok:!1,text:`A mirror, but of the wrong words. You'll usually get: "Yeah, it's been a bad one."`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`A seller messages: "I've had loads of interest, so I'm not really dropping the price." What's your best reply?`],quote:[],options:[{k:"A",t:'"Not dropping the price?"',ok:!1},{k:"B",t:'"Loads of interest?"',ok:!0},{k:"C",t:`"Fair enough. What's the lowest you'd go?"`,ok:!1},{k:"D",t:'"Really?"',ok:!1}],expl:{card:"The card: mirror the words you want explained.",items:[{k:"B",ok:!0,text:`Right. They have to back it up. Say they answer: "A couple of people messaged, but nobody's come to see it yet." Now you can say: "I'm free tonight. Would \xA3120 work?" If they say "Three are viewing tomorrow", move fast or let it go.`,subs:[]},{k:"A",ok:!1,text:'Mirrors the wrong words, so they repeat the "no".',subs:[]},{k:"C",ok:!1,text:"Asks their floor, so they'll name something near the asking price.",subs:[]},{k:"D",ok:!1,text:"Not a mirror. It sounds like you're calling them a liar.",subs:[]}]}},{n:3,fmt:"Type it",stem:[`On Vinted: "Can't go lower sorry, I've got other buyers interested." Type a mirror.`],quote:[],options:[],model:"Other buyers interested?",checks:`one to five words, all taken from their message; contains one of: other, buyers, interested; contains none of: lower, can't, sorry; ends with "?" (trailing emojis ignored); nothing added.`,after:[`The card: mirror the words you want them to explain. Here that's the other buyers, not the "can't go lower".`,`Say they answer: "Well, someone asked if it's still available." That's one maybe. Now you can make your offer.`,`Fails: mirroring "can't go lower" (they just repeat the no), or adding your own words.`],modelRaw:'"Other buyers interested?"'},{n:4,fmt:"Say it",stem:[`You've just said "Lower than \xA3500?" and the seller hasn't answered yet. What's your best next move?`],quote:[],options:[{k:"A",t:"Stay quiet and let them answer",ok:!0},{k:"B",t:'"Because I saw one online for \xA3420."',ok:!1},{k:"C",t:'"Would \xA3450 work for you?"',ok:!1},{k:"D",t:`"Sorry, I just mean it's a bit high."`,ok:!1}],expl:{card:"The card: after the mirror, stay quiet. It only works if they fill the space.",items:[{k:"A",ok:!0,text:`Right. Say they answer: "Well, I'd take \xA3460 if you can collect this week." That's \xA340 off without you asking.`,subs:[]},{k:"B",ok:!1,text:"Turns it into an argument, so they defend the \xA3500.",subs:[]},{k:"C",ok:!1,text:"Offers \xA3450 before you've heard what they'd actually take.",subs:[]},{k:"D",ok:!1,text:"Apologises, so they never have to explain the \xA3500.",subs:[]}]}}],mission:"mirror someone once today, then count three seconds in your head. See if they add more."},{id:"1.5",title:'"Have you given up on\u2026?"',guess:null,card:{paras:[{t:"p",text:'When someone goes quiet on something they started, like a buyer who agreed a price then stopped replying, a client who asked you for a quote, or a recruiter who got in touch about a job, send one short line: "Have you given up on the [thing]?" Then wait.'},{t:"p",text:`Why it works: "Are you still interested?" asks for a yes. A yes commits them, so it's easier to say nothing. "Have you given up on\u2026?" flips it. The easy answer is "No", saying no feels safe, and that "No" means they still want it. People reply to put you right, and you're talking again.`},{t:"p",text:`This isn't "No worries if not!" (lesson 1.1), which hands them a polite way out. Here the easy answer keeps them in, so don't tack a way out on the end.`}],rows:[{label:"Say",text:'"Have you given up on the sofa?" \xB7 "Have you given up on the website?" \xB7 To a recruiter: "Have you given up on the Leeds role?"',subs:[]},{label:"Avoid",text:"",subs:['"Just checking in!" or "Any update?" (easy to leave on read)','"Are you still interested?" (asks for a yes)','Adding a way out: "Have you given up on the sofa? Totally fine if so!"']},{label:"Watch out",text:`only use it on something they started, and only once they've properly gone quiet: a normal follow-up has been left unanswered. Sent to someone who never started anything, to someone senior (a hiring manager, your boss's boss), or after a few hours' silence, it sounds passive-aggressive. If they reply "Yes, sorry", you've lost nothing: you've got your answer and can stop waiting.`,subs:[]},{label:"Evidence",text:"Pro trick (Chris Voss). Never tested. Voss says it almost always works, but there's no data behind that.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You design websites on the side. A caf\xE9 owner asked you for a quote for a new site. You sent one (\xA3400) ten days ago and followed up once, with no reply. What's your best next message?"],quote:[],options:[{k:"A",t:'"Hi! Just checking you got my quote? \u{1F60A}"',ok:!1},{k:"B",t:'"Are you still keen to go ahead with the site?"',ok:!1},{k:"C",t:'"Have you given up on the website?"',ok:!0},{k:"D",t:'"Have you given up on the website? No worries if so!"',ok:!1}],expl:{card:"The card: they've gone quiet on something they started, so ask if they've given up, with no way out.",items:[{k:"C",ok:!0,text:`Right. The easy answer, "No", means she still wants the site. Say she replies: "Kind of. \xA3400 is more than we'd budgeted." Now you can mirror the real problem (lesson 1.4): "More than you'd budgeted?"`,subs:[]},{k:"A",ok:!1,text:'"Just checking" is easy to leave on read, like your first chase.',subs:[]},{k:"B",ok:!1,text:"Asks for a yes, so silence is easier.",subs:[]},{k:"D",ok:!1,text:`The right line, then the way out: "Yes, sorry, we'll leave it."`,subs:[]}]}},{n:2,fmt:"Spot it",stem:["Priya agreed to sell her bike for \xA3120. The buyer said he'd collect it on Saturday, then went quiet:","None of them got a reply. What should she have sent on Tuesday?"],quote:['Sunday, Priya: "Hi! Are you still coming for the bike?"','Tuesday, Priya: "Just checking in \u{1F60A}"',`Thursday, Priya: "No worries if you've changed your mind!"`],options:[{k:"A",t:'"Are you still OK to collect it this week?"',ok:!1},{k:"B",t:'"Have you given up on the bike?"',ok:!0},{k:"C",t:'"Sorry to chase! When are you able to collect?"',ok:!1},{k:"D",t:'"Let me know either way, no stress!"',ok:!1}],expl:{card:"The card: once a normal follow-up's been ignored, ask if they've given up on the thing they started.",items:[{k:"B",ok:!0,text:`Right. The easy answer, "No", means he still wants the bike. Say he replies: "No, sorry! Mad week. Can I come Saturday?" Now you can say: "Saturday's great. 10am?"`,subs:[]},{k:"A",ok:!1,text:"Asks for a yes again, like Sunday's message. You'll usually get more silence.",subs:[]},{k:"C",ok:!1,text:"Asks him to commit to a time, the reply he's been dodging. More silence.",subs:[]},{k:"D",ok:!1,text:`"No stress" hands him the way out: "Sorry, I'll leave it."`,subs:[]}]}},{n:3,fmt:"Say it",stem:["A recruiter messaged you on LinkedIn about a junior marketing job at a Leeds agency, and put you forward. Ten days ago, the agency's head of marketing interviewed you. Since then, nothing from either of them, and the recruiter hasn't answered your email on Monday asking for news. What's your best move?"],quote:[],options:[{k:"A",t:'Message the recruiter: "Have you given up on the Leeds role?"',ok:!0},{k:"B",t:'Email the head of marketing: "Have you given up on me for the role?"',ok:!1},{k:"C",t:'Message the recruiter: "Hi, is there any news on the Leeds job?"',ok:!1},{k:"D",t:'Email the head of marketing: "Are you still considering me for the role?"',ok:!1}],expl:{card:"The card: only for something they started, and never to someone senior.",items:[{k:"A",ok:!0,text:`Right. The recruiter came to you, so this is their deal, and they're not senior. The easy answer is "No". Say they reply: "No! They've been slow, sorry. They're deciding Friday, and you're one of two."`,subs:[]},{k:"B",ok:!1,text:"The right line to the wrong person. She's senior, so it sounds passive-aggressive.",subs:[]},{k:"C",ok:!1,text:`"Any news?" is the follow-up that's already been ignored.`,subs:[]},{k:"D",ok:!1,text:"Asks a busy, senior person for a yes. You'll usually get silence.",subs:[]}]}},{n:4,fmt:"Type it",stem:[`Someone on your course said she'd buy your spare ticket for Friday's gig, at the \xA345 you paid, and send the money "tonight". That was Sunday. On Tuesday you messaged asking if she still wanted it. No reply. It's Wednesday. Type your next message.`],quote:[],options:[],model:"Have you given up on the gig ticket?",checks:'contains one of: given up, giving up, give up, gave up, gone off; contains one of: ticket, gig, it; ends with "?" (trailing emojis ignored); no \xA3 and no digits; contains none of: no worries, no stress, no problem, no bother, if so, if not, or not, totally fine, all good, either way, still interested, still keen, still want, checking in, any update, any news, relist, someone else, other buyers, sell it to, lower, cheaper, discount, on me, why; 15 words or fewer. Whole words, any case.',after:["The card: your normal follow-up's been ignored on something she started, so ask if she's given up, with no way out.",`Say she replies: "No!! Sorry, payday's Friday, I'll send it then." Now you know she still wants it, and when. If she replies "Yeah, sorry, can't make it now", you've lost nothing: resell it today, with two days to spare.`,'Fails: "Still want it?", "Any update?", adding a way out, and dropping the price.'],modelRaw:'"Have you given up on the gig ticket?"'}],mission:`this week, find one thing someone else started that's gone quiet (a buyer, a client, a mate's plan for a trip, a recruiter), and send "Have you given up on\u2026?" Note how fast they reply. If nothing's gone quiet, write the line you'd have sent the last time someone ghosted you.`},{id:"1.6",title:'"What makes you ask?"',guess:null,card:{paras:[{t:"p",text:`When someone asks a question that could box you in, like "What's your budget?", "What are you earning now?" or "Have you had other offers?", don't answer straight away. Say "What makes you ask?", lightly, then stop. You give nothing away, and their answer tells you what they're really after: fitting you to a budget, finding your limit, or just checking you're serious. Then answer the real question without handing them a number that caps you.`},{t:"p",text:'The exception: "What are you looking for?" is a chance to name your number. If you know the going rate, name it (lesson 1.1).'}],rows:[{label:"Say",text:`"What makes you ask?" \xB7 "Good question. What's behind it?"`,subs:[]},{label:"Avoid",text:"",subs:[`Giving the number that caps you ("I'm on \xA324k", "About \xA31,000 a month")`,`"I'd rather not say" (sounds cagey)`,'"Why do you want to know?" ("why" sounds like a challenge, lesson 1.3)']},{label:"Watch out",text:"say it with a smile in your voice. Said flat, it sounds evasive. If they push for a number, give the going rate for the thing, not your budget or your current pay.",subs:[]},{label:"Evidence",text:"Pro trick (Chris Voss).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`A recruiter asks: "And what are you earning at the moment?" You're on \xA324,000, and you've seen the new role advertised at up to \xA332,000. What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!0},{k:"B",t:`"\xA324,000, but I'm hoping for a decent jump."`,ok:!1},{k:"C",t:`"I'd rather not say, if that's OK."`,ok:!1},{k:"D",t:`"What's the most the role could pay?"`,ok:!1}],expl:{card:"The card: when a question could box you in, ask what's behind it instead of answering.",items:[{k:"A",ok:!0,text:`Right. Say they answer: "Just to check we're in the right ballpark." They're fitting you to a budget, so now you can say: "Similar roles are paying around \xA332,000." If they push ("I do need a number"), give the going rate, not your \xA324,000.`,subs:[]},{k:"B",ok:!1,text:"Hands them the number that caps you: offers will start near \xA324,000.",subs:[]},{k:"C",ok:!1,text:"Refuses, and sounds cagey.",subs:[]},{k:"D",ok:!1,text:"Asks their limit, so their answer is your ceiling.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling a jacket on Vinted for \xA360. A buyer messages: "Have you had any other offers?" You haven't. What's your best reply?`],quote:[],options:[{k:"A",t:`"No, you're the first one to ask!"`,ok:!1},{k:"B",t:'"Why do you want to know?"',ok:!1},{k:"C",t:'"What makes you ask?"',ok:!0},{k:"D",t:`"Not yet, but I'm sure I will."`,ok:!1}],expl:{card:`The card: ask what's behind it, lightly. Don't ask "why".`,items:[{k:"C",ok:!0,text:`Right. Say they answer: "Just wondering if you'd take less." They're keen, so get them to name a number instead of dropping yours: "What were you thinking?" If they say \xA345, you can meet them at \xA355.`,subs:[]},{k:"A",ok:!1,text:"Tells them nobody else wants it, so they'll offer low.",subs:[]},{k:"B",ok:!1,text:'"Why" sounds like a challenge: "Just asking!", and a cooler buyer.',subs:[]},{k:"D",ok:!1,text:"Admits there are none, plus a bluff. You'll still usually get a low offer.",subs:[]}]}},{n:3,fmt:"Type it",stem:['At a flat viewing, the agent asks: "What are you paying at your current place?" Type your reply.'],quote:[],options:[],model:"What makes you ask?",checks:"contains one of: makes you ask, what's behind, whats behind, what's the reason, prompted, reason you ask; no \xA3 and no digits; contains none of: why, rather not, none of your business, not telling, private, around, about, roughly. Whole words, any case. 12 words or fewer.",after:["The card: ask what's behind the question instead of handing over a number that caps you.",'Say they answer: "The landlord likes to know people can afford it." Now you can say: "I can afford the asking rent comfortably." That reassures them without giving away your current rent.',`Fails: any number, "why", or a flat refusal ("I'd rather not say").`],modelRaw:'"What makes you ask?"'},{n:4,fmt:"Say it",stem:[`This time the recruiter asks: "What salary are you looking for?" You've checked, and similar roles pay \xA330,000 to \xA334,000. What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!1},{k:"B",t:`"Similar roles pay up to \xA334,000, so I'm looking for \xA334,000."`,ok:!0},{k:"C",t:'"Around \xA330,000 would be fine for me."',ok:!1},{k:"D",t:`"What's the budget for the role?"`,ok:!1}],expl:{card:`The card's exception: when asked "What are you looking for?" and you know the going rate, name your number.`,items:[{k:"B",ok:!0,text:`Right. The top of the going rate, with a reason. Say they answer: "We were thinking more like \xA331,000." You're negotiating from \xA334,000, not their number: "Could we meet at \xA333,000?"`,subs:[]},{k:"A",ok:!1,text:'Right for "What are you earning?", but here it wastes your chance to go first.',subs:[]},{k:"C",ok:!1,text:"The bottom of the range, so that's the most you'll get.",subs:[]},{k:"D",ok:!1,text:"Asks their limit, and their budget becomes your ceiling.",subs:[]}]}}],mission:`next time someone asks your budget, what you earn or whether you've had other offers, say "What makes you ask?" and notice what they tell you.`}]},{n:2,title:"The First Number",tagline:"The first number anyone says pulls the final price towards it. Learn when to say yours first, how to say it, and how to stop theirs pulling you.",lessons:[{id:"2.1",title:"Go first if you know the price",guess:{stem:["In a role-play negotiation, a businessperson haggled with a taxi driver over what to pay him to wait. Only the driver knew what waiting usually costs. What happened to the final price when the businessperson named a number first, instead of the driver?"],options:[{k:"A",t:"About the same either way",ok:!1},{k:"B",t:"About a fifth higher",ok:!1},{k:"C",t:"About twice as high",ok:!1},{k:"D",t:"About four times as high",ok:!0}],reveal:"about four times as high: $49.50 when the businessperson went first, against $11.36 when the driver did. Guess a number when the other side knows more, and you can be miles out without ever finding out."},card:{paras:[{t:"p",text:`When you're selling something or buying second-hand, like a bike, your phone or a used car, the first number anyone says pulls the final price towards it. So before anyone names a price, ask yourself one question: "Do I know what this is worth as well as they do?"`},{t:"p",text:"If yes, say your number first, before they can. Make it ambitious: near the top of what it sells for if you're selling, near the bottom if you're buying, and give a reason."},{t:"p",text:`If not, like a dealer valuing your grandad's watch or a niche job you can't find salaries for, don't guess. Your guess could be hundreds of pounds too low, and they'll happily say yes. Get them to say a number first, then ask what it's based on: "How did you land on that figure?" Their answer shows you what they value most, and where there's room.`}],rows:[{label:"Say",text:`Selling: "\xA31,240. It's had a new chain and cassette." \xB7 Buying: "\xA3115. That's what the last two sold for." \xB7 If you don't know what it's worth: "What would you give me for it?"`,subs:[]},{label:"Avoid",text:"",subs:['"What were you thinking?" when you know what it sells for (they name the first number, and the haggling starts from theirs)',`"\u2026or nearest offer" or "I'm open to offers" (it invites them to start below your number)`,`a modest number "so I don't sound cheeky"`,"guessing a number when they know far more than you do"]},{label:"Watch out",text:`the further you push, the better your deal tends to be, but the more likely they are to walk off, so pick a number you can back up with a reason. On Marketplace, Vinted or eBay, your listing price is your first number, so set it the same way: ambitious, with the reason in the description. A buyer asking "What's the lowest you'd take?" is asking for your limit: answer with your opening number instead. For pay, and rates you'll charge the same person again, give a range (lesson 2.4).`,subs:[]},{label:"Evidence",text:"Proven. Across 90 studies, the side that named a number first usually got the better deal, and ambitious first numbers did better still, though they ended in no deal more often (Petrowsky and colleagues, 2025). When only one side knew what something was worth, the side who didn't know did far better when the other side went first (Maaravi and Levy, 2017).",subs:[]},{label:"Myth",text:'"Never say the first number" and "Always say the first number" are both wrong as rules. It depends on who knows more.',subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You've posted in your uni's buy-and-sell group that you're selling your electric scooter, no price yet. The same model has sold for \xA3220 to \xA3260 on eBay. Someone messages: "How much are you after for it?" What's your best reply?`],quote:[],options:[{k:"A",t:'"What would you be willing to pay for it?"',ok:!1},{k:"B",t:`"\xA3240. It's barely been used, honestly."`,ok:!1},{k:"C",t:'"\xA3260. Still boxed, with the charger."',ok:!0},{k:"D",t:`"Around \xA3250, but I'm open to offers."`,ok:!1}],expl:{card:"The card: you know what it sells for, so go first, near the top, with a reason.",items:[{k:"C",ok:!0,text:`Right. The top of the range, backed by the box and charger. Say they answer: "Would you take \xA3230?" Now you can say: "\xA3250 and I'll throw in the lock."`,subs:[]},{k:"A",ok:!1,text:`For when you don't know what it's worth. You'll usually get: "\xA3150?"`,subs:[]},{k:"B",ok:!1,text:"Starts mid-range. You'll usually finish around \xA3225.",subs:[]},{k:"D",ok:!1,text:`Invites them below your number. You'll usually get: "\xA3200?"`,subs:[]}]}},{n:2,fmt:"Spot it",stem:["At a car boot sale, Chloe finds a used Fender acoustic guitar with no price on it. She checks on her phone: similar ones have sold for \xA3120 to \xA3170.","What should Chloe have said instead?"],quote:['Seller: "What are you offering?"',`Chloe: "Would \xA3165 be OK? Don't want to be cheeky."`,`Seller: "Make it \xA3175 and it's yours."`],options:[{k:"A",t:'"\xA3125. One sold for that last week."',ok:!0},{k:"B",t:`"What's the lowest you'd go to on it?"`,ok:!1},{k:"C",t:`"\xA3145. That's about what they go for."`,ok:!1},{k:"D",t:`"\xA380. I've seen them go for way less."`,ok:!1}],expl:{card:"The card: buying, so go first near the bottom, with a reason. Chloe went first near the top, and apologised.",items:[{k:"A",ok:!0,text:`Right. Low, but backed by a real sale. Say the seller answers: "I could do \xA3150." Now you can say: "\xA3135, and I'll take it now."`,subs:[]},{k:"B",ok:!1,text:`Asks his limit. You'll usually get: "\xA3170."`,subs:[]},{k:"C",ok:!1,text:"Starts mid-range, so you'll usually end up near the top.",subs:[]},{k:"D",ok:!1,text:`Below anything that's sold. You'll usually get: "Not a chance."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're clearing out your stuff before moving abroad. For each sale, should you say a price first, or get them to name a number first?"],quote:[],options:[],sort:[{t:`"Your iPhone 14 on eBay. You've checked 20 sold listings."`,bin:"say a price first"},{t:`"A signed football shirt, to a memorabilia dealer. You can't find a single price for it online."`,bin:"get their number first"},{t:'"Your car, to a dealer. Three valuation sites all say about \xA34,300."',bin:"say a price first"},{t:`"Your uncle's old vinyl, to a record shop. You don't recognise most of the bands."`,bin:"get their number first"},{t:'"Your sofa on Marketplace. The same model has sold for \xA3180 to \xA3220."',bin:"say a price first"},{t:`"A painting you were given, to an antiques dealer. It's signed, but you can't read the name."`,bin:"get their number first"}],expl:{card:'The card: ask "Do I know what this is worth as well as they do?"',items:[{label:"Say a price first",text:"the iPhone, the car and the sofa. You've seen what they sell for. The car is the trap: the dealer's an expert, but after three valuation sites you know the number too.",subs:[]},{label:"Get their number first",text:`the shirt, the vinyl and the painting. Say the record shop offers \xA360 for the lot. Ask: "How did you land on \xA360?", and you'll learn which records he's after.`,subs:[]}]},bins:["say a price first","get their number first"]},{n:4,fmt:"Say it",stem:[`Your grandad left you his old Omega watch. You've no idea what it's worth and can't find one like it online. A vintage watch dealer looks it over: "Lovely piece. What are you looking to get for it?" What's your best reply?`],quote:[],options:[{k:"A",t:`"I was thinking maybe \xA3300, if that's OK?"`,ok:!1},{k:"B",t:`"Do you think it's worth much at all?"`,ok:!1},{k:"C",t:'"\xA31,200. Vintage Omegas are really sought after."',ok:!1},{k:"D",t:'"What would you offer for it?"',ok:!0}],expl:{card:"The card: if they know far more than you, don't guess. Get their number first.",items:[{k:"D",ok:!0,text:`Right. An expert's number, and you've given none. Say he answers: "\xA3600." Ask: "How did you land on \xA3600?" If he says "That's my offer", you've lost nothing: it's worth at least \xA3600.`,subs:[]},{k:"A",ok:!1,text:"A guess. If it's worth \xA3900, you'll never know.",subs:[]},{k:"B",ok:!1,text:`Tells him you've no idea. You'll usually get: "Not really."`,subs:[]},{k:"C",ok:!1,text:"Confident, but a guess. If it's worth \xA32,000, he says yes.",subs:[]}]}},{n:5,fmt:"Say it",stem:[`A recruiter rings about a junior role at a renewable energy start-up. It's a niche job and you can't find any salary figures for it. "Before we put an offer together, what salary are you looking for?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Around \xA325,000 would be great, if that works."',ok:!1},{k:"B",t:'"What did you have in mind for the role?"',ok:!0},{k:"C",t:`"What's the salary range for this role?"`,ok:!1},{k:"D",t:`"Whatever's standard is fine, I'm keen to start."`,ok:!1}],expl:{card:"The card: if you can't find out what it's worth, don't guess. Unlike lesson 1.6, you can't check the going rate.",items:[{k:"B",ok:!0,text:`Right. Say they answer: "We're thinking \xA327,000." You'd have said \xA325,000. Now you can say: "With my placement year in solar, could we look at \xA328,500?"`,subs:[]},{k:"A",ok:!1,text:"A guess, maybe thousands under their budget.",subs:[]},{k:"C",ok:!1,text:"You'll usually be offered the bottom of the range.",subs:[]},{k:"D",ok:!1,text:"Tells them you'll take whatever they offer.",subs:[]}]}},{n:6,fmt:"Type it",stem:[`Someone at work hears you're selling your Apple Watch and asks: "What's the lowest you'd take?" Similar ones have sold for \xA3180 to \xA3210 on eBay. Type your reply: a price and a short reason.`],quote:[],options:[],model:"\xA3205. It's under two years old, with the box and two straps.",checks:`at least one \xA3 amount from 200 to 210, and no other \xA3 amount under 300; 4 to 20 words; contains one of: it's, its, has, with, comes, includes, included, barely, boxed, box, new, old, months, years, condition, sold, because, as, since, strap, straps, charger, battery, scratch, scratches, mint; no "about", "around" or "roughly" directly before an amount; contains none of: offer, offers, nearest, negotiable, ono, flexible, open to, take, below, can't go, cant go, can't do, cant do, any less, or less, for less, minimum, lower, lowest, limit, least, bottom, floor, what were you, I need, I'd need, most you, best price. Whole words, any case.`,after:["The card: you know what it sells for, so answer with your ambitious opening number and a reason, never your limit.",`Say they answer: "Would you do \xA3185?" Now you're haggling near the top: "\xA3198, and I'll bring the charger in tomorrow."`,`Fails: a number under \xA3200 or over \xA3210, no reason, "or nearest offer", and anything that sounds like your limit ("lowest I'll go", "can't do less").`],modelRaw:`"\xA3205. It's under two years old, with the box and two straps."`}],mission:"this week, look up three sold prices for something you own, and write the price you'd say first with your reason."},{id:"2.2",title:"Write your target first",guess:{stem:[`Professional car mechanics and dealers valued the same used car. Beforehand, the "customer" casually mentioned either a high or a low price. How far apart were the experts' valuations?`],options:[{k:"A",t:"No real difference: they're experts",ok:!1},{k:"B",t:"About 5% apart",ok:!1},{k:"C",t:"About 40% apart",ok:!0},{k:"D",t:"The high price made them go lower",ok:!1}],reveal:"about 40% apart (3,563 against 2,520 Deutschmarks) for the same car. When the experts first listed reasons the customer's price might be wrong, the gap shrank by about two thirds."},card:{paras:[{t:"p",text:`When the other side is likely to name the first number, like a rent rise, a dealer's offer for your old car, a pay review or a buyer's offer on your stuff, write down your target before they speak: the price you're aiming for, with a reason. Make it ambitious, like your opening number in lesson 2.1: the top of what it sells for if you're selling or being paid, the bottom if you're paying ("\xA31,280, because similar flats nearby start at \xA31,275"). Never base it on the least you'd accept.`},{t:"p",text:`Their number will pull your thinking towards it, even when you know it's happening. Even car experts got pulled. Two things weaken the pull: keeping your written target in front of you, and asking yourself "Why might their number be wrong?" or "What happens to them if I say no?" Then reply with your own number and your reason, not a step away from theirs.`},{t:"p",text:"The twist: people who aim at a target get better deals but feel worse about them, because they compare the result with the target. So afterwards, judge the deal against your walk-away (your plan B, lesson 4.3): what you'd have done if it had fallen through, like taking the trade-in shop's price."}],rows:[{label:"Say",text:`Before, to yourself: "I'm aiming for \xA3__, because __." \xB7 When their number lands, to yourself: "Why might that be wrong?" \xB7 Out loud: "Ones like this have sold for up to \xA3140. You can have it for \xA3138." \xB7 Afterwards: "Compared with my walk-away, how did I do?"`,subs:[]},{label:"Avoid",text:"",subs:[`"Could you do a bit better than that?" (their number is still the one everyone's working from)`,`"That's a lot", then nothing (theirs is still the only number on the table)`,`"Let's meet in the middle" straight after a number that's way off (the middle is way off too, lesson 3.5)`,`aiming at your minimum: "As long as I get over \xA3900, I'm happy" (any offer above \xA3900 feels like a win, so you stop pushing)`]},{label:"Watch out",text:"sometimes this cancels the pull of their number, and sometimes it only shrinks it, so write the target before they speak, not after. If you don't know what it's worth, you can't set a target yet: ask what their number is based on first, and their answer shows you which parts could come down.",subs:[]},{label:"Evidence",text:"Backed by studies. In a lab negotiation, focusing on your own target, or on what the other side would do without a deal, cancelled out the first offer's advantage (Galinsky and Mussweiler, 2001). Car experts who listed reasons a price was wrong were still pulled, but about two thirds less (Mussweiler, Strack and Pfeiffer, 2000). People focused on a target got better deals but felt less satisfied, and thinking about their walk-away afterwards brought the satisfaction back (Galinsky, Mussweiler and Medvec, 2002, three experiments).",subs:[]},{label:"Myth",text:`"Once you know about anchoring (a first number pulling you towards it), it can't work on you." Being warned about it didn't reduce its effect (Wilson and colleagues, 1996, reported by Mussweiler and colleagues, 2000).`,subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`The letting agent rings: "The landlord wants to put your rent up from \xA31,250 to \xA31,400 a month." You've checked: similar two-beds nearby are listed at \xA31,275 to \xA31,325. What's your best reply?`],quote:[],options:[{k:"A",t:'"Similar flats start at \xA31,275. I can do \xA31,280."',ok:!0},{k:"B",t:'"Could we meet in the middle, at \xA31,325 a month?"',ok:!1},{k:"C",t:'"Flats nearby go up to \xA31,325, so I can do \xA31,310."',ok:!1},{k:"D",t:`"That's a big jump. Could you do \xA31,375 instead?"`,ok:!1}],expl:{card:"The card: reply with your own ambitious number and reason, not a step from theirs. You're paying, so aim low.",items:[{k:"A",ok:!0,text:`Right. It ignores \xA31,400. Say the agent answers: "He could do \xA31,320." Now you can say: "If he can do \xA31,300, I'll confirm by Friday."`,subs:[]},{k:"B",ok:!1,text:"\xA31,400 set the middle, so you land at the top of the market.",subs:[]},{k:"C",ok:!1,text:"Your own number, but near the top: \xA330 a month more than A.",subs:[]},{k:"D",ok:!1,text:"A step down from his number.",subs:[]}]}},{n:2,fmt:"Sort it",stem:[`Your manager says: "We're thinking a 2% rise, so \xA325,500." Job ads for your role pay \xA327,500 to \xA329,500. Before you reply, which thoughts weaken the pull of \xA325,500, and which pull you towards it?`],quote:[],options:[],sort:[{t:'"Why might \xA325,500 be wrong?"',bin:"weakens its pull"},{t:`"\xA325,500 isn't that far off, really."`,bin:"pulls you towards it"},{t:`"My target's \xA329,500, the top of the ads."`,bin:"weakens its pull"},{t:`"I'll ask for a bit more than \xA325,500."`,bin:"pulls you towards it"},{t:'"If I left, what would it cost her to hire and train someone new?"',bin:"weakens its pull"},{t:'"She must have a reason for that number."',bin:"pulls you towards it"}],expl:{card:"The card: keep your target in front of you, and ask why their number might be wrong or what happens to them if you say no.",items:[{label:"Weakens its pull",text:`your target, reasons it's wrong, and the cost of replacing you. Say you reply: "Ads pay up to \xA329,500. Could we look at that?" and she offers \xA327,000: \xA31,500 more than her first number.`,subs:[]},{label:"Pulls you towards it",text:'"a bit more" starts from her number; the other two treat it as right.',subs:[]}]},bins:["weakens its pull","pulls you towards it"]},{n:3,fmt:"Say it",stem:[`A pub manager wants a DJ for a one-off New Year's Eve party: "We usually pay \xA3100 for a set." DJs round here get \xA3250 to \xA3350, and more on New Year's Eve. Last New Year's, Cellar Bar paid you \xA3385. What's your best reply?`],quote:[],options:[{k:"A",t:`"\xA3100's quite low. Could you go to \xA3200?"`,ok:!1},{k:"B",t:'"\xA3250, the going rate for DJs round here."',ok:!1},{k:"C",t:`"OK. What's the most you could stretch to, then?"`,ok:!1},{k:"D",t:`"\xA3385. Cellar Bar paid that last New Year's."`,ok:!0}],expl:{card:"The card: reply with your own ambitious number and reason, not a step up from theirs.",items:[{k:"D",ok:!0,text:`Right. It starts from what you've been paid. Say they answer: "Could you do \xA3300?" Now you can say: "\xA3345, and I'll bring my own lights." If they say "\xA3150, tops", judge that against your walk-away.`,subs:[]},{k:"A",ok:!1,text:"Starts from their \xA3100, so you'll end up near it.",subs:[]},{k:"B",ok:!1,text:"The bottom of the rate, on New Year's.",subs:[]},{k:"C",ok:!1,text:"Asks their limit, which becomes your ceiling.",subs:[]}]}},{n:4,fmt:"Say it",stem:["Last month you sold your Switch for \xA3185. Your target was \xA3210, so it felt like a loss, but the best you'd have got otherwise was \xA3150 from a trade-in shop. Now you're selling your games. They've sold for \xA322 to \xA330 each, and the trade-in shop would give you \xA318 each. Which target do you write down?"],quote:[],options:[{k:"A",t:'"\xA324 each, roughly what most of them went for."',ok:!1},{k:"B",t:`"\xA320 each, so I'm not let down like last time."`,ok:!1},{k:"C",t:'"\xA330 each, the top of the sold prices."',ok:!0},{k:"D",t:'"\xA326 each, the middle, so they go quickly."',ok:!1}],expl:{card:"The card: aim at the top, and judge the result against your walk-away. By that test the Switch went well.",items:[{k:"C",ok:!0,text:`Right. The top, and you can back it up. Say a buyer offers \xA320: "\xA328. That's what the last one sold for." Settle at \xA325 and you've beaten trade-in by \xA37.`,subs:[]},{k:"A",ok:!1,text:"Aims at the middle, so \xA320 will feel close enough.",subs:[]},{k:"B",ok:!1,text:"Lowers the target because a good deal felt bad.",subs:[]},{k:"D",ok:!1,text:"Aims at the middle to sell faster.",subs:[]}]}},{n:5,fmt:"Say it",stem:["Your car's clutch is slipping. A garage quotes \xA3640 to replace it. You've no idea what a clutch usually costs. What's your best reply?"],quote:[],options:[{k:"A",t:'"I was hoping for more like \xA3450, to be honest."',ok:!1},{k:"B",t:'"How did you get to \xA3640?"',ok:!0},{k:"C",t:'"\xA3640? That seems a lot for a clutch."',ok:!1},{k:"D",t:`"What's the lowest you could do it for?"`,ok:!1}],expl:{card:"The card: no idea what it's worth? You can't set a target, so ask what their number is based on.",items:[{k:"B",ok:!0,text:'Right. Say they answer: "\xA3280 for the kit, plus six hours at \xA360." Now you can say: "Could you do the labour at \xA350 an hour if I drop it in Monday?"',subs:[]},{k:"A",ok:!1,text:"A guess. If it's usually \xA3400, they'll take \xA3450.",subs:[]},{k:"C",ok:!1,text:`A hint. You'll usually get: "Clutches aren't cheap, mate."`,subs:[]},{k:"D",ok:!1,text:`Asks their limit. You'll usually get: "\xA3620."`,subs:[]}]}},{n:6,fmt:"Type it",stem:["A dealer offers you \xA32,900 in part-exchange for your Ford Ka. You'd checked beforehand: dealers are paying \xA33,400 to \xA33,700 for similar ones, and you'd written down \xA33,650. Type your reply."],quote:[],options:[],model:"Dealers are paying up to \xA33,700 for these. You can have it for \xA33,650.",checks:"the last \xA3 amount is from 3,500 to 3,700; 25 words or fewer; contains none of: halfway, middle, meet in, split, a bit more, a bit better, I need, I'd need, need at least, at least, minimum, can't go, cant go, below, most you, lowest, best price, best you, your best. Whole words, any case.",after:["The card: reply with your own number and reason, not a step up from theirs.",`The model answer moves the talk from \xA32,900 to \xA33,650. Say he answers: "Best I can do is \xA33,300." Now you can say: "Make it \xA33,480 and we've got a deal."`,'Fails: halfway or "a bit more" (his number still sets the deal), a number below \xA33,500 or above what dealers pay, and anything that tells him your limit.'],modelRaw:'"Dealers are paying up to \xA33,700 for these. You can have it for \xA33,650."'}],mission:"this week, pick one price you see (a listing, a bill, a quote) and write your own target for it with a reason, plus two reasons their number might be wrong."},{id:"2.3",title:"Use a precise number",guess:{stem:["In a used-car study, buyers opened with either a round number or a precise one. How did the sellers' replies differ?"],options:[{k:"A",t:"Sellers moved further from precise offers",ok:!1},{k:"B",t:"No real difference between the two",ok:!1},{k:"C",t:"Sellers moved less from precise offers",ok:!0},{k:"D",t:"Sellers walked away from precise offers more often",ok:!1}],reveal:"sellers moved less. On average, their replies moved about $3,200 away from a precise offer, against about $4,200 from a round one."},card:{paras:[{t:"p",text:"When you name a single price for a one-off, like your asking price on Marketplace, a quote for a one-off job or an offer on a car, make it precise. Round means ending in 00, like \xA3700 or \xA32,000. Precise means anything else, like \xA3685 or \xA32,385."},{t:"p",text:"A precise number sounds worked out, so people assume you know something and push back less. A round one sounds like a guess, so they knock it down harder. Add the reason behind the number where you can."}],rows:[{label:"Say",text:`"\xA32,385. It needs two new tyres, so I've knocked those off." \xB7 "\xA368 for the lot, including postage." \xB7 "\xA3460: two days at my day rate, plus materials."`,subs:[]},{label:"Avoid",text:'"around", "roughly" or "about" before your number (it turns a precise number back into a guess) \xB7 round numbers like \xA32,000 \xB7 pennies (\xA32,384.50) with professionals like car dealers or estate agents',subs:[]},{label:"Watch out",text:`with professionals, a very precise number looks naive unless you give the reason behind it. And when someone hands you a precise number, it doesn't mean they've worked it out: if you know what it sells for, reply with your own number; if you don't, ask what it's based on: "How did you land on \xA3347?" For pay, and rates you'll charge the same person again, use a range instead (lesson 2.4).`,subs:[]},{label:"Evidence",text:"Backed by studies. People moved less from precise first offers across six studies, including a live used-car negotiation (Mason, Lee, Wiley and Ames, 2013). Estate agents were swayed by precision up to a point, then read very precise prices as naive (Loschelder and colleagues, 2016).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`A colleague hears you're selling your MacBook Air and asks: "What's your price?" Similar ones have sold for \xA3580 to \xA3700 on eBay. What's your best reply?`],quote:[],options:[{k:"A",t:'"Around \xA3700 or so, but happy to take offers."',ok:!1},{k:"B",t:`"\xA3685. Battery's at 89%, and it's boxed."`,ok:!0},{k:"C",t:`"\xA3700. Battery's at 89%, and it's boxed."`,ok:!1},{k:"D",t:'"What were you hoping to pay for it?"',ok:!1}],expl:{card:"The card: one precise number, with a reason. Round means ending in 00.",items:[{k:"B",ok:!0,text:'Right. Near the top, and precise, so it sounds worked out. Say they reply: "Would you do \xA3630?" Now you can say: "\xA3660 if you can take it tomorrow."',subs:[]},{k:"A",ok:!1,text:`Round, and invites offers. You'll usually get: "\xA3550?"`,subs:[]},{k:"C",ok:!1,text:"The same line, but round, so it gets pushed down further.",subs:[]},{k:"D",ok:!1,text:"Lets them go first when you know the price (lesson 2.1).",subs:[]}]}},{n:2,fmt:"Say it",stem:["A local hairdresser wants a simple booking website, a one-off job. Freelancers with your experience charge \xA3800 to \xA31,000 for it. They ask for your quote. What's your best reply?"],quote:[],options:[{k:"A",t:`"\xA3940, but I'm flexible on the price."`,ok:!1},{k:"B",t:'"Roughly \xA3950, give or take a bit."',ok:!1},{k:"C",t:'"\xA31,000, which is what freelancers charge."',ok:!1},{k:"D",t:'"\xA3960, including a logo tidy-up."',ok:!0}],expl:{card:"The card: a one-off job gets one precise number, with the reason behind it.",items:[{k:"D",ok:!0,text:`Right. Precise, near the top, with what's included. Say they reply: "Could you do \xA3850?" Now you can say: "I can do \xA3920 if you send the photos by Friday."`,subs:[]},{k:"A",ok:!1,text:`"Flexible" invites a lower offer. You'll usually get: "\xA3800?"`,subs:[]},{k:"B",ok:!1,text:`"Roughly" makes it a guess, so they'll push hard.`,subs:[]},{k:"C",ok:!1,text:"\xA340 higher, but round, so it usually gets pushed down further.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`A seller on Marketplace has a Garmin watch listed at \xA3347. You've checked: the same model has sold for \xA3240 to \xA3290 on eBay. You ask if it's still available. They reply: "Yes, and I've priced it carefully, it's worth every penny." What's your best reply?`],quote:[],options:[{k:"A",t:'"\xA3289. The last one on eBay went for that."',ok:!1},{k:"B",t:'"\xA3347 is a lot for it. Could you do \xA3320?"',ok:!1},{k:"C",t:`"\xA3245. That's what one went for on eBay."`,ok:!0},{k:"D",t:`"What's the lowest you'd actually take for it?"`,ok:!1}],expl:{card:"The card: a precise number isn't proof they've worked it out. You know the going rate and you're buying, so reply low.",items:[{k:"C",ok:!0,text:`Right. Low, with proof. Say they answer: "I could do \xA3300." Now you can say: "\xA3262, and I'll come round today." If they say "Not below \xA3330", let them wait.`,subs:[]},{k:"A",ok:!1,text:"From the top when you're buying (lesson 2.1): \xA344 more than C.",subs:[]},{k:"B",ok:!1,text:"Treats \xA3347 as worked out.",subs:[]},{k:"D",ok:!1,text:`Asks their limit. You'll usually get: "\xA3330."`,subs:[]}]}},{n:4,fmt:"Sort it",stem:["You're selling your 2019 Honda moped. Similar ones have sold for \xA31,600 to \xA31,900. Which asking prices sound worked out, and which sound like a guess?"],quote:[],options:[],sort:[{t:'"\xA31,865. New tyres in March."',bin:"sounds worked out"},{t:'"\xA31,900 or nearest offer."',bin:"sounds like a guess"},{t:'"Roughly \xA31,850, give or take."',bin:"sounds like a guess"},{t:`"\xA31,840, as it's done 4,000 miles."`,bin:"sounds worked out"},{t:`"\xA31,800. It's in good nick."`,bin:"sounds like a guess"},{t:'"\xA31,870 with the top box included."',bin:"sounds worked out"}],expl:{card:'The card: precise means not ending in 00, and "roughly" turns it back into a guess.',items:[{label:"Sounds worked out",text:'\xA31,865, \xA31,840 and \xA31,870, each with a reason. Say a buyer offers \xA31,700: "\xA31,820 if you take the helmet off my hands too."',subs:[]},{label:"Sounds like a guess",text:"",subs:[`"\xA31,800. It's in good nick." is the trap: a reason, but a round number.`,'"\xA31,900 or nearest offer" is round, and invites them below it.','"Roughly \xA31,850" is precise, then "roughly" makes it a guess.']}]},bins:["sounds worked out","sounds like a guess"]},{n:5,fmt:"Type it",stem:[`A new bakery wants a one-off promo video for its opening. You've worked it out: two days of filming and editing at your \xA3180 day rate, plus \xA325 for music, comes to \xA3385. They ask: "What would you charge?" Type your quote with the reason.`],quote:[],options:[],model:"\xA3385. That's two days at my \xA3180 day rate, plus \xA325 for the music.",checks:`the largest amount in the reply is from 375 to 399; contains one of: because, since, as it's, based on, works out, day, days, rate, plus, music, filming, editing; no "about", "around", "roughly" or "ish" directly before or after an amount; contains none of: or so, give or take, ish, lower, flexible, negotiable, open to, ono, less, cheaper, discount, go down, could do, at least, minimum, below, can't go, budget. Whole words, any case.`,after:["The card: a one-off job gets one precise number, with the reason behind it.",'The maths makes \xA3385 sound set by the work, not picked from the air. Say they answer: "Could you do \xA3300?" Now you can say: "I can do \xA3360 if I use a free music track instead."',`Fails: a round number like \xA3400, "about \xA3385", no reason, and anything that offers to come down before they've asked.`],modelRaw:`"\xA3385. That's two days at my \xA3180 day rate, plus \xA325 for the music."`}],mission:"this week, price one thing you could sell or one job you could do as a precise number, and write the reason you'd give."},{id:"2.4",title:"The range trick",guess:{stem:["In a study, sellers either named one bumped-up price, or gave a range that started at their real target and went a bit higher. What happened with the single bumped-up price?"],options:[{k:"A",t:"Deals about 10% better",ok:!1},{k:"B",t:"No deal nearly twice as often",ok:!0},{k:"C",t:"Rated about a third more polite",ok:!1},{k:"D",t:"No deal only half as often",ok:!1}],reveal:"no deal nearly twice as often. The range also got better final deals, and came across as no less polite."},card:{paras:[{t:"p",text:`When someone you'll deal with again asks what you want, like a manager asking your salary expectations, a regular client asking your rate or a parent asking what you charge for weekly tutoring, give a range instead of one number. Make the bottom the number you actually want, and the top a bit higher, roughly 5 to 15% more. Want \xA330 an hour? Say "\xA330 to \xA334."`},{t:"p",text:"Why it works: they use both ends of your range to guess the lowest you'd go, so their guess goes up. And offering below the bottom of your range feels rude, so they usually don't. You get more, without the take-it-or-leave-it feel of one big number."},{t:"p",text:"Which to use: for a one-off sale or job, one precise number (lesson 2.3). For pay, rates and anyone you'll deal with again, a range. One number at the top of the going rate, as in lesson 1.6, is fine; a range starting there is better."}],rows:[{label:"Say",text:`"\xA332 to \xA336 an hour, depending on the subject." \xB7 "I'm looking for \xA332,000 to \xA335,000, depending on the package." \xB7 "\xA3180 to \xA3205 a day, depending on the brief."`,subs:[]},{label:"Avoid",text:`"\xA328k to \xA332k" when you want \xA332k (they'll offer \xA328k) \xB7 very wide ranges, like "\xA330k to \xA345k" (it sounds made up, so they ignore the top) \xB7 a range when they ask your budget (lesson 1.6)`,subs:[]},{label:"Watch out",text:"expect to be offered the bottom of your range, so the bottom must be a number you'd be pleased with. The range is for when they ask what you want. When they give you a range, treat their bottom as their real offer, and reply with one number of your own. Salaries are usually said in round thousands, and that's fine here: the precise-number trick was only tested on one-off prices.",subs:[]},{label:"Evidence",text:"Backed by studies. A range starting at your target got higher final deals than one number, and came across as no less polite. A single bumped-up number ended in no deal nearly twice as often (Ames and Mason, 2015, five studies).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're a freelance photographer. A couple want an engagement shoot, and they've said they'd like you for their wedding next year if it goes well. Your target is \xA3300. They ask: "What do you charge for a shoot like this?" What's your best reply?`],quote:[],options:[{k:"A",t:'"\xA3300 to \xA3500, depending on what you want."',ok:!1},{k:"B",t:'"\xA3335 for a shoot like this, with 40 edited shots."',ok:!1},{k:"C",t:'"\xA3300 to \xA3345, depending on the edited shots."',ok:!0},{k:"D",t:'"Usually somewhere between \xA3250 and \xA3300, really."',ok:!1}],expl:{card:"The card: a repeat client gets a range: bottom at your target, top 5 to 15% higher.",items:[{k:"C",ok:!0,text:'Right. Say they ask: "Could you do \xA3315?" Now you can say: "\xA3315 if you pay the deposit this week." If they say "We hoped for \xA3250": "\xA3300 on a weekday."',subs:[]},{k:"A",ok:!1,text:"So wide it sounds made up.",subs:[]},{k:"B",ok:!1,text:"Fine for a one-off (lesson 2.3). Here, it risks no deal nearly twice as often.",subs:[]},{k:"D",ok:!1,text:"Starts below your target, so you'll get \xA3250.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["You edit videos for small businesses. A gym wants a short promo video every month, and you want \xA3380 a video. Which ranges are likely to get you more than \xA3380, and which \xA3380 or less?"],quote:[],options:[],sort:[{t:'"\xA3380 to \xA3420."',bin:"likely to get you more than \xA3380"},{t:'"\xA3340 to \xA3380."',bin:"likely to get you \xA3380 or less"},{t:'"\xA3380 to \xA3430, depending on the edits."',bin:"likely to get you more than \xA3380"},{t:'"\xA3380 to \xA3600."',bin:"likely to get you \xA3380 or less"},{t:'"Between \xA3380 and \xA3435."',bin:"likely to get you more than \xA3380"},{t:'"\xA3300 to \xA3450, depending."',bin:"likely to get you \xA3380 or less"}],expl:{card:"The card: they'll usually offer the bottom, so the bottom must be your \xA3380, with the top 5 to 15% higher.",items:[{label:"More than \xA3380",text:`the three ranges starting at \xA3380. Say the gym answers: "Could you do \xA3400?" You're haggling above your target.`,subs:[]},{label:"\xA3380 or less",text:"",subs:[`"\xA3340 to \xA3380" starts below it, so you'll be offered \xA3340.`,'"\xA3300 to \xA3450" tells them \xA3300 is fine.',`"\xA3380 to \xA3600" sounds made up, so they'll treat \xA3380 as the price.`]}]},bins:["likely to get you more than \xA3380","likely to get you \xA3380 or less"]},{n:3,fmt:"Say it",stem:[`A recruiter for a small engineering firm says: "The role pays \xA326,000 to \xA330,000." You've checked: similar roles pay up to \xA332,000, and you already use the design software they need. What's your best reply?`],quote:[],options:[{k:"A",t:'"Great, the top of that range would work well for me."',ok:!1},{k:"B",t:`"What's the most the role could stretch to?"`,ok:!1},{k:"C",t:'"Could we say \xA328,000 to \xA332,000, then?"',ok:!1},{k:"D",t:`"As I already use your software, I'm looking for \xA332,000."`,ok:!0}],expl:{card:"The card: treat the bottom of their range as their real offer, and reply with one number of your own.",items:[{k:"D",ok:!0,text:`Right. Your number sits above their top, with a reason. Say they answer: "That's above the band, but I could do \xA329,500." That's \xA33,500 over their bottom.`,subs:[]},{k:"A",ok:!1,text:"Sounds happy. You'll usually get \xA326,000 or \xA327,000.",subs:[]},{k:"B",ok:!1,text:"Asks their limit, so their answer is your ceiling.",subs:[]},{k:"C",ok:!1,text:"A range, not one number, starting at \xA328,000, so that's what you'll get.",subs:[]}]}},{n:4,fmt:"Type it",stem:['Your target for GCSE maths tutoring is \xA330 an hour. A parent wants weekly sessions and asks: "What do you charge?" Type a range that works for you.'],quote:[],options:[],model:"\xA330 to \xA334 an hour, depending on how many sessions a week.",checks:'contains two amounts joined directly by "to", "and", a hyphen or a dash (either can be written with or without \xA3); the lower is 30; the higher is from 31 to 35; every amount of 10 or more is from 30 to 35; no "about", "around" or "roughly" directly before an amount; contains none of: lower, flexible, negotiable, can go, minimum, less, budget, most you, at least, open to, offers, ono. Whole words, any case.',after:["The card: the bottom is the number you want, the top 5 to 15% higher.",'Say the parent answers: "Our last tutor was \xA325." Stay at your bottom, and give them something for it: "I can do \xA330 if we keep the same slot every week."',"Fails: a range starting below \xA330, a top well over 15% higher, like \xA340, and anything that offers to come down."],modelRaw:'"\xA330 to \xA334 an hour, depending on how many sessions a week."'}],mission:"this week, write the range you'd give for one thing you charge for, or one job you'd apply for, with the number you actually want at the bottom."},{id:"2.5",title:"Say what they get",guess:null,card:{paras:[{t:"p",text:`When they ask what you'll pay or what you charge, and you put your own number on the table, say it as what they get, not what you want. Selling: "You'd get the bike, the lock and both lights for \xA3340", not "I want \xA3340 for the bike." Buying: "I can give you \xA3180 for it", not "I'd like it for \xA3180."`},{t:"p",text:`Why it works: "I want \xA3340" makes them think about what they're losing, so they dig in. "You'd get the bike for \xA3340" makes them think about what they're getting, so they give more ground. Same number, one rewording, and you can use it in a Vinted or Marketplace message too.`},{t:"p",text:'"Could you do \xA328?" (lesson 1.1) is different: it asks them to move from their number. This is for when you put your own number down.'}],rows:[{label:"Say",text:`Selling: "You'd get the desk and the chair for \xA385." \xB7 "For \xA3460 you'd get the full site, live by Friday." \xB7 Buying: "I can give you \xA3180 for it."`,subs:[]},{label:"Avoid",text:`"I want \xA3340 for it" or "I'm looking for \xA3340" \xB7 "I'd need \xA3340" (it also sounds like your limit) \xB7 "I'd like it for \xA3180" or "Can I have it for \xA3180?" \xB7 "You'd be paying \xA3340" (it starts with "you", but it's about the money they hand over)`,subs:[]},{label:"Watch out",text:"it changes the wording, not the number. A low number worded nicely still gets a no, so the number still comes from lesson 2.1. It was tested on buying and selling, not on salaries, so for pay just say your number or rang
