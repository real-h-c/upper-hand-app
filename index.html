e plainly (lessons 1.6 and 2.4).",subs:[]},{label:"Evidence",text:"Some evidence. One research team, eight experiments with 650 people: wording an offer as what the other side gets made them give more ground, even when children were swapping cards (Tr\xF6tschel, Loschelder, H\xF6hne and Majer, 2015).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`Your new flatmate sees the desk and chair you're getting rid of and asks: "How much for both?" Sets like it have sold for \xA380 to \xA3100, and you've decided on \xA395. What's your best reply?`],quote:[],options:[{k:"A",t:`"I'm looking for \xA395 for the pair."`,ok:!1},{k:"B",t:`"You'd get the desk and chair for \xA395."`,ok:!0},{k:"C",t:`"You'd be paying \xA395 for the desk and chair."`,ok:!1},{k:"D",t:`"\xA395 for both, if that's OK with you?"`,ok:!1}],expl:{card:"The card: same number, worded as what they get, not what you want or what they hand over.",items:[{k:"B",ok:!0,text:`Right. They picture the desk and chair in their room, not their \xA395. Say they answer: "Would you do \xA385?" Now you can say: "You'd get both for \xA390, and I'll carry them up."`,subs:[]},{k:"A",ok:!1,text:`About what you want. You'll usually get: "\xA375?"`,subs:[]},{k:"C",ok:!1,text:"About the money they hand over.",subs:[]},{k:"D",ok:!1,text:`Makes no the easy answer (lesson 1.1). You'll usually get: "\xA370?"`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're after a PS5 on Marketplace, listed at \xA3320. Similar ones have sold for \xA3260 to \xA3300, and you've decided on \xA3270. You message, and the seller replies: "Make me an offer." What's your best message?`],quote:[],options:[{k:"A",t:'"I can pay you \xA3270, and collect it today."',ok:!0},{k:"B",t:`"I'd like to get it for \xA3270, and I can collect today."`,ok:!1},{k:"C",t:`"I know it's \xA350 under, but would \xA3270 work?"`,ok:!1},{k:"D",t:'"\xA3270 would be my max for it, to be honest."',ok:!1}],expl:{card:"The card: when you're buying and put your number down, the money is what you're offering, so lead with it.",items:[{k:"A",ok:!0,text:`Right. It's about the \xA3270 they get. Say they reply: "It's \xA3320, end of." The wording hasn't moved them, so leave it there: "Fair enough. If it doesn't sell, my \xA3270 stands."`,subs:[]},{k:"B",ok:!1,text:"Same extras, but about what you want: their PS5.",subs:[]},{k:"C",ok:!1,text:"Reminds them of the \xA350 they're losing.",subs:[]},{k:"D",ok:!1,text:"Tells them your limit, so you've nowhere to go.",subs:[]}]}},{n:3,fmt:"Type it",stem:["A caf\xE9 asks your price for designing their new menu, a one-off job. You've decided on \xA3185, including two rounds of changes. Type your price, worded as what they get."],quote:[],options:[],model:"You'd get the full menu design, plus two rounds of changes, for \xA3185.",checks:"every \xA3 amount is \xA3185 and there is at least one; contains one of: you'd get, you get, you'll get, you would get, you will get, you can have, you'd have, you'll have, you're getting, you'd be getting, gets you, get you, I can give you, I'll give you, I can do you; contains none of: I want, I'd want, I'm looking for, looking for, I need, I'd need, I'd like, I'd charge, I charge, my price is, paying, you'd pay, you'll pay, you pay, pay me, cost you, costs you, it'll cost, charge you, at least, minimum, lowest, flexible, negotiable, ono, open to, if that's ok, if that's okay, is that ok, is that okay, alright, if that works, less, lower, discount. Whole words, any case.",after:["The card: say it as what they get, not what you want or what they'll pay.",`The model answer has them picturing the finished menu. Say they answer: "Could you do \xA3150?" Keep the wording: "For \xA3165 you'd get the design with one round of changes."`,`Fails: "I'm looking for", "I'd charge", "it'll cost you", "you'd be paying", and anything that hedges ("if that's OK", "is that alright?").`],modelRaw:`"You'd get the full menu design, plus two rounds of changes, for \xA3185."`},{n:4,fmt:"Say it",stem:[`A neighbour sees your road bike in the hall and asks: "What would you want for it?" It comes with lights and a lock, and similar bikes have sold for \xA3290 to \xA3350 on eBay. What's your best reply?`],quote:[],options:[{k:"A",t:`"You'd get the bike, lights and lock for \xA3305."`,ok:!1},{k:"B",t:`"I'm after \xA3345 for the bike, lights and lock."`,ok:!1},{k:"C",t:'"What would you want to pay for it, roughly?"',ok:!1},{k:"D",t:`"You'd get the bike, lights and lock for \xA3345."`,ok:!0}],expl:{card:"The card: the wording changes how they hear your number, not the number, which still comes from lesson 2.1.",items:[{k:"D",ok:!0,text:`Right. A top-end number, worded as what they get. Say they answer: "Would you do \xA3300?" Now you can say: "You'd get all three for \xA3330. The lock alone was \xA340."`,subs:[]},{k:"A",ok:!1,text:"Right wording, mid-range number. You'll usually end up near \xA3280.",subs:[]},{k:"B",ok:!1,text:"Right number, worded as what you want.",subs:[]},{k:"C",ok:!1,text:"Lets them go first when you know the price (lesson 2.1).",subs:[]}]}}],mission:`this week, rewrite one listing, quote or offer you've sent before as "You'd get\u2026 for \xA3\u2026" or "I can give you \xA3\u2026 for\u2026".`},{id:"2.6",title:'The fake "normally" price',guess:null,card:{paras:[{t:"p",text:"This one works both ways: you can use it, and you need to spot it."},{t:"p",text:`Use it: for one-off sales and one-off jobs, say a higher number first, then come down from it in the same breath: "I normally charge \xA3120 to clear a garden, but as it's a small one I can do \xA395." The higher number still pulls their thinking up, even though you've just taken it back, and your real price feels like a discount you've already given. Use a price you really do charge, so it holds up if they check. For pay, and anyone you'll deal with again, use a range instead (lesson 2.4).`},{t:"p",text:`Spot it: sellers do this to you all the time. "These normally go for \xA390, but I'll do \xA370 for you." Mentally delete the first number: it isn't an offer, it's there to make \xA370 feel cheap. Judge \xA370 against what it really sells for, and reply with your own number. If the higher number is something you can't check, ask where it's from.`}],rows:[{label:"Say",text:`Using it: "My usual price for a full valet is \xA385, but as it's a small car I can do \xA370." \xB7 Spotting it: "I've seen them sell for \xA355. I can give you \xA352." \xB7 If you can't check their number: "Where's the \xA390 from?"`,subs:[]},{label:"Avoid",text:"",subs:[`a "normal" price you don't really charge (it falls apart the moment they check)`,`"It's usually \xA360, but I could go a bit lower" (you've taken the high number back without putting a real one down, so they pick the amount)`,`when it's used on you: "That's a good discount, then" (you've let their higher number decide what counts as cheap)`]},{label:"Watch out",text:"done baldly, it can make you look manipulative. What stops it looking like a trick is the drop being a real favour, for a reason they can see is true, like a group booking or a small job.",subs:[]},{label:"Evidence",text:"Backed by studies. Mentioning a higher number, then taking it back, got better final deals for the person doing it across five studies. It also made them look more manipulative, unless the drop came across as a genuine favour (Bhatia and Gunia, 2018).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["Someone on your street asks what you'd charge to service their bike, a one-off job. You normally charge \xA360 for a full service, and as they're on your street, you'd happily do \xA348. What's your best reply?"],quote:[],options:[{k:"A",t:'"I can do a full service for \xA348 this week."',ok:!1},{k:"B",t:`"It's usually \xA360, but I could go a bit lower."`,ok:!1},{k:"C",t:`"Normally \xA360, but as you're on my street, \xA348."`,ok:!0},{k:"D",t:'"Normally \xA360, but whatever you can afford, really."',ok:!1}],expl:{card:"The card: say your real normal price first, then come down with a reason they can see is true.",items:[{k:"C",ok:!0,text:'Right. \xA360 sets the scale, so \xA348 feels like a favour. If they push for \xA340, the \xA360 is still in their head: "\xA345 if you drop it round before 9."',subs:[]},{k:"A",ok:!1,text:"With no \xA360, they haggle down from \xA348.",subs:[]},{k:"B",ok:!1,text:"No real price, so they pick the amount.",subs:[]},{k:"D",ok:!1,text:`Hands them the choice. You'll usually get: "\xA330?"`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're buying a used Dyson Airwrap on Marketplace. The seller messages: "These are \xA3480 new, so \xA3300 is a steal." You've checked: used ones have sold for \xA3220 to \xA3260. What's your best reply?`],quote:[],options:[{k:"A",t:'"\xA3300 is a good discount. Could you do \xA3280?"',ok:!1},{k:"B",t:`"I've seen one sell for \xA3230. I can give you \xA3225."`,ok:!0},{k:"C",t:`"Where's the \xA3480 from?"`,ok:!1},{k:"D",t:'"Still a lot for a used one. Any chance of a discount?"',ok:!1}],expl:{card:"The card: delete their higher number and reply with your own. Ask where it's from only if you can't check it.",items:[{k:"B",ok:!0,text:`Right. It starts from used prices. Say they reply: "No, \xA3300's a steal." Don't argue: "Fair enough. If it's still there next week, I'm still at \xA3225."`,subs:[]},{k:"A",ok:!1,text:"Lets \xA3480 decide what's cheap, so you'll settle near \xA3280.",subs:[]},{k:"C",ok:!1,text:`You can check this one: you'll get "Dyson's website."`,subs:[]},{k:"D",ok:!1,text:"A hint with an easy no (lesson 1.1).",subs:[]}]}},{n:3,fmt:"Type it",stem:[`At a used car dealer, the salesperson says: "This Corsa was \xA37,995 last week, but I can do it for \xA37,495 today." You've checked: similar Corsas are selling at dealers for \xA36,800 to \xA37,200. Type your reply.`],quote:[],options:[],model:"Similar Corsas are listed from \xA36,800. I can give you \xA36,850.",checks:"the last \xA3 amount is from 6,800 to 6,950; 25 words or fewer; contains none of: halfway, middle, meet in, split, discount, a bit more, a bit less, lowest, best price, best you, your best, most you, at least, minimum, can't go, cant go, below, I need, I'd need. Whole words, any case.",after:["The card: delete their higher number. \xA37,995 isn't an offer: it's there to make \xA37,495 feel cheap.",`Say he answers: "I can't go under \xA37,200." Now you're haggling at the top of the market, not \xA3500 off a price nobody's paying: "\xA36,980, and I'll take it this afternoon."`,'Fails: treating \xA37,495 as a good deal ("discount", "halfway"), a number below \xA36,800 or above \xA36,950, and asking for his best price.'],modelRaw:'"Similar Corsas are listed from \xA36,800. I can give you \xA36,850."'},{n:4,fmt:"Type it",stem:["You charge \xA395 for a headshot session. A student society wants a one-off shoot of headshots for all ten committee members, and you'd happily do \xA375 each, since it's ten in one afternoon. Type your reply, using your normal price."],quote:[],options:[],model:"I normally charge \xA395 a session, but as it's ten of you in one go, I can do \xA375 each.",checks:"contains one of: normally, usually, normal, usual, standard, typically; the first \xA3 amount is \xA395; contains \xA375; no other \xA3 amount under 95; contains one of: as, since, because, ten, 10, all, group, committee, society, one go, afternoon, together, block, bulk, whole; contains none of: flexible, negotiable, open to, ono, lower, whatever, afford, budget, maybe, at least, minimum, lowest, can't go, below, about \xA3, around \xA3, roughly \xA3, less. Whole words, any case.",after:["The card: your real normal price first, then the drop, with a reason they can see is true.",'The model answer makes \xA375 feel like a group discount, because it is one. Say they answer: "Could you do \xA365?" The \xA395 is still in their head: "\xA370 each if you pay before the shoot."',`Fails: no normal price, a drop with no reason, a "normal" price that isn't your \xA395, and anything that leaves the amount to them ("whatever your budget is").`],modelRaw:`"I normally charge \xA395 a session, but as it's ten of you in one go, I can do \xA375 each."`}],mission:`this week, spot one "was \xA3X, now \xA3Y" or "normally \xA3X" price (a shop, a listing, an advert), cross out the first number and write what you'd offer based on what it actually sells for.`},{id:"2.7",title:"Create competition, and test theirs",guess:null,card:{paras:[{t:"p",text:`Create it: when you're selling something second-hand, let buyers see that other people want it. People want things more when others are after them, and a buyer who thinks someone else might get there first haggles less. Book viewings close together (6, 6.15, 6.30) so buyers cross paths, and when someone really is booked, say so: "Someone's coming to see it at 7, so I can't hold it." Only use interest you've really got: if they ask "Who's the other buyer?" and there isn't one, you've lost them and your price. If someone asks "Any other offers?" and you've had none, use "What makes you ask?" (lesson 1.6).`},{t:"p",text:`Test theirs: when a seller says "Someone's offered me more", or a buyer says "I can get one cheaper elsewhere", ask for a detail a real buyer or listing would have and a made-up one wouldn't. A vague answer ("He said he'd let me know") means you make your offer as planned, without adding to it. A specific one ("He's coming at 10 with cash") means it's probably real: decide now, or let it go.`}],rows:[{label:"Say",text:`Selling: "Someone's coming to see it at 7, so I can't hold it." \xB7 Testing a seller: "When are they collecting it?" \xB7 "Who's the offer from?" \xB7 "When do you expect to hear back from them?" \xB7 Testing a buyer: "Can you send me the link?"`,subs:[]},{label:"Avoid",text:`"Loads of people want it" when nobody's asked (one "Who?" and it falls apart) \xB7 "Really? I don't believe you" (it starts a row, and they dig in to prove it) \xB7 raising your offer the moment they mention someone else`,subs:[]},{label:"Watch out",text:"testing their claim only works if you're ready to let it go when the other buyer turns out to be real.",subs:[]},{label:"Evidence",text:`Pro trick. Getting a second bidder interested so others follow is standard when companies are sold (a London Business School lecture on Robert Cialdini's "social proof"), but it hasn't been tested on second-hand sales. People tend to overrate long-shot alternatives and turn down good offers because of them (Pinkley and colleagues, 2019, three studies), and asking when they expect to hear is the check Harvard's Program on Negotiation suggests. The detail test itself hasn't been studied.`,subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You're selling your Xbox Series X on Marketplace for \xA3290, and three people messaged in the last hour. You've booked the first two to view at 6 and 6.30 tonight. What do you send the third?"],quote:[],options:[{k:"A",t:'"People are coming at 6 and 6.30. Could you do 6.15?"',ok:!0},{k:"B",t:'"Still available! When suits you to come and see it?"',ok:!1},{k:"C",t:'"Loads of people want it, so make me your best offer."',ok:!1},{k:"D",t:'"Yes, still available. Would \xA3270 help you decide?"',ok:!1}],expl:{card:"The card: let buyers see that others want it, using interest you've really got.",items:[{k:"A",ok:!0,text:`Right. True, and they're not the only one. Say the 6.15 buyer passes the 6 o'clock and asks: "Would you take \xA3250?" Now you can say: "Someone's coming at 6.30, so I'll stay at \xA3290."`,subs:[]},{k:"B",ok:!1,text:"Lets them pick any time, so they won't see another buyer.",subs:[]},{k:"C",ok:!1,text:"Sounds made up, and asks them to go first.",subs:[]},{k:"D",ok:!1,text:"Gives away \xA320 before anyone's seen it.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're buying a used VW Golf from a private seller. It's listed at \xA36,450, and you've offered \xA35,890. The seller replies: "Someone else has offered me \xA36,300, so I can't do \xA35,890." What's your best reply?`],quote:[],options:[{k:"A",t:'"OK, I could stretch to \xA36,300 as well, then."',ok:!1},{k:"B",t:`"Really? I don't believe that for a second."`,ok:!1},{k:"C",t:`"Then why haven't you sold it to them?"`,ok:!1},{k:"D",t:'"When are they coming to pick it up?"',ok:!0}],expl:{card:"The card: test their claim with a detail a real buyer would have.",items:[{k:"D",ok:!0,text:`Right. Real buyers have a time. Say they answer: "Er, he said he'd let me know." That's a maybe: "My \xA35,890 stands." If it's "Tomorrow at 10, with cash", it's probably real: decide now, or let it go.`,subs:[]},{k:"A",ok:!1,text:"\xA3410 more, for a buyer who might not exist.",subs:[]},{k:"B",ok:!1,text:"Calls them a liar, so they dig in.",subs:[]},{k:"C",ok:!1,text:'"Why" sounds like a challenge (lesson 1.3).',subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're selling your camera on Marketplace for \xA3340. Someone's booked to see it tomorrow at 10. Another buyer messages: "Have you had any other offers?" What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!1},{k:"B",t:'"No offers yet, but a few people have asked."',ok:!1},{k:"C",t:`"Someone's seeing it at 10 tomorrow, so be quick."`,ok:!0},{k:"D",t:`"Loads of interest, so you'd better be quick, mate!"`,ok:!1}],expl:{card:`The card: use interest you've really got. "What makes you ask?" (lesson 1.6) is for when you've had none.`,items:[{k:"C",ok:!0,text:`Right. True and specific. Say they answer: "Could I come tonight, for \xA3320?" Now you can say: "Tonight works, at \xA3335." If they say "I'll wait", you've still got the 10 o'clock.`,subs:[]},{k:"A",ok:!1,text:"Hides the one fact working for you.",subs:[]},{k:"B",ok:!1,text:"Tells them nobody's put money down, so they'll offer low.",subs:[]},{k:"D",ok:!1,text:"Vague, so it sounds made up.",subs:[]}]}},{n:4,fmt:"Type it",stem:["You're selling your gaming monitor for \xA3240. A buyer who's come to see it offers \xA3190. Someone else is booked to see it at 7 tonight. Type your reply."],quote:[],options:[],model:"Someone's coming to see it at 7, so I can't do \xA3190. I can do \xA3235.",checks:"contains one of: someone, somebody, another, other, else, viewer, viewing, booked, coming; at least one amount from 220 to 240; every amount of 100 or more except 190 is from 220 to 240; contains none of: loads, lots of people, everyone, lowest, at least, minimum, below, lower, can't go, cant go, less than, no less, best offer, highest, most you, your best, I need, I'd need. Whole words, any case.",after:["The card: when someone really is booked, say so. It's the one fact that stops a buyer offering low.",`Say they answer: "OK, \xA3220 and I'll take it now." That's \xA330 more than their first offer, because the 7 o'clock is real. Now you can say: "\xA3232 and it's yours."`,'Fails: accepting \xA3190, a vague "loads of people want it", a number below \xA3220, and anything that tells them your limit.'],modelRaw:`"Someone's coming to see it at 7, so I can't do \xA3190. I can do \xA3235."`},{n:5,fmt:"Type it",stem:[`You're selling your AirPods Pro on Vinted for \xA3120. A buyer messages: "I can get the same ones for \xA390 elsewhere." Type a reply that tests whether that's real.`],quote:[],options:[],model:"Oh, which listing? Can you send me the link?",checks:"contains one of: link, listing, send, show, screenshot, where, which; no \xA3 and no number over 9; 20 words or fewer; contains none of: why, really, liar, lying, lie, bs, rubbish, believe, doubt, fake, scam, sure you can, offer, offers, lowest, best price, most you, match, ok then, okay then, go for it, buy them, buy those, buy that, get them then, get those then. Whole words, any case.",after:["The card: ask for a detail a real listing would have. A real cheaper listing takes ten seconds to send.",`Say they send it, and it's a used pair with no case: "Those have no case. Mine are boxed, with the receipt: \xA3115." If it's the same pair, in the same condition, for \xA390, it's real: decide whether to match it or let them go.`,`Fails: arguing ("Really?", "They're fake"), matching their \xA390 straight away, and naming a number.`],modelRaw:'"Oh, which listing? Can you send me the link?"'}],mission:'this week, pick one "selling fast", "only 2 left" or "loads of interest" claim you see or hear, and write the one question that would test it.'}]},{n:3,title:"Haggling Moves",tagline:"What to say back to their number, how to move yours, and how to close.",lessons:[{id:"3.1",title:"Never give something for nothing",guess:null,card:{paras:[{t:"p",text:`When someone asks you for something extra, like holding an item till payday, dropping it round, a bit of extra work or moving in a week early, don't just say yes. Give it only in return for something you want, and say the condition as you agree: "If you\u2026, then I\u2026". A favour you give for free teaches them that pushing works, so they usually push for more. With a condition on it, every extra costs them something. Pick a condition that's worth something to you, like money up front, an intro to a new client or a day off. If you can't think what you want, make them name it: "If I can do that, what can you do for me?"`},{t:"p",text:"Put the condition in the same sentence as your yes. Once you've said yes on its own, you've nothing left to trade."}],rows:[{label:"Say",text:`"If you can collect by Thursday, I can do \xA3185." \xB7 "If you can send all your changes in one email, I'll do a third round." \xB7 If you don't know what to ask for: "If I can do that, what can you do for me?"`,subs:[]},{label:"Avoid",text:'"Sure, no problem!" \xB7 "I can do that, if it helps?" (the "if" asks nothing of them) \xB7 "Yes! Could you maybe add a bit for petrol?" (yes first, then the ask) \xB7 "Happy to, and hopefully you can collect soon." (a hope, not a condition)',subs:[]},{label:"Watch out",text:"on price, you don't always need a condition. When you're swapping numbers and they've just come up, a smaller move of your own is already a trade, your move for theirs (lesson 3.3). And with friends and flatmates, don't put a condition on every small favour: it makes everything feel like a deal.",subs:[]},{label:"Evidence",text:`Some evidence. A review of 34 studies found that people who bargain softly did best when they matched the other side's moves, rather than giving more (H\xFCffmeier and colleagues, 2014). The "If you\u2026, then I\u2026" wording is a Pro trick (Gavin Kennedy; Roger Dawson), never tested.`,subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're selling your Nintendo Switch on Marketplace for \xA3180. A buyer messages: "I definitely want it, but I don't get paid till Friday. Could you hold it for me?" Two other people have asked if it's still available. What's your best reply?`],quote:[],options:[{k:"A",t:`"Sure, no problem. I'll keep it for you till Friday."`,ok:!1},{k:"B",t:`"Sure, I'll hold it. Could you send a \xA320 deposit to be safe?"`,ok:!1},{k:"C",t:`"If you can send a \xA320 deposit now, I'll hold it till Friday."`,ok:!0},{k:"D",t:`"If you're definitely sure you want it, I'll hold it till Friday."`,ok:!1}],expl:{card:"The card: say what you want back, in the same sentence as your yes.",items:[{k:"C",ok:!0,text:`Right. Holding it could cost you two other buyers, so the deposit is your price for that. Say they answer: "Sent, see you Friday." Now you can say: "Lovely, it's yours till Friday."`,subs:[]},{k:"A",ok:!1,text:"Gives the hold away for nothing, with two other buyers waiting.",subs:[]},{k:"B",ok:!1,text:`Yes first, then the ask. You'll usually get: "Can I just pay Friday?"`,subs:[]},{k:"D",ok:!1,text:`The "if" asks for nothing new. You'll usually get "100%!", and hold it free.`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You photographed a hair salon's new look for its website for \xA3150, and the owner has paid. You're building up your photography, and what you need most right now is new clients. She's mentioned her brother is opening a barbershop next month. She messages: "Love them! Could you edit a couple more for Instagram too?" That's about half an hour's work. What's your best reply?`],quote:[],options:[{k:"A",t:'"If I can fit that in, what could you do for me?"',ok:!1},{k:"B",t:'"Of course! An intro to your brother would be amazing if you get a sec."',ok:!1},{k:"C",t:`"Happy to, as long as you're happy with the website ones first."`,ok:!1},{k:"D",t:`"If you can put me in touch with your brother, I'll do the Instagram ones."`,ok:!0}],expl:{card:"The card: give an extra only for something you want. Here that's an intro.",items:[{k:"D",ok:!0,text:`Right. Half an hour's work for a lead on a new job. Say she answers: "Deal, I'll message him tonight." If she says "He's sorting his own", keep the trade: "No problem. The edits are \xA325, then."`,subs:[]},{k:"A",ok:!1,text:`The line for when you don't know what you want. She'll offer: "Free blow-dry next time?"`,subs:[]},{k:"B",ok:!1,text:"Yes first, then a hope: you'll usually get no intro.",subs:[]},{k:"C",ok:!1,text:'The "if" asks nothing: she already loves them.',subs:[]}]}},{n:3,fmt:"Sort it",stem:[`You work part-time in a caf\xE9. Your manager asks: "Could you cover Saturday? Someone's called in sick." You're free, and you'd love next Monday off for a gig on Sunday night. Which replies trade Saturday for something, and which give it for nothing?`],quote:[],options:[],sort:[{t:'"If I cover Saturday, could I have Monday off?"',bin:"trades it"},{t:'"Yeah, no problem, happy to help!"',bin:"gives it for nothing"},{t:'"I can do it, if that helps you out?"',bin:"gives it for nothing"},{t:`"Saturday's fine, as long as I can have Monday off."`,bin:"trades it"},{t:'"Sure. Could I maybe have a Monday off sometime?"',bin:"gives it for nothing"},{t:`"If you can give me Monday off, I'm in for Saturday."`,bin:"trades it"}],expl:{card:"The card: give it only in return, in the same sentence as your yes.",items:[{label:"Trades it",text:`"If I cover Saturday\u2026", "as long as\u2026" and "If you can give me Monday off\u2026" each tie Saturday to Monday. Say she answers: "Deal, you're off Monday."`,subs:[]},{label:"Gives it for nothing",text:"",subs:['"Happy to help!" just hands over Saturday.','"If that helps you out?" is the trap: an "if" that asks nothing of her.',`"Could I maybe\u2026?" comes after the yes, so she can put it off: "I'll look at the rota."`]}]},bins:["trades it","gives it for nothing"]},{n:4,fmt:"Say it",stem:[`You've agreed to rent a flat from the 1st at \xA31,050 a month. The letting agent rings: "The landlord's going abroad on the 25th and wants to hand you the keys himself. Could you move in on the 24th?" You could move a week early without any trouble. What's your best reply?`],quote:[],options:[{k:"A",t:'"If it helps him out, the 24th is no problem."',ok:!1},{k:"B",t:`"The 24th's fine, as long as the rent starts on the 1st."`,ok:!0},{k:"C",t:`"I could, but it'd be a bit of a hassle, to be honest."`,ok:!1},{k:"D",t:`"Sure, the 24th's fine. Would he take a bit off the first month?"`,ok:!1}],expl:{card:"The card: give an extra only in return, with the condition in your yes.",items:[{k:"B",ok:!0,text:`Right. Moving early costs you nothing; a free week's rent is about \xA3240. Say they answer: "He can't do a free week, but he'll take \xA3100 off." That's \xA3100 for something you'd have done anyway.`,subs:[]},{k:"A",ok:!1,text:`The "if" asks nothing of him: a week's rent, given away.`,subs:[]},{k:"C",ok:!1,text:`A hint, not an ask (lesson 1.1). You'll usually get: "Brilliant, I'll tell him."`,subs:[]},{k:"D",ok:!1,text:`Asking after the yes lets him say: "I wouldn't count on it."`,subs:[]}]}},{n:5,fmt:"Type it",stem:[`You've sold a chest of drawers on Marketplace for \xA360. The buyer messages: "Could you drop it round? I'm only 15 minutes away and I don't drive." It'd cost you about \xA38 in petrol. Type a reply that agrees to drop it round, but only in return for petrol money.`],quote:[],options:[],model:"If you can add \xA310 for petrol, I'll drop it round on Saturday.",checks:"contains one of: if, as long as, so long as, provided, providing, plus, and I'll, for an extra, delivered, for \xA3, all in, in total; contains one of: drop, deliver, delivery, bring, round, over; contains an amount with \xA3 in front or quid/pounds after, from 5 to 30 or 65 to 95, or one of: fiver, tenner, petrol, fuel; contains none of: could you, can you, would you, maybe, possibly, if that helps, if it helps, if that's ok, if that's okay, if that works, if that's alright, if you want, if you like, if not, hopefully, no worries, free, no charge, don't suppose, any chance, sorry, I'll cover, on me; 25 words or fewer. Whole words, any case.",after:["The card: give an extra only in return for something, and say the condition as you agree.",`The model answer covers your petrol, with a bit for your time. Say they answer: "Deal, see you Saturday." Now you're getting \xA370, and the trip's paid for.`,'Fails: a plain yes, yes first and then asking for petrol ("Could you add\u2026?"), and an "if" that asks nothing of them ("if that helps").'],modelRaw:`"If you can add \xA310 for petrol, I'll drop it round on Saturday."`}],mission:`write down three things people often ask of you (a lift, an extra shift, holding something you're selling), and next to each, an "If you\u2026, then I\u2026" line asking for something you'd actually want back. Use one this week.`},{id:"3.2",title:'"How much better, exactly?"',guess:null,card:{paras:[{t:"p",text:`When you've made an offer, on a used car, a salary or a Vinted sale, and they reply "You'll have to do better than that", "That's a bit low" or just "Hmm", don't make a better offer yet. Many people fill the gap by raising their own offer, and get nothing back for it. Sales trainers teach this line on purpose for exactly that reason (Roger Dawson calls it the vise). Instead, make them say what "better" means, as a number: "How much better, exactly?"`},{t:"p",text:`This isn't asking for their lowest. "What's the lowest you'd take?" makes their answer your limit. You're asking for their next offer, so the deal usually lands somewhere between your number and theirs.`}],rows:[{label:"Say",text:`"How much better, exactly?" \xB7 "What number did you have in mind?" \xB7 "I've made my offer. What are you proposing?"`,subs:[]},{label:"Avoid",text:`"OK, how about \xA350 more?" \xB7 "I could go a bit higher." \xB7 "What's the lowest you'd take, then?"`,subs:[]},{label:"Watch out",text:`if they come back with a new number ("You'll have to do better. I'd take \xA3280"), don't ask. Just make a small move (lesson 3.3). An old number from before your last offer doesn't count. If they won't name one ("You tell me"), stay where you are: "I'm happy at \xA3550. If you want to suggest a number, I'm listening."`,subs:[]},{label:"Evidence",text:'Pro trick (Roger Dawson; Herb Cohen calls it "the crunch"; Deepak Malhotra and Chris Voss teach the same rule). Never tested.',subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're buying a gaming PC on Marketplace, listed at \xA3700. Similar ones have sold for \xA3550 to \xA3650, and you'd go up to \xA3620. You offer \xA3550, and the seller says: "You'll have to do better than that." What's your best reply?`],quote:[],options:[{k:"A",t:'"OK, how about \xA3600 then?"',ok:!1},{k:"B",t:'"How much better, exactly?"',ok:!0},{k:"C",t:`"What's the lowest you'd take, then?"`,ok:!1},{k:"D",t:'"Sorry, \xA3550 is honestly the most I can do."',ok:!1}],expl:{card:'The card: when they say "do better" without a number, make them name one.',items:[{k:"B",ok:!0,text:`Right. Say they answer: "\xA3650 and it's yours." Now the deal will usually land between \xA3550 and \xA3650, and you can move up in small steps: "I can do \xA3570." If they say "You tell me", stay put: "I'm happy at \xA3550."`,subs:[]},{k:"A",ok:!1,text:"Raises your offer before they've moved: \xA350 for one sentence.",subs:[]},{k:"C",ok:!1,text:"Asks for their lowest. They'll usually say about \xA3680.",subs:[]},{k:"D",ok:!1,text:"Claims a limit you'd break, since you'd go to \xA3620.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`In a job interview at a small design studio, you've asked for \xA331,000. Similar roles pay \xA328,000 to \xA331,000. The hiring manager says: "That's a bit more than we were thinking." What's your best reply?`],quote:[],options:[{k:"A",t:'"Would \xA330,000 work better for you?"',ok:!1},{k:"B",t:`"I'm flexible, I just really want the role."`,ok:!1},{k:"C",t:'"How far off are we?"',ok:!0},{k:"D",t:`"I understand. What's the most you could stretch to?"`,ok:!1}],expl:{card:'The card: "a bit more than we were thinking" is a "do better" with no number. Get the number first.',items:[{k:"C",ok:!0,text:'Right. It makes them say how big the gap is. Say they answer: "We were thinking more like \xA329,000." Now you can make a small move: "Could we look at \xA330,500?"',subs:[]},{k:"A",ok:!1,text:"Drops \xA31,000 before they've said a figure.",subs:[]},{k:"B",ok:!1,text:"Tells them you'll take less, so they'll usually offer less.",subs:[]},{k:"D",ok:!1,text:"Asks for their limit. They'll name a low figure, and you can't ask above it.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're selling a pair of Salomon trainers on Vinted, listed at \xA375. A buyer offers \xA350. You reply: "I can do \xA368." They message back: "Hmm \u{1F914}". What's your best next message?`],quote:[],options:[{k:"A",t:'"OK, \xA362 then?"',ok:!1},{k:"B",t:'"I could do a bit less if you buy today?"',ok:!1},{k:"C",t:'"Sorry, I know \xA368 is a lot for used ones."',ok:!1},{k:"D",t:`"I'm at \xA368. What could you do?"`,ok:!0}],expl:{card:`The card: a "Hmm" isn't a number. Don't move until they name one.`,items:[{k:"D",ok:!0,text:`Right. They offered \xA350 earlier, but they haven't moved since your \xA368, and "Hmm" isn't a new number. Say they reply: "Would you do \xA360?" Now one small move closes it: "I can do \xA365."`,subs:[]},{k:"A",ok:!1,text:"Drops \xA36 because of an emoji.",subs:[]},{k:"B",ok:!1,text:"Tells them you'll go lower before they've offered anything, so they'll wait for it.",subs:[]},{k:"C",ok:!1,text:`Apologising tells them it's too high. You'll usually get: "Yeah, would you do \xA350?"`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're buying a used Garmin watch on Marketplace, listed at \xA3200. Similar ones have sold for \xA3140 to \xA3180. You offered \xA3140, and the seller replies: "You'll have to do better than that. I'd take \xA3180." What's your best reply?`],quote:[],options:[{k:"A",t:'"I can do \xA3150."',ok:!0},{k:"B",t:'"How much better, exactly?"',ok:!1},{k:"C",t:'"I can do \xA3170."',ok:!1},{k:"D",t:'"Is \xA3180 really the best you can do?"',ok:!1}],expl:{card:"The card: ask only when they haven't named a number. They have, so make a small move (lesson 3.3).",items:[{k:"A",ok:!0,text:'Right. A small step, keeping most of the gap on their side. Say they answer: "\xA3170?" Now move by less: "I can do \xA3156."',subs:[]},{k:"B",ok:!1,text:`The card's line, but they've just said \xA3180. You'll usually get: "I just said, \xA3180."`,subs:[]},{k:"C",ok:!1,text:`Gives up \xA330 of the \xA340 gap at once. You'll usually get: "Go on, \xA3175."`,subs:[]},{k:"D",ok:!1,text:`Asks them to judge their own price. You'll usually get: "Yep, \xA3180."`,subs:[]}]}},{n:5,fmt:"Type it",stem:[`You've offered \xA31,400 for a used Vespa on Marketplace. Similar ones have sold for \xA31,400 to \xA31,700. The seller replies: "You'll have to do better than that." Type a reply that makes them name a number, without raising yours.`],quote:[],options:[],model:"What number did you have in mind?",checks:`no amount other than 1,400 (with or without \xA3 or a comma); contains one of: what, how much, how far, in mind, where, which, number, figure; contains none of: lowest, least, bottom, minimum, the most, max, best price, your best, best you can do, cheapest, accept, a bit more, bit more, little more, bit higher, more like, I could, I can, I'll, if I, go up, sorry, budget, afford; ends with "?"; 15 words or fewer. Whole words, any case.`,after:[`The card: don't raise your own offer. Make them say what "better" means, in pounds.`,`The model answer gets their number on the table. Say they answer: "\xA31,700." Now the deal will usually land between \xA31,400 and \xA31,700, and you can move up in small steps: "I can do \xA31,450." If they say "You tell me", stay at \xA31,400: "I'm happy at \xA31,400. What would work for you?"`,'Fails: any new number, "a bit more", and asking for their lowest.'],modelRaw:'"What number did you have in mind?"'}],mission:'say "How much better, exactly?" out loud five times this week, until it sounds calm and curious rather than defensive.'},{id:"3.3",title:"The shrinking ladder",guess:null,card:{paras:[{t:"p",text:"When you're haggling back and forth, like selling your car or buying a laptop on Marketplace, make each move smaller than the one before. Selling, that's down \xA3200, then \xA380, then \xA330 (buying, the same but going up). Shrinking moves tell them you're nearly out of room, so they stop pushing as hard. Moves of the same size tell them another one's coming. A big move late on tells them you've got loads left. Most people don't do this naturally."},{t:"p",text:"Only move after they've moved. If they haven't, ask what they can do (lesson 3.2)."},{t:"p",text:`Finish on a precise number (\xA33,688, not \xA33,700) with a small extra that isn't money, like the roof bars or collecting whenever suits them. Chris Voss ends his "Ackerman plan" exactly like this: it looks like you've scraped together everything you've got.`}],rows:[{label:"Say",text:`(selling, listed at \xA3600) "I can do \xA3560." Then "\xA3540." Then "\xA3532, and I'll throw in the stand."`,subs:[]},{label:"Avoid",text:'the same drop every time (\xA350, \xA350, \xA350) \xB7 jumping straight to your lowest \xB7 "I might be able to go a bit lower."',subs:[]},{label:"Watch out",text:"it works on you too. When their drops shrink and they add a freebie, it doesn't mean they're at their limit: they may be doing it on purpose. Judge their price against the target you wrote down before you started (lesson 2.2), not against the pattern.",subs:[]},{label:"Evidence",text:"Backed by studies (Tey, Schaerer, Madan and Swaab, 2021, seven studies, 2,311 people): people facing shrinking moves thought the other side was closer to their limit than they really were, and pushed less. People who'd set a target beforehand weren't fooled. Ending with a non-money extra is a Pro trick (Chris Voss), never tested.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You're selling your 2014 Toyota Yaris, listed at \xA34,000. You'd take \xA33,500 at a push. You've already come down \xA3150 to \xA33,850, and the buyer has come up to \xA33,550. What's your best next move?"],quote:[],options:[{k:"A",t:'"OK, I can do \xA33,700."',ok:!1},{k:"B",t:`"Go on then, \xA33,550. You've got a deal."`,ok:!1},{k:"C",t:'"I could maybe go a bit lower, let me think."',ok:!1},{k:"D",t:'"I can do \xA33,790."',ok:!0}],expl:{card:"The card: make each move smaller than the last, so it looks like you're nearly out of room.",items:[{k:"D",ok:!0,text:'Right. It drops \xA360, well under your last drop of \xA3150. Say they come back: "Meet me at \xA33,650?" Drop by less again: "\xA33,765, and you can have the roof bars."',subs:[]},{k:"A",ok:!1,text:"The same \xA3150 drop again, so they'll wait for the next one.",subs:[]},{k:"B",ok:!1,text:"A \xA3300 jump to their number says you had plenty of room.",subs:[]},{k:"C",ok:!1,text:"Says there's more room, but not how much, so they'll keep pushing.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're buying a used MacBook. Similar ones sell for \xA3440 to \xA3470, you wrote down \xA3450 as your target, and you've offered \xA3430. The seller has gone from \xA3600 to \xA3520, then \xA3490, then: "\xA3482, and I'll throw in the case. That's me." What's your best reply?`],quote:[],options:[{k:"A",t:'"Fair enough, \xA3482 with the case. Deal."',ok:!1},{k:"B",t:'"Is \xA3482 really the lowest you can go on it?"',ok:!1},{k:"C",t:'"They go for \xA3440 to \xA3470. I can do \xA3440."',ok:!0},{k:"D",t:`"OK, I'll come up to \xA3470 to get it done."`,ok:!1}],expl:{card:"The card: shrinking drops and a freebie don't prove a limit. Judge against your target.",items:[{k:"C",ok:!0,text:`Right. It judges \xA3482 against your \xA3450, not their pattern. Say they answer: "\xA3465 and it's yours." Now: "If you can do \xA3446, I'll transfer it now." If they say "No, \xA3482 really is it", other MacBooks are for sale.`,subs:[]},{k:"A",ok:!1,text:"Believes the pattern and pays \xA332 over your target.",subs:[]},{k:"B",ok:!1,text:`Asks them to judge their own price. You'll usually get: "Yes."`,subs:[]},{k:"D",ok:!1,text:"Jumps \xA340 at once, to \xA320 over your target.",subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're selling your old iPad, listed at \xA3400. Each line shows one way your price could drop over three messages. Which ones say you're nearly out of room, and which say there's more to come?"],quote:[],options:[],sort:[{t:'"\xA3350, then \xA3300, then \xA3250"',bin:"more to come"},{t:'"\xA3360, then \xA3340, then \xA3332"',bin:"nearly out of room"},{t:'"\xA3390, then \xA3380, then \xA3330"',bin:"more to come"},{t:'"\xA3340, then \xA3318, then \xA3311"',bin:"nearly out of room"},{t:'"\xA3385, then \xA3370, then \xA3355"',bin:"more to come"},{t:'"\xA3360, then \xA3330, then \xA3320"',bin:"nearly out of room"}],expl:{card:"The card: shrinking moves say you're nearly out of room; same-size moves, or a big late one, say more's coming.",items:[{label:"Nearly out of room, as each drop is smaller than the last",text:'"\xA3360, \xA3340, \xA3332" (\xA340, \xA320, \xA38), "\xA3340, \xA3318, \xA3311" (\xA360, \xA322, \xA37) and "\xA3360, \xA3330, \xA3320" (\xA340, \xA330, \xA310).',subs:[]},{label:"More to come",text:"",subs:[`"\xA3350, \xA3300, \xA3250" and "\xA3385, \xA3370, \xA3355": the same drop each time, so another's coming.`,`"\xA3390, \xA3380, \xA3330" is the trap: the big late drop says there's plenty more.`]}]},bins:["more to come","nearly out of room"]},{n:4,fmt:"Say it",stem:[`You're selling a Canon camera on Marketplace, listed at \xA3400. You've already come down to \xA3370. The buyer offered \xA3300 earlier, hasn't moved since, and now messages: "Still a bit steep for me." What's your best reply?`],quote:[],options:[{k:"A",t:'"I can do \xA3355."',ok:!1},{k:"B",t:`"I've moved \xA330. Where can you get to?"`,ok:!0},{k:"C",t:`"\xA3340, but I can't go any lower than that."`,ok:!1},{k:"D",t:'"Shall we meet in the middle at \xA3335?"',ok:!1}],expl:{card:"The card: only move after they've moved. If they haven't, ask what they can do.",items:[{k:"B",ok:!0,text:`Right. You've moved \xA330 and they've moved nothing, so the next move is theirs. Say they answer: "I could do \xA3320." Now you can drop by less than your \xA330: "I can do \xA3356."`,subs:[]},{k:"A",ok:!1,text:"The right shape, but they haven't moved. You're bidding against yourself (lesson 3.2).",subs:[]},{k:"C",ok:!1,text:`The same \xA330 drop again, and "can't go any lower" invites a test.`,subs:[]},{k:"D",ok:!1,text:"Offers the middle yourself. They'll usually haggle down from \xA3335.",subs:[]}]}},{n:5,fmt:"Type it",stem:["You're buying a used Technics turntable on Marketplace, listed at \xA3370. Similar ones sell for \xA3330 to \xA3370, and before you started you wrote down a target of \xA3330. You've offered \xA3300, then \xA3315, then \xA3323. The seller's at \xA3345. Type your next offer: a smaller rise than your last one, a precise number no higher than your target, and a small extra that isn't more money."],quote:[],options:[],model:"\xA3327, and I'll come and get it whenever suits you.",checks:"contains an amount from 324 to 330 (with or without \xA3); no other \xA3 amount and no other number of 100 or more; contains one of: collect, collection, come and get, pick up, pick it up, grab, today, tonight, tomorrow, now, this week, whenever, suits, immediately, straight away, right away, transfer, cash; contains none of: lowest, limit, max, most, best price, bottom, can't, more than; 15 words or fewer. Whole words, any case.",after:["The card: make each move smaller than the last, then finish on a precise number with an extra that isn't money.",`The model answer rises \xA34 after your last rise of \xA38, stays under your \xA3330 target, and makes collecting easy for them. Say they answer: "Make it \xA3335 and it's yours." Judge that against your target, not their pattern: "\xA3329, and I'll fit round you."`,"Fails: rising \xA38 or more, going over your target, telling them your limit, and asking for their lowest."],modelRaw:`"\xA3327, and I'll come and get it whenever suits you."`}],mission:"pick something you own, look up three sold prices, and write your asking price and then three drops, each smaller than the last, ending on a precise number with one small extra."},{id:"3.4",title:"Open as far below as they are above",guess:null,card:{paras:[{t:"p",text:"When they've named a price first, like a Marketplace listing or a quote, and it's inside what similar ones sell for, don't offer just under it, and don't offer your target either. Deals tend to end near the middle of the first two numbers. So put your offer as far below your target as their price is above it, and the middle lands on your target. They want \xA3500 and your target is \xA3440 (lesson 2.2): they're \xA360 above it, so offer \xA3380. Selling, flip it: when a buyer names a number before you've given one (a friend, a DM, no listing), ask as far above your target as their offer is below it."},{t:"p",text:"Only do the maths when their number is inside what similar ones sell for. If it's outside that range, the maths gives you a silly number, and offers that far off make more people walk away. Reply from what similar ones sell for instead, as in lesson 2.2."}],rows:[{label:"Say",text:`(listed at \xA3500, similar ones sell for \xA3440 to \xA3520, your target \xA3440) "Could you do \xA3380? The screen's scratched." \xB7 (selling, they offer \xA3270, similar ones sell for \xA3260 to \xA3300, your target \xA3300) "You'd get it with both lenses for \xA3330."`,subs:[]},{label:"Avoid",text:`"Could you do \xA3470?" (just under their price: the middle lands at \xA3485) \xB7 "Could you do \xA3440?" (your target: the middle lands at \xA3470) \xB7 going further than the maths \xB7 saying your target or "the middle" out loud (they'll work out what you're aiming for)`,subs:[]},{label:"Watch out",text:"give a reason with your offer, like any first number. After it, move in shrinking steps, and only after they've moved (lesson 3.3).",subs:[]},{label:"Evidence",text:'Some evidence that deals end near the middle of the first two numbers (Howard Raiffa; Lipp, Smolinski and Kesting, 2023, two studies). Opening as far below as they are above is a Pro trick (Roger Dawson calls it "bracketing"), never tested on its own. Backed by studies that ambitious first offers win more on average but lead to more walkouts (Petrowsky and colleagues, 2025).',subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You want a pair of AirPods Max listed on Marketplace at \xA3320. Similar ones have sold for \xA3265 to \xA3330, and you've written down \xA3265 as your target. The ear cushions look worn in the photos. What's your best first offer?"],quote:[],options:[{k:"A",t:'"Could you do \xA3295 for them?"',ok:!1},{k:"B",t:'"Could you do \xA3265? One sold for that last week."',ok:!1},{k:"C",t:'"Could you do \xA3210? The ear cushions look worn."',ok:!0},{k:"D",t:`"What's the lowest you'd take for them?"`,ok:!1}],expl:{card:"The card: their \xA3320 is inside the going rate, \xA355 over your \xA3265 target, so offer \xA3210.",items:[{k:"C",ok:!0,text:`Right. The middle of \xA3210 and \xA3320 is your \xA3265. Say they answer: "\xA3290?" Now move up a little: "I can do \xA3228." If they say "Bit low, mate", they haven't moved, so ask: "What did you have in mind?"`,subs:[]},{k:"A",ok:!1,text:"Just under their price: the middle's about \xA3308.",subs:[]},{k:"B",ok:!1,text:"Your target as your opener, so the middle lands about \xA3293.",subs:[]},{k:"D",ok:!1,text:"Asks their limit (lesson 1.1): usually something near \xA3320.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You want a Nintendo Switch OLED. Similar ones have sold for \xA3180 to \xA3220, and you've written down \xA3180 as your target. A seller on Marketplace has one listed at \xA3260. What's your best first offer?"],quote:[],options:[{k:"A",t:'"Could you do \xA3100 for it?"',ok:!1},{k:"B",t:`"They've gone for \xA3180 to \xA3220. Could you do \xA3180?"`,ok:!0},{k:"C",t:'"Could you do \xA3240 for it, mate?"',ok:!1},{k:"D",t:`"Could you do \xA3200? That's about what they go for."`,ok:!1}],expl:{card:"The card: \xA3260 is over what these sell for, so skip the maths and reply from the going rate (lesson 2.2).",items:[{k:"B",ok:!0,text:'Right. The bottom of the going rate, with proof. Say they answer: "\xA3215?" Now move up a small step: "I can do \xA3188."',subs:[]},{k:"A",ok:!1,text:"The maths, where the card says not to: it sends you to \xA3100, nearly half below anything similar. You'll usually get no reply.",subs:[]},{k:"C",ok:!1,text:"Steps down from a price that's already too high.",subs:[]},{k:"D",ok:!1,text:"The middle, so \xA3200 becomes your best (lesson 2.1).",subs:[]}]}},{n:3,fmt:"Say it",stem:[`Someone who follows your photography account sees your old Canon camera in a post and messages: "Would you sell it? I'd give you \xA3270." It comes with two lenses. You check: similar ones with two lenses have sold for \xA3260 to \xA3300, so you write down \xA3300 as your target. What's your best reply?`],quote:[],options:[{k:"A",t:`"You'd get it with both lenses for \xA3330."`,ok:!0},{k:"B",t:`"You'd get it with both lenses for \xA3300. That's what they go for."`,ok:!1},{k:"C",t:'"Could you stretch to \xA3285 for it?"',ok:!1},{k:"D",t:`"You'd get it with both lenses for \xA3390."`,ok:!1}],expl:{card:"The card, selling: ask as far above your \xA3300 target as their \xA3270 is below it: \xA3330.",items:[{k:"A",ok:!0,text:'Right. The middle of \xA3270 and \xA3330 is your \xA3300. Say they answer: "Bit steep. I could do \xA3285." Now move down a small step: "You can have it for \xA3318."',subs:[]},{k:"B",ok:!1,text:"Your target as your first number. The middle lands at \xA3285.",subs:[]},{k:"C",ok:!1,text:"A step up from their number: the middle drops to about \xA3278.",subs:[]},{k:"D",ok:!1,text:`Three times the gap the maths gives. You'll usually get: "Ha, no thanks."`,subs:[]}]}},{n:4,fmt:"Type it",stem:["You want a 27-inch monitor listed on Marketplace at \xA3240. Similar ones have sold for \xA3210 to \xA3250, and you've written down \xA3210 as your target. The stand has a scratch on it. Type your first offer, with a reason, so that the middle of your offer and their \xA3240 lands on your target."],quote:[],options:[],model:"Could you do \xA3180? The stand's scratched.",checks:"contains an amount from 175 to 185 (with or without \xA3); every \xA3 amount, and every number of 100 or more, is from 175 to 185 or is 240; contains one of: scratch, scratched, stand, mark, marked, because, since, given; contains none of: target, middle, halfway, meet, split, budget, up to, max, most I, at most, lowest, best price, best you can do, sorry, if not, no worries; 20 words or fewer. Whole words, any case.",after:["The card: their \xA3240 is \xA330 above your \xA3210, so offer \xA330 below it: \xA3180, with a reason.",'The middle of \xA3180 and \xA3240 is your \xA3210. Say they answer: "\xA3225?" Now move up a small step (lesson 3.3): "I can do \xA3192."',"Fails: offering your target (\xA3210), which puts the middle at \xA3225, an offer just under their price, no reason, and mentioning your target or the middle."],modelRaw:`"Could you do \xA3180? The stand's scratched."`}],mission:"look up the sold prices for something you'd like to buy and write down your target (the bottom of what they sell for). Then find a listing priced inside that range and work out the offer that puts the middle on your target."},{id:"3.5",title:"Middle of what?",guess:{stem:["On eBay, buyers and sellers can haggle by sending offers and counter-offers. Across about 10 million of these haggles, what share of offers were exactly halfway between the last two numbers?"],options:[{k:"A",t:"1%",ok:!1},{k:"B",t:"4%",ok:!1},{k:"C",t:"12%",ok:!0},{k:"D",t:"40%",ok:!1}],reveal:"about 12%, far more than chance, and halfway offers were accepted more often than other offers. Meeting in the middle is one of the most normal things people do when they haggle."},card:{paras:[{t:"p",text:`When a buyer, a seller or your landlord says "Let's meet in the middle", check the two numbers before you agree. Meeting halfway is very common, and halfway offers get accepted more often. But the middle is only as fair as the two numbers either side of it. If their number was silly, like \xA3900 for something that sells for about \xA3500, the middle is still way too high. Ask "Middle of what?" and go back to what similar ones sell for. (To put the middle where you want it from the start, use lesson 3.4.)`}],rows:[{label:"Say",text:`"Middle of what, though? Mine's based on what these sell for. What's yours based on?" \xB7 "Halfway from \xA3900 doesn't work. Similar ones go for about \xA3500."`,subs:[]},{label:"Avoid",text:'"Go on then, halfway" straight after a silly opening number',subs:[]},{label:"Watch out",text:"when both numbers are close to what it usually sells for, the middle lands near the going rate anyway, so halfway is often the quickest close.",subs:[]},{label:"Evidence",text:`Backed by studies that meeting halfway is common and that halfway offers get accepted more often (Keniston and colleagues, 2021, about 10 million eBay haggles). Asking "Middle of what?" is our own advice, built on first-offer research (lesson 2.1). It's never been tested on its own.`,subs:[]},{label:"Myth",text:'"Never split the difference." Good advice for hostage negotiators, but too strong for haggling over prices.',subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're buying a used Dyson Airwrap. Similar ones have sold for \xA3220 to \xA3260. The seller listed it at \xA3380, you offered \xA3220, and now they say: "Let's just meet in the middle. \xA3300?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Go on then, \xA3300 sounds fair enough to me, mate."',ok:!1},{k:"B",t:'"Halfway from \xA3380? They go for \xA3220 to \xA3260."',ok:!0},{k:"C",t:`"I can stretch to \xA3280, but that's my absolute limit."`,ok:!1},{k:"D",t:'"How about we split it again? \xA3260?"',ok:!1}],expl:{card:"The card: a middle is only as fair as its two numbers, and their \xA3380 is way over the going rate.",items:[{k:"B",ok:!0,text:'Right. Their "middle" is built on a price nobody pays. Say they answer: "Fair enough. \xA3255?" Now move up a small step: "I can do \xA3232." If they say "\xA3300 or nothing", others sell for \xA3220 to \xA3260.',subs:[]},{k:"A",ok:!1,text:'Pays \xA340 over the going rate because "the middle" sounded fair.',subs:[]},{k:"C",ok:!1,text:"Jumps \xA360 and tells them your limit.",subs:[]},{k:"D",ok:!1,text:"Still built on their \xA3380: \xA340 for nothing.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling a Patagonia fleece on eBay. Similar ones have sold for \xA375 to \xA385, and you've listed it at \xA385. A buyer offered \xA360, you countered at \xA382, and they reply: "Meet in the middle at \xA371?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Middle of what? These sell for \xA375 to \xA385."',ok:!0},{k:"B",t:`"\xA371 works for me. Send it as an offer and I'll accept."`,ok:!1},{k:"C",t:`"Sorry, I never split the difference. It's \xA382."`,ok:!1},{k:"D",t:`"What's the highest you could go to?"`,ok:!1}],expl:{card:"The card: a middle is only as fair as its two numbers, and their \xA360 is \xA315 under the going rate.",items:[{k:"A",ok:!0,text:`Right. It brings the talk back to what fleeces sell for. Say they answer: "OK, \xA376?" That's \xA35 over their "middle". Now: "\xA380 and it's yours."`,subs:[]},{k:"B",ok:!1,text:"Agrees to a middle built on a lowball: \xA34 under anything similar.",subs:[]},{k:"C",ok:!1,text:"The myth, with no reason. On eBay, they'll usually click the next listing.",subs:[]},{k:"D",ok:!1,text:"Asks for their limit. They'll usually say \xA371, and that's your ceiling.",subs:[]}]}},{n:3,fmt:"Sort it",stem:[`You're buying a used car. The online valuation says it's worth about \xA36,000. In each line, the seller suggests meeting in the middle. Does the middle land on the valuation, or should you ask "Middle of what?" and go back to the \xA36,000?`],quote:[],options:[],sort:[{t:'"You offered \xA35,800, they asked \xA36,200, and they suggest \xA36,000."',bin:"the middle lands on the valuation"},{t:'"They asked \xA39,000, you offered \xA36,000, and they suggest \xA37,500."',bin:"middle of what?"},{t:`"You're \xA3200 apart: you've offered \xA35,900 and they want \xA36,100."`,bin:"the middle lands on the valuation"},{t:'"They asked \xA37,500, you offered \xA35,900, and they suggest \xA36,700."',bin:"middle of what?"},{t:`"A dealer says 'I'll meet you halfway' between your \xA36,000 and their \xA38,000."`,bin:"middle of what?"}],expl:{card:"The card: whether halfway is fair depends on the two numbers, not on how generous it sounds.",items:[{label:"The middle lands on the valuation",text:'"\xA35,800 and \xA36,200" and "\xA35,900 and \xA36,100". Both numbers are near \xA36,000, so halfway is \xA36,000.',subs:[]},{label:"Middle of what?",text:"",subs:['"\xA39,000 and \xA36,000": the middle, \xA37,500, is \xA31,500 over the valuation.','"\xA37,500 and \xA35,900": \xA36,700 is still \xA3700 over.',`The dealer's "I'll meet you halfway" is the trap. It sounds generous, but halfway from \xA38,000 leaves you paying \xA31,000 over.`]}]},bins:["the middle lands on the valuation","middle of what?"]},{n:4,fmt:"Type it",stem:[`You've listed a Sage coffee machine on Marketplace at \xA3200. Similar ones have sold for \xA3180 to \xA3200. A buyer offers \xA3120, then adds: "Let's meet in the middle, \xA3160?" Type a reply that doesn't agree to \xA3160 and brings it back to what similar ones sell for.`],quote:[],options:[],model:"Middle of what, though? Similar ones have sold for \xA3180 to \xA3200.",checks:"contains one of: sell for, sells for, sell at, sold for, sold at, sold, selling, selling for, go for, goes for, going for, gone for, going rate, worth, similar, others, based on, listings, used ones, usually; no amount from 121 to 179 except 160 (with or without \xA3); contains none of: deal, fine, ok, okay, go on, sounds good, works, sure thing, for sure, happy with, let's do, let's say, I'll take, you're on, go for it, done, lowest, minimum, at least, can't go, need, accept; 25 words or fewer. Whole words, any case.",after:["The card: the middle is only as fair as the two numbers. Their \xA3120 is \xA360 under anything similar has sold for, so halfway is still too low.",`Say they answer: "Fair enough. \xA3175?" Now you're close to the going rate: "I can do \xA3188."`,`Fails: agreeing ("fine", "go on", "OK"), offering a price below what similar ones sell for, and replies that don't mention what similar ones sell for.`],modelRaw:'"Middle of what, though? Similar ones have sold for \xA3180 to \xA3200."'}],mission:`find a listing you like and look up what similar ones have sold for. Work out where "meet in the middle" would land between the asking price and an offer at the bottom of that range. If it lands above what they sell for, write the "Middle of what?" reply you'd send.`},{id:"3.6",title:"Get them to offer the split",guess:null,card:{paras:[{t:"p",text:`When you're nearly there, like \xA3280 against their \xA3320 on a sofa, or \xA3200 apart on a car, and you're both stuck, don't offer to meet in the middle yourself. Say "It'd be a shame to lose this over \xA340", then stop talking. People often fill the gap by suggesting it themselves: "Shall we just split it?" Now they've moved halfway and you haven't moved at all. Their halfway figure is their new number, so you can take it, or, on a one-off deal with a stranger, try once more: "So you could do \xA3300? Make it \xA3290 and it's done."`},{t:"p",text:"Only use it when both numbers are close to the going rate. If the gap comes from their silly number, halfway is still too much, so go back to what similar ones sell for first (lesson 3.5). And it's for when you're both stuck. Straight after they've come down, a smaller move of your own is fine, even if it lands halfway, like \xA3410 against a shop's \xA3430 in lesson 1.1."}],rows:[{label:"Say",text:`"We're so close. It'd be a shame to lose this over \xA340." \xB7 In a message: "Feels daft to let this fall through over \xA340."`,subs:[]},{label:"Avoid",text:'"Shall we just meet in the middle?" \xB7 "Split the difference?" \xB7 saying the shame line, then offering the middle yourself',subs:[]},{label:"Watch out",text:`when someone says "It'd be a shame to lose this over \xA340" to you, it's the same trick. Don't offer the split: "It would. What can you do?" And don't split twice with someone you'll deal with again, like a landlord or a regular client: it feels like a squeeze.`,subs:[]},{label:"Evidence",text:"Pro trick (Roger Dawson). Widely taught to salespeople, never tested.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You're buying an oak dining table on Marketplace. Similar tables sell for \xA3300 to \xA3380. You're at \xA3300, the seller's at \xA3350, and you've been going back and forth for ten minutes. What's your best next message?"],quote:[],options:[{k:"A",t:'"Shall we just split it and call it \xA3325?"',ok:!1},{k:"B",t:`"It'd be a shame to lose this over \xA350. \xA3325?"`,ok:!1},{k:"C",t:'"Feels daft to let this fall through over \xA350."',ok:!0},{k:"D",t:`"\xA3350's a bit much. What's the lowest you'd go to?"`,ok:!1}],expl:{card:"The card: when you're close, don't offer the middle. Say it'd be a shame to lose it, then wait.",items:[{k:"C",ok:!0,text:`Right. It points at the gap without moving. Say they answer: "Go on, split it. \xA3325?" They've come down \xA325 and you haven't moved. Take it, or try once more: "Make it \xA3315 and it's done."`,subs:[]},{k:"A",ok:!1,text:`Offers the middle yourself. You'll usually get: "Make it \xA3340."`,subs:[]},{k:"B",ok:!1,text:"The right line, then you offer the middle anyway.",subs:[]},{k:"D",ok:!1,text:"Asks for their lowest, so that's the most you'll get off.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling your DJI drone on Marketplace, listed at \xA3450. The buyer's at \xA3400 and you're at \xA3440. He says: "Come on, it'd be a shame to lose this over forty quid." What's your best reply?`],quote:[],options:[{k:"A",t:'"It would. What can you do?"',ok:!0},{k:"B",t:'"True. Shall we just meet at \xA3420?"',ok:!1},{k:"C",t:`"Go on then, \xA3400. Let's not fall out over it."`,ok:!1},{k:"D",t:'"It would be. I could maybe do \xA3430?"',ok:!1}],expl:{card:"The card: when someone says the shame line to you, it's the same trick. Don't offer the split. Ask what they can do.",items:[{k:"A",ok:!0,text:`Right. It agrees, and hands the next move back to him. Say he answers: "Fine, \xA3420?" He's come up \xA320 and you haven't moved. Take it, or try once more: "Make it \xA3434 and it's yours."`,subs:[]},{k:"B",ok:!1,text:"Offers the middle, exactly what he was fishing for.",subs:[]},{k:"C",ok:!1,text:"Gives him the whole \xA340.",subs:[]},{k:"D",ok:!1,text:`Drops \xA310 before he's moved (lesson 3.2). You'll usually get: "Make it \xA3410."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're booking a man-with-a-van for your move. Other quotes were \xA3100 to \xA3150. You've offered \xA3100, he's asked \xA3140, and you're both stuck. Which lines get him to suggest the middle, and which offer it yourself?"],quote:[],options:[],sort:[{t:`"It'd be a shame to lose this over \xA340."`,bin:"gets him to suggest it"},{t:'"Shall we just meet in the middle?"',bin:"offers it yourself"},{t:`"We're so close now, it feels daft to stop."`,bin:"gets him to suggest it"},{t:`"Let's call it \xA3120 and be done."`,bin:"offers it yourself"},{t:`"I'd hate for this to fall through over \xA340."`,bin:"gets him to suggest it"},{t:`"It'd be a shame to lose this over \xA340. \xA3120?"`,bin:"offers it yourself"}],expl:{card:"The card: whoever suggests the middle moves first. Say the shame line, then wait.",items:[{label:"Gets him to suggest it",text:`"shame to lose this", "so close now", "hate for this to fall through". Each points at the gap without moving. Say he answers: "Go on, \xA3120." He's dropped \xA320 and you haven't moved.`,subs:[]},{label:"Offers it yourself",text:"",subs:['"Meet in the middle?" and "\xA3120 and be done" move you \xA320 straight away.',`The last line is the trap: the right words, then you offer the middle anyway. You'll usually get: "Make it \xA3125."`]}]},bins:["gets him to suggest it","offers it yourself"]},{n:4,fmt:"Say it",stem:["You're buying a used Xbox Series X on Marketplace. Similar ones sell for \xA3250 to \xA3280. The seller started at \xA3400 and you offered \xA3250. He's now at \xA3380, you're at \xA3260, and it's stalled. What's your best next message?"],quote:[],options:[{k:"A",t:`"It'd be a shame to lose this over \xA3120."`,ok:!1},{k:"B",t:'"Shall we meet in the middle at \xA3320?"',ok:!1},{k:"C",t:`"What's the lowest you'd take for it?"`,ok:!1},{k:"D",t:'"Similar ones go for \xA3250 to \xA3280, mate."',ok:!0}],expl:{card:"The card: the shame line is for when both numbers are near the going rate. His \xA3380 isn't, so go back to it first (lesson 3.5).",items:[{k:"D",ok:!0,text:`Right. It brings the talk back to the real price. Say he answers: "Fair, \xA3290 then?" Now the shame line works: "It'd be a shame to lose this over \xA330."`,subs:[]},{k:"A",ok:!1,text:"The right line, wrong place. His split would be \xA3320.",subs:[]},{k:"B",ok:!1,text:"Offers the middle of a silly number: \xA340 over the going rate.",subs:[]},{k:"C",ok:!1,text:"Asks for his lowest. He'll usually say \xA3350.",subs:[]}]}},{n:5,fmt:"Type it",stem:["You're selling your Honda Jazz. Similar ones have sold for \xA32,800 to \xA33,100. The buyer's at \xA32,850, you're at \xA32,950, and you've both been stuck for ten minutes. Type a line that gets them to suggest meeting in the middle, without offering it yourself."],quote:[],options:[],model:"We're so close. It'd be a shame to lose this over \xA3100.",checks:`contains one of: shame, pity, daft, silly, mad, crazy, gutted, hate, waste; contains one of: lose, losing, lost, fall through, fall apart, fall over, miss out, walk away, over; no amount other than 100 (with or without \xA3; "a hundred" and "hundred quid" are fine); contains none of: split, middle, halfway, meet, how about, what about, I'll do, I could, I can, could do, can do, call it, lowest, best price, your best, the most, fifty, grand, thousand, can't go, lower, minimum, at least, need; 20 words or fewer. Whole words, any case.`,after:["The card: say what a shame it would be, then wait for them to offer the middle.",`Say they answer: "Split it then? \xA32,900." They've come up \xA350 and you haven't moved. Take it, or try once more: "Make it \xA32,925 and the keys are yours." If they answer "It would. What can you do?", they know the trick: stay at \xA32,950, or make one small move (lesson 3.3).`,"Fails: offering the middle, naming a new number, telling them your limit, and asking for their best price."],modelRaw:`"We're so close. It'd be a shame to lose this over \xA3100."`}],mission:`this week, make an offer on a Vinted or Marketplace listing you'd buy. When you're close and stuck, send "Feels daft to let this fall through over \xA3X" and see who suggests the middle.`}]},{n:4,title:"Holding Firm",tagline:"Say no without starting a row, and stay put when they push.",lessons:[{id:"4.1",title:'"How am I supposed to do that?"',guess:null,card:{paras:[{t:"p",text:`When someone asks for something way out of line, like a buyer wanting \xA350 off and free delivery, or a client wanting three jobs for the price of one, don't argue and don't give in. Ask, calmly: "How am I supposed to do that?" It's a no without the row. They have to look at the deal from your side and work out how it could work for you, and they'll often come back with a smaller ask or a better offer.`}],rows:[{label:"Say",text:'"How am I supposed to do that?" (slowly, then stop talking) \xB7 In a message: "Love the idea! How am I supposed to do all that for \xA3100?"',subs:[]},{label:"Avoid",text:"",subs:[`"That's ridiculous." (they defend their ask)`,'"Why would I do that?" ("why" sounds like a challenge, lesson 1.3)','Giving in a bit to keep them sweet: "Go on, \xA3180 for the lot."']},{label:"Watch out",text:`save it for demands that are really out of line, and use it once you've been chatting a bit. On someone's normal price, or as your first message, it sounds like whining. In a message there's no calm voice, so start friendly. If they answer "That's your problem", they've hit their limit: change what they get for the money ("For \xA3100 I can do the logo"), or walk away.`,subs:[]},{label:"Evidence",text:"Pro trick (Chris Voss). Never tested for getting a better price.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You've been messaging a caf\xE9 owner for a week about designing her logo, and it's been friendly. You charge \xA3100 for a logo, and about \xA375 each for a menu design or a set of Instagram posts. Now she writes: "Could you do the logo, the menus and a set of Instagram posts for \xA3100, by Friday?" What's your best reply?`],quote:[],options:[{k:"A",t:`"I'd need at least \xA3250 to do all of that, I'm afraid."`,ok:!1},{k:"B",t:'"Why do you think all that is only worth \xA3100?"',ok:!1},{k:"C",t:'"Ha, cheeky! I could do all three for \xA3200?"',ok:!1},{k:"D",t:'"Love it! How am I supposed to do all that for \xA3100?"',ok:!0}],expl:{card:'The card: for a demand way out of line, ask "How am I supposed to do that?", friendly in a message.',items:[{k:"D",ok:!0,text:'Right. A no without a row, and she sees it from your side. Say she answers: "Fair. What could you do for \xA3100?" Now you can say: "The logo. Menus and posts are another \xA3150."',subs:[]},{k:"A",ok:!1,text:"Names your floor, so \xA3250 is the most you'll get.",subs:[]},{k:"B",ok:!1,text:'"Why" about her price, so she defends it.',subs:[]},{k:"C",ok:!1,text:'Gives in by \xA350 straight away: "Could you do \xA3150?"',subs:[]}]}},{n:2,fmt:"Say it",stem:["You're moving flats across town. A man with a van quotes \xA3180 for the job, his standard price for a half-day move. It feels a lot for one room of stuff, but you've no idea what moves usually cost. What's your best reply?"],quote:[],options:[{k:"A",t:'"How am I supposed to pay \xA3180 for one room of stuff?"',ok:!1},{k:"B",t:'"Is \xA3180 the best you can do on that?"',ok:!1},{k:"C",t:'"What could you do on the \xA3180?"',ok:!0},{k:"D",t:'"Could you do it for \xA3110?"',ok:!1}],expl:{card:"The card: save it for demands way out of line. \xA3180 is his standard price, and you don't know the going rate, so ask what he could do (lesson 1.1).",items:[{k:"C",ok:!0,text:`Right. He names the first discount. Say he answers: "\xA3160 if you're packed and ready when I get there." That's \xA320 off for something you'd do anyway.`,subs:[]},{k:"A",ok:!1,text:`The card's line on a normal price: "That's what a half-day costs."`,subs:[]},{k:"B",ok:!1,text:'Asks him to judge his own price: "Yes."',subs:[]},{k:"D",ok:!1,text:"Guesses a number you can't back up.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You quoted \xA3450, your normal rate, to build a small business website. The client offered \xA3150. You asked: "How am I supposed to do that?" They reply: "Not sure, that's your problem. The \xA3150 is a start-up grant, and it's all we've got." What's your best next move?`],quote:[],options:[{k:"A",t:'"For \xA3150, I can do a one-page site."',ok:!0},{k:"B",t:'"Right, but how am I supposed to do that?"',ok:!1},{k:"C",t:`"OK, I'll knock it down to \xA3300 for you."`,ok:!1},{k:"D",t:'"Could you stretch to \xA3300 if I start this week?"',ok:!1}],expl:{card:`The card: "That's your problem" means they've hit their limit. Change what they get for the money.`,items:[{k:"A",ok:!0,text:'Right. The grant is fixed, so shrink the job, not your rate. Say they answer: "One page is fine for now." If they still want the full site for \xA3150, walk away.',subs:[]},{k:"B",ok:!1,text:"Repeats a question they've just answered.",subs:[]},{k:"C",ok:!1,text:"Drops \xA3150 for nothing, and it's still double the grant.",subs:[]},{k:"D",ok:!1,text:`Keeps pushing on price after they've told you \xA3150 is all there is. You'll usually get: "Like I said, \xA3150."`,subs:[]}]}},{n:4,fmt:"Type it",stem:[`You've been chatting with a Marketplace buyer about your wardrobe, listed at \xA3120 (similar ones go for \xA3100 to \xA3130), and it's been friendly. Now they write: "Could you knock off \xA350 and deliver it to Bristol for free?" That's 40 miles away. Type your reply: the calm question that says no without a row.`],quote:[],options:[],model:"Ha, how am I supposed to do that?",checks:`contains one of: how am I, how would I, how could I, how can I, how do I; contains one of: supposed to, meant to, do that, do all that, make that work, manage that; ends with "?" (trailing emojis ignored); no number other than their 50, the 40 miles, your 120 and the 70 they'd pay; contains none of: ok, okay, sure, fine, deal, lowest, best price, minimum, at least, below, can't go, ridiculous, joke, joking, kidding, mick, serious, laugh, mad, piss, why; 15 words or fewer. Whole words, any case.`,after:['The card: when a demand is way out of line, ask "How am I supposed to do that?", friendly in a message, then stop.',`Say they answer: "Fair, Bristol's a trek. What if I collect, and you knock off \xA310?" Their \xA350 and free delivery just became \xA310 and you staying at home.`,'Fails: agreeing ("OK", "sure"), a new number, sarcasm ("Are you serious?", "having a laugh?") and "why".'],modelRaw:'"Ha, how am I supposed to do that?"'}],mission:`this week, think of one request you've had that was way out of line (a mate wanting a free lift to the airport, a buyer wanting half off). Write the friendly message version of "How am I supposed to do that?", then say the spoken version out loud, slowly, and stop.`},{id:"4.2",title:"The calm, flat no",guess:{stem:["Researchers watched skilled negotiators across 103 negotiation sessions. The skilled ones gave about 1.8 reasons to back up each point. How many did average negotiators give?"],options:[{k:"A",t:"About 0.9",ok:!1},{k:"B",t:"About 1.2",ok:!1},{k:"C",t:"About 1.8, the same",ok:!1},{k:"D",t:"About 3",ok:!0}],reveal:"about 3. The best negotiators gave fewer reasons, not more."},card:{paras:[{t:"p",text:"When someone keeps pushing on something you've already said no to, like a buyer after more off, a client wanting extra work for free or a flatmate who wants you to cover them again, most people do one of two things. They argue, piling up reasons, or they give a little. Both teach them that pushing works."},{t:"p",text:`Instead, give a calm, flat no. Say "That's difficult" (not a blunt "No", and no list of reasons). Pause and count to three in your head. Then say where you stand in one short sentence, letting your voice go down at the end, and stop talking. If you'd say yes on different terms, make those terms your sentence: "Extra posts are \xA340 each." If it's a no whatever happens, say so: "I'm staying at \xA390." "That's difficult" isn't a maybe: it's calm, and the flat sentence after it is the answer. (In lesson 4.4 you'll say their no back softer, with a "today" on the end. That's the difference.)`}],rows:[{label:"Say",text:`"That's difficult. I'm staying at \xA390." \xB7 "That's difficult. Extra posts are \xA340 each." \xB7 "That's difficult. I can do Tuesday, not Monday."`,subs:[]},{label:"Avoid",text:"",subs:[`A pile of reasons: "I paid \xA3200, it's barely used, and I've had loads of interest."`,`Arguing about what's fair, or calling your own price "fair" or "reasonable" (they argue back)`,'Ending on a question: "\u2026is that OK?" (it invites them to say no)']},{label:"Watch out",text:"in a message there's no voice or pause, so just send the two short sentences. If you give a reason, give one, your strongest, and only once. If all your reasons are weak, give none.",subs:[]},{label:"Evidence",text:`Pro trick (a former Swiss hostage negotiator; Chris Voss's "late-night DJ voice"). Some evidence for fewer reasons: skilled negotiators gave about 1.8 reasons per point against 3 for average ones, and used annoying words like "fair" and "generous" about their own offers about 2 times an hour, against about 11 (Huthwaite field study: observed, not an experiment).`,subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`A buyer has come round to look at the bike you're selling for \xA3295. Similar bikes have sold for \xA3280 to \xA3320. He's offered \xA3220 twice, and you've said no twice. Now he says: "Come on, \xA3220 is more than fair for a second-hand bike." What's your best reply?`],quote:[],options:[{k:"A",t:`"It's had a full service, it's got new tyres, and I paid \xA3600."`,ok:!1},{k:"B",t:`"That's difficult. Could you meet me nearer \xA3280?"`,ok:!1},{k:"C",t:`"That's difficult. I'm staying at \xA3295."`,ok:!0},{k:"D",t:'"Honestly, I think \xA3295 is a really fair price for it."',ok:!1}],expl:{card:`The card: "That's difficult", a pause, one short sentence. No arguments, no giving ground.`,items:[{k:"C",ok:!0,text:`Right. Nothing to argue with, and no sign pushing works. Say he answers: "OK, \xA3260?" He's moved \xA340 and you haven't moved. If he says "\xA3220 or I'm off", let him go: similar bikes sell for \xA3280 to \xA3320.`,subs:[]},{k:"A",ok:!1,text:`A pile of reasons. He'll attack the weakest: "What you paid doesn't matter."`,subs:[]},{k:"B",ok:!1,text:'Gives ground and ends on a question: "\xA3240 then."',subs:[]},{k:"D",ok:!1,text:"Calls your price fair, so now you're arguing about fairness.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["Your flatmate wants you to cover her \xA345 share of the electricity again this month. You've already said no once, and she's asking again. Which replies hold your no, and which invite another push?"],quote:[],options:[],sort:[{t:`"That's difficult. I can't cover it this month."`,bin:"holds your no"},{t:`"I'm skint, my insurance is due, and I covered you in March."`,bin:"invites another push"},{t:`"That's difficult. It's just not fair on me."`,bin:"invites another push"},{t:`"That's difficult. I'd like it in the kitty by Friday."`,bin:"holds your no"},{t:`"I covered March, so this one's yours."`,bin:"holds your no"},{t:`"That's difficult, I'm a bit skint, and I did cover March, so\u2026"`,bin:"invites another push"}],expl:{card:"The card: one short sentence, one reason at most. The sentence counts, not the opener.",items:[{label:"Holds your no",text:`"I can't cover it this month" (where you stand), "in the kitty by Friday" (your terms) and "I covered March, so this one's yours" (one reason, even without the opener).`,subs:[]},{label:"Invites another push",text:"",subs:[`"I'm skint, my insurance is due\u2026" is three reasons.`,`"That's difficult. It's just not fair\u2026" is the first trap: it argues about fairness.`,`"That's difficult, I'm a bit skint, and\u2026" is the second trap: it becomes a list.`]}]},bins:["holds your no","invites another push"]},{n:3,fmt:"Say it",stem:[`A regular client asked for five extra Instagram posts for free, and you said they weren't included. Now she writes: "Come on, we're such a good clie
