illing to go to for a quick sale?"`,ok:!1},{k:"D",t:`"I haven't really got a set budget in mind. What could you do on it?"`,ok:!1}],expl:{card:"The card: when buying, give your target as your budget, with a reason.",items:[{k:"A",ok:!0,text:`Right. It sounds like a fact about you, so he tries to make it work. Say he answers: "\xA3330 with the lights?" Now you can say: "If the lock's in too, \xA3318."`,subs:[]},{k:"B",ok:!1,text:"Your walk-away as your budget, so \xA3350 is now the least you'll pay.",subs:[]},{k:"C",ok:!1,text:"Asks his limit (lesson 1.1): his answer becomes your best price.",subs:[]},{k:"D",ok:!1,text:"You know the going rate (lesson 2.1), so this hands him the first number.",subs:[]}]}},{n:5,fmt:"Type it",stem:[`A parent wants you to teach her son guitar, two hours a week. Your rate is \xA332 an hour. She says: "We'd love you to do it, but we've only budgeted \xA322 an hour." Type the question that tests whether the budget is really the problem.`],quote:[],options:[],model:"If the budget weren't an issue, would I be the teacher you'd want?",checks:`contains one of: if, aside, to one side, apart from, setting, putting, forget, forgetting, ignore, ignoring, regardless, leaving, say, imagine, suppose, weren't, wasn't, didn't matter, only thing, only problem, only issue; contains one of: budget, money, price, cost, rate, fee, 22, 32; contains one of: want, choose, choosing, pick, go with, first choice, right person, the one, hire, hiring, book, booking, prefer, have me; contains none of: could you do, could you stretch, stretch, meet, middle, split, halfway, is fine, that's fine, I'd do, I could do, I can do, I'll do, do it for, come down, go down, drop, why, max, maximum, lowest, best price, most you, minimum, at least, can't go; no number except 22 and 32; contains "?"; 20 words or fewer. Whole words, any case.`,after:["The card: take money off the table first.",`Say she answers: "Honestly, yes, you're who we want." Now the only problem is money, so change what they get, not your rate: "Then how about \xA332 for one hour a week instead of two?"`,`Fails: dropping to her number ("I'd do \xA322"), splitting, "why" questions, and asking her maximum.`],modelRaw:`"If the budget weren't an issue, would I be the teacher you'd want?"`}],mission:`this week, write the "If budget weren't an issue\u2026" line you'd use the next time a client, boss or buyer says money's tight. Then set your budget (your target) for the next thing you'll buy second-hand.`}]}],opening:null,playbooks:[{n:1,title:"Your first job offer",points:[{n:1,tag:null,stem:[`You've told Sophie you're delighted. Sophie: "Great! Before I send it over, can I ask: are you talking to any other companies at the moment?"`],options:[{k:"A",t:`"Not really, no. You're my first choice by a mile."`,ok:!1},{k:"B",t:`"Ah, what's prompting the question?"`,ok:!0},{k:"C",t:'"Yes, and one of them has already offered me \xA332,000."',ok:!1},{k:"D",t:'"Why do you want to know that, out of interest?"',ok:!1}],expl:`B is lesson 1.6: you give nothing away, and she tells you what's behind it: "Ha, fair. Two of our grads have dropped out, and I'm trying to fill places for September." Now you know she needs you. Your Tuesday interview is far from certain, a weak plan B, so it stays private (4.3). A says you're not looking anywhere else, so she has no reason to give extras. C is a bluff she'll test: "Who's it from?" (2.7). D asks "why", which sounds like a challenge (1.6).`},{n:2,tag:null,stem:[`Sophie: "Just so you know, salary's the same for everyone on the scheme, so \xA328,000 is fixed."`],options:[{k:"A",t:'"Understood. In that case, could you help me out with the moving costs, to start with?"',ok:!1},{k:"B",t:'"Other grad schemes are paying around \xA330k, so could you stretch to \xA329k for me?"',ok:!1},{k:"C",t:'"OK. Then three things: the move, my review and my start date. The move matters most."',ok:!0},{k:"D",t:'"No problem at all, \xA328,000 is completely fine with me, honestly."',ok:!1}],expl:`C puts every ask on the table at once and says which matters most (7.1), so she can trade between them without you revealing a limit. A starts one at a time, so each later ask sounds like "one more thing". B pushes a number she's just said is fixed; when a budget really is fixed, change what you get, not the number (8.4). D says you're happy with nothing extra.`},{n:3,tag:null,stem:[`Sophie: "On the move, we can help. I've got \xA3750 in the budget for relocation."`],options:[{k:"A",t:`"That's really kind, thank you. \xA3750 will help a lot."`,ok:!1},{k:"B",t:`"It'll cost me \xA31,600 to move. Shall we meet at \xA31,175?"`,ok:!1},{k:"C",t:`"Deposit and first month come to \xA31,600. Who'd sign off the difference?"`,ok:!0},{k:"D",t:`"Moving's so expensive at the moment: the deposit, rent, a van, furniture, trains\u2026"`,ok:!1}],expl:`C tests her budget (8.4): is it a limit, or her opening number? One real cost with one reason makes the gap concrete (1.1). She says: "Actually, that's me. The policy goes up to \xA31,500, so let's do that." A treats her budget as a limit without testing it, so you get \xA3750. B offers the middle yourself instead of letting her offer it (3.6), so you get \xA31,175. D lists five costs, so she argues with the weakest ("We don't cover furniture") and stays at \xA3750 (4.2).`},{n:4,tag:null,stem:[`You asked if she could make it the full \xA31,600. The policy really stops at \xA31,500, so you've agreed that. Sophie: "On the review: grads move to \xA330,000 at their twelve-month review, if they're rated on track."`],options:[{k:"A",t:'"Could you just put me on \xA330,000 from day one, instead of waiting?"',ok:!1},{k:"B",t:`"That's fine. I'm sure I'll be on track by then anyway."`,ok:!1},{k:"C",t:'"Is there any way the review could come a bit earlier?"',ok:!1},{k:"D",t:`"If I'm rated on track at six months, could it move then?"`,ok:!0}],expl:`D turns the review into a bet (7.4): the firm pays the \xA32,000 early only if you've earned it by its own measure, so it's easy to say yes to. A pushes the fixed salary again. B accepts twelve months. C is vague, so you'll usually get: "Mark only moves reviews if there's a reason."`},{n:5,tag:null,stem:[`Sophie: "I like that. It's not my call, though. I'd have to take it to Mark, our head of talent."`],options:[{k:"A",t:`"No problem. Ping me an email once you've heard."`,ok:!1},{k:"B",t:'"Great. Would you be happy to argue for it when you see him?"',ok:!0},{k:"C",t:'"Could I speak to Mark myself, to save you the hassle?"',ok:!1},{k:"D",t:'"Happy to drop the move to \xA31,000, to make it easier for Mark."',ok:!1}],expl:`B handles the absent boss (8.1): get the person in front of you arguing for it. She says: "Definitely. Your assessment-day scores were the best in the group." Then: "Mark's said yes." A leaves her passing it on neutrally, and a no comes back from someone you can't argue with. C goes over her head, so you lose the one person on your side. D gives back \xA3500 while she's away, for nothing in return (8.1, 3.1).`},{n:6,tag:null,stem:[`Sophie: "Last thing: the start date. Could you start on the 1st with everyone else? It's induction day."`],options:[{k:"A",t:`"OK, the 1st it is. I'll sort the bar out somehow and just make it all work."`,ok:!1},{k:"B",t:'"Could we meet somewhere in the middle and call it the 8th, then?"',ok:!1},{k:"C",t:'"If I start on the 15th, I could still come up for induction on the 1st?"',ok:!0},{k:"D",t:`"It really does have to be the 15th, I'm afraid, or I can't take the place."`,ok:!1}],expl:`C is a swap (7.1), with your condition in the same sentence as your offer (3.1): one train trip costs you little and fixes her real worry, the whole cohort on day one, for the two weeks you need. She says: "Perfect. The 15th, and we'll see you at induction." A gives up the time you need. B offers the middle yourself (3.6), so you get the 8th. D is an ultimatum: you'll usually get the 15th, coolly, but then Friday is Friday, so you decide before Tuesday's interview (4.3).`},{n:7,tag:null,stem:[`Sophie: "Brilliant. I'll email it all over. I just need your answer by Friday."`],options:[{k:"A",t:`"Friday's absolutely fine. I'm sure I'll have made my mind up well before then."`,ok:!1},{k:"B",t:'"Is Friday a firm deadline, or is it more of a rough guide?"',ok:!1},{k:"C",t:`"I'm really keen. Could I confirm next Wednesday, once I've read it properly?"`,ok:!0},{k:"D",t:'"Would it be OK if I took a little longer than Friday to think it all over?"',ok:!1}],expl:`C is lessons 4.5 and 8.2: with a job offer, ask for one short, specific extension, sounding keen, with a reason, and never question whether the deadline's real. She says: "Honestly? As long as I hear by the end of next week, I can hold your place." Next Wednesday is the day after your interview. A decides before Tuesday. B asks her to judge her own deadline: "It's firm, I'm afraid." D is vague, so she picks: "Monday at the latest", still before Tuesday.`}],honest:"many UK graduate schemes pay everyone on the intake the same salary. What often can move: help with moving costs, your start date, when your first pay review happens, and the deadline to decide.",sees:`It's Wednesday afternoon. You've just finished uni in Bristol, and you've been offered a place on the graduate programme at Calder & Pike, an insurance firm in Leeds. The early careers manager, Sophie, is about to ring you with the details. Your goal: come off the call with as much as you can get on top of the salary.
- Your walk-away: if this falls through, you keep your bar job in Bristol and keep applying. You also have a final-round interview at another firm next Tuesday (around \xA330k, far from certain).
- Your target: help with moving (a deposit and first month's rent in Leeds come to about \xA31,600), your first pay review sooner than 12 months, a 15 September start (you owe the bar two weeks' notice and want a week to move), and until next Wednesday to decide, so you've had Tuesday's interview first.
- Keep private: that you have no other offer yet, and that you'd take this job even with nothing extra.`,hidden:`- Persona: Sophie Grant, early careers manager. Friendly, quick, organised, under time pressure. Warm, slightly scripted recruiter language.
- Real situation and pressures: two of her fourteen graduates have dropped out, and her target is a full cohort by the end of the month, about two and a half weeks away, for a 1 September start. She's judged on her acceptance rate, so she can't afford to lose a good candidate over small things.
- Opening line: "Hi, is that {name}? It's Sophie from Calder & Pike. Good news: we'd love to offer you a place on the graduate programme. It's \xA328,000, starting 1 September. How does that sound?" After the learner's first reply: "Before I send it over, can I ask: are you talking to any other companies at the moment?"
- Other offers: if the learner asks what's behind the question without answering it, she says: "Ha, fair. Two of our grads have dropped out, and I'm trying to fill places for September." If the learner invents an offer, she asks: "Who's it from? Could you send it over?"
- Salary: fixed at \xA328,000 for the whole intake, and this is true. She never moves it, however asked.
- Relocation: the policy pays up to \xA31,500. She opens with "I've got \xA3750 in the budget for relocation" (her own starting number, not a limit). She goes to \xA31,500 ("Actually, that's me. The policy goes up to \xA31,500, so let's do that") if the learner gives the real cost with one reason (\xA31,600) and either asks who could sign off more, asks what the policy allows, or tests the budget. If the learner then asks for the full \xA31,600: "The policy really stops at \xA31,500, I'm afraid." She agrees a split if the learner offers one. She stays at \xA3750 if thanked, or if given five vague reasons ("I'll see what I can do").
- Asks together or one by one: if the learner puts several asks on the table at once and says which matters most, she says "OK, let's go through them" and handles them as a package. If the asks come one at a time, by the third she says "Anything else, or is that everything?" and won't go later than the 8th on the start date.
- Pay review: graduates move to \xA330,000 at the 12-month review if rated "on track". Mark, head of talent, can bring it forward on the same criteria. If the learner proposes the rise at six months if they're rated on track, she likes it but says it's Mark's call. A plain "earlier review?" gets "Mark only moves reviews if there's a reason"; if the learner then adds the on-track condition, carry on as above.
- Mark: if the learner asks Sophie to back it, argue for it, or what would help her make the case, she does, and comes back: "Mark's said yes: rated on track at six months, you move to \xA330,000." If the learner says "let me know", or asks to speak to Mark directly ("He doesn't really do that"), Mark declines: "He'd rather keep it at twelve months." If the learner offers to give something up while she's checking, she takes it, and Mark's answer still depends on whether she was asked to back it.
- Start date: anything up to 22 September is possible, but she'd love the whole cohort at the induction day on 1 September. She asks "Could you start on the 1st with everyone else?" If the learner offers a swap that helps her (coming to the 1 September induction day, or doing the online pre-start course) in return for a 15 September start, she agrees at once. If the learner just gives the reason (two weeks' notice plus the move), she offers the 8th. If the learner suggests a midpoint, she agrees it (the 8th). An ultimatum ("the 15th or nothing") gets the 15th, but she cools: from then on she won't move the deadline past Friday, however it's asked.
- Deadline: Friday is her preference, not a rule. Her real limit is filling the cohort by the end of the month. If the learner asks for a specific later day with a reason, sounding keen, she says "Honestly? As long as I hear by the end of next week, I can hold your place", and agrees any day up to next Thursday. A vague "more time?" gets "Monday at the latest". "What happens if I miss Friday?" tells her the learner might not take it: "I'd need to know Friday, I'm afraid." "Is Friday a real deadline?" gets "It is, I'm afraid." The end of the month gets "I really need to know by next week."
- Tactics she uses (from the course): the question behind the question, "Are you talking to anyone else?" (1.6); the fixed salary, which is true (7.1, 8.4); the hot potato, "\xA3750 in the budget" (8.4); the absent boss, Mark (8.1); the Friday deadline (8.2).
- Warms up when: the learner sounds keen and specific, gives one reason per ask, or ranks their asks.
- Digs in when: the learner keeps pushing salary after she's said it's fixed, invents a competing offer, says the deadline must be fake, stacks up five reasons for one ask, or issues ultimatums.`,scoring:`Scored on first-year value on top of the fixed \xA328,000: relocation as agreed (\xA30 to \xA31,500), plus \xA31,000 if the six-month review is agreed (the \xA32,000 rise arriving six months early).
- Top: \xA32,500.
- Strong: \xA31,500 to \xA32,499.
- OK: \xA3750 to \xA31,499.
- Missed: under \xA3750.
Tie-breakers within a band: a decision deadline after Tuesday's interview (next Wednesday or Thursday), and a 15 September start.

Moves to reward:
- Answered "Are you talking to anyone else?" with a question, without lying or showing they had nothing (1.6, 4.3).
- Kept the uncertain Tuesday interview to themselves (4.3).
- Once told salary was fixed, put every ask on the table at once and said which mattered most (7.1).
- Tested the "\xA3750 in the budget" with the real cost and one reason, or asked what the policy allows (8.4, 7.2, 1.1).
- Made the early review a bet on their own "on track" rating (7.4).
- Got Sophie arguing for the review with Mark, instead of just passing it on (8.1).
- Offered a cheap swap (the induction day) for the 15 September start (7.1, 3.1).
- Asked for one specific later day, keenly, with a reason (4.5, 8.2).

Mistakes to flag:
- Said they had no other options, or bluffed an offer (4.3).
- Kept pushing salary after it was fixed (7.1, 8.4).
- Asked for things one at a time (7.1).
- Took the \xA3750 without testing it, or offered to split it (8.4, 3.6).
- Gave five reasons for one ask (4.2).
- Said "let me know what he says", or asked to go over Sophie's head (8.1).
- Offered to give something up while Mark was deciding (8.1, 3.1).
- Issued an ultimatum over the start date (4.3).
- Asked whether Friday was real, asked for "a bit more time", or agreed a date before Tuesday (8.2).`,guidedCheck:"following every \u2713 gives \xA31,500 relocation (Point 3) plus the six-month review (Points 4 and 5, +\xA31,000) = \xA32,500, which is Top. It also wins both tie-breakers: a 15 September start (Point 6) and until next Wednesday to decide (Point 7). Every \u2713 meets the hidden rule that unlocks the next concession.",debrief:`- Opening: "You came away with {relocation_amount} towards your move, {review_outcome}, a start on {start_date}, and until {deadline} to decide. On top of a fixed \xA328,000, that's worth {first_year_value} in your first year."
- On the other-offers question: "She asked if you were talking to anyone else. You said: '{learner_other_offers_line}'. {If asked back: 'You gave nothing away, and found out she had two places to fill.' / If revealed or bluffed: 'That told her {you had no other options / you had an offer she could ask to see} (lessons 4.3 and 1.6).'}"
- On the fixed salary: "When Sophie said salary was fixed, you said: '{learner_line_after_fixed}'. {If all asks at once: 'Putting everything on the table at once let her trade between them.' / If one at a time or salary again: 'Next time, put every ask on the table at once and say which matters most (lesson 7.1).'}"
- On the relocation budget: "She said she had \xA3750 in the budget. You said: '{learner_relocation_line}'. {If \xA31,500: 'The budget was her own opening number, and testing it doubled it.' / If not: 'Her policy went to \xA31,500. Testing the budget would have found it (lesson 8.4).'}"
- On the review: "You said: '{learner_review_line}', and when it went to Mark: '{learner_authority_line}'. {If six months: 'A bet on your own rating, with Sophie arguing for it, got the rise six months early.' / If not: 'It came back as a no from someone you never spoke to (lessons 7.4 and 8.1).'}"
- On the start date: "She asked for the 1st. You said: '{learner_start_line}'. {If a swap: 'One train trip for induction bought you the two weeks you needed.' / If not: 'Offer something cheap for you that she wants, like coming to induction, in return for the date you need (lesson 7.1).'}"
- On the deadline: "She said Friday. You said: '{learner_deadline_line}'. {If next Wednesday or Thursday: 'A keen, specific request got you past Tuesday's interview.' / If not: 'Ask for one specific later day, sounding keen, with a reason (lessons 4.5 and 8.2).'}"
- Close: "Compare that with your walk-away: the bar job, plus Tuesday's interview. How much better off are you? (lesson 2.2)" Then the one move to practise next, picked from the biggest flagged mistake.`,bands:[{band:"Top",text:"\xA32,500."},{band:"Strong",text:"\xA31,500 to \xA32,499."},{band:"OK",text:"\xA3750 to \xA31,499."},{band:"Missed",text:"under \xA3750."}]},{n:2,title:"Selling and buying on Vinted and Marketplace",points:[{n:1,tag:"Vinted",stem:[`maya.thrifts: "Hiii would you take \xA370? I've seen the same one on here for \xA380 x"`],options:[{k:"A",t:`"Sorry, \xA370's way too low for a jacket like this one."`,ok:!1},{k:"B",t:'"Hiii, ooh which one? Screenshot it for me? x"',ok:!0},{k:"C",t:'"OK, could you meet me at \xA395 then? x"',ok:!1},{k:"D",t:`"I bet that one's not in as good nick as mine."`,ok:!1}],expl:`B tests her competition (2.7): a real listing takes seconds to screenshot. She replies "it's gone now \u{1F648}", and her \xA380 goes with it. Copying her "Hiii" is lesson 6.3. A says no without a number, so the haggling starts from hers (2.2). C drops \xA325 for a listing you never saw. D argues about it instead of checking it.`},{n:2,tag:"Vinted",stem:[`maya.thrifts: "it's gone now \u{1F648} tbh I need to know in 10 mins, I'm looking at another one. \xA385?"`],options:[{k:"A",t:`"OK, \xA385 is fine, I'll go ahead and accept your offer now."`,ok:!1},{k:"B",t:`"I've had loads of other offers, so probably not, sorry."`,ok:!1},{k:"C",t:'"Can I sleep on it and get back to you?"',ok:!1},{k:"D",t:'"No stress if you find another. Yours for \xA3114 x"',ok:!0}],expl:`D takes the bite out of her 10 minutes (8.2): you'd be fine either way, so the clock stops working. And it names your own precise number, near the top of the \xA395 to \xA3125 these sell for, a touch under for the cuff (2.3). She comes back: "meet me at \xA3110? x". A gives up \xA335 to a clock you can't check. B is a bluff (2.7): you've had no other offers, so if she asks who, you're caught. C gives her no number, so she'll usually move on.`},{n:3,tag:"Vinted",stem:[`You came back with "\xA3112 and it's yours x". She replied "ok \xA3111 and that's me done, will pay tonight x", and you said yes. Next day there was no payment, so you sent "Hiya, all ok for paying today? x". That was yesterday, and she still hasn't replied. What do you send now?`],options:[{k:"A",t:'"Hiya, did you see my last message? x"',ok:!1},{k:"B",t:'"Hiya! I could do \xA3105 instead, to help? x"',ok:!1},{k:"C",t:`"No worries at all if you've changed your mind! x"`,ok:!1},{k:"D",t:'"Hiya, have you gone off the puffer? x"',ok:!0}],expl:'D is lesson 1.5: she started this, and your normal chase has been ignored, so ask in a way where "no" is the easy reply, and "no" means she still wants it: "omg no sorry!! mad week, paying now x". A asks for a yes again, and a yes commits her, so silence is easier: another day of nothing, then "could you do \xA3100?". B drops \xA36 for nothing in return (3.1). C hands her the way out (1.1): "ah ok, found one cheaper anyway x".'},{n:4,tag:"Marketplace",stem:[`Dan: "hey yeah still available. \xA3180, they're \xA3320 new"`],options:[{k:"A",t:'"Is it all in good working order, would you say?"',ok:!1},{k:"B",t:`"What's playing up on it these days?"`,ok:!0},{k:"C",t:'"Honestly, how low would you be willing to go?"',ok:!1},{k:"D",t:`"How long have you had it, and how often's it played?"`,ok:!1}],expl:`B assumes something's wrong (1.2), so he tells you: "the input jack crackles a bit tbh". That's where the lead plugs in, about \xA320 to fix, so it's \xA320 off. A is yes/no: "yep all good". C asks his limit, so his answer becomes the best you'll get (1.1). D is open but about the guitar's history, so you get "3 years, now and then".`},{n:5,tag:"Marketplace",stem:['Dan: "just the jack, easy fix. what you thinking?"'],options:[{k:"A",t:'"Similar ones go for \xA3130 to \xA3170, so somewhere around \xA3150?"',ok:!1},{k:"B",t:'"OK. Would you do \xA3165 if I came round tonight?"',ok:!1},{k:"C",t:'"Fair. With the jack needing a \xA320 fix, I can give you \xA3124."',ok:!0},{k:"D",t:`"I could do \xA3120. The jack's gone, it's three years old, and it's only a Squier."`,ok:!1}],expl:`C names a precise number with one reason (2.3, 4.2), as what he gets (2.5). A precise number looks worked out, so he pushes back less: "\xA3150 is my final offer mate". A is round, with "around", from the middle of the range, so you'll usually pay \xA3150 or more. B starts near the top, on a guitar with a fault, so you'll usually pay \xA3160 or more. D gives three reasons, so he argues with the weakest: "nothing wrong with a squier mate" (4.2).`},{n:6,tag:"Marketplace",stem:[`You've offered \xA3124, with the jack as your reason. Dan: "\xA3150 is my final offer mate"`],options:[{k:"A",t:'"OK, fair enough, \xA3150 it is. When can I come round?"',ok:!1},{k:"B",t:'"Shall we just meet in the middle and say \xA3137?"',ok:!1},{k:"C",t:'"Seems silly to lose it over \xA326, I could come tomorrow."',ok:!0},{k:"D",t:`"That's a bit cheeky when the jack's actually broken, mate, to be fair."`,ok:!1}],expl:`C is lesson 3.6: point out the gap is small, and let him suggest the split, so he gives ground first. He says: "go on then, meet in the middle? \xA3137". His "final" offer has just moved \xA313 (4.4: carry on rather than argue with "final"). A takes "final" at face value. B makes you the one who gives ground, and you'll usually end up paying \xA3137. D complains but asks for nothing.`},{n:7,tag:"Marketplace",stem:['Dan: "go on then, meet in the middle? \xA3137"'],options:[{k:"A",t:`"Deal, \xA3137 it is. I'll bring the cash round to yours tomorrow."`,ok:!1},{k:"B",t:`"So \xA3137 works. With the jack, \xA3130 and I'll come tomorrow?"`,ok:!0},{k:"C",t:`"Fair. So what's the lowest you'd actually go then?"`,ok:!1},{k:"D",t:`"\xA3137's still a lot for a guitar with a dodgy jack."`,ok:!1}],expl:`B treats his \xA3137 as his new position and haggles from there (3.6), moving you just \xA36 from your \xA3124 (3.3), with the jack as your one reason and tomorrow as your day. He says: "fine \xA3130, come tomorrow after 6". A pays \xA37 over your target. C asks his limit, so his answer becomes the best you'll get. D complains but names no number.`},{n:8,tag:"collection",stem:[`You agreed \xA3130 by message, and you've turned up on Tuesday with cash. Dan: "actually someone's just offered me \xA3160, so it'd need to be \xA3150 really"`],options:[{k:"A",t:`"OK, fine. I've come all this way now, so \xA3150."`,ok:!1},{k:"B",t:'"Split the difference with me? Call it \xA3140?"',ok:!1},{k:"C",t:'"Oh right. What time are they picking it up?"',ok:!0},{k:"D",t:`"Come off it, mate. There's no other buyer, you're making that up."`,ok:!1}],expl:`C tests his rival buyer (2.7): a real one has a time to collect. He hasn't: "erm\u2026 not sure tbh. go on, \xA3130's fine". Even at \xA3150, you'd still be under your \xA3155 plan B (4.3). A pays \xA320 because you've made the trip. B pays him \xA310 for going back on the deal, and the middle is set by his made-up number (3.5). D calls him a liar instead of testing the claim, so he'll usually dig in to save face: "\xA3145 or I wait for him" (2.7).`}],intro:"Two rounds: first you sell, then you buy.",sees:`*Round 1, selling on Vinted.* You're selling your black North Face Nuptse puffer, size M, worn for two winters, with a small mark on one cuff. You've listed it at \xA3120. On eBay, sold listings for similar ones went for \xA395 to \xA3125. A buyer has just messaged. Your goal: sell it, and get paid, as close to your listing as you can.
- Your walk-away: \xA390. Below that, you'd rather keep it for another winter.
- Your target: \xA3110.

*Round 2, buying on Marketplace.* You want a Squier Stratocaster to learn on. One's listed 15 minutes away at \xA3180, with a gig bag. Used ones like it go for \xA3130 to \xA3170. Your goal: get it at a good price.
- Your walk-away: \xA3155. There's a similar one across town at \xA3155 that you could collect on Sunday.
- Your target: \xA3130.
- You can collect any evening this week and pay cash.`,hidden:`*Round 1 buyer: maya.thrifts.*
- Persona: a reseller who flips branded jackets on Depop. Short, friendly messages, lots of "x" and emojis. Never admits she resells.
- Real situation: she sells this jacket for around \xA3150 on Depop, where sellers pay no fee, so anything up to \xA3112 still works for her. No time pressure at all.
- Opening line: "Hiii would you take \xA370? I've seen the same one on here for \xA380 x"
- Walk-away: \xA3112 for the jacket alone.
- The \xA380 listing doesn't exist. If asked which one, or for a link or screenshot: "it's gone now \u{1F648}". If the learner drops their price because of it without asking, she pushes from \xA380.
- Concessions: after the comparison, she sets a fake deadline: "tbh I need to know in 10 mins, I'm looking at another one. \xA385?" A no without a number keeps her at \xA385. Any precise counter under \xA3110 gets \xA395; a second precise counter from \xA3105 to \xA3125 then gets "\xA3100 and that's me done x". A precise \xA3110 to \xA3125, with the 10 minutes calmly brushed off, gets "meet me at \xA3110? x". Above \xA3125, she counters \xA3100; if the learner then names a precise \xA3110 to \xA3125, she settles at \xA3110. After "meet me at \xA3110", if the learner asks for a little more, she goes to \xA3111 ("ok \xA3111 and that's me done, will pay tonight x"). She never goes above \xA3112.
- After the deal: once a price is agreed, she goes quiet without paying and ignores the first ordinary chase ("All ok for paying today?"). If the learner then sends one line asking whether she's gone off it or given up on it, she replies at once ("omg no sorry!! mad week, paying now x") and pays the agreed price. A second chase for a yes ("Still interested?", "Did you see my message?") gets no reply for another day, then "sorry could you do \xA3100? money's tight this month x". A price drop gets taken at the new price. "No worries if you've changed your mind" gets "ah ok, found one cheaper anyway x", and no sale. If the learner's very first chase is the gone-off line, she still replies, but flag it in the debrief as early (1.5).
- Warms up when: replies are quick, friendly, precise, and copy a word or two of hers. Digs in when: the learner argues about her taste, insults the offer, or writes a paragraph justifying the price.

*Round 2 seller: Dan.*
- Persona: 26, relaxed, slightly disorganised, types in lowercase. Likes to sound in demand.
- Real situation: he flies to Melbourne next Thursday and needs the guitar gone. He bought it new for \xA3320 three years ago. The input jack crackles and needs replacing (about \xA320 at a guitar shop). Two people said they'd come round; neither turned up.
- Opening line: "hey yeah still available. \xA3180, they're \xA3320 new"
- Walk-away: \xA3120.
- Information: only a question that assumes something's wrong ("What's playing up?", "What needs fixing?") gets the jack. Open or yes/no questions about the guitar get good news only ("plays great", "3 years, now and then"). A question about him or why he's selling gets Melbourne and the no-shows. A mirror or a test of his "loads of people asking" gets the no-shows.
- After the jack comes out: "just the jack, easy fix. what you thinking?" If the learner asks how much interest he's had, or asks for a discount before the fault is out: "had loads of people asking tho".
- Concessions: \xA3160 if the learner just asks for a discount. A round offer with the jack as the reason (\xA3120, \xA3130), or an offer with a pile of reasons, gets "nah \xA3155 is my final offer mate" (to a pile, he first argues the weakest: "nothing wrong with a squier mate"). A precise offer with the jack as its one reason gets "\xA3150 is my final offer mate". If the learner then says the gap is small or a shame, without proposing a number, he offers the split himself: the midpoint of \xA3150 and their last offer (for \xA3124, "meet in the middle? \xA3137"). If the learner proposes the split, he takes it at the midpoint. After his own split, a precise number with one reason and a collection day before Thursday gets "fine \xA3130" (or the learner's number, if it's \xA3130 or more).
- At collection: "actually someone's just offered me \xA3160, so it'd need to be \xA3150 really" (nobody has). If the learner asks who or when, or calmly offers to leave it for the other buyer, he folds at once to the agreed price. If they accuse him, he gets prickly and digs in to save face: "believe what you want, \xA3145 or I wait for him." If they offer to split, he takes it. If they pay, he takes \xA3150.
- Warms up when: the learner is friendly, asks about the guitar or about him. Digs in when: the learner lowballs before asking anything, or calls him a liar.`,scoring:`- Round 1 (price paid for the jacket): Top \xA3110 or more. Strong \xA3100 to \xA3109. OK \xA390 to \xA399. Missed: below \xA390, or no sale.
- Round 2 (price paid): Top \xA3130 or less. Strong \xA3131 to \xA3145. OK \xA3146 to \xA3155. Missed: above \xA3155, or paying more than the agreed price at collection.

Moves to reward:
- Asked to see the "\xA380" listing before moving (2.7).
- Took the bite out of the 10-minute deadline and answered with a precise number high in the market (8.2, 2.3, 2.2).
- Copied a word or two of maya's early (6.3).
- When maya ignored a normal chase after agreeing, sent one line asking if she'd gone off it, instead of chasing again or dropping the price (1.5).
- Opened the guitar chat with a question that assumes something's wrong (1.2).
- Made a precise offer with the jack as its one reason (2.3, 4.2).
- Tested his "loads of people asking" (1.4, 2.7).
- After "final offer", got Dan to suggest the split, then haggled from his halfway (3.6, 4.4).
- Moved in small steps with one reason (3.3, 4.2).
- At collection, tested the "\xA3160 buyer" (2.7, 4.3).

Mistakes to flag:
- Dropped the price because of a listing they never saw (2.7).
- Rushed by the 10-minute clock (8.2).
- Chased maya's silence with a price drop or "no worries if not" (3.1, 1.1).
- Sent the gone-off line as the very first chase, before a normal one had been ignored (1.5).
- Asked for Dan's lowest price (1.1: his answer becomes the best you'll get).
- Named a price before finding the fault (1.2).
- Accepted "final offer" at face value (4.4).
- Proposed the split themselves (3.6).
- Paid more at collection, or split after he went back on the deal (3.5).
- Called him a liar or got cross (2.7, 6.4).
- Paid above \xA3155 with the Sunday guitar available (4.3).`,guidedCheck:"following every \u2713 gives \xA3111 paid for the jacket (Round 1 Top, against maya's \xA3112 walk-away) and \xA3130 for the guitar (Round 2 Top, against Dan's \xA3120 walk-away). Every \u2713 meets the hidden rule that unlocks the next step.",debrief:`- Opening: "You sold the jacket for {r1_price} (target \xA3110, walk-away \xA390) and bought the guitar for {r2_price} (target \xA3130, walk-away \xA3155). Across both, that's {total_vs_target} against your targets."
- On the comparison: "maya said she'd seen it for \xA380. You said: '{learner_line_comparison}'. {If asked for it: 'The listing vanished, and so did the \xA380.' / If dropped: 'You dropped to {price} for a listing you never saw (lesson 2.7).'}"
- On the deadline: "She gave you 10 minutes. You said: '{learner_line_deadline}'. {If calm with a precise number: 'The clock stopped working, and she came up to {price}.' / If rushed: 'A clock you couldn't check cost you {difference} (lesson 8.2).'}"
- On the silence: "After you'd agreed, maya went quiet and ignored your first chase. You sent: '{learner_line_silence}'. {If asked whether she'd gone off it: 'She replied straight away and paid.' / If chased, dropped or let her off: 'That {cost you {difference} / lost the sale}. One line asking if she'd gone off it gets people replying to say they haven't (lesson 1.5).'} {If the gone-off line was the very first chase: 'It worked, but it came early: send a normal chase first, and save this line for when that's ignored (lesson 1.5).'}"
- On the guitar opener: "Dan opened with '\xA3320 new'. You said: '{learner_line_opener}'. {If fault found: 'That's how you found out about the crackly jack, and it was your reason for every number after.' / If not: 'You never heard about the jack, which was worth about \xA330 to you: the \xA3160 he gives anyone who just asks, against the \xA3130 you could have got (lesson 1.2).'}"
- On "final offer": "He said \xA3150 was final. You said: '{learner_line_final}'. He then went to {next_price}."
- On the re-trade: "At his door he asked for \xA3150. You said: '{learner_line_retrade}'. {If held at \xA3130: 'He folded straight away: there was no other buyer.' / If paid more: 'There was no \xA3160 buyer. Asking when they were coming would have saved you {difference} (lesson 2.7).'}"
- Close: "Compare those prices with your walk-aways, \xA390 for the jacket and \xA3155 for the guitar. How much better off are you? (lesson 2.2)" Then the one move to practise next.`,bands:[{band:"Top",text:""},{band:"Strong",text:""},{band:"OK",text:""},{band:"Missed",text:""}]},{n:3,title:"Buying a used car",points:[{n:1,tag:null,stem:[`After the test drive. Craig: "She's a lovely little car, isn't she?"`],options:[{k:"A",t:'"Has anything ever gone wrong with her at all?"',ok:!1},{k:"B",t:`"What's she going to need in the next year?"`,ok:!0},{k:"C",t:'"Has she got a full service history with her?"',ok:!1},{k:"D",t:`"What's the best you can do on the price, then?"`,ok:!1}],expl:`B assumes she'll need something (1.2), so Craig tells you: "Couple of tyres, maybe, and the MOT's due in two months." Both are reasons to pay less. A makes "no, never" the easy answer. C gets "yep, full history", a claim, not the record. D asks him to judge his own price (1.1): "\xA36,995's a great price."`},{n:2,tag:null,stem:[`Craig: "She was \xA37,495 last month, so at \xA36,995 you're already \xA3500 better off. Shall we do the paperwork?"`],options:[{k:"A",t:'"AutoTrader has them from \xA36,300, and she needs tyres. \xA36,150 all-in?"',ok:!0},{k:"B",t:`"So that's \xA3500 off already? Brilliant. Could you go to \xA36,500?"`,ok:!1},{k:"C",t:'"Honestly, I could probably stretch to about \xA36,800 if we did it today."',ok:!1},{k:"D",t:'"Is \xA36,995 really the very best you can do on her today, though?"',ok:!1}],expl:`A ignores last month's price, which is only there to make \xA36,995 feel like a discount (2.6), and starts from your own number based on the market (2.2), with one reason and every fee included (8.3). Craig: "\xA36,150? You'll have to do better than that." B treats the "was" price as real and starts \xA3200 above your target. C starts close to his price, and "stretch" says there's more. D asks him to judge his own price.`},{n:3,tag:null,stem:[`Craig: "\xA36,150? You'll have to do better than that."`],options:[{k:"A",t:'"Better by how much, roughly?"',ok:!0},{k:"B",t:'"OK, OK. How about \xA36,300, then?"',ok:!1},{k:"C",t:`"Fine, \xA36,350, but that's my absolute limit."`,ok:!1},{k:"D",t:`"Why, what's wrong with \xA36,150?"`,ok:!1}],expl:`"You'll have to do better" is a trap to get you raising your own offer with nothing back (3.2). A makes him name a number: "Get to \xA36,450 and she's yours." That's \xA3545 off his price, and you haven't moved. B raises your own offer by \xA3150 with no counter. C raises it and tells him your limit. D invites him to list everything wrong with your number.`},{n:4,tag:null,stem:[`Craig: "Get to \xA36,450 and she's yours. Honestly, she's a cracking little car." He's at \xA36,450, you're at \xA36,150, and you're stuck. You know what Polos sell for, but he knows far more than you about what an MOT that's nearly due could cost you.`],options:[{k:"A",t:'"Honestly, Craig, if you were buying, would you pay \xA36,450 for her yourself?"',ok:!1},{k:"B",t:'"Craig, in my shoes, with the MOT due in two months, what would you do?"',ok:!0},{k:"C",t:`"OK, I'll go to \xA36,300, but that's honestly as high as I can go on her."`,ok:!1},{k:"D",t:`"Come on, Craig, she's not worth anything like \xA36,450 with the MOT that close."`,ok:!1}],expl:`B asks his advice as an open question (1.3): you're stuck after both numbers, and the MOT is a problem he understands better than you, so he stops defending his price and starts solving it. "Honestly? I wouldn't drive off with the MOT due that soon. I'll get her a fresh MOT before you collect." You haven't moved a penny. A is the yes/no version: "In a heartbeat, mate." C jumps \xA3150 and calls it your limit (3.3). D argues, so he defends: "Every one I sell's worth it."`},{n:5,tag:null,stem:[`Craig: "Fresh MOT at \xA36,450, then. But I've got a couple coming to see her at 3, so I can't hold that past lunch."`],options:[{k:"A",t:`"OK, if she's really going at 3, let's just do the \xA36,450 now and get it sorted."`,ok:!1},{k:"B",t:'"Could you hold the \xA36,450 for me until tomorrow morning, so I can have a think?"',ok:!1},{k:"C",t:`"No problem if they take her. I'm seeing another Polo at 5 and deciding tonight. \xA36,240 with the MOT?"`,ok:!0},{k:"D",t:`"Come on, Craig, there's no couple really coming at 3, is there? I wasn't born yesterday."`,ok:!1}],expl:`C answers his clock with your own real one (8.2): you'd be fine if the couple took her, and you're deciding tonight, so if he doesn't deal, he loses you. Then you move \xA390, only after he's come down (3.3). Craig: "Let me see what I can do." A pays \xA3300 more because of a clock you can't check. B asks him to hold \xA36,450, so \xA36,450 becomes the number, and it treats a clock you can't check as real (8.2). D accuses him, so he digs in (2.7).`},{n:6,tag:null,stem:[`Craig: "Let me see what I can do. How are you paying, by the way? If it's finance, what sort of monthly works for you?"`],options:[{k:"A",t:'"Around \xA3150 a month would be ideal for me, to be honest."',ok:!1},{k:"B",t:`"I'm paying cash today, so what's the best total you can do?"`,ok:!1},{k:"C",t:`"I'd rather settle the total before we talk payments."`,ok:!0},{k:"D",t:`"What's the longest you could spread the payments over?"`,ok:!1}],expl:`the monthly question lets him hit any figure by adding months while the total climbs (8.3). C keeps the haggling on the total. Craig: "Look, \xA36,350 all-in with the MOT. That's my final offer." A hands him a monthly target, so he'll quote a 48-month plan on the full \xA36,995. B keeps to the total, but gives away paying today for nothing and asks him to judge his own price (1.1, 3.1): "Cash? Then \xA36,450's a great price." D asks for the longest term, which costs most.`},{n:7,tag:null,stem:[`Craig: "Look, \xA36,350 all-in with the MOT. That's my final offer."`],options:[{k:"A",t:`"OK, \xA36,350's fine by me. Where do I sign, and when can I collect?"`,ok:!1},{k:"B",t:'"Could we meet in the middle, then, and call it \xA36,295?"',ok:!1},{k:"C",t:`"So \xA36,350's where you are on price today. Could the tyres go in at that?"`,ok:!0},{k:"D",t:`"Come on, that's not really final, Craig. Everyone says that."`,ok:!1}],expl:`C says his "final" back as today's price, so it isn't fixed for good, and moves the haggling to what's included (4.4). Two new tyres are worth about \xA3250 to you. Craig: "Tyres as well? That's Gary's call." A takes "final" at face value, with the tyres still to do. B suggests the split yourself instead of letting him offer it (3.6): "Call it \xA36,325, and that's with no tyres." D argues with "final", so he has to stick to it to save face.`},{n:8,tag:null,stem:[`Craig: "Tyres as well? That's Gary's call. I'll go and ask him."`],options:[{k:"A",t:`"No rush. Come and find me when you've spoken to him."`,ok:!1},{k:"B",t:'"Could I come and talk to Gary about it myself?"',ok:!1},{k:"C",t:'"And if he says no, I could probably go to \xA36,400."',ok:!1},{k:"D",t:`"Sure. If he's OK with it, are we signing today?"`,ok:!0}],expl:`with a boss in the back, the risk is a second squeeze (8.1). D pins it: if Gary says yes, the deal's done today. Gary: "Go on then. \xA36,350 all-in, MOT and two new tyres." A leaves room for "Tyres, yes, but then it's \xA36,450." B goes over Craig's head, so you lose the one person arguing your side. C gives away \xA350 before you've heard anything, for nothing in return (8.1, 3.1).`}],sees:`You need a car for your new job, and you've found a 2017 VW Polo 1.0 SE with 58,000 miles at a small independent dealer, advertised at \xA36,995. On AutoTrader, similar Polos with similar miles are listed at \xA36,300 to \xA36,900. You've test-driven it and liked it. Your goal: buy it at a good price including every fee (the all-in price), or walk away and buy your backup.
- Your walk-away: \xA36,600 all-in. Your backup is another 2017 Polo from a private seller for \xA36,300, with 74,000 miles, an MOT due next month and tyres that need doing (about \xA3250 more), and no dealer to go back to if anything goes wrong. You're seeing it at 5pm today, and you'll buy one of the two tonight.
- Your target: \xA36,300 all-in with a fresh MOT, or the same value another way (two new tyres are worth about \xA3250 to you).
- You're paying from savings and can pay today. Only offer that in return for something. Keep your walk-away to yourself.`,hidden:`- Personas: Craig, the salesman: chatty, matey, "between you and me". Gary, the sales manager: blunt, stays in the back office; Craig takes anything above his own limit to him.
- Real situation and pressures: the Polo has been on the forecourt for 47 days and is costing them money. They bought it at auction for \xA35,300 and spent \xA3300 on prep. Craig is three cars short of his month-end target, and it's the last week of the month. The MOT runs out in two months, two tyres are near the legal limit, there's a small scrape on the rear bumper, and the service history has a gap (nothing recorded for 2022).
- Opening line (Craig): "She's a lovely little car, isn't she?" Once price comes up: "She was \xA37,495 last month, so at \xA36,995 you're already \xA3500 better off." (The car was never listed at \xA37,495.)
- Walk-away: \xA36,150 all-in with no extras. \xA36,200 all-in with a fresh MOT. \xA36,350 all-in with a fresh MOT and two new tyres.
- Information: only a question that assumes something will need doing gets the tyres and the MOT date. Open or yes/no questions ("Tell me about her", "Any problems?") get "She's been great, full history". Asking to see the service record shows the 2022 gap.
- First number: if the learner counters from his \xA36,995 or the "was" price (anything above \xA36,450 without market evidence, or offering a split from \xA36,995), Craig says "Let me see what I can do" and the price stays above \xA36,600 unless the learner later re-anchors on the market. If the learner names a number from market evidence with a reason (anything up to \xA36,450), Craig: "You'll have to do better than that."
- The vise: if the learner raises their own offer without a counter, each raise becomes the new floor. If they ask how much better, Craig names a number: "Get to \xA36,450 and she's yours. Honestly, she's a cracking little car."
- Advice: if, while they're stuck, the learner asks Craig's advice as an open question (what he'd do in their shoes, given the MOT or the tyres), he switches from defending the price to solving their problem: "Honestly? I wouldn't drive off with the MOT due that soon. Tell you what, I'll get her a fresh MOT before you collect." The price stays \xA36,450, now with a fresh MOT (it costs the dealer little in its own workshop). A yes/no version ("Would you pay \xA36,450 for her?") gets "In a heartbeat, mate." Arguing the car isn't worth it gets "Every one I sell's worth it."
- Deadline: "I've got a couple coming to see her at 3, so I can't hold that past lunch." (There is no couple.) If the learner stays calm (fine if the car goes) and tells him their own real deadline (seeing another Polo at 5, deciding tonight) or that they have other options, then moves a small step with the MOT included, Craig says "Let me see what I can do" and asks how they're paying. If they're rushed, or reveal a deadline that only costs them ("I need a car for Monday"), the price stays at \xA36,450: "Then you'd better grab her."
- Monthly: "How are you paying, by the way? If it's finance, what sort of monthly works for you?" If the learner names a monthly figure or asks about terms, Craig quotes a 48-month plan on the full \xA36,995 and stops moving on price. If the learner offers paying today for nothing and asks his best total: "Cash? Then \xA36,450's a great price." If the learner keeps to the total: "Look, \xA36,350 all-in with the MOT. That's my final offer."
- Final offer: if accepted, the deal is \xA36,350 all-in with a fresh MOT. If the learner offers a split, he meets them only part way: "Call it \xA36,325, and that's with no tyres." If they accept that the price is where he is today and ask for the two tyres within it, Craig: "Tyres as well? That's Gary's call." If they argue that it can't be final, he digs in at \xA36,350.
- The absent boss again: if the learner pins it ("if Gary says yes, are we done today?"), Gary agrees: \xA36,350 all-in, fresh MOT and two new tyres. If the learner says "let me know", Gary comes back: "Tyres, yes, but then it's \xA36,450." If the learner asks to speak to Gary directly, Craig cools and Gary says no to the tyres. If the learner offers more while Craig's away, he takes it.
- The \xA3199 admin fee: only appears if the learner has never said "all-in" or asked for the total. Dropped at once if the learner says a fee everyone has to pay should be in the advertised price (the law since April 2025), or holds the all-in number.
- Paint protection at \xA3249 (optional): pushed at the paperwork ("most people take it"), dropped the moment it's declined, included free if the learner asks for it inside the agreed price.
- Tactics they use (from the course): the fake "was" price (2.6); the vise, "You'll have to do better than that" (3.2); the couple at 3 (8.2); the monthly question (8.3); "final offer" (4.4); the boss in the back (8.1); the admin fee (8.3, 7.2).
- Warms up when: the learner is friendly, knows the market, names specific faults, and stays calm. Craig likes a buyer who can pay today.
- Digs in when: the learner insults the car or him, says the couple at 3 is made up, makes a silly offer with no reason (\xA35,000), or repeats the same demand louder. If the learner walks out calmly with a number above \xA36,150 on the table, Craig rings back within the hour with "\xA36,350 all-in with the MOT".`,scoring:`Effective price: the all-in price (including every fee), minus \xA3250 if two new tyres are included.
- Top: \xA36,300 or less, with a fresh MOT.
- Strong: \xA36,301 to \xA36,450.
- OK: \xA36,451 to \xA36,600 (under your walk-away).
- Missed: above \xA36,600, or paying the admin fee or paint protection without noticing. Walking away calmly when they wouldn't go under \xA36,600 counts as a good result, not a miss.

Moves to reward:
- Asked a question that assumes something will need doing (1.2).
- Ignored the "was \xA37,495" and started from the market with their own precise number (2.6, 2.2, 2.3).
- Talked all-in from the start (8.3).
- Answered "You'll have to do better than that" by making Craig name a number (3.2).
- When stuck, asked Craig's advice as an open question, so he started fixing the MOT problem (1.3).
- Made the 3 o'clock couple cost them nothing, and told Craig their own real deadline: deciding tonight (8.2).
- Kept their steps shrinking (3.3).
- Kept to the total when asked about monthly payments (8.3).
- Said "final" back as today's price and asked for the tyres within it (4.4).
- Pinned the deal before it went to Gary (8.1).
- If the admin fee appeared: pointed out that a compulsory fee belongs in the advertised price (7.2).
- Used paying today as a trade, not a free extra (3.1).

Mistakes to flag:
- Named a price before finding the faults (1.2).
- Treated the "was" price as real, or countered from \xA36,995 (2.6, 2.2).
- Raised their own offer after "You'll have to do better" (3.2).
- Rushed by the 3 o'clock couple, accused him of making them up, or told him a deadline that only costs them (8.2, 2.7).
- Named or haggled a monthly payment (8.3).
- Accepted "final" at face value, or split it (4.4, 3.6).
- Said "let me know" when it went to Gary, or offered more while he was away (8.1, 3.1).
- Revealed the walk-away, or offered to pay today for nothing (4.3, 3.1).`,guidedCheck:`following every \u2713 gives \xA36,350 all-in with a fresh MOT and two new tyres, an effective \xA36,100, which is Top. It's exactly the dealer's walk-away for that package, so it's a price they'll take. The admin fee never appears, because the learner said "all-in" at Point 2.`,debrief:`- Opening: "You {bought the Polo for {all_in_price} all-in{with_extras} / walked away at {their_last_number}}. Your target was \xA36,300 all-in with an MOT, and your walk-away was \xA36,600. They started at \xA36,995, with a '\xA37,495 last month' to make it feel cheap."
- On the faults: "Craig said she was lovely. You said: '{learner_line_opener}'. {If faults found: 'That's how the tyres and the MOT date came out, and you used them for the rest of the deal.' / If not: 'The tyres and the MOT never came up, and they were your best reasons for a lower price (lesson 1.2).'}"
- On the first number: "Your first number was '{learner_first_offer}'. {If from the market: 'You started from the market, not from his \xA36,995 or his made-up \xA37,495.' / If from his: 'Starting from his number pulled the whole deal towards it (lessons 2.2 and 2.6).'}"
- On "do better": "He said you'd have to do better. You said: '{learner_vise_line}'. {If asked for a number: 'He named \xA36,450 without you moving at all.' / If raised: 'You raised your own offer with nothing back (lesson 3.2).'}"
- On being stuck: "He was at \xA36,450 and you were at \xA36,150. You said: '{learner_stuck_line}'. {If asked his advice: 'Asking what he'd do in your shoes got him fixing your MOT problem instead of defending his price.' / If not: 'Asking his advice, as an open question, would have got him solving your problem instead of defending his price (lesson 1.3).'}"
- On the deadline: "He said another couple was coming at 3. You said: '{learner_deadline_line}'. {If calm with your own deadline: 'Deciding tonight put the clock on him, and the couple never came up again.' / If rushed or you gave a deadline that only costs you: 'A clock you couldn't check cost you {difference}. Your real deadline, deciding tonight, would have put the pressure on him (lesson 8.2).'}"
- On the monthly question: "He asked what monthly would work. You said: '{learner_monthly_line}'. {If kept to the total: 'Keeping to the total kept the price moving.' / If named a monthly: 'That let him quote a long plan on the full \xA36,995 (lesson 8.3).'}"
- On "final" and the tyres: "He said \xA36,350 was final. You said: '{learner_final_line}', and when it went to Gary: '{learner_authority_line}'. {Outcome line.}"
- Close: "Compare that with your walk-away, the private Polo at about \xA36,600 once you'd done its tyres and MOT. How much better off are you? (lesson 2.2)" Then the one move to practise next.`,bands:[{band:"Top",text:"\xA36,300 or less, with a fresh MOT."},{band:"Strong",text:"\xA36,301 to \xA36,450."},{band:"OK",text:"\xA36,451 to \xA36,600 (under your walk-away)."},{band:"Missed",text:"above \xA36,600, or paying the admin fee or paint protection without noticing. Walking away calmly when they wouldn't go under \xA36,600 counts as a good result, not a miss."}]}],counts:{units:8,lessons:40,questions:184,typeit:43,guess:15,missions:40,playbooks:3,points:23},sourceDashCount:0};
