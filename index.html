east one; contains one of: you'd get, you get, you'll get, you would get, you will get, you can have, you'd have, you'll have, you're getting, you'd be getting, gets you, get you, I can give you, I'll give you, I can do you; contains none of: I want, I'd want, I'm looking for, looking for, I need, I'd need, I'd like, I'd charge, I charge, my price is, paying, you'd pay, you'll pay, you pay, pay me, cost you, costs you, it'll cost, charge you, at least, minimum, lowest, flexible, negotiable, ono, open to, if that's ok, if that's okay, is that ok, is that okay, alright, if that works, less, lower, discount. Whole words, any case.",after:["The card: say it as what they get, not what you want or what they'll pay.",`The model answer has them picturing the finished menu. Say they answer: "Could you do \xA3150?" Keep the wording: "For \xA3165 you'd get the design with one round of changes."`,`Fails: "I'm looking for", "I'd charge", "it'll cost you", "you'd be paying", and anything that hedges ("if that's OK", "is that alright?").`],modelRaw:`"You'd get the full menu design, plus two rounds of changes, for \xA3185."`},{n:4,fmt:"Say it",stem:[`A neighbour sees your road bike in the hall and asks: "What would you want for it?" It comes with lights and a lock, and similar bikes have sold for \xA3290 to \xA3350 on eBay. What's your best reply?`],quote:[],options:[{k:"A",t:`"You'd get the bike, lights and lock for \xA3305."`,ok:!1},{k:"B",t:`"I'm after \xA3345 for the bike, lights and lock."`,ok:!1},{k:"C",t:'"What would you want to pay for it, roughly?"',ok:!1},{k:"D",t:`"You'd get the bike, lights and lock for \xA3345."`,ok:!0}],expl:{card:"The card: nice wording doesn't fix a low number. Pick the number first (lesson 2.1).",items:[{k:"D",ok:!0,text:`Right. A top-end number, worded as what they get. Say they answer: "Would you do \xA3300?" Now you can say: "You'd get all three for \xA3330. The lock alone was \xA340."`,subs:[]},{k:"A",ok:!1,text:"Right wording, mid-range number. You'll usually end up near \xA3280.",subs:[]},{k:"B",ok:!1,text:"Right number, worded as what you want.",subs:[]},{k:"C",ok:!1,text:"Lets them go first when you know the price (lesson 2.1).",subs:[]}]}}],mission:`this week, rewrite one listing, quote or offer you've sent before as "You'd get\u2026 for \xA3\u2026" or "I can give you \xA3\u2026 for\u2026".`},{id:"2.6",title:'Use and spot the "normally" price',guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Say a price you really charge, then come down from it in the same breath, with a reason. When a seller does it to you, ignore their first number."}]},{h:"When to use it",items:[{t:"p",text:"A one-off sale or job you'd happily do for less, for a reason they can see is true."},{t:"sit",text:"A group booking, a small job, a quiet weekday."}]},{h:"Why it works",items:[{t:"p",text:"The higher number still pulls their thinking up, even though you took it back, so your real price feels like a discount."}]},{h:"Example",items:[{t:"sit",text:"You valet cars on the side. A neighbour asks your price for her small hatchback."},{t:"say",who:"You",text:`"My usual price is \xA385, but as it's a small car, I can do \xA370."`},{t:"p",text:"\xA370 now sounds like a favour, not an opening bid."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Only use a price you really charge.",rest:'A made-up "normal" price falls apart the moment they check.'},{t:"sit",text:"You charge \xA385 for a valet, so say \xA385, not \xA3110."},{t:"tip",n:2,title:"Make the drop a real favour, for a reason they can see.",rest:"Done baldly, it looks manipulative."},{t:"bad",text:`"It's usually \xA385, but I could go a bit lower." \u2192 no real price, so they pick the amount.`},{t:"tip",n:3,title:"When it's used on you, delete their first number.",rest:"Judge their price against what it really sells for, and reply with your own number."},{t:"sit",text:`A seller says: "These are \xA390 new, so \xA360's a bargain." Used ones sell for \xA340 to \xA350.`},{t:"good",text:`"I've seen them sell for \xA342. I can give you \xA340."`},{t:"bad",text:`"That's a good discount, then." \u2192 their \xA390 decides what counts as cheap.`},{t:"tip",n:4,title:"Can't check their higher number? Ask where it's from.",rest:"Only then."},{t:"sit",text:`A stallholder says a lamp "normally fetches \xA3200". You can't find one like it online.`},{t:"quote",text:`"Where's the \xA3200 from?"`}]},{h:"Don't use it when",items:[{t:"li",text:"**It's pay, or someone you'll deal with again.** Give a range instead (lesson 2.4)."}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Mentioning a higher number, then taking it back, got people better deals across five studies. It also made them look more manipulative, unless the drop came across as a genuine favour (Bhatia and Gunia, 2018)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["Someone on your street asks what you'd charge to service their bike, a one-off job. You normally charge \xA360 for a full service, and as they're on your street, you'd happily do \xA348. What's your best reply?"],quote:[],options:[{k:"A",t:'"I can do a full service for \xA348 this week."',ok:!1},{k:"B",t:`"It's usually \xA360, but I could go a bit lower."`,ok:!1},{k:"C",t:`"Normally \xA360, but as you're on my street, \xA348."`,ok:!0},{k:"D",t:'"Normally \xA360, but whatever you can afford, really."',ok:!1}],expl:{card:"The card: say a price you really charge, then come down from it, for a reason they can see is true.",items:[{k:"C",ok:!0,text:'Right. \xA360 sets the scale, so \xA348 feels like a favour. If they push for \xA340, the \xA360 is still in their head: "\xA345 if you drop it round before 9."',subs:[]},{k:"A",ok:!1,text:"With no \xA360, they haggle down from \xA348.",subs:[]},{k:"B",ok:!1,text:"No real price, so they pick the amount.",subs:[]},{k:"D",ok:!1,text:`Hands them the choice. You'll usually get: "\xA330?"`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're buying a used Dyson Airwrap on Marketplace. The seller messages: "These are \xA3480 new, so \xA3300 is a steal." You've checked: used ones have sold for \xA3220 to \xA3260. What's your best reply?`],quote:[],options:[{k:"A",t:'"\xA3300 is a good discount. Could you do \xA3280?"',ok:!1},{k:"B",t:`"I've seen one sell for \xA3230. I can give you \xA3225."`,ok:!0},{k:"C",t:`"Where's the \xA3480 from?"`,ok:!1},{k:"D",t:'"Still a lot for a used one. Any chance of a discount?"',ok:!1}],expl:{card:"The card: when it's used on you, delete their first number and reply with your own. Ask where it's from only if you can't check it.",items:[{k:"B",ok:!0,text:`Right. It starts from used prices. Say they reply: "No, \xA3300's a steal." Don't argue: "Fair enough. If it's still there next week, I'm still at \xA3225."`,subs:[]},{k:"A",ok:!1,text:"Lets \xA3480 decide what's cheap, so you'll settle near \xA3280.",subs:[]},{k:"C",ok:!1,text:`You can check this one: you'll get "Dyson's website."`,subs:[]},{k:"D",ok:!1,text:"A hint with an easy no (lesson 1.1).",subs:[]}]}},{n:3,fmt:"Type it",stem:[`At a used car dealer, the salesperson says: "This Corsa was \xA37,995 last week, but I can do it for \xA37,495 today." You've checked: similar Corsas are selling at dealers for \xA36,800 to \xA37,200. Type your reply.`],quote:[],options:[],model:"Similar Corsas are listed from \xA36,800. I can give you \xA36,850.",checks:"the last \xA3 amount is from 6,800 to 6,950; 25 words or fewer; contains none of: halfway, middle, meet in, split, discount, a bit more, a bit less, lowest, best price, best you, your best, most you, at least, minimum, can't go, cant go, below, I need, I'd need. Whole words, any case.",after:["The card: delete their first number. \xA37,995 isn't an offer: it's there to make \xA37,495 feel cheap.",`Say he answers: "I can't go under \xA37,200." Now you're haggling at the top of the market, not \xA3500 off a price nobody's paying: "\xA36,980, and I'll take it this afternoon."`,'Fails: treating \xA37,495 as a good deal ("discount", "halfway"), a number below \xA36,800 or above \xA36,950, and asking for his best price.'],modelRaw:'"Similar Corsas are listed from \xA36,800. I can give you \xA36,850."'},{n:4,fmt:"Type it",stem:["You charge \xA395 for a headshot session. A student society wants a one-off shoot of headshots for all ten committee members, and you'd happily do \xA375 each, since it's ten in one afternoon. Type your reply, using your normal price."],quote:[],options:[],model:"I normally charge \xA395 a session, but as it's ten of you in one go, I can do \xA375 each.",checks:"contains one of: normally, usually, normal, usual, standard, typically; the first \xA3 amount is \xA395; contains \xA375; no other \xA3 amount under 95; contains one of: as, since, because, ten, 10, all, group, committee, society, one go, afternoon, together, block, bulk, whole; contains none of: flexible, negotiable, open to, ono, lower, whatever, afford, budget, maybe, at least, minimum, lowest, can't go, below, about \xA3, around \xA3, roughly \xA3, less. Whole words, any case.",after:["The card: a price you really charge first, then the drop, for a reason they can see is true.",'The model answer makes \xA375 feel like a group discount, because it is one. Say they answer: "Could you do \xA365?" The \xA395 is still in their head: "\xA370 each if you pay before the shoot."',`Fails: no normal price, a drop with no reason, a "normal" price that isn't your \xA395, and anything that leaves the amount to them ("whatever your budget is").`],modelRaw:`"I normally charge \xA395 a session, but as it's ten of you in one go, I can do \xA375 each."`}],mission:`this week, spot one "was \xA3X, now \xA3Y" or "normally \xA3X" price (a shop, a listing, an advert), cross out the first number and write what you'd offer based on what it actually sells for.`},{id:"2.7",title:"Other buyers: use yours, test theirs",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Selling? Let buyers see that others really want it. Told about another buyer or a cheaper deal? Ask for a detail a real one would have."}]},{h:"When to use it",items:[{t:"p",text:"Second-hand deals with more than one person interested, or someone claiming a better offer."},{t:"sit",text:'Selling your bike on Marketplace, buying a used car, a buyer saying "I can get it cheaper".'}]},{h:"Why it works",items:[{t:"p",text:"People want things more when others are after them, so a buyer who might lose out haggles less. A made-up rival has no details, so one question shows it."}]},{h:"Example",items:[{t:"sit",text:`You've offered \xA3150 for a desk listed at \xA3180. The seller says: "Someone's offered \xA3175."`},{t:"say",who:"You",text:'"When are they collecting it?"'},{t:"say",who:"Seller",text:`"Er, they said they'd let me know."`},{t:"p",text:"Vague, so your \xA3150 stands."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Book viewings close together,",rest:"so buyers cross paths."},{t:"p",text:"*Three people want to see your bike:* book them at 6, 6.15 and 6.30."},{t:"tip",n:2,title:"Someone really booked? Say so, specifically, and hold your price.",rest:""},{t:"good",text:`"Someone's seeing it at 8, so I can't hold it."`},{t:"bad",text:'"Loads of people want it." \u2192 it sounds made up, and one "Who?" ends it.'},{t:"p",text:'No real interest yet, and they ask "Any other offers?" Use "What makes you ask?" (lesson 1.6).'},{t:"tip",n:3,title:`Testing their claim? Vague answer \u2192 keep your offer exactly as it was. Specific answer ("He's coming at 10 with cash") \u2192 it's probably real: decide now, or let it go.`,rest:""},{t:"p",text:'*A buyer says your \xA345 jacket is \xA330 on Depop:* "Can you screenshot it for me?"'}]},{h:"Avoid",items:[{t:"bad",text:`"Really? I don't believe you." It starts a row, and they dig in to prove it.`},{t:"bad",text:`"Then why haven't you sold it?" "Why" sounds like a challenge.`},{t:"bad",text:"Raising your offer the moment they mention someone else."}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Getting a second bidder interested is standard when companies are sold, but it hasn't been tested on second-hand sales, and nor has the detail test. People do overrate long-shot alternatives and turn down good offers because of them (Pinkley and colleagues, 2019)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You're selling your Xbox Series X on Marketplace for \xA3290, and three people messaged in the last hour. You've booked the first two to view at 6 and 6.30 tonight. What do you send the third?"],quote:[],options:[{k:"A",t:'"People are coming at 6 and 6.30. Could you do 6.15?"',ok:!0},{k:"B",t:'"Still available! When suits you to come and see it?"',ok:!1},{k:"C",t:'"Loads of people want it, so make me your best offer."',ok:!1},{k:"D",t:'"Yes, still available. Would \xA3270 help you decide?"',ok:!1}],expl:{card:"The card: book viewings close together, so buyers see that others really want it.",items:[{k:"A",ok:!0,text:`Right. True, and they're not the only one. Say the 6.15 buyer passes the 6 o'clock and asks: "Would you take \xA3250?" Now you can say: "Someone's coming at 6.30, so I'll stay at \xA3290."`,subs:[]},{k:"B",ok:!1,text:"Lets them pick any time, so they won't see another buyer.",subs:[]},{k:"C",ok:!1,text:"Sounds made up, and asks them to go first.",subs:[]},{k:"D",ok:!1,text:"Gives away \xA320 before anyone's seen it.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're buying a used VW Golf from a private seller. It's listed at \xA36,450, and you've offered \xA35,890. The seller replies: "Someone else has offered me \xA36,300, so I can't do \xA35,890." What's your best reply?`],quote:[],options:[{k:"A",t:'"OK, I could stretch to \xA36,300 as well, then."',ok:!1},{k:"B",t:`"Really? I don't believe that for a second."`,ok:!1},{k:"C",t:`"Then why haven't you sold it to them?"`,ok:!1},{k:"D",t:'"When are they coming to pick it up?"',ok:!0}],expl:{card:"The card: test their claim with a detail a real buyer would have. Vague answer: keep your offer as it was.",items:[{k:"D",ok:!0,text:`Right. Real buyers have a time. Say they answer: "Er, he said he'd let me know." That's a maybe: "My \xA35,890 stands." If it's "Tomorrow at 10, with cash", it's probably real: decide now, or let it go.`,subs:[]},{k:"A",ok:!1,text:"\xA3410 more, for a buyer who might not exist.",subs:[]},{k:"B",ok:!1,text:"Calls them a liar, so they dig in.",subs:[]},{k:"C",ok:!1,text:'"Why" sounds like a challenge (lesson 1.3).',subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're selling your camera on Marketplace for \xA3340. Someone's booked to see it tomorrow at 10. Another buyer messages: "Have you had any other offers?" What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!1},{k:"B",t:'"No offers yet, but a few people have asked."',ok:!1},{k:"C",t:`"Someone's seeing it at 10 tomorrow, so be quick."`,ok:!0},{k:"D",t:`"Loads of interest, so you'd better be quick, mate!"`,ok:!1}],expl:{card:`The card: someone really booked? Say so, specifically. "What makes you ask?" (lesson 1.6) is for when you've had no interest.`,items:[{k:"C",ok:!0,text:`Right. True and specific. Say they answer: "Could I come tonight, for \xA3320?" Now you can say: "Tonight works, at \xA3335." If they say "I'll wait", you've still got the 10 o'clock.`,subs:[]},{k:"A",ok:!1,text:"Hides the one fact working for you.",subs:[]},{k:"B",ok:!1,text:"Tells them nobody's put money down, so they'll offer low.",subs:[]},{k:"D",ok:!1,text:"Vague, so it sounds made up.",subs:[]}]}},{n:4,fmt:"Type it",stem:["You're selling your gaming monitor for \xA3240. A buyer who's come to see it offers \xA3190. Someone else is booked to see it at 7 tonight. Type your reply."],quote:[],options:[],model:"Someone's coming to see it at 7, so I can't do \xA3190. I can do \xA3235.",checks:"contains one of: someone, somebody, another, other, else, viewer, viewing, booked, coming; at least one amount from 220 to 240; every amount of 100 or more except 190 is from 220 to 240; contains none of: loads, lots of people, everyone, lowest, at least, minimum, below, lower, can't go, cant go, less than, no less, best offer, highest, most you, your best, I need, I'd need. Whole words, any case.",after:["The card: when someone really is booked, say so. It's the one fact that stops a buyer offering low.",`Say they answer: "OK, \xA3220 and I'll take it now." That's \xA330 more than their first offer, because the 7 o'clock is real. Now you can say: "\xA3232 and it's yours."`,'Fails: accepting \xA3190, a vague "loads of people want it", a number below \xA3220, and anything that tells them your limit.'],modelRaw:`"Someone's coming to see it at 7, so I can't do \xA3190. I can do \xA3235."`},{n:5,fmt:"Type it",stem:[`You're selling your AirPods Pro on Vinted for \xA3120. A buyer messages: "I can get the same ones for \xA390 elsewhere." Type a reply that tests whether that's real.`],quote:[],options:[],model:"Oh, which listing? Can you send me the link?",checks:"contains one of: link, listing, send, show, screenshot, where, which; no \xA3 and no number over 9; 20 words or fewer; contains none of: why, really, liar, lying, lie, bs, rubbish, believe, doubt, fake, scam, sure you can, offer, offers, lowest, best price, most you, match, ok then, okay then, go for it, buy them, buy those, buy that, get them then, get those then. Whole words, any case.",after:["The card: ask for a detail a real listing would have. A real cheaper listing takes ten seconds to send.",`Say they send it, and it's a used pair with no case: "Those have no case. Mine are boxed, with the receipt: \xA3115." If it's the same pair, in the same condition, for \xA390, it's real: decide whether to match it or let them go.`,`Fails: arguing ("Really?", "They're fake"), matching their \xA390 straight away, and naming a number.`],modelRaw:'"Oh, which listing? Can you send me the link?"'}],mission:'this week, pick one "selling fast", "only 2 left" or "loads of interest" claim you see or hear, and write the one question that would test it.'}]},{n:3,title:"Haggling Moves",tagline:"What to say back to their number, how to move yours, and how to close.",lessons:[{id:"3.1",title:"Only give an extra in return",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When someone asks you for an extra, say yes only with a condition, in the same sentence:"},{t:"quote",text:'"If you\u2026, then I\u2026"'}]},{h:"When to use it",items:[{t:"p",text:"Someone asks for something on top of the deal."},{t:"sit",text:"A buyer wants it delivered, a client wants a rush job, a parent wants an extra tutoring session before the exam."}]},{h:"Why it works",items:[{t:"p",text:"A free extra teaches them that pushing works, so they push for more. With a condition on it, every extra costs them something."}]},{h:"Example",items:[{t:"sit",text:"You're selling a desk for \xA380. The buyer asks if you'll take it apart so it fits in her car."},{t:"say",who:"You",text:`"If you can collect tonight, I'll take it apart for you."`},{t:"say",who:"Buyer",text:`"Deal, I'll be there at 7."`},{t:"p",text:"It's gone tonight, not clogging up your room all week."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Put the condition in the same sentence as your yes.",rest:"After a plain yes, there's nothing left to trade."},{t:"good",text:'"If you can collect by Thursday, I can do \xA3185."'},{t:"bad",text:`"Yes! Could you add a bit for petrol?" \u2192 "Ah, I'd rather not."`},{t:"tip",n:2,title:'Make the "if" ask for something.',rest:""},{t:"good",text:`"I'll do a third round, as long as all your changes come in one email."`},{t:"bad",text:'"I can do that, if it helps?" \u2192 the "if" asks nothing of them.'},{t:"tip",n:3,title:"Ask for something worth having to you:",rest:"money up front, an intro, a day off. Can't think what? \u2192 Make them name it."},{t:"sit",text:"A neighbour asks you to take in her parcels all week."},{t:"quote",text:'"If I can do that, what can you do for me?"'}]},{h:"Don't use it when",items:[{t:"li",text:"**You're swapping prices.** A smaller move straight after theirs is already a trade (lesson 3.3)."},{t:"li",text:"**It's a small favour for a friend or flatmate.** Conditions make it feel like a deal."}]},{h:"Avoid",items:[{t:"bad",text:'"Happy to, and hopefully you can collect soon." A hope, not a condition.'}]},{h:"Other ways to say it",items:[{t:"p",text:`"If you\u2026, I'll\u2026" \xB7 "\u2026as long as you\u2026" \xB7 "\xA370, and I'll drop it round."`}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:`A review of 34 studies found soft bargainers did best when they matched the other side's moves, (H\xFCffmeier and colleagues, 2014). The "If you\u2026, then I\u2026" wording is a pro trick, never tested.`}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're selling your Nintendo Switch on Marketplace for \xA3180. A buyer messages: "I definitely want it, but I don't get paid till Friday. Could you hold it for me?" Two other people have asked if it's still available. What's your best reply?`],quote:[],options:[{k:"A",t:`"Sure, no problem. I'll keep it for you till Friday."`,ok:!1},{k:"B",t:`"Sure, I'll hold it. Could you send a \xA320 deposit to be safe?"`,ok:!1},{k:"C",t:`"If you can send a \xA320 deposit now, I'll hold it till Friday."`,ok:!0},{k:"D",t:`"If you're definitely sure you want it, I'll hold it till Friday."`,ok:!1}],expl:{card:"The card: put the condition in the same sentence as your yes.",items:[{k:"C",ok:!0,text:`Right. Holding it could cost you two other buyers, so the deposit is your price for that. Say they answer: "Sent, see you Friday." Now you can say: "Lovely, it's yours till Friday."`,subs:[]},{k:"A",ok:!1,text:"Gives the hold away for nothing, with two other buyers waiting.",subs:[]},{k:"B",ok:!1,text:`Yes first, then the ask. You'll usually get: "Can I just pay Friday?"`,subs:[]},{k:"D",ok:!1,text:`The "if" asks for nothing new. You'll usually get "100%!", and hold it free.`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You photographed a hair salon's new look for its website for \xA3150, and the owner has paid. You're building up your photography, and what you need most right now is new clients. She's mentioned her brother is opening a barbershop next month. She messages: "Love them! Could you edit a couple more for Instagram too?" That's about half an hour's work. What's your best reply?`],quote:[],options:[{k:"A",t:'"If I can fit that in, what could you do for me?"',ok:!1},{k:"B",t:'"Of course! An intro to your brother would be amazing if you get a sec."',ok:!1},{k:"C",t:`"Happy to, as long as you're happy with the website ones first."`,ok:!1},{k:"D",t:`"If you can put me in touch with your brother, I'll do the Instagram ones."`,ok:!0}],expl:{card:"The card: ask for something worth having to you. Here, an intro.",items:[{k:"D",ok:!0,text:`Right. Half an hour's work for a lead on a new job. Say she answers: "Deal, I'll message him tonight." If she says "He's sorting his own", keep the trade: "No problem. The edits are \xA325, then."`,subs:[]},{k:"A",ok:!1,text:`The line for when you don't know what you want. She'll offer: "Free blow-dry next time?"`,subs:[]},{k:"B",ok:!1,text:"Yes first, then a hope: you'll usually get no intro.",subs:[]},{k:"C",ok:!1,text:'The "if" asks nothing: she already loves them.',subs:[]}]}},{n:3,fmt:"Sort it",stem:[`You work part-time in a caf\xE9. Your manager asks: "Could you cover Saturday? Someone's called in sick." You're free, and you'd love next Monday off for a gig on Sunday night. Which replies trade Saturday for something, and which give it for nothing?`],quote:[],options:[],sort:[{t:'"If I cover Saturday, could I have Monday off?"',bin:"trades it"},{t:'"Yeah, no problem, happy to help!"',bin:"gives it for nothing"},{t:'"I can do it, if that helps you out?"',bin:"gives it for nothing"},{t:`"Saturday's fine, as long as I can have Monday off."`,bin:"trades it"},{t:'"Sure. Could I maybe have a Monday off sometime?"',bin:"gives it for nothing"},{t:`"If you can give me Monday off, I'm in for Saturday."`,bin:"trades it"}],expl:{card:'The card: say yes only with a condition, in the same sentence. "As long as\u2026" works too.',items:[{label:"Trades it",text:`"If I cover Saturday\u2026", "as long as\u2026" and "If you can give me Monday off\u2026" each tie Saturday to Monday. Say she answers: "Deal, you're off Monday."`,subs:[]},{label:"Gives it for nothing",text:"",subs:['"Happy to help!" just hands over Saturday.','"If that helps you out?" is the trap: an "if" that asks nothing of her.',`"Could I maybe\u2026?" comes after the yes, so she can put it off: "I'll look at the rota."`]}]},bins:["trades it","gives it for nothing"]},{n:4,fmt:"Say it",stem:[`You've agreed to rent a flat from the 1st at \xA31,050 a month. The letting agent rings: "The landlord's going abroad on the 25th and wants to hand you the keys himself. Could you move in on the 24th?" You could move a week early without any trouble. What's your best reply?`],quote:[],options:[{k:"A",t:'"If it helps him out, the 24th is no problem."',ok:!1},{k:"B",t:`"The 24th's fine, as long as the rent starts on the 1st."`,ok:!0},{k:"C",t:`"I could, but it'd be a bit of a hassle, to be honest."`,ok:!1},{k:"D",t:`"Sure, the 24th's fine. Would he take a bit off the first month?"`,ok:!1}],expl:{card:"The card: say yes only with a condition that asks for something.",items:[{k:"B",ok:!0,text:`Right. Moving early costs you nothing; a free week's rent is about \xA3240. Say they answer: "He can't do a free week, but he'll take \xA3100 off." That's \xA3100 for something you'd have done anyway.`,subs:[]},{k:"A",ok:!1,text:`The "if" asks nothing of him: a week's rent, given away.`,subs:[]},{k:"C",ok:!1,text:`A hint, not an ask (lesson 1.1). You'll usually get: "Brilliant, I'll tell him."`,subs:[]},{k:"D",ok:!1,text:`Asking after the yes lets him say: "I wouldn't count on it."`,subs:[]}]}},{n:5,fmt:"Type it",stem:[`You've sold a chest of drawers on Marketplace for \xA360. The buyer messages: "Could you drop it round? I'm only 15 minutes away and I don't drive." It'd cost you about \xA38 in petrol. Type a reply that agrees to drop it round, but only in return for petrol money.`],quote:[],options:[],model:"If you can add \xA310 for petrol, I'll drop it round on Saturday.",checks:"contains one of: if, as long as, so long as, provided, providing, plus, and I'll, for an extra, delivered, for \xA3, all in, in total; contains one of: drop, deliver, delivery, bring, round, over; contains an amount with \xA3 in front or quid/pounds after, from 5 to 30 or 65 to 95, or one of: fiver, tenner, petrol, fuel; contains none of: could you, can you, would you, maybe, possibly, if that helps, if it helps, if that's ok, if that's okay, if that works, if that's alright, if you want, if you like, if not, hopefully, no worries, free, no charge, don't suppose, any chance, sorry, I'll cover, on me; 25 words or fewer. Whole words, any case.",after:['The card: say yes only with a condition, in the same sentence: "If you\u2026, then I\u2026".',`The model answer covers your petrol, with a bit for your time. Say they answer: "Deal, see you Saturday." Now you're getting \xA370, and the trip's paid for.`,'Fails: a plain yes, yes first and then asking for petrol ("Could you add\u2026?"), and an "if" that asks nothing of them ("if that helps").'],modelRaw:`"If you can add \xA310 for petrol, I'll drop it round on Saturday."`}],mission:`write down three things people often ask of you (a lift, an extra shift, holding something you're selling), and next to each, an "If you\u2026, then I\u2026" line asking for something you'd actually want back. Use one this week.`},{id:"3.2",title:"Make them say how much better",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:`You've made an offer, and they say "You'll have to do better" without a new number. Don't raise yours. Ask:`},{t:"quote",text:'"How much better, exactly?"'}]},{h:"When to use it",items:[{t:"p",text:"Any reply that pushes you to move without naming a figure."},{t:"sit",text:`"That's a bit low." "A bit more than we were thinking." Or just "Hmm".`}]},{h:"Why it works",items:[{t:"p",text:'Most people fill the gap by raising their own offer, and get nothing back. Sales trainers teach "do better" for exactly that reason. Asking for the number makes them move first.'}]},{h:"Example",items:[{t:"sit",text:"You've offered \xA3400 for an e-bike listed at \xA3520."},{t:"say",who:"Seller",text:`"You'll have to do better than that."`},{t:"say",who:"You",text:'"How much better, exactly?"'},{t:"say",who:"Seller",text:`"\xA3480 and it's yours."`},{t:"p",text:"They've come down \xA340. You haven't moved."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"It asks for their next offer, not their lowest.",rest:`"What's the lowest you'd take?" makes their answer the best you'll get. "How much better?" gets a number you can haggle from, so the deal usually lands between yours and theirs.`},{t:"tip",n:2,title:"Only ask when they haven't named a new number.",rest:"A number from before your last offer doesn't count."},{t:"sit",text:`You'd offered \xA3240. The seller says: "Do better. I'd take \xA3280." Make a small move (lesson 3.3):`},{t:"quote",text:'"I can do \xA3250."'},{t:"tip",n:3,title:`They won't name one ("You tell me")? Stay where you are.`,rest:""},{t:"quote",text:`"I'm happy at \xA3550. If you want to suggest a number, I'm listening."`}]},{h:"Avoid",items:[{t:"bad",text:`"OK, how about \xA350 more?" You've moved and they haven't.`},{t:"bad",text:`"I'm flexible" or "I could go a bit higher." They'll just wait for you to move.`},{t:"bad",text:`"That's the most I can do," when it isn't. They'll test it.`}]},{h:"Other ways to say it",items:[{t:"p",text:`"What number did you have in mind?" \xB7 "How far apart are we?" \xB7 "I'm at \xA3550. What could you do?"`}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:'Roger Dawson calls "do better" the vise, and Herb Cohen calls it "the crunch"; Deepak Malhotra and Chris Voss teach the same rule. Never tested.'}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're buying a gaming PC on Marketplace, listed at \xA3700. Similar ones have sold for \xA3550 to \xA3650, and you'd go up to \xA3620. You offer \xA3550, and the seller says: "You'll have to do better than that." What's your best reply?`],quote:[],options:[{k:"A",t:'"OK, how about \xA3600 then?"',ok:!1},{k:"B",t:'"How much better, exactly?"',ok:!0},{k:"C",t:`"What's the lowest you'd take, then?"`,ok:!1},{k:"D",t:'"Sorry, \xA3550 is honestly the most I can do."',ok:!1}],expl:{card:'The card: "do better" with no new number? Make them name one.',items:[{k:"B",ok:!0,text:`Right. Say they answer: "\xA3650 and it's yours." Now the deal will usually land between \xA3550 and \xA3650, and you can move up in small steps: "I can do \xA3570." If they say "You tell me", stay put: "I'm happy at \xA3550."`,subs:[]},{k:"A",ok:!1,text:"Raises your offer before they've moved: \xA350 for one sentence.",subs:[]},{k:"C",ok:!1,text:"Asks for their lowest. They'll usually say about \xA3680.",subs:[]},{k:"D",ok:!1,text:"Claims a limit you'd break, since you'd go to \xA3620.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`In a job interview at a small design studio, you've asked for \xA331,000. Similar roles pay \xA328,000 to \xA331,000. The hiring manager says: "That's a bit more than we were thinking." What's your best reply?`],quote:[],options:[{k:"A",t:'"Would \xA330,000 work better for you?"',ok:!1},{k:"B",t:`"I'm flexible, I just really want the role."`,ok:!1},{k:"C",t:'"How far off are we?"',ok:!0},{k:"D",t:`"I understand. What's the most you could stretch to?"`,ok:!1}],expl:{card:'The card: "A bit more than we were thinking" counts as "do better" with no number. Make them name one first.',items:[{k:"C",ok:!0,text:'Right. It makes them say how big the gap is. Say they answer: "We were thinking more like \xA329,000." Now you can make a small move: "Could we look at \xA330,500?"',subs:[]},{k:"A",ok:!1,text:"Drops \xA31,000 before they've said a figure.",subs:[]},{k:"B",ok:!1,text:"Tells them you'll take less, so they'll usually offer less.",subs:[]},{k:"D",ok:!1,text:"Asks for their limit. They'll name a low figure, and you can't ask above it.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're selling a pair of Salomon trainers on Vinted, listed at \xA375. A buyer offers \xA350. You reply: "I can do \xA368." They message back: "Hmm \u{1F914}". What's your best next message?`],quote:[],options:[{k:"A",t:'"OK, \xA362 then?"',ok:!1},{k:"B",t:'"I could do a bit less if you buy today?"',ok:!1},{k:"C",t:'"Sorry, I know \xA368 is a lot for used ones."',ok:!1},{k:"D",t:`"I'm at \xA368. What could you do?"`,ok:!0}],expl:{card:'The card: "Hmm" counts as "do better". Make them name a number.',items:[{k:"D",ok:!0,text:`Right. They offered \xA350 earlier, but they haven't moved since your \xA368, and "Hmm" isn't a new number. Say they reply: "Would you do \xA360?" Now one small move closes it: "I can do \xA365."`,subs:[]},{k:"A",ok:!1,text:"Drops \xA36 because of an emoji.",subs:[]},{k:"B",ok:!1,text:"Tells them you'll go lower before they've offered anything, so they'll wait for it.",subs:[]},{k:"C",ok:!1,text:`Apologising tells them it's too high. You'll usually get: "Yeah, would you do \xA350?"`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're buying a used Garmin watch on Marketplace, listed at \xA3200. Similar ones have sold for \xA3140 to \xA3180. You offered \xA3140, and the seller replies: "You'll have to do better than that. I'd take \xA3180." What's your best reply?`],quote:[],options:[{k:"A",t:'"I can do \xA3150."',ok:!0},{k:"B",t:'"How much better, exactly?"',ok:!1},{k:"C",t:'"I can do \xA3170."',ok:!1},{k:"D",t:'"Is \xA3180 really the best you can do?"',ok:!1}],expl:{card:"The card: only ask when they haven't named a new number. They have, so make a small move (lesson 3.3).",items:[{k:"A",ok:!0,text:'Right. A small step, keeping most of the gap on their side. Say they answer: "\xA3170?" Now move by less: "I can do \xA3156."',subs:[]},{k:"B",ok:!1,text:`The card's line, but they've just said \xA3180. You'll usually get: "I just said, \xA3180."`,subs:[]},{k:"C",ok:!1,text:`Gives up \xA330 of the \xA340 gap at once. You'll usually get: "Go on, \xA3175."`,subs:[]},{k:"D",ok:!1,text:`Asks them to judge their own price. You'll usually get: "Yep, \xA3180."`,subs:[]}]}},{n:5,fmt:"Type it",stem:[`You've offered \xA31,400 for a used Vespa on Marketplace. Similar ones have sold for \xA31,400 to \xA31,700. The seller replies: "You'll have to do better than that." Type a reply that makes them name a number, without raising yours.`],quote:[],options:[],model:"What number did you have in mind?",checks:`no amount other than 1,400 (with or without \xA3 or a comma); contains one of: what, how much, how far, in mind, where, which, number, figure; contains none of: lowest, least, bottom, minimum, the most, max, best price, your best, best you can do, cheapest, accept, a bit more, bit more, little more, bit higher, more like, I could, I can, I'll, if I, go up, sorry, budget, afford; ends with "?"; 15 words or fewer. Whole words, any case.`,after:["The card: don't raise yours. Make them name a number, and if they won't, stay where you are.",`The model answer gets their number on the table. Say they answer: "\xA31,700." Now the deal will usually land between \xA31,400 and \xA31,700, and you can move up in small steps: "I can do \xA31,450." If they say "You tell me", stay at \xA31,400: "I'm happy at \xA31,400. What would work for you?"`,'Fails: any new number, "a bit more", and asking for their lowest.'],modelRaw:'"What number did you have in mind?"'}],mission:'say "How much better, exactly?" out loud five times this week, until it sounds calm and curious rather than defensive.'},{id:"3.3",title:"Make each price move smaller",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When you're haggling back and forth, make each move smaller than the last. Selling: down \xA3200, then \xA380, then \xA330. Buying: the same, going up."}]},{h:"When to use it",items:[{t:"p",text:"Any haggle with a few rounds of offers."},{t:"sit",text:"Selling your car, buying a laptop on Marketplace, agreeing a rate with a client."}]},{h:"Why it works",items:[{t:"p",text:"Shrinking moves say you're nearly out of room, so they stop pushing. Same-size moves say another one's coming. A big move late on says you've got loads left."}]},{h:"Example",items:[{t:"sit",text:"You're selling your bike, listed at \xA3500."},{t:"say",who:"Buyer",text:'"Would you do \xA3400?"'},{t:"say",who:"You",text:'"I can do \xA3460."'},{t:"say",who:"Buyer",text:'"\xA3420?"'},{t:"say",who:"You",text:'"\xA3445."'},{t:"say",who:"Buyer",text:'"Go on, \xA3430?"'},{t:"say",who:"You",text:'"\xA3437, and you can have the lights."'},{t:"p",text:"Your drops went \xA340, \xA315, \xA38. They can see you're nearly out of room."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Only move after they've moved.",rest:"If they haven't, ask what they can do (lesson 3.2)."},{t:"sit",text:`You've come down from \xA3250 to \xA3230. The buyer's still on \xA3180 and says: "Still too much."`},{t:"quote",text:`"I've come down \xA320. Your turn: what could you do?"`},{t:"tip",n:2,title:"Finish on a precise number with a small extra that isn't money.",rest:"It looks like you've nothing left."},{t:"good",text:`"\xA33,688, and I'll throw in the roof bars." (not "\xA33,700")`},{t:"tip",n:3,title:"Their shrinking moves don't prove they're at their limit.",rest:"Judge their price against the target you wrote down (lesson 2.2)."},{t:"sit",text:`A seller goes \xA390, \xA375, \xA370, then: "\xA368, and I'll post it free." Your target was \xA360, so \xA368 is still \xA38 over.`}]},{h:"Avoid",items:[{t:"bad",text:"The same drop every time (\xA350, \xA350, \xA350). They'll wait for the next one."},{t:"bad",text:"Jumping straight to your lowest, or to their number. It says you had plenty of room."},{t:"bad",text:'"I might be able to go a bit lower." More room, but not how much, so they keep pushing.'}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"In seven studies, shrinking moves made people think the other side was nearer their limit than it was, so they pushed less, unless they'd set a target first (Tey, Schaerer, Madan and Swaab, 2021). Ending on a non-money extra is a pro trick (Chris Voss), never tested."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You're selling your 2014 Toyota Yaris, listed at \xA34,000. You'd take \xA33,500 at a push. You've already come down \xA3150 to \xA33,850, and the buyer has come up to \xA33,550. What's your best next move?"],quote:[],options:[{k:"A",t:'"OK, I can do \xA33,700."',ok:!1},{k:"B",t:`"Go on then, \xA33,550. You've got a deal."`,ok:!1},{k:"C",t:'"I could maybe go a bit lower, let me think."',ok:!1},{k:"D",t:'"I can do \xA33,790."',ok:!0}],expl:{card:"The card: make each move smaller than the last, so it looks like you're nearly out of room.",items:[{k:"D",ok:!0,text:'Right. It drops \xA360, well under your last drop of \xA3150. Say they come back: "Meet me at \xA33,650?" Drop by less again: "\xA33,765, and you can have the roof bars."',subs:[]},{k:"A",ok:!1,text:"The same \xA3150 drop again, so they'll wait for the next one.",subs:[]},{k:"B",ok:!1,text:"A \xA3300 jump to their number says you had plenty of room.",subs:[]},{k:"C",ok:!1,text:"Says there's more room, but not how much, so they'll keep pushing.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're buying a used MacBook. Similar ones sell for \xA3440 to \xA3470, you wrote down \xA3450 as your target, and you've offered \xA3430. The seller has gone from \xA3600 to \xA3520, then \xA3490, then: "\xA3482, and I'll throw in the case. That's me." What's your best reply?`],quote:[],options:[{k:"A",t:'"Fair enough, \xA3482 with the case. Deal."',ok:!1},{k:"B",t:'"Is \xA3482 really the lowest you can go on it?"',ok:!1},{k:"C",t:'"They go for \xA3440 to \xA3470. I can do \xA3440."',ok:!0},{k:"D",t:`"OK, I'll come up to \xA3470 to get it done."`,ok:!1}],expl:{card:"The card: shrinking moves don't prove a limit. Judge against your target.",items:[{k:"C",ok:!0,text:`Right. It judges \xA3482 against your \xA3450, not their pattern. Say they answer: "\xA3465 and it's yours." Now: "If you can do \xA3446, I'll transfer it now." If they say "No, \xA3482 really is it", other MacBooks are for sale.`,subs:[]},{k:"A",ok:!1,text:"Believes the pattern and pays \xA332 over your target.",subs:[]},{k:"B",ok:!1,text:`Asks them to judge their own price. You'll usually get: "Yes."`,subs:[]},{k:"D",ok:!1,text:"Jumps \xA340 at once, to \xA320 over your target.",subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're selling your old iPad, listed at \xA3400. Each line shows one way your price could drop over three messages. Which ones say you're nearly out of room, and which say there's more to come?"],quote:[],options:[],sort:[{t:'"\xA3350, then \xA3300, then \xA3250"',bin:"more to come"},{t:'"\xA3360, then \xA3340, then \xA3332"',bin:"nearly out of room"},{t:'"\xA3390, then \xA3380, then \xA3330"',bin:"more to come"},{t:'"\xA3340, then \xA3318, then \xA3311"',bin:"nearly out of room"},{t:'"\xA3385, then \xA3370, then \xA3355"',bin:"more to come"},{t:'"\xA3360, then \xA3330, then \xA3320"',bin:"nearly out of room"}],expl:{card:"The card: shrinking moves say you're nearly out of room; same-size moves, or a big late one, say more's coming.",items:[{label:"Nearly out of room, as each drop is smaller than the last",text:'"\xA3360, \xA3340, \xA3332" (\xA340, \xA320, \xA38), "\xA3340, \xA3318, \xA3311" (\xA360, \xA322, \xA37) and "\xA3360, \xA3330, \xA3320" (\xA340, \xA330, \xA310).',subs:[]},{label:"More to come",text:"",subs:[`"\xA3350, \xA3300, \xA3250" and "\xA3385, \xA3370, \xA3355": the same drop each time, so another's coming.`,`"\xA3390, \xA3380, \xA3330" is the trap: the big late drop says there's plenty more.`]}]},bins:["more to come","nearly out of room"]},{n:4,fmt:"Say it",stem:[`You're selling a Canon camera on Marketplace, listed at \xA3400. You've already come down to \xA3370. The buyer offered \xA3300 earlier, hasn't moved since, and now messages: "Still a bit steep for me." What's your best reply?`],quote:[],options:[{k:"A",t:'"I can do \xA3355."',ok:!1},{k:"B",t:`"I've moved \xA330. Where can you get to?"`,ok:!0},{k:"C",t:`"\xA3340, but I can't go any lower than that."`,ok:!1},{k:"D",t:'"Shall we meet in the middle at \xA3335?"',ok:!1}],expl:{card:"The card: only move after they've moved. If they haven't, ask what they can do.",items:[{k:"B",ok:!0,text:`Right. You've moved \xA330 and they've moved nothing, so the next move is theirs. Say they answer: "I could do \xA3320." Now you can drop by less than your \xA330: "I can do \xA3356."`,subs:[]},{k:"A",ok:!1,text:"The right shape, but they haven't moved. You're bidding against yourself (lesson 3.2).",subs:[]},{k:"C",ok:!1,text:`The same \xA330 drop again, and "can't go any lower" invites a test.`,subs:[]},{k:"D",ok:!1,text:"Offers the middle yourself. They'll usually haggle down from \xA3335.",subs:[]}]}},{n:5,fmt:"Type it",stem:["You're buying a used Technics turntable on Marketplace, listed at \xA3370. Similar ones sell for \xA3330 to \xA3370, and before you started you wrote down a target of \xA3330. You've offered \xA3300, then \xA3315, then \xA3323. The seller's at \xA3345. Type your next offer: a smaller rise than your last one, a precise number no higher than your target, and a small extra that isn't more money."],quote:[],options:[],model:"\xA3327, and I'll come and get it whenever suits you.",checks:"contains an amount from 324 to 330 (with or without \xA3); no other \xA3 amount and no other number of 100 or more; contains one of: collect, collection, come and get, pick up, pick it up, grab, today, tonight, tomorrow, now, this week, whenever, suits, immediately, straight away, right away, transfer, cash; contains none of: lowest, limit, max, most, best price, bottom, can't, more than; 15 words or fewer. Whole words, any case.",after:["The card: make each move smaller than the last, then finish on a precise number with an extra that isn't money.",`The model answer rises \xA34 after your last rise of \xA38, stays under your \xA3330 target, and makes collecting easy for them. Say they answer: "Make it \xA3335 and it's yours." Judge that against your target, not their pattern: "\xA3329, and I'll fit round you."`,"Fails: rising \xA38 or more, going over your target, telling them your limit, and asking for their lowest."],modelRaw:`"\xA3327, and I'll come and get it whenever suits you."`}],mission:"pick something you own, look up three sold prices, and write your asking price and then three drops, each smaller than the last, ending on a precise number with one small extra."},{id:"3.4",title:"Put the middle on your target",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Offer as far below your target as their price is above it. The middle then lands on your target."}]},{h:"When to use it",items:[{t:"p",text:"They've named a price first, it's inside what similar ones sell for, and you've written down your target (lesson 2.2)."},{t:"sit",text:"A Marketplace listing, a decorator's quote, a used car's asking price."}]},{h:"Why it works",items:[{t:"p",text:"Deals tend to end near the middle of the first two numbers. Offer just under their price, or your target, and the middle lands above your target."}]},{h:"Example",items:[{t:"sit",text:"A sofa's listed at \xA3300. Similar ones sell for \xA3240 to \xA3320; your target is \xA3240. It's \xA360 above, so go \xA360 below."},{t:"say",who:"You",text:'"Could you do \xA3180? The arms are a bit worn."'},{t:"say",who:"Seller",text:`"That's low. \xA3260?"`},{t:"p",text:"The middle of \xA3180 and \xA3300 is your \xA3240."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:'Give a reason, and keep your target and "the middle" to yourself.',rest:"Say them and they'll work out what you're aiming for."},{t:"bad",text:`"My target's \xA3240, so could you do \xA3180?" \u2192 "So you'll pay \xA3240, then."`},{t:"tip",n:2,title:"Their price is way over what similar ones sell for? Skip the maths.",rest:"It gives a silly number, and offers that far off make more people walk away. Reply from the going rate instead (buying: its bottom), with proof."},{t:"sit",text:"An e-scooter is listed at \xA3500. Similar ones sell for \xA3250 to \xA3300."},{t:"quote",text:`"They've gone for \xA3250 to \xA3300. Could you do \xA3250?"`},{t:"tip",n:3,title:"Selling? Flip it.",rest:"When a buyer names a number before you've given one, ask as far above your target as their offer is below it."},{t:"sit",text:"A mate offers \xA3200 for your guitar. Your target is \xA3240."},{t:"quote",text:'"You can have it with the case for \xA3280."'}]},{h:"Avoid",items:[{t:"bad",text:"Going further than the maths. You'll usually just get a no."}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:`Deals tend to end near the middle of the first two numbers (Howard Raiffa; Lipp, Smolinski and Kesting, 2023). Going as far below as they are above is a pro trick (Roger Dawson's "bracketing"), never tested on its own, and very ambitious first offers lead to more walkouts (Petrowsky and colleagues, 2025).`}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You want a pair of AirPods Max listed on Marketplace at \xA3320. Similar ones have sold for \xA3265 to \xA3330, and you've written down \xA3265 as your target. The ear cushions look worn in the photos. What's your best first offer?"],quote:[],options:[{k:"A",t:'"Could you do \xA3295 for them?"',ok:!1},{k:"B",t:'"Could you do \xA3265? One sold for that last week."',ok:!1},{k:"C",t:'"Could you do \xA3210? The ear cushions look worn."',ok:!0},{k:"D",t:`"What's the lowest you'd take for them?"`,ok:!1}],expl:{card:"The card: they're \xA355 over your \xA3265 target, so go \xA355 under it: \xA3210.",items:[{k:"C",ok:!0,text:`Right. The middle of \xA3210 and \xA3320 is your \xA3265. Say they answer: "\xA3290?" Now move up a little: "I can do \xA3228." If they say "Bit low, mate", they haven't moved, so ask: "What did you have in mind?"`,subs:[]},{k:"A",ok:!1,text:"Just under their price: the middle's about \xA3308.",subs:[]},{k:"B",ok:!1,text:"Your target as your opener, so the middle lands about \xA3293.",subs:[]},{k:"D",ok:!1,text:"Asks their limit (lesson 1.1): usually something near \xA3320.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You want a Nintendo Switch OLED. Similar ones have sold for \xA3180 to \xA3220, and you've written down \xA3180 as your target. A seller on Marketplace has one listed at \xA3260. What's your best first offer?"],quote:[],options:[{k:"A",t:'"Could you do \xA3100 for it?"',ok:!1},{k:"B",t:`"They've gone for \xA3180 to \xA3220. Could you do \xA3180?"`,ok:!0},{k:"C",t:'"Could you do \xA3240 for it, mate?"',ok:!1},{k:"D",t:`"Could you do \xA3200? That's about what they go for."`,ok:!1}],expl:{card:"The card: way over what similar ones sell for? Skip the maths.",items:[{k:"B",ok:!0,text:'Right. The bottom of the going rate, with proof. Say they answer: "\xA3215?" Now move up a small step: "I can do \xA3188."',subs:[]},{k:"A",ok:!1,text:"The maths, where the card says not to: it sends you to \xA3100, nearly half below anything similar. You'll usually get no reply.",subs:[]},{k:"C",ok:!1,text:"Steps down from a price that's already too high.",subs:[]},{k:"D",ok:!1,text:"The middle, so \xA3200 becomes your best (lesson 2.1).",subs:[]}]}},{n:3,fmt:"Say it",stem:[`Someone who follows your photography account sees your old Canon camera in a post and messages: "Would you sell it? I'd give you \xA3270." It comes with two lenses. You check: similar ones with two lenses have sold for \xA3260 to \xA3300, so you write down \xA3300 as your target. What's your best reply?`],quote:[],options:[{k:"A",t:`"You'd get it with both lenses for \xA3330."`,ok:!0},{k:"B",t:`"You'd get it with both lenses for \xA3300. That's what they go for."`,ok:!1},{k:"C",t:'"Could you stretch to \xA3285 for it?"',ok:!1},{k:"D",t:`"You'd get it with both lenses for \xA3390."`,ok:!1}],expl:{card:"The card: selling, flip it. Ask as far above your \xA3300 target as their \xA3270 is below it: \xA3330.",items:[{k:"A",ok:!0,text:'Right. The middle of \xA3270 and \xA3330 is your \xA3300. Say they answer: "Bit steep. I could do \xA3285." Now move down a small step: "You can have it for \xA3318."',subs:[]},{k:"B",ok:!1,text:"Your target as your first number. The middle lands at \xA3285.",subs:[]},{k:"C",ok:!1,text:"A step up from their number: the middle drops to about \xA3278.",subs:[]},{k:"D",ok:!1,text:`Three times the gap the maths gives. You'll usually get: "Ha, no thanks."`,subs:[]}]}},{n:4,fmt:"Type it",stem:["You want a 27-inch monitor listed on Marketplace at \xA3240. Similar ones have sold for \xA3210 to \xA3250, and you've written down \xA3210 as your target. The stand has a scratch on it. Type your first offer, with a reason, so that the middle of your offer and their \xA3240 lands on your target."],quote:[],options:[],model:"Could you do \xA3180? The stand's scratched.",checks:"contains an amount from 175 to 185 (with or without \xA3); every \xA3 amount, and every number of 100 or more, is from 175 to 185 or is 240; contains one of: scratch, scratched, stand, mark, marked, because, since, given; contains none of: target, middle, halfway, meet, split, budget, up to, max, most I, at most, lowest, best price, best you can do, sorry, if not, no worries; 20 words or fewer. Whole words, any case.",after:["The card: offer as far below your target as their price is above it. \xA3240 is \xA330 above your \xA3210, so offer \xA3180, with a reason.",'The middle of \xA3180 and \xA3240 is your \xA3210. Say they answer: "\xA3225?" Now move up a small step (lesson 3.3): "I can do \xA3192."',"Fails: offering your target (\xA3210), which puts the middle at \xA3225, an offer just under their price, no reason, and mentioning your target or the middle."],modelRaw:`"Could you do \xA3180? The stand's scratched."`}],mission:"look up the sold prices for something you'd like to buy and write down your target (the bottom of what they sell for). Then find a listing priced inside that range and work out the offer that puts the middle on your target."},{id:"3.5",title:"Check before you meet in the middle",guess:{stem:["On eBay, buyers and sellers can haggle by sending offers and counter-offers. Across about 10 million of these haggles, what share of offers were exactly halfway between the last two numbers?"],options:[{k:"A",t:"1%",ok:!1},{k:"B",t:"4%",ok:!1},{k:"C",t:"12%",ok:!0},{k:"D",t:"40%",ok:!1}],reveal:"about 12%, far more than chance, and halfway offers were accepted more often than other offers. Meeting in the middle is one of the most normal things people do when they haggle."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:`When they say "Let's meet in the middle", check both numbers. If either is way off what similar ones sell for, ask:`},{t:"quote",text:'"Middle of what?"'},{t:"p",text:"Then go back to what similar ones sell for."}]},{h:"When to use it",items:[{t:"p",text:"Someone offers to split the difference."},{t:"sit",text:"A seller on Marketplace, a buyer on eBay, a landlord on rent."}]},{h:"Why it works",items:[{t:"p",text:"Halfway sounds fair, and halfway offers do get accepted more often. But the middle is only as fair as the two numbers either side of it. Halfway from a silly number is still silly."}]},{h:"Example",items:[{t:"sit",text:'Buying a road bike. Similar ones go for about \xA3500. The seller asked \xA3900, you offered \xA3480, and now: "Meet in the middle? \xA3690."'},{t:"say",who:"You",text:'"Middle of what? Similar ones go for about \xA3500."'},{t:"say",who:"Seller",text:'"Fair enough. \xA3540?"'},{t:"p",text:`That's \xA3150 under his "middle".`}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Both numbers near the going rate? Halfway is often the quickest close.",rest:"The middle lands near the going rate anyway."},{t:"sit",text:"A guitar that sells for about \xA3300. You're at \xA3290, she's at \xA3310."},{t:"quote",text:'"Go on then, \xA3300."'},{t:"tip",n:2,title:'One number way off? Ask "Middle of what?",',rest:`however generous halfway sounds. It works when you're selling too: a lowball offer drags their "middle" too low.`},{t:"sit",text:`You've listed a lamp at \xA360. Similar ones sell for \xA350 to \xA360. A buyer offered \xA320, and now says: "Meet at \xA340?"`},{t:"quote",text:'"Middle of what? These sell for \xA350 to \xA360."'}]},{h:"Avoid",items:[{t:"bad",text:'"Go on then, halfway," straight after a silly first number.'},{t:"bad",text:`"Sorry, I never split the difference." The myth below, with no reason: they'll usually just go.`}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:'On eBay, about 12% of offers were exactly halfway, and halfway offers were accepted more often (Keniston and colleagues, 2021, about 10 million haggles). Asking "Middle of what?" is our own advice, never tested on its own.'},{t:"ev",label:"Myth",text:'"Never split the difference." Fine for hostage negotiators, but too strong for haggling over prices.'}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're buying a used Dyson Airwrap. Similar ones have sold for \xA3220 to \xA3260. The seller listed it at \xA3380, you offered \xA3220, and now they say: "Let's just meet in the middle. \xA3300?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Go on then, \xA3300 sounds fair enough to me, mate."',ok:!1},{k:"B",t:'"Halfway from \xA3380? They go for \xA3220 to \xA3260."',ok:!0},{k:"C",t:`"I can stretch to \xA3280, but that's my absolute limit."`,ok:!1},{k:"D",t:'"How about we split it again? \xA3260?"',ok:!1}],expl:{card:"The card: a middle is only as fair as its two numbers, and their \xA3380 is way over the going rate.",items:[{k:"B",ok:!0,text:'Right. Their "middle" is built on a price nobody pays. Say they answer: "Fair enough. \xA3255?" Now move up a small step: "I can do \xA3232." If they say "\xA3300 or nothing", others sell for \xA3220 to \xA3260.',subs:[]},{k:"A",ok:!1,text:'Pays \xA340 over the going rate because "the middle" sounded fair.',subs:[]},{k:"C",ok:!1,text:"Jumps \xA360 and tells them your limit.",subs:[]},{k:"D",ok:!1,text:"Still built on their \xA3380: \xA340 for nothing.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling a Patagonia fleece on eBay. Similar ones have sold for \xA375 to \xA385, and you've listed it at \xA385. A buyer offered \xA360, you countered at \xA382, and they reply: "Meet in the middle at \xA371?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Middle of what? These sell for \xA375 to \xA385."',ok:!0},{k:"B",t:`"\xA371 works for me. Send it as an offer and I'll accept."`,ok:!1},{k:"C",t:`"Sorry, I never split the difference. It's \xA382."`,ok:!1},{k:"D",t:`"What's the highest you could go to?"`,ok:!1}],expl:{card:"The card: a middle is only as fair as its two numbers, and their \xA360 is \xA315 under the going rate.",items:[{k:"A",ok:!0,text:`Right. It brings the talk back to what fleeces sell for. Say they answer: "OK, \xA376?" That's \xA35 over their "middle". Now: "\xA380 and it's yours."`,subs:[]},{k:"B",ok:!1,text:"Agrees to a middle built on a lowball: \xA34 under anything similar.",subs:[]},{k:"C",ok:!1,text:"The myth, with no reason. On eBay, they'll usually click the next listing.",subs:[]},{k:"D",ok:!1,text:"Asks for their limit. They'll usually say \xA371, and that's your ceiling.",subs:[]}]}},{n:3,fmt:"Sort it",stem:[`You're buying a used car. The online valuation says it's worth about \xA36,000. In each line, the seller suggests meeting in the middle. Does the middle land on the valuation, or should you ask "Middle of what?" and go back to the \xA36,000?`],quote:[],options:[],sort:[{t:'"You offered \xA35,800, they asked \xA36,200, and they suggest \xA36,000."',bin:"the middle lands on the valuation"},{t:'"They asked \xA39,000, you offered \xA36,000, and they suggest \xA37,500."',bin:"middle of what?"},{t:`"You're \xA3200 apart: you've offered \xA35,900 and they want \xA36,100."`,bin:"the middle lands on the valuation"},{t:'"They asked \xA37,500, you offered \xA35,900, and they suggest \xA36,700."',bin:"middle of what?"},{t:`"A dealer says 'I'll meet you halfway' between your \xA36,000 and their \xA38,000."`,bin:"middle of what?"}],expl:{card:"The card: whether halfway is fair depends on the two numbers, not on how generous it sounds.",items:[{label:"The middle lands on the valuation",text:'"\xA35,800 and \xA36,200" and "\xA35,900 and \xA36,100". Both numbers are near \xA36,000, so halfway is \xA36,000.',subs:[]},{label:"Middle of what?",text:"",subs:['"\xA39,000 and \xA36,000": the middle, \xA37,500, is \xA31,500 over the valuation.','"\xA37,500 and \xA35,900": \xA36,700 is still \xA3700 over.',`The dealer's "I'll meet you halfway" is the trap. It sounds generous, but halfway from \xA38,000 leaves you paying \xA31,000 over.`]}]},bins:["the middle lands on the valuation","middle of what?"]},{n:4,fmt:"Type it",stem:[`You've listed a Sage coffee machine on Marketplace at \xA3200. Similar ones have sold for \xA3180 to \xA3200. A buyer offers \xA3120, then adds: "Let's meet in the middle, \xA3160?" Type a reply that doesn't agree to \xA3160 and brings it back to what similar ones sell for.`],quote:[],options:[],model:"Middle of what, though? Similar ones have sold for \xA3180 to \xA3200.",checks:"contains one of: sell for, sells for, sell at, sold for, sold at, sold, selling, selling for, go for, goes for, going for, gone for, going rate, worth, similar, others, based on, listings, used ones, usually; no amount from 121 to 179 except 160 (with or without \xA3); contains none of: deal, fine, ok, okay, go on, sounds good, works, sure thing, for sure, happy with, let's do, let's say, I'll take, you're on, go for it, done, lowest, minimum, at least, can't go, need, accept; 25 words or fewer. Whole words, any case.",after:["The card: the middle is only as fair as the two numbers. Their \xA3120 is \xA360 under anything similar has sold for, so halfway is still too low.",`Say they answer: "Fair enough. \xA3175?" Now you're close to the going rate: "I can do \xA3188."`,`Fails: agreeing ("fine", "go on", "OK"), offering a price below what similar ones sell for, and replies that don't mention what similar ones sell for.`],modelRaw:'"Middle of what, though? Similar ones have sold for \xA3180 to \xA3200."'}],mission:`find a listing you like and look up what similar ones have sold for. Work out where "meet in the middle" would land between the asking price and an offer at the bottom of that range. If it lands above what they sell for, write the "Middle of what?" reply you'd send.`},{id:"3.6",title:"Get them to suggest the middle",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"You're close and stuck. Don't offer the middle. Say:"},{t:"quote",text:`"It'd be a shame to lose this over \xA340."`},{t:"p",text:"Then stop talking."}]},{h:"When to use it",items:[{t:"p",text:"Both numbers are near the going rate, there's a small gap, and neither of you is moving."},{t:"sit",text:"\xA3280 against their \xA3320 for a sofa, or \xA3200 apart on a car."}]},{h:"Why it works",items:[{t:"p",text:"The silence is awkward, and people often fill it by suggesting the split themselves. Then they've moved halfway, and you haven't moved at all."}]},{h:"Example",items:[{t:"sit",text:"You're buying a used iPhone. Similar ones go for \xA3300 to \xA3350. You're at \xA3300, the seller's at \xA3340, and it's stalled."},{t:"say",who:"You",text:`"It'd be a shame to lose this over \xA340."`},{t:"say",who:"Seller",text:'"Shall we just split it? \xA3320."'},{t:"p",text:"They've come down \xA320. You haven't moved."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Say the line, then wait. Don't add a number.",rest:""},{t:"good",text:`"It'd be a shame to lose this over \xA340."`},{t:"bad",text:`"It'd be a shame to lose this over \xA340. \xA3320?" \u2192 you've offered the middle yourself.`},{t:"tip",n:2,title:"They offer the middle? That's their new number.",rest:"Take it, or, on a one-off deal with a stranger, try once more with a smaller move:"},{t:"quote",text:`"So you could do \xA3320? Make it \xA3310 and it's done."`},{t:"p",text:"Don't split twice with someone you'll deal with again, like a landlord or a regular client. It feels like a squeeze."},{t:"tip",n:3,title:"They say the shame line to you? Don't offer the split.",rest:""},{t:"quote",text:'"It would. What can you do?"'}]},{h:"Don't use it when",items:[{t:"li",text:"**One number is way off the going rate.** Halfway is still too much, so go back to what similar ones sell for first (lesson 3.5)."},{t:"li",text:"**They've just moved.** Then a smaller move of your own is fine, even if it lands halfway (lesson 3.3)."}]},{h:"Avoid",items:[{t:"bad",text:'"Shall we just meet in the middle?" Whoever suggests the middle moves first.'}]},{h:"Other ways to say it",items:[{t:"p",text:`"Feels daft to let this fall through over \xA340." \xB7 "I'd hate for this to fall through over \xA340."`}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Widely taught to salespeople (Roger Dawson), never tested."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You're buying an oak dining table on Marketplace. Similar tables sell for \xA3300 to \xA3380. You're at \xA3300, the seller's at \xA3350, and you've been going back and forth for ten minutes. What's your best next message?"],quote:[],options:[{k:"A",t:'"Shall we just split it and call it \xA3325?"',ok:!1},{k:"B",t:`"It'd be a shame to lose this over \xA350. \xA3325?"`,ok:!1},{k:"C",t:'"Feels daft to let this fall through over \xA350."',ok:!0},{k:"D",t:`"\xA3350's a bit much. What's the lowest you'd go to?"`,ok:!1}],expl:{card:"The card: when you're close, don't offer the middle. Say it'd be a shame to lose it, then wait.",items:[{k:"C",ok:!0,text:`Right. It points at the gap without moving. Say they answer: "Go on, split it. \xA3325?" They've come down \xA325 and you haven't moved. Take it, or try once more: "Make it \xA3315 and it's done."`,subs:[]},{k:"A",ok:!1,text:`Offers the middle yourself. You'll usually get: "Make it \xA3340."`,subs:[]},{k:"B",ok:!1,text:"The right line, then you offer the middle anyway.",subs:[]},{k:"D",ok:!1,text:"Asks for their lowest, so that's the most you'll get off.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling your DJI drone on Marketplace, listed at \xA3450. The buyer's at \xA3400 and you're at \xA3440. He says: "Come on, it'd be a shame to lose this over forty quid." What's your best reply?`],quote:[],options:[{k:"A",t:'"It would. What can you do?"',ok:!0},{k:"B",t:'"True. Shall we just meet at \xA3420?"',ok:!1},{k:"C",t:`"Go on then, \xA3400. Let's not fall out over it."`,ok:!1},{k:"D",t:'"It would be. I could maybe do \xA3430?"',ok:!1}],expl:{card:"The card: they say the shame line to you? Don't offer the split. Ask what they can do.",items:[{k:"A",ok:!0,text:`Right. It agrees, and hands the next move back to him. Say he answers: "Fine, \xA3420?" He's come up \xA320 and you haven't moved. Take it, or try once more: "Make it \xA3434 and it's yours."`,subs:[]},{k:"B",ok:!1,text:"Offers the middle, exactly what he was fishing for.",subs:[]},{k:"C",ok:!1,text:"Gives him the whole \xA340.",subs:[]},{k:"D",ok:!1,text:`Drops \xA310 before he's moved (lesson 3.2). You'll usually get: "Make it \xA3410."`,subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're booking a man-with-a-van for your move. Other quotes were \xA3100 to \xA3150. You've offered \xA3100, he's asked \xA3140, and you're both stuck. Which lines get him to suggest the middle, and which offer it yourself?"],quote:[],options:[],sort:[{t:`"It'd be a shame to lose this over \xA340."`,bin:"gets him to suggest it"},{t:'"Shall we just meet in the middle?"',bin:"offers it yourself"},{t:`"We're so close now, it feels daft to stop."`,bin:"gets him to suggest it"},{t:`"Let's call it \xA3120 and be done."`,bin:"offers it yourself"},{t:`"I'd hate for this to fall through over \xA340."`,bin:"gets him to suggest it"},{t:`"It'd be a shame to lose this over \xA340. \xA3120?"`,bin:"offers it yourself"}],expl:{card:"The card: whoever suggests the middle moves first. Say the shame line, then wait.",items:[{label:"Gets him to suggest it",text:`"shame to lose this", "so close now", "hate for this to fall through". Each points at the gap without moving. Say he answers: "Go on, \xA3120." He's dropped \xA320 and you haven't moved.`,subs:[]},{label:"Offers it yourself",text:"",subs:['"Meet in the middle?" and "\xA3120 and be done" move you \xA320 straight away.',`The last line is the trap: the right words, then you offer the middle anyway. You'll usually get: "Make it \xA3125."`]}]},bins:["gets him to suggest it","offers it yourself"]},{n:4,fmt:"Say it",stem:["You're buying a used Xbox Series X on Marketplace. Similar ones sell for \xA3250 to \xA3280. The seller started at \xA3400 and you offered \xA3250. He's now at \xA3380, you're at \xA3260, and it's stalled. What's your best next message?"],quote:[],options:[{k:"A",t:`"It'd be a shame to lose this over \xA3120."`,ok:!1},{k:"B",t:'"Shall we meet in the middle at \xA3320?"',ok:!1},{k:"C",t:`"What's the lowest you'd take for it?"`,ok:!1},{k:"D",t:'"Similar ones go for \xA3250 to \xA3280, mate."',ok:!0}],expl:{card:"The card: the shame line is for when both numbers are near the going rate. His \xA3380 isn't, so go back to it first (lesson 3.5).",items:[{k:"D",ok:!0,text:`Right. It brings the talk back to the real price. Say he answers: "Fair, \xA3290 then?" Now the shame line works: "It'd be a shame to lose this over \xA330."`,subs:[]},{k:"A",ok:!1,text:"The right line, wrong place. His split would be \xA3320.",subs:[]},{k:"B",ok:!1,text:"Offers the middle of a silly number: \xA340 over the going rate.",subs:[]},{k:"C",ok:!1,text:"Asks for his lowest. He'll usually say \xA3350.",subs:[]}]}},{n:5,fmt:"Type it",stem:["You're selling your Honda Jazz. Similar ones have sold for \xA32,800 to \xA33,100. The buyer's at \xA32,850, you're at \xA32,950, and you've both been stuck for ten minutes. Type a line that gets them to suggest meeting in the middle, without offering it yourself."],quote:[],options:[],model:"We're so close. It'd be a shame to lose this over \xA3100.",checks:`contains one of: shame, pity, daft, silly, mad, crazy, gutted, hate, waste; contains one of: lose, losing, lost, fall through, fall apart, fall over, miss out, walk away, over; no amount other than 100 (with or without \xA3; "a hundred" and "hundred quid" are fine); contains none of: split, middle, halfway, meet, how about, what about, I'll do, I could, I can, could do, can do, call it, lowest, best price, your best, the most, fifty, grand, thousand, can't go, lower, minimum, at least, need; 20 words or fewer. Whole words, any case.`,after:["The card: say what a shame it would be, then wait for them to offer the middle.",`Say they answer: "Split it then? \xA32,900." They've come up \xA350 and you haven't moved. Take it, or try once more: "Make it \xA32,925 and the keys are yours." If they answer "It would. What can you do?", they know the trick: stay at \xA32,950, or make one small move (lesson 3.3).`,"Fails: offering the middle, naming a new number, telling them your limit, and asking for their best price."],modelRaw:`"We're so close. It'd be a shame to lose this over \xA3100."`}],mission:`this week, make an offer on a Vinted or Marketplace listing you'd buy. When you're close and stuck, send "Feels daft to let this fall through over \xA3X" and see who suggests the middle.`}]},{n:4,title:"Holding Firm",tagline:"Say no without starting a row, and stay put when they push.",lessons:[{id:"4.1",title:"Push back on a cheeky demand",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When someone asks for something way out of line, don't argue or give in. Ask calmly:"},{t:"quote",text:'"How am I supposed to do that?"'},{t:"p",text:"Then stop talking."}]},{h:"When to use it",items:[{t:"p",text:"A demand far beyond what's fair, once you've been chatting a bit."},{t:"sit",text:"A client wanting a week's work by tomorrow for the same fee, a buyer wanting half off plus free postage."}]},{h:"Why it works",items:[{t:"p",text:"It's a no without the row. They have to see the deal from your side, and often come back with a smaller ask."}]},{h:"Example",items:[{t:"sit",text:"You tutor at \xA335 an hour. A parent you've been chatting to wants three hours a week, plus marking, for \xA350."},{t:"say",who:"You",text:'"How am I supposed to do that?"'},{t:"say",who:"Parent",text:'"Fair. Could you do two hours for \xA370?"'},{t:"p",text:"Their ask shrank, and you never said no."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Say it slowly, then stay quiet.",rest:"In a message there's no calm voice, so start friendly."},{t:"sit",text:'A buyer messages: "\xA330 for your \xA370 jacket, and post it free?"'},{t:"good",text:'"Ha, I like the confidence! How am I supposed to do that?"'},{t:"bad",text:'"Are you having a laugh?" \u2192 sarcasm starts the row.'},{t:"tip",n:2,title:`They say "That's your problem"? Stop pushing on price.`,rest:"They've hit their limit. Change what they get for the money, or walk away."},{t:"sit",text:`A client says: "\xA3100 is all we've got. That's your problem."`},{t:"quote",text:'"For \xA3100, I can do the logo."'}]},{h:"Don't use it when",items:[{t:"li",text:`**It's their normal price.** There it sounds like whining. Know the going rate? \u2192 Name your number. Don't? \u2192 "What could you do on the price?" (lesson 1.1).`},{t:"li",text:"**It's your first message.** Chat a bit first, or it sounds like whining too."}]},{h:"Avoid",items:[{t:"bad",text:`"That's ridiculous." They defend their ask.`},{t:"bad",text:'"Why would I do that?" "Why" sounds like a challenge (lesson 1.3).'},{t:"bad",text:'"Go on, \xA3180 for the lot." Giving in a bit tells them pushing works.'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Chris Voss teaches it. Never tested for getting a better price."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You've been messaging a caf\xE9 owner for a week about designing her logo, and it's been friendly. You charge \xA3100 for a logo, and about \xA375 each for a menu design or a set of Instagram posts. Now she writes: "Could you do the logo, the menus and a set of Instagram posts for \xA3100, by Friday?" What's your best reply?`],quote:[],options:[{k:"A",t:`"I'd need at least \xA3250 to do all of that, I'm afraid."`,ok:!1},{k:"B",t:'"Why do you think all that is only worth \xA3100?"',ok:!1},{k:"C",t:'"Ha, cheeky! I could do all three for \xA3200?"',ok:!1},{k:"D",t:'"Love it! How am I supposed to do all that for \xA3100?"',ok:!0}],expl:{card:'The card: for a demand way out of line, ask "How am I supposed to do that?", friendly in a message.',items:[{k:"D",ok:!0,text:'Right. A no without a row, and she sees it from your side. Say she answers: "Fair. What could you do for \xA3100?" Now you can say: "The logo. Menus and posts are another \xA3150."',subs:[]},{k:"A",ok:!1,text:"Names your floor, so \xA3250 is the most you'll get.",subs:[]},{k:"B",ok:!1,text:'"Why" about her price, so she defends it.',subs:[]},{k:"C",ok:!1,text:'Gives in by \xA350 straight away: "Could you do \xA3150?"',subs:[]}]}},{n:2,fmt:"Say it",stem:["You're moving flats across town. A man with a van quotes \xA3180 for the job, his standard price for a half-day move. It feels a lot for one room of stuff, but you've no idea what moves usually cost. What's your best reply?"],quote:[],options:[{k:"A",t:'"How am I supposed to pay \xA3180 for one room of stuff?"',ok:!1},{k:"B",t:'"Is \xA3180 the best you can do on that?"',ok:!1},{k:"C",t:'"What could you do on the \xA3180?"',ok:!0},{k:"D",t:'"Could you do it for \xA3110?"',ok:!1}],expl:{card:"The card: don't use it on their normal price. \xA3180 is his standard price, and you don't know the going rate, so ask what he could do (lesson 1.1).",items:[{k:"C",ok:!0,text:`Right. He names the first discount. Say he answers: "\xA3160 if you're packed and ready when I get there." That's \xA320 off for something you'd do anyway.`,subs:[]},{k:"A",ok:!1,text:`The card's line on a normal price: "That's what a half-day costs."`,subs:[]},{k:"B",ok:!1,text:'Asks him to judge his own price: "Yes."',subs:[]},{k:"D",ok:!1,text:"Guesses a number you can't back up.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You quoted \xA3450, your normal rate, to build a small business website. The client offered \xA3150. You asked: "How am I supposed to do that?" They reply: "Not sure, that's your problem. The \xA3150 is a start-up grant, and it's all we've got." What's your best next move?`],quote:[],options:[{k:"A",t:'"For \xA3150, I can do a one-page site."',ok:!0},{k:"B",t:'"Right, but how am I supposed to do that?"',ok:!1},{k:"C",t:`"OK, I'll knock it down to \xA3300 for you."`,ok:!1},{k:"D",t:'"Could you stretch to \xA3300 if I start this week?"',ok:!1}],expl:{card:`The card: "That's your problem" means they've hit their limit. Change what they get for the money.`,items:[{k:"A",ok:!0,text:'Right. The grant is fixed, so shrink the job, not your rate. Say they answer: "One page is fine for now." If they still want the full site for \xA3150, walk away.',subs:[]},{k:"B",ok:!1,text:"Repeats a question they've just answered.",subs:[]},{k:"C",ok:!1,text:"Drops \xA3150 for nothing, and it's still double the grant.",subs:[]},{k:"D",ok:!1,text:`Keeps pushing on price after they've told you \xA3150 is all there is. You'll usually get: "Like I said, \xA3150."`,subs:[]}]}},{n:4,fmt:"Type it",stem:[`You've been chatting with a Marketplace buyer about your wardrobe, listed at \xA3120 (similar ones go for \xA3100 to \xA3130), and it's been friendly. Now they write: "Could you knock off \xA350 and deliver it to Bristol for free?" That's 40 miles away. Type your reply: the calm question that says no without a row.`],quote:[],options:[],model:"Ha, how am I supposed to do that?",checks:`contains one of: how am I, how would I, how could I, how can I, how do I; contains one of: supposed to, meant to, do that, do all that, make that work, manage that; ends with "?" (trailing emojis ignored); no number other than their 50, the 40 miles, your 120 and the 70 they'd pay; contains none of: ok, okay, sure, fine, deal, lowest, best price, minimum, at least, below, can't go, ridiculous, joke, joking, kidding, mick, serious, laugh, mad, piss, why; 15 words or fewer. Whole words, any case.`,after:['The card: when a demand is way out of line, ask "How am I supposed to do that?", friendly in a message, then stop.',`Say they answer: "Fair, Bristol's a trek. What if I collect, and you knock off \xA310?" Their \xA350 and free delivery just became \xA310 and you staying at home.`,'Fails: agreeing ("OK", "sure"), a new number, sarcasm ("Are you serious?", "having a laugh?") and "why".'],modelRaw:'"Ha, how am I supposed to do that?"'}],mission:`this week, think of one request you've had that was way out of line (a mate wanting a free lift to the airport, a buyer wanting half off). Write the friendly message version of "How am I supposed to do that?", then say the spoken version out loud, slowly, and stop.`},{id:"4.2",title:"Hold your no without arguing",guess:{stem:["Researchers watched skilled negotiators across 103 negotiation sessions. The skilled ones gave about 1.8 reasons to back up each point. How many did average negotiators give?"],options:[{k:"A",t:"About 0.9",ok:!1},{k:"B",t:"About 1.2",ok:!1},{k:"C",t:"About 1.8, the same",ok:!1},{k:"D",t:"About 3",ok:!0}],reveal:"about 3. The best negotiators gave fewer reasons, not more."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When they push again on something you've said no to, say:"},{t:"quote",text:`"That's difficult."`},{t:"p",text:"Pause for three seconds. Then say where you stand in one short sentence, letting your voice go down at the end, and stop."}]},{h:"When to use it",items:[{t:"p",text:"You've said no, and they keep pushing."},{t:"sit",text:"A customer haggling at your car-boot stall, a mate asking to borrow your car again, your manager asking you to stay late again."}]},{h:"Why it works",items:[{t:"p",text:"Arguing and giving a little both teach them that pushing works. A calm, flat sentence gives them nothing to argue with."}]},{h:"Example",items:[{t:"sit",text:"At a car-boot sale, a customer has asked twice for your \xA340 lamp at \xA325."},{t:"say",who:"Customer",text:`"Go on, \xA325. It's only a lamp."`},{t:"say",who:"You",text:`"That's difficult\u2026 I'm staying at \xA340."`},{t:"p",text:"Nothing to argue with: they pay \xA340 or walk."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Would you say yes on other terms? Make those terms your sentence.",rest:"No whatever happens? Say where you stand."},{t:"sit",text:"A client wants a free extra round of edits. You'd do it for \xA330."},{t:"quote",text:`"That's difficult. Another round is \xA330."`},{t:"tip",n:2,title:"One reason at most: your strongest, said once.",rest:"All your reasons weak? Give none. Give a pile and they'll attack the weakest."},{t:"sit",text:"Your mate asks again to borrow your car."},{t:"good",text:`"That's difficult. It's not insured for you."`},{t:"bad",text:`"I need it Saturday, the tyres are low, and it's not insured for you." \u2192 "I'll check the tyres!"`},{t:"tip",n:3,title:"In a message, skip the pause.",rest:"Just send the two short
