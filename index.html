then ask. No money off.",`Say she answers: "Fine. 6 tomorrow, and you'd better be in." You've kept the sale at \xA335, instead of knocking a fiver off to say sorry.`,`Fails: money off ("\xA330 for the hassle"), excuses that weren't what happened ("got held up at work"), vague sorries ("Sorry for any inconvenience"), and a sorry with no new time to collect.`],modelRaw:`"Really sorry, I completely forgot and went to the gym. That's on me. Could you come tomorrow at 6? I'll be in."`}],mission:"think of the last time you let someone down: you were late, forgot something or missed a deadline. Write the message you'd send now: sorry, what happened in one plain line, then your ask, with no money off."},{id:"6.3",title:"Copy their words",guess:{stem:["In a chat negotiation, people were told to copy the other person's words and phrases, either in the first ten minutes or in the last ten. Which group got the best deals?"],options:[{k:"A",t:"Copying in the first ten minutes",ok:!0},{k:"B",t:"Copying in the last ten minutes",ok:!1},{k:"C",t:"Not copying at all",ok:!1},{k:"D",t:"It made no difference",ok:!1}],reveal:"copying early scored about a third more points than not copying. Copying late did worst of all."},card:{paras:[{t:"p",text:`Use this when you're haggling by message: Vinted, Depop, Marketplace, WhatsApp with a landlord or a client. In your first few messages, copy a couple of their words: their greeting ("hiya", "Good evening"), their abbreviations ("tbh", "tmrw") and what they said about their situation ("for my brother's birthday"). People trust people who talk like them, and in studies the person who copied got the better deal. Copy early, then stop: once you're deep in the haggling, just stick to your terms.`},{t:"p",text:'Copying their words never means copying their number. "ok yeah 35 is fine!" sounds just like them and loses you \xA310.'}],rows:[{label:"Say",text:`to "Hey! Love this, any chance of 20?": "Hey! Glad you love it. Could do 24?" \xB7 to "Good afternoon. Is the bike still for sale?": "Good afternoon. Yes, it's still for sale."`,subs:[]},{label:"Avoid",text:"",subs:['Replying in your own stiff words to a casual message: "Hello, thank you for your enquiry."',"Copying so much they notice: every word, or their typos.","Going along with their price to keep things friendly."]},{label:"Watch out",text:"use one or two of their words, not all of them, because if they spot it, it stops working. In one of the two studies, copying late in the chat seemed to help the other side instead, so do it at the start.",subs:[]},{label:"Evidence",text:"Some evidence. In two small chat experiments, people who copied the other side's words in the first ten minutes were trusted more and got better deals (Swaab, Maddux and Sinaceur, 2011).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're selling a jacket on Vinted for \xA345. Similar ones have sold for \xA340 to \xA345. A buyer messages: "hiya!! would u take 35? need it for a festival next wk \u{1F64F}" What's your best reply?`],quote:[],options:[{k:"A",t:'"hiya! could do 42 and post tmrw, in time for the festival"',ok:!0},{k:"B",t:'"Hello, thanks for your offer. I could do \xA342 and post tomorrow."',ok:!1},{k:"C",t:`"Sorry, it's already priced really fairly, so I'm sticking at \xA345."`,ok:!1},{k:"D",t:`"ok yeah 35 is fine, I'll get it posted to you tmrw!"`,ok:!1}],expl:{card:"The card: copy their words, not their number.",items:[{k:"A",ok:!0,text:`Right. Their "hiya", their festival, and \xA342. Say they reply: "yesss deal!!" That's \xA37 more than they asked. If they say "35 or nothing sorry", hold: "42's my price, but it'll be with u in time for the festival".`,subs:[]},{k:"B",ok:!1,text:"The same deal, in your words, not theirs.",subs:[]},{k:"C",ok:!1,text:"None of their words, and nothing to say yes to.",subs:[]},{k:"D",ok:!1,text:"Sounds like them, then takes their offer: \xA310 gone.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling an old electric piano on Facebook Marketplace for \xA3180. Similar ones have sold for \xA3160 to \xA3185. A buyer messages: "Good evening. Is the piano still available? I could collect on Saturday morning if \xA3140 would be acceptable. Kind regards, Margaret." What's your best reply?`],quote:[],options:[{k:"A",t:'"hiya! yep still here \u{1F60A} could do 175 if u grab it sat morning?"',ok:!1},{k:"B",t:`"Good evening, Margaret. Yes, it's still here, and \xA3140 would be fine. See you Saturday."`,ok:!1},{k:"C",t:'"Good evening, Margaret. Yes, it is. I could do \xA3175 if you collect on Saturday."',ok:!0},{k:"D",t:`"Hi, yes it's still available. What's the most you could stretch to?"`,ok:!1}],expl:{card:"The card: copy their words. This time they're formal ones.",items:[{k:"C",ok:!0,text:'Right. Her "Good evening", her name, her Saturday, and a price near the top of the market. Say she replies: "Would \xA3150 be possible?" Now: "I could do \xA3172, if you collect on Saturday."',subs:[]},{k:"A",ok:!1,text:"The same deal, in texting-speak, with none of her words.",subs:[]},{k:"B",ok:!1,text:"Copies her words, then accepts her first offer: \xA340 gone.",subs:[]},{k:"D",ok:!1,text:"Asks for her limit, so her answer becomes your ceiling.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You want a bookcase listed at \xA380 on Facebook Marketplace. Similar ones have sold for about \xA360. The listing says: "Moving to Leeds on Friday so need this gone asap!" What's your best first message?`],quote:[],options:[{k:"A",t:'"Hi, is the bookcase still available? Would you take \xA360?"',ok:!1},{k:"B",t:'"Hi! Happy to help get it gone before Friday. \xA360 if I collect Thursday?"',ok:!0},{k:"C",t:'"Hello, I am interested in purchasing the bookcase. Would \xA360 be acceptable to you? Kind regards"',ok:!1},{k:"D",t:`"Hi! Could you do \xA360 for it? Moving's so stressful, so no worries if not!"`,ok:!1}],expl:{card:"The card: copy their words, including what they said about their situation.",items:[{k:"B",ok:!0,text:`Right. Their "gone" and their Friday make you sound on their side. Say they reply: "Thursday's perfect! Could you do \xA370?" Now: "I could do \xA363, and I'll be there at 6 on Thursday."`,subs:[]},{k:"A",ok:!1,text:'None of their words, so it reads like every lowball: "\xA375 lowest."',subs:[]},{k:"C",ok:!1,text:"None of their words either, in a stiff tone.",subs:[]},{k:"D",ok:!1,text:'"No worries if not" makes no the easy answer (lesson 1.1).',subs:[]}]}},{n:4,fmt:"Type it",stem:[`You're selling a dress on Vinted for \xA330. A buyer messages: "heyy is this still up? would be perfect for my sister's 21st xx" Type a first reply that copies some of their words.`],quote:[],options:[],model:"heyy yes still up! it'd be perfect for a 21st xx",checks:"contains at least two of: hey, heyy, heyyy, still up, perfect, sister, sis, 21st, x, xx; contains none of: dear, hello, kind regards, regards, thank you for your, lowest, minimum, at least, below, can't go, best price, no worries, if not; no number other than the 21 in 21st or 30; 20 words or fewer. Whole words, any case.",after:["The card: in your first messages, copy a couple of their words.",`The model answer copies "heyy", "still up", the 21st and the kisses, without overdoing it. Say they reply: "omg yay!! would u do 22? xx" Now you can say: "could do 27 and post tmrw so it's there in time xx"`,`Fails: a formal reply ("Hello, thank you for your message"), copying nothing, or offering a lower price before they've asked.`],modelRaw:`"heyy yes still up! it'd be perfect for a 21st xx"`}],mission:"in the next message you send to a buyer, seller, landlord or client, copy two of their words or their greeting, and notice the tone of what comes back."},{id:"6.4",title:"Firm, never commanding",guess:{stem:["Researchers studied 364 real eBay disputes and looked at what the person complaining wrote. Which made a dispute most likely to settle?"],options:[{k:"A",t:'Friendly words: "Thanks so much, I really appreciate it."',ok:!1},{k:"B",t:'Clear orders: "Refund me now."',ok:!1},{k:"C",t:"Firm words: the facts, plus exactly what they wanted",ok:!0},{k:"D",t:"Showing how angry they were",ok:!1}],reveal:"firm complaints made settling about four times as likely. Orders and angry words roughly halved it, and friendly words made no difference."},card:{paras:[{t:"p",text:`Use this when you're owed: a refund, your deposit back, a charge you never should have paid. Most people either go soft ("Sorry to bother you, I think there might be a mistake?") and get "We'll look into it", or, once they're fed up, give orders ("Refund me now") and get nowhere. Be firm instead: the facts (what happened, with dates and amounts), then exactly what you want, said as what you'd like, not what they must do.`},{t:"p",text:'Why it works: a firm complaint gives them one exact thing to say yes to. Orders and angry words make people dig in, because giving way then feels like being pushed around. In real eBay disputes, firm complaints made settling about four times as likely, and orders and angry words roughly halved it. An order is still an order with "please" on the end.'}],rows:[{label:"Say",text:`"I cancelled my gym on 2 June, but was charged \xA330 on 1 July. I'd like it refunded." \xB7 "I'd expect the delivery fee back." \xB7 If they push back, repeat the facts and the same ask: "I'd still like the \xA330 refunded."`,subs:[]},{label:"Avoid",text:"",subs:['Orders: "Refund me now", "You need to sort this."','Angry words: "This is a joke", "Disgraceful."',"Going soft: no dates, no amount, no ask."]},{label:"Watch out",text:`stay firm when they're nice. A sorry or "I've passed it on" isn't your money, so thank them and repeat the ask. Saying calmly what happens next is fine ("If we can't agree, I'm happy for the deposit scheme to decide"); a deadline plus a threat is an order. And if what they're blaming you for isn't your fault, don't say sorry for it, even to be polite (lesson 6.2).`,subs:[]},{label:"Evidence",text:`Some evidence. In 364 real eBay disputes, firm complaints made settling about four times as likely, orders more than halved it, and angry words roughly halved it (Brett and others, 2007). It's real data, but it shows a link, not proof. The study's "firm" wasn't defined as facts plus an ask; that part is how we've put it into practice.`,subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You cancelled your meal-kit subscription on 3 March, and they've still taken \xA345 on 1 April. You're emailing them. Which message gives you the best chance of getting your money back?"],quote:[],options:[{k:"A",t:`"This is a joke. I cancelled weeks ago and you've helped yourselves to \xA345."`,ok:!1},{k:"B",t:'"Sorry to bother you, I think I may have been charged by mistake? Could someone look into it?"',ok:!1},{k:"C",t:`"I cancelled on 3 March but was charged \xA345 on 1 April. I'd like it refunded."`,ok:!0},{k:"D",t:'"Refund the \xA345 you took on 1 April. I cancelled on 3 March."',ok:!1}],expl:{card:"The card: when you're owed, give the facts and exactly what you want.",items:[{k:"C",ok:!0,text:`Right. Dates, amount, ask. If they reply "We have no record of a cancellation", repeat the facts: "I cancelled in the app on 3 March and have the email. I'd still like the \xA345 refunded."`,subs:[]},{k:"A",ok:!1,text:"Angry words roughly halved settling. Expect a slow, defensive reply.",subs:[]},{k:"B",ok:!1,text:`No dates, no ask. You'll usually get: "We'll look into it."`,subs:[]},{k:"D",ok:!1,text:"The same facts, as an order. Orders halved settling too.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["A hotel has charged you \xA360 for a late checkout you never had. You're writing to them. Which lines are firm, and which give them an order?"],quote:[],options:[],sort:[{t:`"I'd like the \xA360 refunded by Friday."`,bin:"firm"},{t:'"You need to refund this by Friday."',bin:"gives an order"},{t:`"I checked out at 10am, so I'd like the late-checkout charge taken off."`,bin:"firm"},{t:`"Take the \xA360 off and we'll leave it there."`,bin:"gives an order"},{t:`"I'd expect the \xA360 back this week."`,bin:"firm"},{t:'"Just refund it."',bin:"gives an order"}],expl:{card:"The card: firm is the facts plus what you'd like, not what they must do.",items:[{label:"Firm",text:`"I'd like\u2026", "I'd expect\u2026" and "I checked out at 10am, so I'd like\u2026" state what you want without telling them what to do. Say they reply: "Our system shows 12pm." Now you can say: "I left at 10am. I'd still like the \xA360 back."`,subs:[]},{label:"Gives an order",text:"",subs:[`"You need to\u2026" sounds reasonable, but it's an order.`,'"Take the \xA360 off\u2026" is an order with a condition.','"Just refund it" is the bluntest order.']}]},bins:["firm","gives an order"]},{n:3,fmt:"Say it",stem:[`You left your mobile network on 14 April, but they took another \xA322 on 28 April. You emailed with the dates and asked for it back. They reply: "So sorry for the trouble! I've passed this on to our billing team." What's your best reply?`],quote:[],options:[{k:"A",t:`"Thanks, I really appreciate the apology. I'll wait to hear back from them."`,ok:!1},{k:"B",t:`"Sorry doesn't get me my money back. Refund the \xA322 now, please."`,ok:!1},{k:"C",t:'"No worries at all, these things happen! Thanks so much for looking into it."',ok:!1},{k:"D",t:`"Thanks. I'd still like the \xA322 refunded. When will that happen?"`,ok:!0}],expl:{card:"The card: stay firm when they're nice. A sorry isn't your money.",items:[{k:"D",ok:!0,text:`Right. It accepts the sorry, keeps the exact ask, and asks when. Say they reply: "Billing will refund it within five working days." Now you've got a date, not just a sorry.`,subs:[]},{k:"A",ok:!1,text:"Takes the sorry instead of the money. You'll usually hear nothing.",subs:[]},{k:"B",ok:!1,text:`An order, and "please" doesn't change that. Orders more than halved settling.`,subs:[]},{k:"C",ok:!1,text:"Thanks them and drops the ask, so they've nothing left to do.",subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're moving out. Your deposit is protected in a deposit scheme, as the law requires, and your move-in photos show a stain on the bedroom carpet. Your landlord messages: "I'm keeping \xA3300 of your deposit for the carpet stain." What's your best reply?`],quote:[],options:[{k:"A",t:`"That's outrageous. That stain was already there before I even moved in!"`,ok:!1},{k:"B",t:`"The stain is in my move-in photos, attached. I'd like the full deposit back."`,ok:!0},{k:"C",t:`"I'm really sorry about the carpet. Could I have the full deposit back?"`,ok:!1},{k:"D",t:`"Return my full deposit by Friday, or I'll be going straight to the deposit scheme."`,ok:!1}],expl:{card:"The card: facts, exactly what you want, and no sorry for what isn't your fault.",items:[{k:"B",ok:!0,text:`Right. Say he answers: "Photos prove nothing." Now you can say, calmly: "Then I'm happy for the deposit scheme to decide." Its free service needs you both to agree, or it's small claims. Either way, he must justify each deduction.`,subs:[]},{k:"A",ok:!1,text:`Angry words. You'll usually get: "I'm keeping the lot."`,subs:[]},{k:"C",ok:!1,text:"The sorry sounds like you're admitting the stain (lesson 6.2).",subs:[]},{k:"D",ok:!1,text:"An order with a threat, and no facts: he'll dig in.",subs:[]}]}},{n:5,fmt:"Type it",stem:["A takeaway app charged you \xA318 for an order that never arrived. You're messaging their support chat. Type a firm message that doesn't give an order."],quote:[],options:[],model:"My order never arrived, but I was charged \xA318. I'd like a full refund.",checks:"contains one of: arrive, arrived, came, come, delivered, turn up, turned up, show up, showed up, showed, received, get it, got it, get my, got my, charged, paid; contains one of: I'd like, I would like, I'd expect, I would expect, I'm expecting, I want, can I, could I, can you, could you; contains one of: refund, refunded, money back, back; first word (ignoring an opening hi, hello or hey) is not an order (refund, give, send, sort, fix, credit, return, pay, process, cancel, put, just, get); contains none of: refund me, give me, you need to, you must, you have to, sort it, sort this, fix this, immediately, right now, asap, joke, disgrace, disgraceful, ridiculous, useless, scam, rip off, pathetic, unacceptable, outrageous, shocking, seriously, sorry, I think, maybe, might, possibly, if possible, no worries, just wondering, any chance, bother, refund now, back now, it now; no \xA3 amount other than \xA318; 35 words or fewer. Whole words, any case.",after:["The card: when you're owed, say what happened and what you want, with no orders and no angry words.",`Say they reply: "The driver marked it as delivered." Stay firm with the facts: "It wasn't delivered to me. I was in all evening. I'd still like the \xA318 refunded."`,'Fails: orders ("Refund me now"), angry words ("This is a joke"), and soft, vague lines ("Sorry, I think there might be a problem?").'],modelRaw:`"My order never arrived, but I was charged \xA318. I'd like a full refund."`}],mission:`think of one charge, delay or mistake from the last month. Write the message: what happened, in one sentence, then "I'd like\u2026". Send it if it's still worth sending.`}]},{n:7,title:"Bigger Deals",tagline:"Most deals have more in them than one price. Put it all on the table, and you can both come away with more.",lessons:[{id:"7.1",title:"Rank your asks, settle them together",guess:null,card:{paras:[{t:"p",text:"Use this when a deal has more than one part: a job offer (salary, start date, home working), a freelance job (fee, deadline, rounds of changes), a flat (rent, move-in date, furniture). Most people haggle each part on its own. But each side cares about some parts far more than others, so swap: give on what costs you little, and get what you care about most."},{t:"p",text:"Two rules make the swap possible. Put all your asks on the table at once and say how you rank them; in studies, sharing your ranking cost people nothing. And don't agree one part on its own, or you've nothing left to swap for more of it."}],rows:[{label:"Say",text:`"Salary matters most to me, then home working. I'm flexible on the start date." \xB7 "Can we look at it all together before we agree anything?" \xB7 Then swap, saying both halves: "If I start two weeks early, could we do two days at home?"`,subs:[]},{label:"Avoid",text:"",subs:[`"Let's lock in the salary, then do the rest."`,`Telling them your limit: "I'd need at least \xA328,000."`,'Adding asks one by one after a yes: "Oh, and one more thing\u2026"']},{label:"Watch out",text:"in a job offer, or with anyone you'll keep dealing with, asks dripped in after a yes annoy people. Most graduate scheme salaries are fixed (lesson 1.1), so salary swaps work best at smaller firms. If it's only a price, add something to swap: when you collect, how you pay, an extra.",subs:[]},{label:"Evidence",text:"Backed by studies. Most negotiators assume the other side wants the exact opposite of what they want, and miss swaps that leave both better off (Thompson and Hastie, 1990). Asking about or sharing priorities led to better deals for both sides, even when only one person did it, and the people who shared didn't lose out (Thompson, 1991). Raising everything at once is a Pro trick (Deepak Malhotra, Harvard).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`A recruiter rings about your first job offer, at a small marketing agency: "Let's agree salary first, \xA327,000, then we'll sort out the details." Similar roles pay \xA327,000 to \xA329,000. Salary matters most to you, then home working, and you could happily start earlier than planned. What's your best reply?`],quote:[],options:[{k:"A",t:'"Sure, \xA327,000 works. What are the other details?"',ok:!1},{k:"B",t:'"Could we lock the salary in at \xA329,000 first, then sort the rest after?"',ok:!1},{k:"C",t:`"What's the most you could go to on the salary?"`,ok:!1},{k:"D",t:`"I'd rather look at salary, start date and home working together."`,ok:!0}],expl:{card:"The card: keep every part open to swap.",items:[{k:"D",ok:!0,text:`Right. Say they answer: "We're flexible on home working and the start date." Now swap: "If I start two weeks early, could we do \xA328,500 and two days at home?" If they insist on a salary number now, pencil it in: "\xA329,000, as long as we can come back to it."`,subs:[]},{k:"A",ok:!1,text:"Settles salary alone.",subs:[]},{k:"B",ok:!1,text:"Higher, but still one part at a time.",subs:[]},{k:"C",ok:!1,text:"Asks for their limit.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`Your offer from a small agency is \xA328,000, one day a week at home, starting 1 September. Similar roles pay \xA328,000 to \xA330,000. Salary matters most to you, then home working, and you could easily start in August. The recruiter asks: "What matters most to you in all this?" What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!1},{k:"B",t:`"Salary matters most, then home working. The start date's flexible."`,ok:!0},{k:"C",t:`"Honestly, I'd need at least \xA330,000 before I could say yes to this."`,ok:!1},{k:"D",t:'"It all matters to me equally, to be honest."',ok:!1}],expl:{card:"The card: share your ranking, never your limit.",items:[{k:"B",ok:!0,text:`Right. It shows where the swap is. Say they answer: "Salary's tight, but home working's easy." Now: "Then if I start in August, could we do \xA328,750 and two days at home?"`,subs:[]},{k:"A",ok:!1,text:"For questions that could cap you, like your budget (lesson 1.6). A ranking can't cap you.",subs:[]},{k:"C",ok:!1,text:"Your limit. You'll usually get \xA330,000 exactly.",subs:[]},{k:"D",ok:!1,text:"Hides your ranking, so the easy swap never comes up.",subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're negotiating your first job offer, at a small agency. They've offered \xA327,000, and similar roles pay up to \xA329,000. Which lines say what matters most to you, and which give away your limit?"],quote:[],options:[],sort:[{t:'"Salary matters more to me than the start date."',bin:"says what matters most"},{t:`"I couldn't go below \xA327,000."`,bin:"gives away your limit"},{t:'"Home working is the big one for me."',bin:"says what matters most"},{t:`"Anything over \xA328,000 and I'd sign today."`,bin:"gives away your limit"},{t:`"I'm flexible on when I start."`,bin:"says what matters most"},{t:`"I'd need at least two days at home."`,bin:"gives away your limit"}],expl:{card:"The card: share your ranking, never your limit.",items:[{label:"Says what matters most",text:'swaps, with no number to aim at. Say they answer: "Three days at home, but salary stays at \xA327,000." Now: "If I start a week early, could we do \xA327,750?"',subs:[]},{label:"Gives away your limit",text:"",subs:[`"I couldn't go below \xA327,000": you'll usually get exactly that.`,`"Anything over \xA328,000": you'll usually get \xA328,000 and a bit.`,`"At least two days" sounds like a priority, but it's a floor: you'll get two, not three.`]}]},bins:["says what matters most","gives away your limit"]},{n:4,fmt:"Say it",stem:[`A small brewery wants you to design the labels for its new beer. You'd normally charge \xA3365. They say: "We can pay \xA3300, and it has to be ready by the 14th, that's our launch." You've got a quiet month, so the 14th is easy, and you could even send a draft by the 7th. What's your best reply?`],quote:[],options:[{k:"A",t:'"No problem at all. \xA3300 and ready by the 14th works absolutely fine for me."',ok:!1},{k:"B",t:'"Could we do \xA3365 if I deliver it on the 21st, a week later?"',ok:!1},{k:"C",t:'"If I send a draft by the 7th, final by the 14th, could we do \xA3365?"',ok:!0},{k:"D",t:'"Could you do \xA3345 if I throw in a free logo for the launch?"',ok:!1}],expl:{card:"The card: give what costs you little, get what you care about.",items:[{k:"C",ok:!0,text:`Right. A draft costs you little; their launch matters most to them. Say they answer: "A draft by the 7th would really help. \xA3340?" That's \xA340 more for almost nothing.`,subs:[]},{k:"A",ok:!1,text:"Takes their first number and gets nothing for the deadline.",subs:[]},{k:"B",ok:!1,text:`The wrong way round: it asks them to move their launch. "The 14th isn't moving."`,subs:[]},{k:"D",ok:!1,text:"A logo costs you hours: you'd pay for your own \xA345.",subs:[]}]}},{n:5,fmt:"Type it",stem:['A recruiter at a small agency says: "We can do \xA327,500, starting 1 September." Similar roles pay \xA327,500 to \xA329,000. Salary matters most to you, and you could easily start on 18 August. Type a reply that offers the earlier start in return for more salary.'],quote:[],options:[],model:"If I can start on 18 August, could we make it \xA329,000?",checks:"contains one of: August, 18, 18th, earlier, sooner, early; contains a salary above \xA327,500 (any format: \xA328,500, 28,500, 28500, \xA328.5k, 29k); contains none of: at least, minimum, lowest, the most, can't go, couldn't go, I need, need at least, would accept, I'd accept; 30 words or fewer. Whole words, any case.",after:["The card: swap what costs you little for what you care about, and say both halves.",`Say they answer: "We can't do \xA329,000, but \xA328,250 if you start on the 18th." That's \xA3750 a year for two weeks you didn't mind. If they say "Salary's fixed", ask what else the date could buy: "Then could we do two days at home?"`,`Fails: offering the date with nothing back, accepting \xA327,500, or giving away your limit ("I'd need at least \xA328,000").`],modelRaw:'"If I can start on 18 August, could we make it \xA329,000?"'}],mission:`take one deal you're in or about to be in (a job offer, a freelance job, a flat, a bill). Write down every part that could be agreed, then rank them from "matters most" to "don't mind".`},{id:"7.2",title:"Use their own rules",guess:null,card:{paras:[{t:"p",text:`Use this when you're asking a company, a landlord or an employer for something: money back, a better price, a repair, something they don't usually do. Your opinion ("That's not fair") is easy to brush off: "Sorry you feel that way." Their own rules are harder to brush off, because saying no means arguing with themselves. So find their policy (a returns page, a price-match promise, your tenancy agreement), something they promised in writing (an email, an advert) or something they've done before, and use it as your reason.`},{t:"p",text:`If there's no rule to quote, ask what they've done before ("What have you done for other members in my position?"), or what their figure is based on ("What's that based on?").`}],rows:[{label:"Say",text:`"Your website says you price match. Could you match this one?" \xB7 "What have you done for other customers who've had this?" \xB7 "Your email said delivery by Friday."`,subs:[]},{label:"Avoid",text:"",subs:[`Opinions: "Any decent company would sort this", "It's only fair", "That's a rubbish policy."`,'"Could you make an exception, just this once?" That asks them to break their rule, not follow it.']},{label:"Watch out",text:`if the person can't bend the rules ("The system won't let me"), quoting policy at them just makes them defensive. Ask who can, then quote the rule to that person. And say it plainly: if you sound smug, they'll stop wanting to help.`,subs:[]},{label:"Evidence",text:"Pro trick (Stuart Diamond, Getting More; Fisher and Ury, Getting to Yes, on using outside standards like market prices). Widely taught, never tested.",subs:[]}]},questions:[{n:1,fmt:"Sort it",stem:["You ordered a \xA3300 TV online. It arrived a week late with a faulty screen, and you want your money back. Which lines use their own rules or promises, and which are easy to brush off?"],quote:[],options:[],sort:[{t:'"Your returns page says faulty items can be refunded within 30 days."',bin:"uses their own rules"},{t:'"Any decent shop would refund this straight away."',bin:"easy to brush off"},{t:'"You refunded my last order straight away when it arrived damaged."',bin:"uses their own rules"},{t:`"I've been a loyal customer for years."`,bin:"easy to brush off"},{t:'"The order confirmation said delivery by Friday."',bin:"uses their own rules"},{t:'"Nobody would pay \xA3300 for a screen like this."',bin:"easy to brush off"}],expl:{card:"The card: their own rules are hard to argue with; your opinion isn't.",items:[{label:"Their own rules",text:`the returns page, the delivery promise and the last refund. The last refund is strongest: they must explain why you're treated differently. Say they answer: "That was a different item." Now: "What's different? Both arrived faulty."`,subs:[]},{label:"Easy to brush off",text:"",subs:['"Any decent shop\u2026" is opinion dressed as a rule.',`"A loyal customer" is true, but it isn't their rule.`,'"Nobody would pay \xA3300\u2026" is opinion again.']}]},bins:["uses their own rules","easy to brush off"]},{n:2,fmt:"Say it",stem:[`You're four months into a 12-month gym contract at \xA340 a month. You're having knee surgery and can't train for three months. You ask the gym to freeze your membership. They say: "Sorry, we don't do freezes." What's your best reply?`],quote:[],options:[{k:"A",t:`"That's a pretty poor policy for a gym, to be honest."`,ok:!1},{k:"B",t:`"What have you done for members who've had surgery?"`,ok:!0},{k:"C",t:'"Could you make an exception for me, just this once?"',ok:!1},{k:"D",t:`"Okay, I'll just have to keep paying for it, then."`,ok:!1}],expl:{card:"The card: ask what they've done before.",items:[{k:"B",ok:!0,text:`Right. If they've done it for others, no is hard. Say they answer: "We have, with a doctor's note." Now: "I'll get you one this week. Could you freeze it from the 1st?" If they say "Never", ask: "Who'd be able to make that call?"`,subs:[]},{k:"A",ok:!1,text:"Your opinion, so they defend the policy.",subs:[]},{k:"C",ok:!1,text:`Asks them to break their rule: "Sorry, I can't."`,subs:[]},{k:"D",ok:!1,text:"Gives in: \xA3120 for three months you can't use.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`Your phone contract has ended and you own the handset, so you just need a SIM plan. The provider says: "\xA332 a month is our standard price for that plan." On their own website, new customers get the same SIM-only plan for \xA318. What's your best reply?`],quote:[],options:[{k:"A",t:'"Could you knock it down to \xA327 a month?"',ok:!1},{k:"B",t:`"I've been with you four years, and that's not fair, is it?"`,ok:!1},{k:"C",t:'"Is that really the best you can do for me?"',ok:!1},{k:"D",t:'"Your website has it at \xA318. Can I have that price?"',ok:!0}],expl:{card:"The card: use their own price as your reason.",items:[{k:"D",ok:!0,text:`Right. Saying no means defending charging you more than a stranger. Say they answer: "That's for new customers, but I can do \xA320." Now: "It's the same plan. Could you do the \xA318?"`,subs:[]},{k:"A",ok:!1,text:"No reason, and above their own price. \xA327 is usually your best.",subs:[]},{k:"B",ok:!1,text:"Fairness is opinion, and they'll disagree.",subs:[]},{k:"C",ok:!1,text:'Asks them to judge their own price: "Yes, it is."',subs:[]}]}},{n:4,fmt:"Say it",stem:[`A jacket you bought five weeks ago has split at the seam. The shop's returns page says faulty items can be returned within six months. At the till, the assistant says: "I can see it's faulty, but anything over 28 days has to go through head office. The till won't let me." What's your best reply?`],quote:[],options:[{k:"A",t:'"Your returns page says faulty items are covered for six months."',ok:!1},{k:"B",t:`"Come on, it's only a week over the 28 days."`,ok:!1},{k:"C",t:`"Who'd be able to override it for me?"`,ok:!0},{k:"D",t:'"Get me your manager, please. This is ridiculous."',ok:!1}],expl:{card:"The card: ask who can bend the rule, then quote it.",items:[{k:"C",ok:!0,text:`Right. She's agreed it's faulty but can't act. Say she answers: "My supervisor can." Then, to the supervisor: "Your returns page covers faulty items for six months. This split after five weeks."`,subs:[]},{k:"A",ok:!1,text:"The right rule, to someone who can't act on it.",subs:[]},{k:"B",ok:!1,text:"Argues with the 28 days instead of using the six months.",subs:[]},{k:"D",ok:!1,text:"An order with angry words, so the supervisor arrives on her side.",subs:[]}]}},{n:5,fmt:"Type it",stem:['The washing machine that came with your flat broke three weeks ago. Your tenancy agreement says supplied appliances are repaired "within 14 days of being reported". Type a message to your landlord that uses his own agreement.'],quote:[],options:[],model:"The tenancy agreement says appliances are repaired within 14 days. It's been three weeks since I reported the washing machine. When can it be fixed?",checks:"contains one of: agreement, contract, tenancy; contains one of: 14, fourteen, two weeks, fortnight; contains one of: when, could, can, would, I'd like, I would like, I'd expect; first word (ignoring an opening hi, hey, hello or dear) is not an order (fix, sort, get, repair, send, replace); contains none of: disgrace, joke, ridiculous, useless, immediately, right now, asap, or else, seriously, even, unacceptable, fix it, sort it, clearly, as you know; 40 words or fewer. Whole words, any case.",after:["The card: use their own rule as your reason, and say it plainly.",`Say he answers: "That's just standard wording." Now you can say: "It's the agreement we both signed. When can someone come out?"`,'Fails: no mention of the agreement, smug or angry words ("Do you even read it?"), and orders ("Fix it immediately").'],modelRaw:`"The tenancy agreement says appliances are repaired within 14 days. It's been three weeks since I reported the washing machine. When can it be fixed?"`}],mission:"look up the refund, price-match or compensation policy of one company you pay every month, and copy one line you could quote at them."},{id:"7.3",title:"Three offers at once",guess:null,card:{paras:[{t:"p",text:"Use this when you're making an offer on something with more than one part: a freelance quote, selling furniture (price, delivery, extras), a counter to a job offer. Don't make one offer. Make two or three at the same time, each equally good for you, but mixing the parts differently. Then ask which works best."},{t:"p",text:"Why it works: several offers look like a real effort to meet them, so they push back less on your numbers. You look flexible without dropping your price. And the one they pick tells you what they care about most."},{t:"p",text:"Before you send it, check each offer is truly as good for you as the others. If one is simply cheaper for them, it's a discount, not an option."}],rows:[{label:"Say",text:'"\xA3145 if you collect, \xA3160 if I drop it round, or \xA3145 with the lock and lights. Which suits you best?" \xB7 "Either \xA329,000 with one day at home, or \xA328,000 with two. Which works better for you?"',subs:[]},{label:"Avoid",text:"",subs:["One offer and nothing else.",'Three prices for the same thing: "\xA3195, \xA3185 or \xA3175."',"An option that's worse for you than the others."]},{label:"Watch out",text:`if they mix and match ("the cheap price, but delivered"), that's a new offer, not one of yours. Point them back to your options. And it only works when there's more than one part. If it's only a price, add parts first: when they collect, delivery, an extra. If it's only your pay or rate, with nothing to vary, use a range instead (lesson 2.4).`,subs:[]},{label:"Evidence",text:"Backed by studies. In six experiments, people who made several equal offers at once got better deals than people who made one, and both sides ended up with more overall. The other side saw it as a more genuine effort (Leonardelli, Medvec, Galinsky and others, 2019).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["A local dog groomer asks you to make a one-minute promo video. You'd normally charge \xA3410, with two rounds of changes. Which reply gets you the best deal?"],quote:[],options:[{k:"A",t:`"It's \xA3410, which includes two rounds of changes and the music licence."`,ok:!1},{k:"B",t:'"What sort of budget did you have in mind for it?"',ok:!1},{k:"C",t:`"\xA3410, or I could probably do \xA3355 if that's too much."`,ok:!1},{k:"D",t:'"\xA3410 with two rounds of changes, \xA3465 with three, or \xA3355 with one."',ok:!0}],expl:{card:"The card: two or three offers, each equally good for you.",items:[{k:"D",ok:!0,text:`Right. More rounds, more work, more money, so each is fair to you. Say they answer: "One round's fine." Price matters most to them. If they ask for "\xA3355 with two rounds", point them back: "Two rounds is the \xA3410 one."`,subs:[]},{k:"A",ok:!1,text:"One offer, so only price is left.",subs:[]},{k:"B",ok:!1,text:"Asks their limit. You know your rate, so go first (lesson 2.1).",subs:[]},{k:"C",ok:!1,text:"The second offer is just a discount.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You're moving out on Saturday and need your sofa gone by then. You'd be happy with \xA3195 if the buyer collects. Delivering it would cost you \xA320 in fuel for a mate's van. You'd also like the matching armchair gone, because there's no room for it in your new place. Which message makes offers that are all equally good for you?"],quote:[],options:[{k:"A",t:`"\xA3195 if you collect by Saturday, or I could do \xA3165 if you'd rather collect next week."`,ok:!1},{k:"B",t:'"\xA3195 if you collect by Saturday, \xA3215 if I deliver, or \xA3195 with the armchair too."',ok:!0},{k:"C",t:'"\xA3195, \xA3185 or \xA3175, depending on what you can stretch to. Let me know!"',ok:!1},{k:"D",t:'"\xA3195 if you collect it by Saturday, or the same \xA3195 if I deliver it to you."',ok:!1}],expl:{card:"The card: each offer must be as good for you as the others.",items:[{k:"B",ok:!0,text:`Right. Delivery costs you \xA320, so it's \xA320 more, and you want the armchair gone anyway. Say they answer: "Ooh, I'll take the armchair too." Your flat's cleared for the same \xA3195.`,subs:[]},{k:"A",ok:!1,text:"Worse for you twice: less money, and the sofa's still there after you move.",subs:[]},{k:"C",ok:!1,text:"Three prices for one sofa. You'll usually get \xA3175.",subs:[]},{k:"D",ok:!1,text:"Delivery costs you \xA320: a discount in disguise.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're selling your sofa and messaged a buyer: "\xA3195 if you collect by Saturday, \xA3215 if I deliver, or \xA3195 with the armchair too." They reply: "I'll take the \xA3195 one, delivered please!" What's your best reply?`],quote:[],options:[{k:"A",t:'"Go on then, \xA3195 delivered. See you on Saturday."',ok:!1},{k:"B",t:'"How about \xA3205 delivered, then? Meet in the middle?"',ok:!1},{k:"C",t:'"Delivered is the \xA3215 one, or \xA3195 if you collect."',ok:!0},{k:"D",t:`"What's the most you'd pay to have it delivered?"`,ok:!1}],expl:{card:"The card: if they mix and match, point them back to your options.",items:[{k:"C",ok:!0,text:`Right. Friendly, and your own options are back on the table. Say they answer: "Fine, \xA3215 delivered?" That's your full price. If they say "I'll collect, then", you've still got \xA3195.`,subs:[]},{k:"A",ok:!1,text:"Gives away the \xA320 your offers were built to protect.",subs:[]},{k:"B",ok:!1,text:"Splits a gap that only exists because they mixed your offers.",subs:[]},{k:"D",ok:!1,text:'Asks their limit: "Ten quid?"',subs:[]}]}},{n:4,fmt:"Type it",stem:["A parent asks your rate for piano lessons for her daughter. You charge \xA336 an hour. You'd be just as happy with \xA333 an hour if they book 10 lessons in one go, or \xA331 an hour if their daughter comes to you. Type a reply that gives them the options at once."],quote:[],options:[],model:"It's \xA336 an hour, \xA333 if you book 10 lessons, or \xA331 if she comes to me. Which suits you best?",checks:"contains at least two of: 36, 33, 31; if it contains 33, it also contains one of: book, booking, sessions, lessons, block, ten, 10, upfront, in advance, in one go; if it contains 31, it also contains one of: come, comes, coming, to me, to mine, at mine, my place, my house, mine; no number other than 36, 33, 31 or 10; contains none of: budget, afford, lowest, the most, at least, minimum, can't go, below, cheapest; 40 words or fewer. Whole words, any case.",after:["The card: two or three offers at once, each as good for you as the others.",'Say they answer: "\xA333 for ten sounds good. Could it be Tuesdays?" Now you know a regular slot matters more to them than the last \xA33 an hour.','Fails: one price on its own, prices with no reason ("\xA336, \xA333 or \xA331"), and asking their budget.'],modelRaw:`"It's \xA336 an hour, \xA333 if you book 10 lessons, or \xA331 if she comes to me. Which suits you best?"`}],mission:"next time you sell something or quote for a job, write two or three offers that are all equally good for you before you reply. If nothing's coming up, do it for one thing you own and could sell."},{id:"7.4",title:"Bet on it",guess:null,card:{paras:[{t:"p",text:"Use this when you're stuck because you disagree about what will happen: a seller swears the bike's fine and you think it needs work; your manager isn't sure you'll hit your targets and you are; a client doubts you'll finish by the deadline. Don't argue about who's right. Make the deal depend on it, so each side gets the deal they believe in. The thing you were stuck on becomes the deal. And if they won't take the bet, their confidence was probably just talk."},{t:"p",text:`The bet has to be on something you can both check soon: a shop check, a sales figure, a date. Not "if it's still running fine next year".`}],rows:[{label:"Say",text:'"If the bike passes a shop check, \xA3295. If it needs a new chain, \xA3255." \xB7 "If I bring in 40 sign-ups by my probation review, could it go to \xA328,000?"',subs:[]},{label:"Avoid",text:"",subs:[`Arguing about who's right: "It'll definitely fail."`,`Vague bets: "if I do well", "if it's still OK in a year."`,"Splitting the difference when what you really disagree about is the facts."]},{label:"Watch out",text:"if they suggest the bet, ask yourself why they're so confident, because they may know more than you. Before you take a bonus for hitting a target, find out how often people actually hit it.",subs:[]},{label:"Evidence",text:"Pro trick. Business negotiators call it a contingent deal and use it all the time (Bazerman and Gillespie, Harvard Business Review, 1999). Their example: a TV producer and a TV station disagreed about how many viewers a new show would get, and the deal fell apart. Tying the price to the real viewing figures would have let each side bet on what it believed. No controlled experiment has tested it.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're buying a used Peugeot 208 from a private seller for \xA32,400. Its MOT runs out in two weeks. The seller says: "It'll sail through, it's never failed." You think the brakes will need doing, at about \xA3290. He won't drop the price. What's your best move?`],quote:[],options:[{k:"A",t:'"I reckon the brakes will fail, though. Could you do \xA32,110?"',ok:!1},{k:"B",t:'"If it passes its MOT before I buy, \xA32,400. If it fails, \xA32,110."',ok:!0},{k:"C",t:'"Could we split the difference and call it \xA32,255?"',ok:!1},{k:"D",t:`"\xA32,110 now, and another \xA3290 if it's still running fine next year."`,ok:!1}],expl:{card:"The card: bet on something you can both check soon.",items:[{k:"B",ok:!0,text:`Right. If he's sure it'll pass, he expects his \xA32,400, so he should say yes. Say he answers: "Fine, I'll book it in." If he says "I'm not waiting", his confidence was talk: "No problem. As it stands, I'm at \xA32,110."`,subs:[]},{k:"A",ok:!1,text:`Argues who's right: "Brakes are fine, mate."`,subs:[]},{k:"C",ok:!1,text:"Splits a gap that's really about the brakes.",subs:[]},{k:"D",ok:!1,text:'Vague and a year away. "Running fine" is endlessly arguable.',subs:[]}]}},{n:2,fmt:"Say it",stem:[`You've been offered a sales job at a start-up at \xA326,000. Similar sales roles pay \xA326,000 to \xA329,000. You're confident you'll hit your targets. The hiring manager says: "I can't justify more until I've seen what you can do." What's your best reply?`],quote:[],options:[{k:"A",t:'"If I do well in my first few months, could we have another look at the salary then?"',ok:!1},{k:"B",t:`"I'm really confident I'll do well here, so could you start me on \xA329,000 instead?"`,ok:!1},{k:"C",t:'"If I hit my sales target by my three-month review, could it go to \xA329,000?"',ok:!0},{k:"D",t:`"That's fair. A review in a year sounds good to me."`,ok:!1}],expl:{card:"The card: turn their doubt into the deal.",items:[{k:"C",ok:!0,text:`Right. They only pay if you deliver, which is their worry. Say they answer: "Hit target three months running and I'll do \xA328,500." That's \xA32,500 a year, tied to something you're sure of.`,subs:[]},{k:"A",ok:!1,text:`Vague: "doing well" is whatever they say. You'll usually get: "We'll see."`,subs:[]},{k:"B",ok:!1,text:"Argues you're right. They still have no reason to believe you.",subs:[]},{k:"D",ok:!1,text:"Accepts a year at \xA326,000 when you'd earn more sooner.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`A gig promoter offers your band a support slot: "\xA3100, plus \xA32 for every ticket we sell over 150." Your band usually gets \xA3180 for a slot like this. You've no idea how many tickets their nights usually sell. What's your best reply?`],quote:[],options:[{k:"A",t:'"How many tickets did your last few nights sell?"',ok:!0},{k:"B",t:`"Sounds good, I'm in. Send me the details."`,ok:!1},{k:"C",t:'"Could you make it \xA33 for every ticket over the 150?"',ok:!1},{k:"D",t:`"What's the most I could make from it?"`,ok:!1}],expl:{card:"The card: if they suggest the bet, find out the odds first.",items:[{k:"A",ok:!0,text:`Right. They know their numbers; you don't. Say they answer: "About 160." The bonus is worth about \xA320, so the real offer is \xA3120: "Could we do \xA3180 flat?" If they say "We sell out at 300", take the bet.`,subs:[]},{k:"B",ok:!1,text:"Takes a bet where they know the odds.",subs:[]},{k:"C",ok:!1,text:"Haggles over the bet before you know it'll pay.",subs:[]},{k:"D",ok:!1,text:"Gets the sell-out figure, not a normal night.",subs:[]}]}},{n:4,fmt:"Type it",stem:["A client wants a website by 1 March, but doubts you can finish in time, so she's only offering \xA3600 instead of your usual \xA3780. You're sure you can do it. Type a reply that turns her doubt into the deal."],quote:[],options:[],model:"If it's live by 1 March, it's \xA3780. If it's late, \xA3600.",checks:"contains one of: if, unless, otherwise; contains 780; contains one of: March, 1st, deadline, on time, in time, late, by then; contains a second amount below 780, or one of: off, less, discount, knock; no number above 780; contains none of: trust me, promise, split, meet in the middle, halfway, lowest, at least, minimum, the most; 35 words or fewer. Whole words, any case.",after:["The card: make the deal depend on what you disagree about, using something you can both check.",`Say she answers: "OK, \xA3780 if it's live by the 1st." That's \xA3180 more for something you were sure of anyway. If she turns down any bet, her worry is the price, not the date, so talk about what \xA3600 would get her.`,`Fails: arguing ("Trust me, I'll make it"), splitting the difference, and a bet with nothing she can check.`],modelRaw:`"If it's live by 1 March, it's \xA3780. If it's late, \xA3600."`}],mission:'think of one disagreement about what will happen (with a flatmate, a manager, a buyer) and write the "If\u2026 then\u2026" deal that would have settled it.'}]},{n:8,title:"Dirty Tactics: Use Them and Beat Them",tagline:"Four tricks people use to squeeze you. Learn to run each one yourself, and to stop it working on you.",lessons:[{id:"8.1",title:"The absent boss",guess:null,card:{paras:[{t:"p",text:`When the person you're haggling with might not decide alone, like a salesperson with a manager or a letting agent with a landlord, watch for the second squeeze: you give your best number, they "check with the boss" (who you can't argue with), and come back wanting more.`},{t:"p",text:`Use it: when you need time, say someone who really has a say must agree: "I'll need to talk it over with my flatmates first."`},{t:"p",text:`Beat it: before your number, find out who decides, with an "or" so it's easy to admit it isn't them: "Can you agree the price yourself, or does it go to your manager?" A plain "Are you the one who decides?" usually gets a yes, because nobody likes admitting they're junior. If it has to go up, pin it first and get them backing you. If they reopen something agreed, reopen something too.`}],rows:[{label:"Say",text:`"If he says yes, have we got a deal?" \xB7 "Will you be recommending it?" \xB7 "If that's back open, so is the price."`,subs:[]},{label:"Avoid",text:`"Are you the one who decides?" \xB7 "Just let me know what he says" \xB7 offering more while they're "checking" \xB7 going over their head once they've offered to take it up ("Could I just talk to your manager?").`,subs:[]},{label:"Watch out",text:"once you've said someone else decides, a yes on the spot looks like a bluff.",subs:[]},{label:"Evidence",text:"Pro trick (Roger Dawson; Fisher and Ury; Deepak Malhotra). Never tested in studies.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:["You run a photo booth on the side. The social sec of a uni football club wants it for their end-of-season party, and you'd normally charge \xA3275 for the night. Before you name your price, what's your best question?"],quote:[],options:[{k:"A",t:'"What sort of budget has the club got for the night, roughly?"',ok:!1},{k:"B",t:'"Is this your call, or does the committee have to OK it?"',ok:!0},{k:"C",t:'"Are you the one who makes the final decision on this?"',ok:!1},{k:"D",t:'"Shall I just email the club a full quote first?"',ok:!1}],expl:{card:`The card: find out who decides before your number, with an "or" so it's easy to admit.`,items:[{k:"B",ok:!0,text:'Right. Say they answer: "Anything over \xA3200 goes to the treasurer." Now you can say: "Great. If I quote \xA3275, will you be backing me when it goes to her?"',subs:[]},{k:"A",ok:!1,text:`Lets them name a number first, though you know your rate. You'll usually get "about \xA3150".`,subs:[]},{k:"C",ok:!1,text:'No "or", so people say yes to save face, then check after your price.',subs:[]},{k:"D",ok:!1,text:"Sends your number to people you can't talk to.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling your old gaming laptop to a colleague. You've agreed \xA3450. Then he says: "Sounds good. I'll just check with my girlfriend tonight, we share money." What's your best reply?`],quote:[],options:[{k:"A",t:'"No worries at all, just let me know what she thinks."',ok:!1},{k:"B",t:'"Course. Could I have a quick chat with her myself, about the specs?"',ok:!1},{k:"C",t:'"Sure, and if it helps, I could probably do \xA3430."',ok:!1},{k:"D",t:`"Sure. If she's happy, is that us agreed at \xA3450?"`,ok:!0}],expl:{card:"The card: before it goes to someone else, pin it: if they say yes, it's a deal.",items:[{k:"D",ok:!0,text:`Right. Now "She wants \xA3400" means going back on his word. Say he answers: "Yeah, if she's fine, it's a deal." If he says "I'll see", he's keeping a second go open: "Why not ring her now?"`,subs:[]},{k:"A",ok:!1,text:`Leaves the door open. You'll usually get: "She thinks \xA3400's fairer."`,subs:[]},{k:"B",ok:!1,text:`Goes over his head once he's offered to check: "Nah, I'll handle it."`,subs:[]},{k:"C",ok:!1,text:`Drops \xA320 while he's "checking", before anyone's asked.`,subs:[]}]}},{n:3,fmt:"Say it",stem:[`You and your girlfriend, Ella, are joining a gym together. On the tour, the sales rep says: "If you sign up right now, I'll waive the \xA350 joining fee." You want to compare it with the gym down the road first. What's your best reply?`],quote:[],options:[{k:"A",t:`"Sounds good. I'll just talk it over with Ella first."`,ok:!0},{k:"B",t:'"If I join today, can you sign off the waiver yourself?"',ok:!1},{k:"C",t:'"OK, go on then. Sign me up now, before it goes."',ok:!1},{k:"D",t:'"Can I have a think about it and come back?"',ok:!1}],expl:{card:"The card: when you need time, say someone who really has a say needs to agree.",items:[{k:"A",ok:!0,text:`Right. Ella really is joining too, so the rep has nothing to push against. Say they answer: "The waiver's only today." Now you can say: "No problem. If it's still on when we're back, great."`,subs:[]},{k:"B",ok:!1,text:"The beat-it question on the wrong side: here you're the one being pushed.",subs:[]},{k:"C",ok:!1,text:"Signs before you've compared, for a \xA350 deadline.",subs:[]},{k:"D",ok:!1,text:`Makes it your doubt, so the rep works on it: "What's holding you back?"`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're building a website for a florist for \xA3400, to go live on the 30th. The manager comes back: "The owner's happy with \xA3400, but he wants it live a week earlier." What's your best reply?`],quote:[],options:[{k:"A",t:`"OK, no problem at all. I'll get it done a week earlier."`,ok:!1},{k:"B",t:'"Then the price moves too: you can have it a week early for \xA3450."',ok:!0},{k:"C",t:`"OK, but I might need a bit extra for that, if that's alright with you?"`,ok:!1},{k:"D",t:'"OK. Can he let me know if anything else changes?"',ok:!1}],expl:{card:"The card: if they reopen something you'd agreed, reopen something too.",items:[{k:"B",ok:!0,text:`Right. The second squeeze now has a price. Say the manager answers: "Let me check with him." Often the earlier date quietly disappears, and if he really needs it, you're paid \xA350 for the rush.`,subs:[]},{k:"A",ok:!1,text:"Gives a week of your time away free.",subs:[]},{k:"C",ok:!1,text:`Reopens the price so vaguely it's easy to brush off: "It's only a week, surely?"`,subs:[]},{k:"D",ok:!1,text:`Gives the week away and invites the next squeeze: "Actually, he'd also like a blog page."`,subs:[]}]}},{n:5,fmt:"Type it",stem:[`You're buying an ex-display sofa at a furniture shop. Before you make your offer, type the question you'd ask so the assistant can't "check with the manager" after you've given your best number.`],quote:[],options:[],model:"If we agree a price, can you sign it off, or does it go to your manager?",checks:`contains one of: sign off, sign-off, signs off, sign it off, sign this off, decide, decides, decision, your call, the call, approve, authorise, authorize, OK it, okay it, OK a, okay a, yourself, anyone else, someone else, who else needs, who else has, manager, boss, final say, check with, on your own, upstairs, above you; contains "who" or the word "or"; contains none of: are you the one, are you the person, budget, looking at it, interested, better deal, cheaper, what he'd take, what she'd take, check with your manager for, ask your manager for, lowest, best price, most you, minimum, at least, can't go; no \xA3; contains "?"; 20 words or fewer. Whole words, any case.`,after:[`The card: before your number, find out who decides, with an "or" so it's easy to admit it isn't them.`,'Say they answer: "Anything over \xA3100 off needs my manager." Now you can say: "Could you grab her now, so we can agree it together?"','Fails: questions with no "or" or "who" ("Can you decide the price yourself?", "Are you the one who decides?"), which get a face-saving yes, and anything that invites a second go ("Could you check with your manager for a better deal?").'],modelRaw:'"If we agree a price, can you sign it off, or does it go to your manager?"'}],mission:`next time you're in a shop that can give discounts (a phone shop, a bike shop, a market stall), ask: "Can you agree a discount yourself, or does it go to someone else?" Note what they say.`},{id:"8.2",title:"Deadlines",guess:{stem:["In a study, pairs haggled over a used car by chat, and one person in each pair had a hard deadline. When they kept it secret, 37% of pairs ended with no deal. When they told the other side about it, what happened?"],options:[{k:"A",t:"No deal went up, to about 50%",ok:!1},{k:"B",t:"No deal stayed about the same",ok:!1},{k:"C",t:"No deal fell, to about 23%",ok:!0},{k:"D",t:"No deal fell, to about 5%",ok:!1}],reveal:"it fell to about 23%, and the people who revealed their deadline also tended to get a bigger share of the deal (54% against 43%). Most people in the study expected revealing it to hurt them. Both results were borderline, so treat them as a good sign, not a sure thing."},card:{paras:[{t:"p",text:"When you're choosing between two options, like two flats, two second-hand bikes or two clients who want the same week, and you'll decide on a set day, tell the other side that day. Most people hide their deadline, thinking it hands over power. But a real deadline squeezes both of you: if the day passes without a deal, they lose you. Say it as a plain fact, what you're deciding and when, then make your ask."},{t:"p",text:"Only reveal a deadline that costs them if it passes. One that only costs you (your tenancy ends on the 30th, you need a car for your new job) tells them you're stuck. A cost that grows while you wait (storage you pay for every week) tells them stalling works. Keep those to yourself."}],rows:[{label:"Say",text:`"I'm choosing between this and one other by Friday." \xB7 "I'm seeing the other one on Thursday and deciding on Friday." \xB7 Their deadline: "What happens if I come back on Monday?"`,subs:[]},{label:"Avoid",text:`a deadline that only costs you ("I've got to be out by the 30th") \xB7 a cost that grows ("I'm paying for storage every week") \xB7 saying it as a threat ("Agree by Friday or I'll go elsewhere")`,subs:[]},{label:"Watch out",text:`when they set the deadline ("only today", "I need an answer in 10 minutes"), don't ask whether it's real: they'll say yes. Ask what happens if you miss it. Often it's "not much". If you'd be fine either way, say so, and the clock stops working. If it's clearly real but too tight, ask for one short, specific extension with a reason: "Could I confirm by 9pm Friday, after my other viewing?" With a job offer, skip the test and go straight to the extension, sounding keen (lesson 4.5).`,subs:[]},{label:"Evidence",text:"Some evidence: revealing a real deadline tended to cut deadlocks and win a bigger share, but both results were borderline (Gino and Moore, 2008). Keeping quiet about a deadline that only costs you is our reading of the study's warning about costs that grow while you wait. It wasn't tested directly. Backed by studies that time pressure makes people give in (Stuhlmacher and colleagues, 1998; Karag\xF6zo\u011Flu and Kocher, 2019). Testing their deadline is a Pro trick (Herb Cohen; a Stanford dealmaker's lecture).",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You edit videos on the side. A caf\xE9 chain wants three short promos for \xA3600, filmed in March. Another client has also asked about March, and you've told them you'll confirm on Friday. The caf\xE9 owner replies to your quote: "Love it! Let us have a think and we'll come back to you." What's your best reply?`],quote:[],options:[{k:"A",t:`"Great! No pressure at all. Just let me know whenever you've decided."`,ok:!1},{k:"B",t:'"Great! Is there any chance you could get back to me by Friday?"',ok:!1},{k:"C",t:`"Great! I'm confirming my March bookings on Friday. Could you let me know by then?"`,ok:!0},{k:"D",t:'"Great! March is looking a bit quiet for me, so the sooner the better."',ok:!1}],expl:{card:"The card: tell them a real deadline that costs them, as a plain fact.",items:[{k:"C",ok:!0,text:`Right. If Friday passes, they lose March to the other client. Say they answer: "Can't you pencil us in?" Now you can say: "Only till 5pm Friday."`,subs:[]},{k:"A",ok:!1,text:"No deadline, so no reason to decide. You'll usually wait weeks.",subs:[]},{k:"B",ok:!1,text:`Nothing behind the day: missing Friday costs them nothing. You'll usually get: "We'll try!"`,subs:[]},{k:"D",ok:!1,text:"A deadline that only costs you: it says you need the work, so you'll usually get a lower offer.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["You're flat-hunting. You like a flat at \xA31,050 a month (similar flats nearby are \xA31,000 to \xA31,075), and you're viewing another one on Thursday. Which of these would you tell the letting agent, and which would you keep to yourself?"],quote:[],options:[],sort:[{t:`"I'm seeing one other on Thursday and deciding on Friday."`,bin:"tell them: if your day passes, they lose you"},{t:`"I've handed in my notice and have to be out by the 30th."`,bin:"keep it: it only puts pressure on you"},{t:`"I'll pay a holding deposit on one of the two on Friday."`,bin:"tell them: if your day passes, they lose you"},{t:'"I need to have somewhere sorted by Friday."',bin:"keep it: it only puts pressure on you"},{t:`"I'm signing for one of the two this week."`,bin:"tell them: if your day passes, they lose you"},{t:`"I'm paying for a storage unit every week I'm waiting."`,bin:"keep it: it only puts pressure on you"}],expl:{card:"The card: reveal a deadline only if it costs them when it passes.",items:[{label:"Tell them",text:`"deciding on Friday", "a holding deposit on one of the two" and "signing for one this week". Say the agent answers: "Let me speak to the landlord today." Now you can say: "At \xA31,000, I'd sign this one on Friday."`,subs:[]},{label:"Keep it",text:"",subs:[`"Out by the 30th" and "somewhere sorted by Friday" are your deadlines, not theirs. You'll usually get: "Better grab it, then."`,'"Storage every week" grows, so it tells them waiting works.']}]},bins:["tell them: if your day passes, they lose you","keep it: it only puts pressure on you"]},{n:3,fmt:"Say it",stem:[`You want a used road bike. Two on Marketplace fit you: one listed at \xA3330, and one you prefer at \xA3360. Similar ones sell for \xA3300 to \xA3340. You're seeing both on Saturday morning and will buy one of them that day. The \xA3360 seller hasn't mentioned any deadline. He messages: "Still on for Saturday?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Yes! No rush my end, so if it sells before then, no worries. Would you take \xA3305?"',ok:!1},{k:"B",t:`"Yes! I'm seeing one other that morning and buying one of them. Would you take \xA3305?"`,ok:!0},{k:"C",t:'"Yes! I need one sorted before my new job starts. Would you take \xA3305?"',ok:!1},{k:"D",t:`"Yes! But if it's not \xA3305, I'll just buy the other one instead."`,ok:!1}],expl:{card:'The card: reveal a real deadline that costs them. "Fine either way" only answers theirs.',items:[{k:"B",ok:!0,text:`Right. If Saturday passes, he loses you to the other bike. Say he answers: "Could do \xA3340?" Now you can say: "\xA3312, and I'll bring cash."`,subs:[]},{k:"A",ok:!1,text:`The line for their deadline, throwing yours away. You'll usually get: "No worries, \xA3360 then."`,subs:[]},{k:"C",ok:!1,text:`A deadline that only costs you. You'll usually get: "Better be quick, then."`,subs:[]},{k:"D",ok:!1,text:`The right facts, said as a threat. You'll usually get: "Go for the other one, then."`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're in a phone shop looking at SIM-only deals. Online, similar ones are \xA310 to \xA314 a month, and you want to compare them properly tonight. Your current deal runs to the end of next month. The salesperson says: "I can do you \xA312 a month, but that's only today. Tomorrow it's back to \xA315." What's your best reply?`],quote:[],options:[{k:"A",t:`"OK, if it's only today, I'll take the \xA312 now."`,ok:!1},{k:"B",t:'"Is that genuinely only today, or might it last?"',ok:!1},{k:"C",t:`"Come off it, that's just a line to get me to sign."`,ok:!1},{k:"D",t:'"What happens if I come back in on Saturday?"',ok:!0}],expl:{card:"The card's watch-out: when they set the deadline, ask what happens if you miss it.",items:[{k:"D",ok:!0,text:`Right. Say they answer: "Probably still on, but no promises." Now you can say: "Great. I'll compare tonight and come back Saturday." If they say "It really ends tonight", you've lost nothing: "If it's gone, it's gone."`,subs:[]},{k:"A",ok:!1,text:"Takes \xA312 before you've compared, because of a clock you can't check.",subs:[]},{k:"B",ok:!1,text:`Asks them to judge their own deadline. You'll usually get: "Yes, only today."`,subs:[]},{k:"C",ok:!1,text:"An accusation. You'll usually get the \xA315.",subs:[]}]}},{n:5,fmt:"Type it",stem:[`You're buying a used car privately. You've test-driven a Ford Fiesta listed at \xA34,200 (similar ones sell for \xA33,700 to \xA34,000). You're seeing another Fiesta on Friday, and you'll buy one of the two on Saturday. The first seller texts: "Any more thoughts on the car?" Type a reply that uses your deadline.`],quote:[],options:[],model:"Still keen! I'm seeing one other on Friday and buying one of the two on Saturday.",checks:"contains one of: decide, deciding, decision, choose, choosing, pick, picking, buy, buying, go with, going with, make my mind up, making my mind up; contains one of: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, fri, sat, tomorrow, tonight, today, this week, the weekend, this weekend; contains one of: other, another, one of, two, second, both, between, else, elsewhere; contains none of: no rush, no hurry, whenever, in your own time, or I'll, otherwise, unless, if you don't, if you can't, if not, or else, last chance, take it or leave it, final offer, need one, need a car, need it, need the car, need to have, have to have, got to have, gotta have, desperate, asap, urgent, for work, for my job, new job, commute, hold it, hold the car, keep it for me, save it, full price, asking price, lowest, best price, most you, minimum, at least, can't go; any \xA3 amount is under \xA34,000; 30 words or fewer. Whole words, any case.",after:["The card: tell them a real deadline that costs them if it passes, as a plain fact.",'The model answer means that if Saturday passes, he loses you to the other car. Say he answers: "Fair. What are you thinking on price?" Now you can say: "I could do \xA33,710, cash on Saturday."',`Fails: deadlines that only cost you ("I need a car for my new job"), threats ("\u2026or I'll buy the other one"), "no rush", and asking him to hold it.`],modelRaw:`"Still keen! I'm seeing one other on Friday and buying one of the two on Saturday."`}],mission:`next time you're choosing between two things (two phone deals, two second-hand listings, two quotes), pick the day you'll decide and tell both sides: "I'm choosing between yours and one other on Friday." Note which one moves first. If nothing's coming up this week, find one "ends tonight" or countdown deal online, check the same page two days later, and see whether it's really gone.`},{id:"8.3",title:"Talk total, never monthly",guess:null,card:{paras:[{t:"p",text:`When you're buying on monthly payments, like a car on finance or a phone on contract, the seller will often ask: "What sort of monthly payment are you looking for?" Don't give one. They can hit almost any monthly figure by stretching how long you pay, while the total goes up. Agree the total first and compare deals by their totals. It's the one budget question you don't answer with "What makes you ask?" (lesson 1.6): you already know why they're asking.`},{t:"p",text:`Use it: when you're the one asking for money, flip it. Shrink the cost into the smallest true unit: "It's \xA318 a month more for the house, so about \xA31 a week each." And when they shrink a cost at you ("only \xA315 a week more"), grow it back into the total.`}],rows:[{label:"Say",text:`"Let's agree the price of the moped first, then talk about how I pay." \xB7 "What's the total I'd pay, start to finish?" \xB7 "That's \xA3780 a year."`,subs:[]},{label:"Avoid",text:'naming a monthly budget ("Around \xA3150 a month?") \xB7 haggling in their small unit ("Could you do \xA3139 a month?"): they just add months \xB7 comparing deals of different lengths by the monthly.',subs:[]},{label:"Watch out",text:`use a unit that's true and that people think in, like a week or a month. "Pennies a day" for something billed yearly sounds like a trick.`,subs:[]},{label:"Evidence",text:'Pro trick (Deepak Malhotra on choosing the unit; Roger Dawson on "real money"). Never tested in studies.',subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You're in a phone shop looking at a new Samsung that costs about \xA3800 to buy outright. A SIM-only deal elsewhere is about \xA310 a month. The salesperson asks: "So what are you looking to spend each month?" What's your best reply?`],quote:[],options:[{k:"A",t:`"Around \xA330 a month would be ideal, if that's doable."`,ok:!1},{k:"B",t:`"What's it cost in total, over the whole contract?"`,ok:!0},{k:"C",t:'"About \xA330 a month, but what would that come to in total?"',ok:!1},{k:"D",t:'"Could you show me your cheapest monthly plan, please?"',ok:!1}],expl:{card:"The card: don't give a monthly figure; compare deals by their totals.",items:[{k:"B",ok:!0,text:`Right. Say they answer: "\xA342 a month for 36 months." That's \xA31,512, against about \xA31,160 bought separately (phone plus \xA310 SIM-only). Now you can say: "That's \xA3350 more. Can you get closer?"`,subs:[]},{k:"A",ok:!1,text:"Hands them a monthly target: \xA330, stretched longer.",subs:[]},{k:"C",ok:!1,text:"Asks for the total, but names a monthly first, so the deal gets built around \xA330.",subs:[]},{k:"D",ok:!1,text:"The cheapest monthly is usually the dearest in total.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You want your house of four to get a cleaner. It's \xA360 a fortnight for the whole house, and your flatmates aren't sure. What's your best pitch?"],quote:[],options:[{k:"A",t:`"It's \xA360 a fortnight, which honestly isn't that much."`,ok:!1},{k:"B",t:`"It's \xA31,560 a year, but split four ways it's fine."`,ok:!1},{k:"C",t:`"Could we all chip in for a cleaner? It's not much."`,ok:!1},{k:"D",t:`"That's \xA37.50 a week each, for a clean house."`,ok:!0}],expl:{card:"The card: when you're asking for money, shrink it into the smallest true unit.",items:[{k:"D",ok:!0,text:`Right. Same cost, but it's the number each person feels. Say one answers: "That's \xA3390 a year each, though." Now you can say: "For 26 cleans, and no more rows about the bathroom."`,subs:[]},{k:"A",ok:!1,text:`The big unit, and "isn't that much" invites "It is to me."`,subs:[]},{k:"B",ok:!1,text:"Grows it into the biggest number: the move for paying, not asking.",subs:[]},{k:"C",ok:!1,text:"No number, so everyone imagines their own.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You rent a flat for \xA3950 a month. Similar flats on your road are about \xA3975. Your landlord texts: "Rent's going up from April. Don't worry, it's only \xA315 a week more." What's your best reply?`],quote:[],options:[{k:"A",t:`"That's \xA3780 a year. Flats on our road are \xA3975. Could we do that?"`,ok:!0},{k:"B",t:`"OK, fair enough. I suppose \xA315 a week isn't too bad, all things considered."`,ok:!1},{k:"C",t:'"Could we knock that down and make it \xA310 a week instead?"',ok:!1},{k:"D",t:`"So that's about \xA32 a day, basically a coffee. Fair enough, then."`,ok:!1}],expl:{card:"The card: when they shrink a cost at you, grow it back into the total.",items:[{k:"A",ok:!0,text:'Right. \xA3780 a year makes \xA3975 sound reasonable. Say he answers: "OK, \xA3975 from April." If he serves a Section 13 notice for \xA31,015 instead, the tribunal can set the market rent, about \xA3975.',subs:[]},{k:"B",ok:!1,text:"Accepts his unit, and \xA3780 a year with it.",subs:[]},{k:"C",ok:!1,text:'Haggles in his small unit: a \xA35 "win" still costing \xA3520 a year.',subs:[]},{k:"D",ok:!1,text:'The "asking" trick on the wrong side: it only helps him.',subs:[]}]}},{n:4,fmt:"Type it",stem:[`You're buying a used Piaggio moped from a dealer. It's listed at \xA32,195, and similar ones sell for \xA31,900 to \xA32,100. The salesman asks: "So what sort of monthly payment are you looking for?" Type your reply.`],quote:[],options:[],model:"Let's agree the price of the moped first, then talk about how I pay.",checks:"contains one of: total, price, overall, altogether, all in, all-in, full price, cash price, in full, outright, figure, number, cost, how much is it, how much for; contains none of: monthly price, monthly cost, price per month, price a month, cost per month, cost a month, how much a month, how much per month, what's the monthly, what would the monthly, monthly be, monthly payment be, monthly payments be, lowest monthly, cheapest monthly, as low as, cheapest, longest, spread, years, ideal, ideally, budget, afford, comfortable, lowest, best price, most you, minimum, at least; no \xA3 and no digits; 25 words or fewer. Whole words, any case.",after:["The card: don't give a monthly figure. Agree the total first.",`Say he answers: "We can do \xA32,095 if you pay outright." That's \xA3100 off before finance comes up. Now you can say: "\xA31,950 and we'll do the paperwork today." If he says "The price is fixed, the finance is flexible", compare the finance total with paying outright.`,`Fails: any monthly number, spreading or stretching the payments, and "What makes you ask?" on its own (you already know why he's asking).`],modelRaw:`"Let's agree the price of the moped first, then talk about how I pay."`},{n:5,fmt:"Type it",stem:["You and three bandmates could hire a rehearsal room for \xA396 a month. They aren't sure. Type the line that makes the cost sound as small as it really is."],quote:[],options:[],model:"It's \xA324 a month each, so about \xA35.50 a week.",checks:"contains one of: each, per person, per head, a head, apiece; contains a per-person figure (24, 5.50, 5.5, 5.54, 5.55, 80p, 0.80, twenty-four, twenty four); no other number except 96 and 4; contains none of: a year, per year, yearly, annually, 288, 1,152, 1152; 30 words or fewer. Whole words, any case.",after:["The card: when you're asking for money, shrink it into the smallest true unit.",`Say a bandmate answers: "\xA324 each? Fine, if we get Saturday mornings." Now it's a yes, and the only question is the slot.`,`Fails: the total on its own ("\xA396 a month"), any yearly figure, and per-person numbers that don't add up.`],modelRaw:`"It's \xA324 a month each, so about \xA35.50 a week."`}],mission:"pick one thing you pay monthly (phone, gym, a subscription) and work out the total over the whole contract. Then pick one shared cost you'd like your flatmates or family to agree to, and work out what it comes to per person per week."},{id:"8.4",title:"The hot potato",guess:null,card:{paras:[{t:"p",text:`When someone hands you their problem and expects a lower price to fix it ("We've only got \xA3400 for this", "It's not in this year's budget"), that's a hot potato: their problem, tossed to you. Test it before you take it on. A budget is often just someone's opening number. Two tests: take money off the table ("If budget weren't an issue, would you want me for this?"), and find who can move it ("Who could approve going over?"). If the budget really is fixed, keep your price and change what they get: a smaller version at their budget (lesson 4.1).`},{t:"p",text:"Use it: when you're buying and know the going rate (lesson 2.1), set your budget at your target beforehand (lesson 2.2) and say it with a reason. It sounds like a fact about you, not an offer, so they try to make it work. Once said, only go above it for something real."}],rows:[{label:"Say",text:`"For \xA3200, I can do three hours instead of five." \xB7 Buying: "I've put \xA3185 aside for a desk, so that's what I'm working with."`,subs:[]},{label:"Avoid",text:`dropping straight to their number \xB7 arguing their budget is too low \xB7 "Is it definitely not in the budget?" (they'll say yes) \xB7 giving your walk-away as your budget ("My max is \xA3350").`,subs:[]},{label:"Watch out",text:"some budgets really are fixed (a society's grant, a grad scheme's pay band). Pushing then makes the person in front of you look bad.",subs:[]},{label:"Evidence",text:"Pro trick (Roger Dawson). Never tested in studies.",subs:[]}]},questions:[{n:1,fmt:"Say it",stem:[`You make short videos for small businesses. A gym owner loved your reel, and you've quoted \xA3650 for a two-minute promo. He says: "We'd love you to do it, but we've only got \xA3400 in the budget." What's your best reply?`],quote:[],options:[{k:"A",t:'"OK, I can make \xA3400 work for you this time."',ok:!1},{k:"B",t:`"If the budget weren't an issue, would I be your first choice?"`,ok:!0},{k:"C",t:'"\xA3400 is really low for a two-minute video like this, to be honest."',ok:!1},{k:"D",t:'"Is \xA3400 definitely the most the budget can stretch to?"',ok:!1}],expl:{card:"The card: test a budget before you take it on. Take money off the table first.",items:[{k:"B",ok:!0,text:`Right. Say he answers: "Honestly, yes." Now money's the only problem: "Then it's \xA3650 for two minutes, or \xA3395 for a 60-second cut." If he says "Not really", money wasn't the issue: "What would make it a yes?"`,subs:[]},{k:"A",ok:!1,text:"Drops \xA3250 for a number you never tested.",subs:[]},{k:"C",ok:!1,text:"Argues with his budget, so he defends it.",subs:[]},{k:"D",ok:!1,text:`Asks him to judge his own budget. You'll usually get: "Afraid so."`,subs:[]}]}},{n:2,fmt:"Say it",stem:[`You work at a small design agency. You've asked your manager for a rise from \xA326,000 to \xA328,000, the top of what similar roles pay. She says: "I agree you deserve it, but it's not in this year's budget." What's your best reply?`],quote:[],options:[{k:"A",t:`"OK, that's fair. Could we look at it again next year?"`,ok:!1},{k:"B",t:'"Is it definitely not in the budget at all, though?"',ok:!1},{k:"C",t:'"Who signs off the budget, and could we make the case together?"',ok:!0},{k:"D",t:`"If it's not in the budget, could you at least do \xA327,000 instead?"`,ok:!1}],expl:{card:"The card: find who can move the budget.",items:[{k:"C",ok:!0,text:`Right. It keeps her on your side and finds who can move it. Say she answers: "Finance sets next year's budget in March." Now you can say: "Could you put my \xA328,000 in for March, so it starts in April?"`,subs:[]},{k:"A",ok:!1,text:"Takes her problem as yours; next year usually brings the same answer.",subs:[]},{k:"B",ok:!1,text:`Asks her to judge her own claim: "I'm afraid so."`,subs:[]},{k:"D",ok:!1,text:`Halves your ask without testing the budget: "Even that's tricky this year."`,subs:[]}]}},{n:3,fmt:"Say it",stem:[`You photograph events and charge \xA3300 for a five-hour night. A student society wants you, but says: "The students' union gives us exactly \xA3200 per event, and we're not allowed to go over." What's your best reply?`],quote:[],options:[{k:"A",t:`"If money weren't an issue, would you want me for the night?"`,ok:!1},{k:"B",t:'"OK, \xA3200 for the full five hours is absolutely fine."',ok:!1},{k:"C",t:'"Could the society find the other \xA3100 from somewhere?"',ok:!1},{k:"D",t:'"For \xA3200, I could cover three hours instead of five."',ok:!0}],expl:{card:"The card: if the budget really is fixed, keep your price and change what they get. Here the union's rule makes it fixed.",items:[{k:"D",ok:!0,text:'Right. You keep your rate, and they stay inside their rules. Say they answer: "Three hours works, 9 till 12." Done, with no discount.',subs:[]},{k:"A",ok:!1,text:"The test for a budget you're unsure about; the union's rule has already answered it.",subs:[]},{k:"B",ok:!1,text:"Gives two hours away free.",subs:[]},{k:"C",ok:!1,text:"Pushes a budget that's really fixed, which makes the person asking look bad.",subs:[]}]}},{n:4,fmt:"Say it",stem:["You want a used road bike listed at \xA3380. Similar ones sell for \xA3300 to \xA3350 on eBay. You've put \xA3310 aside for it, and you'd go to \xA3350 at most. You're messaging the seller. What's your best first offer?"],quote:[],options:[{k:"A",t:`"I've budgeted \xA3310 for a bike, so that's what I can work with."`,ok:!0},{k:"B",t:'"My absolute max is \xA3350 for a bike, so could we say that?"',ok:!1},{k:"C",t:`"What's the lowest you'd be w
