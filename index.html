ow you treated them, and money doesn't answer that."}]},{h:"Example",items:[{t:"sit",text:"You forgot to walk your neighbour's dog on Tuesday. She's furious, and you'd like to keep the job."},{t:"say",who:"You",text:`"Really sorry, I forgot Tuesday's walk. That's on me. Could I still do Thursdays?"`},{t:"say",who:"Neighbour",text:`"Fine. Just don't forget again."`},{t:"p",text:"You keep the job, without walking her dog free for a week."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Say what you actually did,",rest:`even if it's just "I forgot".`},{t:"good",text:'"Sorry, I double-booked myself. My mistake."'},{t:"bad",text:`"Sorry for any confusion." \u2192 it doesn't say what you did.`},{t:"bad",text:'"Sorry you feel that way." \u2192 sorry for their feelings, not your mistake.'},{t:"tip",n:2,title:"Don't pay your way out.",rest:'No money back, money off or freebie "to make up for it".'},{t:"bad",text:`"Sorry! I'll knock \xA35 off." \u2192 \xA35 gone, for a worse result.`},{t:"tip",n:3,title:"Don't blame something else when it was you.",rest:""},{t:"bad",text:`"Sorry, the brief wasn't clear." \u2192 they know it was you, so they stay annoyed.`},{t:"tip",n:4,title:"Then make your ask.",rest:""},{t:"sit",text:"A client's annoyed that your designs came a day late."},{t:"quote",text:`"Sorry, I misjudged the timing. That's on me. If you're happy with them, a review would really help."`}]},{h:"Don't use it when",items:[{t:"li",text:"**It wasn't your fault.** A mark shown in your listing photos, a stain that was there when you moved in. Just state the facts, with no sorry: in a dispute, a sorry sounds like you're admitting it."}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:"An eBay seller asked 632 unhappy customers to withdraw their feedback: a plain apology worked for 44.8%, against about 20% for cash (Abeler and others, 2010). In 364 real eBay disputes, saying what happened made settling about 2.5 times as likely, a link, not proof (Brett and others, 2007)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You sold some trainers on Vinted for \xA355, forgot to post them for four days, and finally sent them this morning. The buyer messages: "Still not here?? This is really poor." You'd like a good review. What's your best reply?`],quote:[],options:[{k:"A",t:`"Sorry if you're upset! They're on their way to you now."`,ok:!1},{k:"B",t:`"They went out this morning, and I'll refund you \xA35 for the wait."`,ok:!1},{k:"C",t:`"Sorry, Evri have been really slow this week. They're on their way!"`,ok:!1},{k:"D",t:'"Really sorry, I forgot to post them until this morning. My fault."',ok:!0}],expl:{card:"The card: in the wrong? Say sorry, say what happened, and don't pay.",items:[{k:"D",ok:!0,text:`Right. A plain sorry, and "I forgot" is the truth. Say they reply: "Sorry doesn't get them here faster." Now you can say, with no cash: "True. They're due Thursday. If you're happy with them, a review would really help."`,subs:[]},{k:"A",ok:!1,text:"Sorry for their feelings, not your mistake: a brush-off.",subs:[]},{k:"B",ok:!1,text:"Pays instead of saying sorry: \xA35 gone, for a worse result.",subs:[]},{k:"C",ok:!1,text:"Blames the courier, but the tracking shows they went out today.",subs:[]}]}},{n:2,fmt:"Sort it",stem:[`You edited a music video for a local band and sent it two days late. Their footage arrived on time; you misjudged how long the colour grading would take. The singer messages: "Two days late, with our release on Friday. Not great." You'd love to edit their next video. Which replies own the mistake, and which make it worse?`],quote:[],options:[],sort:[{t:'"Really sorry. I promised Wednesday and misjudged how long the colour grading would take."',bin:"owns the mistake"},{t:'"Sorry for any inconvenience caused."',bin:"makes it worse"},{t:`"Sorry about that. I'll take \xA350 off the invoice to make up for it."`,bin:"makes it worse"},{t:`"You're right, sorry. I underestimated the grading and didn't warn you in time."`,bin:"owns the mistake"},{t:'"Sorry, the footage you sent was huge, so it took ages to work through."',bin:"makes it worse"},{t:`"That's on me, sorry. I got the timing wrong and should have told you sooner."`,bin:"owns the mistake"}],expl:{card:"The card: say sorry for what you did and say what happened. No money, no blame.",items:[{label:"Owns the mistake",text:'each says sorry and says plainly what went wrong (the grading, the timing). Say she answers: "Thanks for being straight. Just flag it sooner next time." Now you can say: "Will do. Have you got a date for the next video?"',subs:[]},{label:"Makes it worse",text:"",subs:[`"Sorry for any inconvenience" doesn't say what you did.`,'"\xA350 off" pays her off.','"The footage you sent was huge" blames the band for your misjudgement.']}]},bins:["owns the mistake","makes it worse"]},{n:3,fmt:"Say it",stem:[`You sold a vintage denim jacket on Depop for \xA338. The fourth listing photo shows a small bleach mark on the sleeve, and the description says "small bleach mark on left sleeve". The buyer messages: "There's a bleach mark on the sleeve you never mentioned!! Not happy." What's your best reply?`],quote:[],options:[{k:"A",t:`"So sorry about the mark! I really hope it doesn't spoil it for you."`,ok:!1},{k:"B",t:`"It's in photo 4, and the listing says 'small bleach mark on left sleeve'."`,ok:!0},{k:"C",t:`"Sorry about that! I'll send you \xA35 back to make up for the mark."`,ok:!1},{k:"D",t:`"Sorry you're disappointed with it. Hopefully it's still a great jacket for you!"`,ok:!1}],expl:{card:"The card: wasn't your fault? Just state the facts, with no sorry. Here, the mark is in your listing.",items:[{k:"B",ok:!0,text:`Right. The facts, with no sorry to read as an admission. Say they reply: "I still want a refund." Now you can say: "It's in photo 4 and the description, so it's as described."`,subs:[]},{k:"A",ok:!1,text:'Sorry for the mark sounds like an admission: "So, refund then?"',subs:[]},{k:"C",ok:!1,text:"Sorry plus cash, for a mark that isn't your fault: \xA35 gone.",subs:[]},{k:"D",ok:!1,text:'Sorry for their feelings, and "you never mentioned" goes unanswered.',subs:[]}]}},{n:4,fmt:"Type it",stem:[`You're selling a lamp on Facebook Marketplace for \xA335. The buyer arranged to collect at 6pm, but you forgot and went to the gym. She messages: "Came all the way over and you weren't even in. Unbelievable." You'd still like to sell it to her for \xA335. Type your reply.`],quote:[],options:[],model:"Really sorry, I completely forgot and went to the gym. That's on me. Could you come tomorrow at 6? I'll be in.",checks:"contains one of: sorry, apologies, apologise, apologize, my bad; contains one of: forgot, forget, forgotten, slipped my mind, mixed up, messed up, went out, gym, lost track, double-booked; contains one of: tomorrow, tonight, later, another time, what time, when suits, when works, when can, when could, when would, when's good, come back, come round, come over, collect, pick it up, pick up, free, instead, still want, suit, suits, work for you, works for you, hold it, rearrange; contains none of: if you're upset, if you were upset, if you are upset, any inconvenience, the mix-up, a mix-up, traffic, held up, got stuck, kept me, at work, boss, something came up, emergency, delayed, train, bus, phone died, knock, discount, cheaper, for free, free of charge, refund, fiver, tenner, quid, off it, take off, off for, for the hassle, for the trouble, compensate, compensation, petrol, fuel; no \xA3 amount other than \xA335; no other number except 35 or a time (1 to 12, optionally with am, pm, :00, :15, :30 or :45); 40 words or fewer. Whole words, any case.",after:["The card: say sorry for what you did, say what happened, then ask. No money off.",`Say she answers: "Fine. 6 tomorrow, and you'd better be in." You've kept the sale at \xA335, instead of knocking a fiver off to say sorry.`,`Fails: money off ("\xA330 for the hassle"), excuses that weren't what happened ("got held up at work"), vague sorries ("Sorry for any inconvenience"), and a sorry with no new time to collect.`],modelRaw:`"Really sorry, I completely forgot and went to the gym. That's on me. Could you come tomorrow at 6? I'll be in."`}],mission:"think of the last time you let someone down: you were late, forgot something or missed a deadline. Write the message you'd send now: sorry, what happened in one plain line, then your ask, with no money off."},{id:"6.3",title:"Copy their words in messages",guess:{stem:["In a chat negotiation, people were told to copy the other person's words and phrases, either in the first ten minutes or in the last ten. Which group got the best deals?"],options:[{k:"A",t:"Copying in the first ten minutes",ok:!0},{k:"B",t:"Copying in the last ten minutes",ok:!1},{k:"C",t:"Not copying at all",ok:!1},{k:"D",t:"It made no difference",ok:!1}],reveal:"copying early scored about a third more points than not copying. Copying late did worst of all."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"When you're haggling by message, copy a couple of their words in your first few messages: their greeting, their abbreviations, or what they said about their situation."}]},{h:"When to use it",items:[{t:"p",text:"Any haggle that happens in messages."},{t:"sit",text:"Vinted, Depop, Marketplace, WhatsApp with a landlord or a client."}]},{h:"Why it works",items:[{t:"p",text:"People trust people who sound like them. In chat experiments, the person who copied the other side's words early got the better deal."}]},{h:"Example",items:[{t:"sit",text:"You're selling a games console on Marketplace for \xA3150."},{t:"say",who:"Buyer",text:`"alright mate, would u do 120? it's for my lad's birthday sat"`},{t:"say",who:"You",text:`"alright mate! could do 140, and it'll be with u in time for sat"`},{t:"p",text:"You sound like him, and you haven't touched his number."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Copy their words, never their number.",rest:""},{t:"sit",text:`A top's listed at \xA328. They message: "Hey! Love this, any chance of 20?"`},{t:"good",text:'"Hey! Glad you love it. Could do 25?"'},{t:"bad",text:`"Hey! Yeah 20's fine \u{1F60A}" \u2192 sounds like them, and \xA38 gone.`},{t:"tip",n:2,title:"Formal message? Copy that too.",rest:""},{t:"sit",text:'A buyer writes: "Good afternoon. Is the bike still for sale?"'},{t:"quote",text:`"Good afternoon. Yes, it's still for sale."`},{t:"tip",n:3,title:"Copy what they said about their situation.",rest:""},{t:"sit",text:"A buyer says the table is for her first flat."},{t:"quote",text:'"Ah, a first flat, exciting! Could do \xA385 for it."'},{t:"tip",n:4,title:"Copy early, then stop.",rest:"One or two of their words in your first few messages. Once you're deep in the haggling, just stick to your terms."}]},{h:"Avoid",items:[{t:"bad",text:'"Hello, thank you for your enquiry." Your own stiff words, to a casual message.'},{t:"bad",text:"Copying every word, or their typos. If they notice, it stops working."}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:"In two small chat experiments, people who copied the other side's words in the first ten minutes were trusted more and got better deals (Swaab, Maddux and Sinaceur, 2011). In one of the two, copying late seemed to help the other side instead, so copy early."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're selling a jacket on Vinted for \xA345. Similar ones have sold for \xA340 to \xA345. A buyer messages: "hiya!! would u take 35? need it for a festival next wk \u{1F64F}" What's your best reply?`],quote:[],options:[{k:"A",t:'"hiya! could do 42 and post tmrw, in time for the festival"',ok:!0},{k:"B",t:'"Hello, thanks for your offer. I could do \xA342 and post tomorrow."',ok:!1},{k:"C",t:`"Sorry, it's already priced really fairly, so I'm sticking at \xA345."`,ok:!1},{k:"D",t:`"ok yeah 35 is fine, I'll get it posted to you tmrw!"`,ok:!1}],expl:{card:"The card: copy their words, not their number.",items:[{k:"A",ok:!0,text:`Right. Their "hiya", their festival, and \xA342. Say they reply: "yesss deal!!" That's \xA37 more than they asked. If they say "35 or nothing sorry", hold: "42's my price, but it'll be with u in time for the festival".`,subs:[]},{k:"B",ok:!1,text:"The same deal, in your words, not theirs.",subs:[]},{k:"C",ok:!1,text:"None of their words, and nothing to say yes to.",subs:[]},{k:"D",ok:!1,text:"Sounds like them, then takes their offer: \xA310 gone.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling an old electric piano on Facebook Marketplace for \xA3180. Similar ones have sold for \xA3160 to \xA3185. A buyer messages: "Good evening. Is the piano still available? I could collect on Saturday morning if \xA3140 would be acceptable. Kind regards, Margaret." What's your best reply?`],quote:[],options:[{k:"A",t:'"hiya! yep still here \u{1F60A} could do 175 if u grab it sat morning?"',ok:!1},{k:"B",t:`"Good evening, Margaret. Yes, it's still here, and \xA3140 would be fine. See you Saturday."`,ok:!1},{k:"C",t:'"Good evening, Margaret. Yes, it is. I could do \xA3175 if you collect on Saturday."',ok:!0},{k:"D",t:`"Hi, yes it's still available. What's the most you could stretch to?"`,ok:!1}],expl:{card:"The card: formal message? Copy that too.",items:[{k:"C",ok:!0,text:'Right. Her "Good evening", her name, her Saturday, and a price near the top of the market. Say she replies: "Would \xA3150 be possible?" Now: "I could do \xA3172, if you collect on Saturday."',subs:[]},{k:"A",ok:!1,text:"The same deal, in texting-speak, with none of her words.",subs:[]},{k:"B",ok:!1,text:"Copies her words, then accepts her first offer: \xA340 gone.",subs:[]},{k:"D",ok:!1,text:"Asks for her limit, so her answer becomes your ceiling.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You want a bookcase listed at \xA380 on Facebook Marketplace. Similar ones have sold for about \xA360. The listing says: "Moving to Leeds on Friday so need this gone asap!" What's your best first message?`],quote:[],options:[{k:"A",t:'"Hi, is the bookcase still available? Would you take \xA360?"',ok:!1},{k:"B",t:'"Hi! Happy to help get it gone before Friday. \xA360 if I collect Thursday?"',ok:!0},{k:"C",t:'"Hello, I am interested in purchasing the bookcase. Would \xA360 be acceptable to you? Kind regards"',ok:!1},{k:"D",t:`"Hi! Could you do \xA360 for it? Moving's so stressful, so no worries if not!"`,ok:!1}],expl:{card:"The card: copy their words, including what they said about their situation.",items:[{k:"B",ok:!0,text:`Right. Their "gone" and their Friday make you sound on their side. Say they reply: "Thursday's perfect! Could you do \xA370?" Now: "I could do \xA363, and I'll be there at 6 on Thursday."`,subs:[]},{k:"A",ok:!1,text:'None of their words, so it reads like every lowball: "\xA375 lowest."',subs:[]},{k:"C",ok:!1,text:"None of their words either, in a stiff tone.",subs:[]},{k:"D",ok:!1,text:'"No worries if not" makes no the easy answer (lesson 1.1).',subs:[]}]}},{n:4,fmt:"Type it",stem:[`You're selling a dress on Vinted for \xA330. A buyer messages: "heyy is this still up? would be perfect for my sister's 21st xx" Type a first reply that copies some of their words.`],quote:[],options:[],model:"heyy yes still up! it'd be perfect for a 21st xx",checks:"contains at least two of: hey, heyy, heyyy, still up, perfect, sister, sis, 21st, x, xx; contains none of: dear, hello, kind regards, regards, thank you for your, lowest, minimum, at least, below, can't go, best price, no worries, if not; no number other than the 21 in 21st or 30; 20 words or fewer. Whole words, any case.",after:["The card: copy a couple of their words in your first few messages.",`The model answer copies "heyy", "still up", the 21st and the kisses, without overdoing it. Say they reply: "omg yay!! would u do 22? xx" Now you can say: "could do 27 and post tmrw so it's there in time xx"`,`Fails: a formal reply ("Hello, thank you for your message"), copying nothing, or offering a lower price before they've asked.`],modelRaw:`"heyy yes still up! it'd be perfect for a 21st xx"`}],mission:"in the next message you send to a buyer, seller, landlord or client, copy two of their words or their greeting, and notice the tone of what comes back."},{id:"6.4",title:"Firm, not bossy, when you're owed",guess:{stem:["Researchers studied 364 real eBay disputes and looked at what the person complaining wrote. Which made a dispute most likely to settle?"],options:[{k:"A",t:'Friendly words: "Thanks so much, I really appreciate it."',ok:!1},{k:"B",t:'Clear orders: "Refund me now."',ok:!1},{k:"C",t:"Firm words: the facts, plus exactly what they wanted",ok:!0},{k:"D",t:"Showing how angry they were",ok:!1}],reveal:"firm complaints made settling about four times as likely. Orders and angry words roughly halved it, and friendly words made no difference."},card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:`Give the facts (what happened, with dates and amounts), then say exactly what you want: "I'd like\u2026" or "I'd expect\u2026". No orders, no angry words.`}]},{h:"When to use it",items:[{t:"p",text:"You're owed money and you're writing to whoever owes it."},{t:"sit",text:"A refund, your deposit back, a charge you never agreed to."}]},{h:"Why it works",items:[{t:"p",text:"A firm complaint gives them one exact thing to say yes to. Orders and anger make people dig in, because giving way then feels like being pushed around."}]},{h:"Example",items:[{t:"sit",text:"Your phone bill has a roaming charge, but you didn't leave the UK."},{t:"say",who:"You",text:`"There's a \xA315 roaming charge on 3 May, but I was in Leeds. I'd like it removed."`},{t:"say",who:"Adviser",text:'"I can see that. Removing it now."'},{t:"p",text:"One exact ask, and nothing to argue with."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Say what you'd like, not what they must do.",rest:`Adding "please" doesn't change an order.`},{t:"bad",text:'"Refund it now, please." \u2192 still an order, so they dig in.'},{t:"tip",n:2,title:"A date is fine. A date plus a threat is an order.",rest:""},{t:"good",text:`"I'd like it refunded by Friday."`},{t:"good",text:`"If we can't agree, I'm happy for the deposit scheme to decide." \u2192 a calm next step, not a threat.`},{t:"bad",text:`"Refund me by Friday or I'll go to the ombudsman." \u2192 they dig in.`},{t:"tip",n:3,title:"They push back, or they're nice to you? Repeat the facts and the same ask.",rest:`A sorry or "I've passed it on" isn't your money.`},{t:"sit",text:`Your bank says: "Sorry for the hassle, it's with our disputes team."`},{t:"quote",text:`"Thanks for that. It's the \xA360 I'm after. Can you give me a date?"`}]},{h:"Avoid",items:[{t:"bad",text:'"This is a joke." Angry words make them dig in.'},{t:"bad",text:`"Sorry to bother you, I think there might be a mistake?" No facts, no ask: you get "We'll look into it."`},{t:"bad",text:'"Sorry about the stain," when it was already there. It sounds like an admission (lesson 6.2).'}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:"In 364 real eBay disputes, firm complaints made settling about four times as likely; orders more than halved it, and angry words roughly halved it (Brett and others, 2007). Real data, but a link, not proof."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You cancelled your meal-kit subscription on 3 March, and they've still taken \xA345 on 1 April. You're emailing them. Which message gives you the best chance of getting your money back?"],quote:[],options:[{k:"A",t:`"This is a joke. I cancelled weeks ago and you've helped yourselves to \xA345."`,ok:!1},{k:"B",t:'"Sorry to bother you, I think I may have been charged by mistake? Could someone look into it?"',ok:!1},{k:"C",t:`"I cancelled on 3 March but was charged \xA345 on 1 April. I'd like it refunded."`,ok:!0},{k:"D",t:'"Refund the \xA345 you took on 1 April. I cancelled on 3 March."',ok:!1}],expl:{card:"The card: give the facts, with dates and amounts, then exactly what you want.",items:[{k:"C",ok:!0,text:`Right. Dates, amount, ask. If they reply "We have no record of a cancellation", repeat the facts: "I cancelled in the app on 3 March and have the email. I'd still like the \xA345 refunded."`,subs:[]},{k:"A",ok:!1,text:"Angry words roughly halved settling. Expect a slow, defensive reply.",subs:[]},{k:"B",ok:!1,text:`No dates, no ask. You'll usually get: "We'll look into it."`,subs:[]},{k:"D",ok:!1,text:"The same facts, as an order. Orders halved settling too.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["A hotel has charged you \xA360 for a late checkout you never had. You're writing to them. Which lines are firm, and which give them an order?"],quote:[],options:[],sort:[{t:`"I'd like the \xA360 refunded by Friday."`,bin:"firm"},{t:'"You need to refund this by Friday."',bin:"gives an order"},{t:`"I checked out at 10am, so I'd like the late-checkout charge taken off."`,bin:"firm"},{t:`"Take the \xA360 off and we'll leave it there."`,bin:"gives an order"},{t:`"I'd expect the \xA360 back this week."`,bin:"firm"},{t:'"Just refund it."',bin:"gives an order"}],expl:{card:"The card: say what you'd like, not what they must do.",items:[{label:"Firm",text:`"I'd like\u2026", "I'd expect\u2026" and "I checked out at 10am, so I'd like\u2026" state what you want without telling them what to do. Say they reply: "Our system shows 12pm." Now you can say: "I left at 10am. I'd still like the \xA360 back."`,subs:[]},{label:"Gives an order",text:"",subs:[`"You need to\u2026" sounds reasonable, but it's an order.`,'"Take the \xA360 off\u2026" is an order with a condition.','"Just refund it" is the bluntest order.']}]},bins:["firm","gives an order"]},{n:3,fmt:"Say it",stem:[`You left your mobile network on 14 April, but they took another \xA322 on 28 April. You emailed with the dates and asked for it back. They reply: "So sorry for the trouble! I've passed this on to our billing team." What's your best reply?`],quote:[],options:[{k:"A",t:`"Thanks, I really appreciate the apology. I'll wait to hear back from them."`,ok:!1},{k:"B",t:`"Sorry doesn't get me my money back. Refund the \xA322 now, please."`,ok:!1},{k:"C",t:'"No worries at all, these things happen! Thanks so much for looking into it."',ok:!1},{k:"D",t:`"Thanks. I'd still like the \xA322 refunded. When will that happen?"`,ok:!0}],expl:{card:"The card: they're nice to you? Repeat your exact ask. A sorry isn't your money.",items:[{k:"D",ok:!0,text:`Right. It accepts the sorry, keeps the exact ask, and asks when. Say they reply: "Billing will refund it within five working days." Now you've got a date, not just a sorry.`,subs:[]},{k:"A",ok:!1,text:"Takes the sorry instead of the money. You'll usually hear nothing.",subs:[]},{k:"B",ok:!1,text:`An order, and "please" doesn't change that. Orders more than halved settling.`,subs:[]},{k:"C",ok:!1,text:"Thanks them and drops the ask, so they've nothing left to do.",subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're moving out. Your deposit is protected in a deposit scheme, as the law requires, and your move-in photos show a stain on the bedroom carpet. Your landlord messages: "I'm keeping \xA3300 of your deposit for the carpet stain." What's your best reply?`],quote:[],options:[{k:"A",t:`"That's outrageous. That stain was already there before I even moved in!"`,ok:!1},{k:"B",t:`"The stain is in my move-in photos, attached. I'd like the full deposit back."`,ok:!0},{k:"C",t:`"I'm really sorry about the carpet. Could I have the full deposit back?"`,ok:!1},{k:"D",t:`"Return my full deposit by Friday, or I'll be going straight to the deposit scheme."`,ok:!1}],expl:{card:"The card: facts, your exact ask, and no sorry for what wasn't your fault.",items:[{k:"B",ok:!0,text:`Right. Say he answers: "Photos prove nothing." Now you can say, calmly: "Then I'm happy for the deposit scheme to decide." Its free service needs you both to agree, or it's small claims. Either way, he must justify each deduction.`,subs:[]},{k:"A",ok:!1,text:`Angry words. You'll usually get: "I'm keeping the lot."`,subs:[]},{k:"C",ok:!1,text:"The sorry sounds like you're admitting the stain (lesson 6.2).",subs:[]},{k:"D",ok:!1,text:"An order with a threat, and no facts: he'll dig in.",subs:[]}]}},{n:5,fmt:"Type it",stem:["A takeaway app charged you \xA318 for an order that never arrived. You're messaging their support chat. Type a firm message that doesn't give an order."],quote:[],options:[],model:"My order never arrived, but I was charged \xA318. I'd like a full refund.",checks:"contains one of: arrive, arrived, came, come, delivered, turn up, turned up, show up, showed up, showed, received, get it, got it, get my, got my, charged, paid; contains one of: I'd like, I would like, I'd expect, I would expect, I'm expecting, I want, can I, could I, can you, could you; contains one of: refund, refunded, money back, back; first word (ignoring an opening hi, hello or hey) is not an order (refund, give, send, sort, fix, credit, return, pay, process, cancel, put, just, get); contains none of: refund me, give me, you need to, you must, you have to, sort it, sort this, fix this, immediately, right now, asap, joke, disgrace, disgraceful, ridiculous, useless, scam, rip off, pathetic, unacceptable, outrageous, shocking, seriously, sorry, I think, maybe, might, possibly, if possible, no worries, just wondering, any chance, bother, refund now, back now, it now; no \xA3 amount other than \xA318; 35 words or fewer. Whole words, any case.",after:["The card: when you're owed, say what happened and what you want, with no orders and no angry words.",`Say they reply: "The driver marked it as delivered." Stay firm with the facts: "It wasn't delivered to me. I was in all evening. I'd still like the \xA318 refunded."`,'Fails: orders ("Refund me now"), angry words ("This is a joke"), and soft, vague lines ("Sorry, I think there might be a problem?").'],modelRaw:`"My order never arrived, but I was charged \xA318. I'd like a full refund."`}],mission:`think of one charge, delay or mistake from the last month. Write the message: what happened, in one sentence, then "I'd like\u2026". Send it if it's still worth sending.`}]},{n:7,title:"Bigger Deals",tagline:"Most deals have more in them than one price. Put it all on the table, and you can both come away with more.",lessons:[{id:"7.1",title:"Several parts? Rank them, then swap",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Put all your asks on the table at once, and say which matters most. Then swap: give what costs you little, for what you care about."}]},{h:"When to use it",items:[{t:"p",text:"Any deal with more than one part."},{t:"sit",text:"A job offer (salary, start date, home working), a flat (rent, move-in date, furniture)."}]},{h:"Why it works",items:[{t:"p",text:"Each side cares more about some parts than others. Look at it all together and you can both swap your way to more."}]},{h:"Example",items:[{t:"sit",text:"A room's \xA3700 a month from 1 September; similar rooms are \xA3650 to \xA3700. You could move in any time."},{t:"say",who:"You",text:`"Rent's the big one for me. If I move in on 15 August, could we do \xA3650?"`},{t:"say",who:"Landlord",text:'"15 August works. \xA3670?"'},{t:"p",text:"\xA330 a month less, for a date you didn't mind."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Say your ranking, never your limit.",rest:"A ranking can't be used against you. A limit becomes what you get."},{t:"good",text:'"The fee matters most to me, then the deadline."'},{t:"bad",text:`"I'd need at least \xA3300." \u2192 you'll usually get \xA3300 exactly.`},{t:"tip",n:2,title:'Asked "What matters most to you?" Just answer.',rest:`It can't cap you, so skip "What makes you ask?" (lesson 1.6).`},{t:"tip",n:3,title:"Don't settle one part on its own.",rest:"Then nothing's left to swap for more of it. If they insist, pencil it in."},{t:"sit",text:"A client wants to fix the fee before talking about the deadline."},{t:"quote",text:'"\xA3400 for now, as long as we can come back to it."'},{t:"tip",n:4,title:"Swap in one sentence: what you give, and what you get.",rest:"Give what's cheap for you, and never ask them to give up what they care about most."},{t:"sit",text:"You've got your own furniture."},{t:"quote",text:'"If I take it unfurnished, could we do \xA3650?"'}]},{h:"Avoid",items:[{t:"bad",text:'"Oh, and one more thing\u2026" Asks added after a yes annoy people.'}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"Most negotiators wrongly assume the other side wants the opposite of what they want, and miss swaps that help both (Thompson and Hastie, 1990). Sharing priorities led to better deals for both sides, even when only one person did it, and sharers didn't lose out (Thompson, 1991)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`A recruiter rings about your first job offer, at a small marketing agency: "Let's agree salary first, \xA327,000, then we'll sort out the details." Similar roles pay \xA327,000 to \xA329,000. Salary matters most to you, then home working, and you could happily start earlier than planned. What's your best reply?`],quote:[],options:[{k:"A",t:'"Sure, \xA327,000 works. What are the other details?"',ok:!1},{k:"B",t:'"Could we lock the salary in at \xA329,000 first, then sort the rest after?"',ok:!1},{k:"C",t:`"What's the most you could go to on the salary?"`,ok:!1},{k:"D",t:`"I'd rather look at salary, start date and home working together."`,ok:!0}],expl:{card:"The card: don't settle one part on its own.",items:[{k:"D",ok:!0,text:`Right. Say they answer: "We're flexible on home working and the start date." Now swap: "If I start two weeks early, could we do \xA328,500 and two days at home?" If they insist on a salary number now, pencil it in: "\xA329,000, as long as we can come back to it."`,subs:[]},{k:"A",ok:!1,text:"Settles salary alone.",subs:[]},{k:"B",ok:!1,text:"Higher, but still one part at a time.",subs:[]},{k:"C",ok:!1,text:"Asks for their limit.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`Your offer from a small agency is \xA328,000, one day a week at home, starting 1 September. Similar roles pay \xA328,000 to \xA330,000. Salary matters most to you, then home working, and you could easily start in August. The recruiter asks: "What matters most to you in all this?" What's your best reply?`],quote:[],options:[{k:"A",t:'"What makes you ask?"',ok:!1},{k:"B",t:`"Salary matters most, then home working. The start date's flexible."`,ok:!0},{k:"C",t:`"Honestly, I'd need at least \xA330,000 before I could say yes to this."`,ok:!1},{k:"D",t:'"It all matters to me equally, to be honest."',ok:!1}],expl:{card:"The card: asked what matters most? Just answer: your ranking, never your limit.",items:[{k:"B",ok:!0,text:`Right. It shows where the swap is. Say they answer: "Salary's tight, but home working's easy." Now: "Then if I start in August, could we do \xA328,750 and two days at home?"`,subs:[]},{k:"A",ok:!1,text:"For questions that could cap you, like your budget (lesson 1.6). A ranking can't cap you.",subs:[]},{k:"C",ok:!1,text:"Your limit. You'll usually get \xA330,000 exactly.",subs:[]},{k:"D",ok:!1,text:"Hides your ranking, so the easy swap never comes up.",subs:[]}]}},{n:3,fmt:"Sort it",stem:["You're negotiating your first job offer, at a small agency. They've offered \xA327,000, and similar roles pay up to \xA329,000. Which lines say what matters most to you, and which give away your limit?"],quote:[],options:[],sort:[{t:'"Salary matters more to me than the start date."',bin:"says what matters most"},{t:`"I couldn't go below \xA327,000."`,bin:"gives away your limit"},{t:'"Home working is the big one for me."',bin:"says what matters most"},{t:`"Anything over \xA328,000 and I'd sign today."`,bin:"gives away your limit"},{t:`"I'm flexible on when I start."`,bin:"says what matters most"},{t:`"I'd need at least two days at home."`,bin:"gives away your limit"}],expl:{card:"The card: share your ranking, never your limit.",items:[{label:"Says what matters most",text:'swaps, with no number to aim at. Say they answer: "Three days at home, but salary stays at \xA327,000." Now: "If I start a week early, could we do \xA327,750?"',subs:[]},{label:"Gives away your limit",text:"",subs:[`"I couldn't go below \xA327,000": you'll usually get exactly that.`,`"Anything over \xA328,000": you'll usually get \xA328,000 and a bit.`,`"At least two days" sounds like a priority, but it's a floor: you'll get two, not three.`]}]},bins:["says what matters most","gives away your limit"]},{n:4,fmt:"Say it",stem:[`A small brewery wants you to design the labels for its new beer. You'd normally charge \xA3365. They say: "We can pay \xA3300, and it has to be ready by the 14th, that's our launch." You've got a quiet month, so the 14th is easy, and you could even send a draft by the 7th. What's your best reply?`],quote:[],options:[{k:"A",t:'"No problem at all. \xA3300 and ready by the 14th works absolutely fine for me."',ok:!1},{k:"B",t:'"Could we do \xA3365 if I deliver it on the 21st, a week later?"',ok:!1},{k:"C",t:'"If I send a draft by the 7th, final by the 14th, could we do \xA3365?"',ok:!0},{k:"D",t:'"Could you do \xA3345 if I throw in a free logo for the launch?"',ok:!1}],expl:{card:"The card: give what's cheap for you, and never ask them to give up what they care about most.",items:[{k:"C",ok:!0,text:`Right. A draft costs you little; their launch matters most to them. Say they answer: "A draft by the 7th would really help. \xA3340?" That's \xA340 more for almost nothing.`,subs:[]},{k:"A",ok:!1,text:"Takes their first number and gets nothing for the deadline.",subs:[]},{k:"B",ok:!1,text:`The wrong way round: it asks them to move their launch. "The 14th isn't moving."`,subs:[]},{k:"D",ok:!1,text:"A logo costs you hours: you'd pay for your own \xA345.",subs:[]}]}},{n:5,fmt:"Type it",stem:['A recruiter at a small agency says: "We can do \xA327,500, starting 1 September." Similar roles pay \xA327,500 to \xA329,000. Salary matters most to you, and you could easily start on 18 August. Type a reply that offers the earlier start in return for more salary.'],quote:[],options:[],model:"If I can start on 18 August, could we make it \xA329,000?",checks:"contains one of: August, 18, 18th, earlier, sooner, early; contains a salary above \xA327,500 (any format: \xA328,500, 28,500, 28500, \xA328.5k, 29k); contains none of: at least, minimum, lowest, the most, can't go, couldn't go, I need, need at least, would accept, I'd accept; 30 words or fewer. Whole words, any case.",after:["The card: swap in one sentence: what you give, and what you get.",`Say they answer: "We can't do \xA329,000, but \xA328,250 if you start on the 18th." That's \xA3750 a year for two weeks you didn't mind. If they say "Salary's fixed", ask what else the date could buy: "Then could we do two days at home?"`,`Fails: offering the date with nothing back, accepting \xA327,500, or giving away your limit ("I'd need at least \xA328,000").`],modelRaw:'"If I can start on 18 August, could we make it \xA329,000?"'}],mission:`take one deal you're in or about to be in (a job offer, a freelance job, a flat, a bill). Write down every part that could be agreed, then rank them from "matters most" to "don't mind".`},{id:"7.2",title:"Use their own rules as your reason",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Asking a company, landlord or employer for something? Give their own rule as your reason, not your opinion."},{t:"quote",text:'"Your website says you price match. Could you match this one?"'}]},{h:"When to use it",items:[{t:"p",text:"You want something from someone with rules or promises."},{t:"sit",text:"Money back from a shop, a repair from your landlord, a better price from your phone provider."}]},{h:"Why it works",items:[{t:"p",text:`Your opinion is easy to brush off: "Sorry you feel that way." Their own rule isn't, because saying no means arguing with themselves.`}]},{h:"Example",items:[{t:"sit",text:"A hairdresser charges \xA345. The price list in the window says \xA338."},{t:"say",who:"You",text:'"Your price list says \xA338 for a cut. Could you charge me that?"'},{t:"say",who:"Hairdresser",text:`"Oh, that's an old list. Go on, \xA338."`},{t:"p",text:"You pay their own price."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Use their policy, a written promise or what they did before.",rest:"What they did last time is hardest to refuse: they must explain why you're different."},{t:"sit",text:"Your bank refunded a card fraud in a day last year. This one's taken a week."},{t:"quote",text:'"Last time you refunded it within a day. Could you do the same here?"'},{t:"tip",n:2,title:"No rule to quote? Ask what they've done before.",rest:""},{t:"sit",text:"Your landlord says no to painting your room."},{t:"quote",text:'"What have other tenants been allowed to do?"'},{t:"tip",n:3,title:`They can't bend it ("The system won't let me")? Ask who can, then quote the rule to that person.`,rest:"Quoting it at someone who can't act makes them defensive."},{t:"sit",text:"The gym receptionist says the cancellation fee is automatic."},{t:"quote",text:`"Who could waive it?" Then, to the manager: "Your terms say no fee with a month's notice. I gave six weeks."`},{t:"tip",n:4,title:"Say it plainly.",rest:"Sound smug and they stop wanting to help."},{t:"bad",text:'"Do you even read your own policy?" \u2192 they defend, not help.'}]},{h:"Avoid",items:[{t:"bad",text:`"Any decent company would sort this." That's opinion, so they defend their policy.`},{t:"bad",text:'"Could you make an exception, just this once?" It asks them to break their rule, not follow it.'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Taught in *Getting More* (Stuart Diamond) and *Getting to Yes* (Fisher and Ury). Never tested."}]}]}],know:!1},questions:[{n:1,fmt:"Sort it",stem:["You ordered a \xA3300 TV online. It arrived a week late with a faulty screen, and you want your money back. Which lines use their own rules or promises, and which are easy to brush off?"],quote:[],options:[],sort:[{t:'"Your returns page says faulty items can be refunded within 30 days."',bin:"uses their own rules"},{t:'"Any decent shop would refund this straight away."',bin:"easy to brush off"},{t:'"You refunded my last order straight away when it arrived damaged."',bin:"uses their own rules"},{t:`"I've been a loyal customer for years."`,bin:"easy to brush off"},{t:'"The order confirmation said delivery by Friday."',bin:"uses their own rules"},{t:'"Nobody would pay \xA3300 for a screen like this."',bin:"easy to brush off"}],expl:{card:"The card: use their policy, a written promise or what they did before. Your opinion is easy to brush off.",items:[{label:"Their own rules",text:`the returns page, the delivery promise and the last refund. The last refund is strongest: they must explain why you're treated differently. Say they answer: "That was a different item." Now: "What's different? Both arrived faulty."`,subs:[]},{label:"Easy to brush off",text:"",subs:['"Any decent shop\u2026" is opinion dressed as a rule.',`"A loyal customer" is true, but it isn't their rule.`,'"Nobody would pay \xA3300\u2026" is opinion again.']}]},bins:["uses their own rules","easy to brush off"]},{n:2,fmt:"Say it",stem:[`You're four months into a 12-month gym contract at \xA340 a month. You're having knee surgery and can't train for three months. You ask the gym to freeze your membership. They say: "Sorry, we don't do freezes." What's your best reply?`],quote:[],options:[{k:"A",t:`"That's a pretty poor policy for a gym, to be honest."`,ok:!1},{k:"B",t:`"What have you done for members who've had surgery?"`,ok:!0},{k:"C",t:'"Could you make an exception for me, just this once?"',ok:!1},{k:"D",t:`"Okay, I'll just have to keep paying for it, then."`,ok:!1}],expl:{card:"The card: ask what they've done before.",items:[{k:"B",ok:!0,text:`Right. If they've done it for others, no is hard. Say they answer: "We have, with a doctor's note." Now: "I'll get you one this week. Could you freeze it from the 1st?" If they say "Never", ask: "Who'd be able to make that call?"`,subs:[]},{k:"A",ok:!1,text:"Your opinion, so they defend the policy.",subs:[]},{k:"C",ok:!1,text:`Asks them to break their rule: "Sorry, I can't."`,subs:[]},{k:"D",ok:!1,text:"Gives in: \xA3120 for three months you can't use.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`Your phone contract has ended and you own the handset, so you just need a SIM plan. The provider says: "\xA332 a month is our standard price for that plan." On their own website, new customers get the same SIM-only plan for \xA318. What's your best reply?`],quote:[],options:[{k:"A",t:'"Could you knock it down to \xA327 a month?"',ok:!1},{k:"B",t:`"I've been with you four years, and that's not fair, is it?"`,ok:!1},{k:"C",t:'"Is that really the best you can do for me?"',ok:!1},{k:"D",t:'"Your website has it at \xA318. Can I have that price?"',ok:!0}],expl:{card:"The card: give their own rule as your reason. Here, it's their own website price.",items:[{k:"D",ok:!0,text:`Right. Saying no means defending charging you more than a stranger. Say they answer: "That's for new customers, but I can do \xA320." Now: "It's the same plan. Could you do the \xA318?"`,subs:[]},{k:"A",ok:!1,text:"No reason, and above their own price. \xA327 is usually your best.",subs:[]},{k:"B",ok:!1,text:"Fairness is opinion, and they'll disagree.",subs:[]},{k:"C",ok:!1,text:'Asks them to judge their own price: "Yes, it is."',subs:[]}]}},{n:4,fmt:"Say it",stem:[`A jacket you bought five weeks ago has split at the seam. The shop's returns page says faulty items can be returned within six months. At the till, the assistant says: "I can see it's faulty, but anything over 28 days has to go through head office. The till won't let me." What's your best reply?`],quote:[],options:[{k:"A",t:'"Your returns page says faulty items are covered for six months."',ok:!1},{k:"B",t:`"Come on, it's only a week over the 28 days."`,ok:!1},{k:"C",t:`"Who'd be able to override it for me?"`,ok:!0},{k:"D",t:'"Get me your manager, please. This is ridiculous."',ok:!1}],expl:{card:"The card: they can't bend it? Ask who can, then quote the rule to that person.",items:[{k:"C",ok:!0,text:`Right. She's agreed it's faulty but can't act. Say she answers: "My supervisor can." Then, to the supervisor: "Your returns page covers faulty items for six months. This split after five weeks."`,subs:[]},{k:"A",ok:!1,text:"The right rule, to someone who can't act on it.",subs:[]},{k:"B",ok:!1,text:"Argues with the 28 days instead of using the six months.",subs:[]},{k:"D",ok:!1,text:"An order with angry words, so the supervisor arrives on her side.",subs:[]}]}},{n:5,fmt:"Type it",stem:['The washing machine that came with your flat broke three weeks ago. Your tenancy agreement says supplied appliances are repaired "within 14 days of being reported". Type a message to your landlord that uses his own agreement.'],quote:[],options:[],model:"The tenancy agreement says appliances are repaired within 14 days. It's been three weeks since I reported the washing machine. When can it be fixed?",checks:"contains one of: agreement, contract, tenancy; contains one of: 14, fourteen, two weeks, fortnight; contains one of: when, could, can, would, I'd like, I would like, I'd expect; first word (ignoring an opening hi, hey, hello or dear) is not an order (fix, sort, get, repair, send, replace); contains none of: disgrace, joke, ridiculous, useless, immediately, right now, asap, or else, seriously, even, unacceptable, fix it, sort it, clearly, as you know; 40 words or fewer. Whole words, any case.",after:["The card: use their own rule as your reason, and say it plainly.",`Say he answers: "That's just standard wording." Now you can say: "It's the agreement we both signed. When can someone come out?"`,'Fails: no mention of the agreement, smug or angry words ("Do you even read it?"), and orders ("Fix it immediately").'],modelRaw:`"The tenancy agreement says appliances are repaired within 14 days. It's been three weeks since I reported the washing machine. When can it be fixed?"`}],mission:"look up the refund, price-match or compensation policy of one company you pay every month, and copy one line you could quote at them."},{id:"7.3",title:"Make two or three offers at once",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Make two or three offers at the same time, each mixing the parts differently but each equally good for you. Then ask which suits them."}]},{h:"When to use it",items:[{t:"p",text:"Your offer has more than one part."},{t:"sit",text:"A freelance quote, selling furniture (price, delivery, extras), a counter to a job offer."}]},{h:"Why it works",items:[{t:"p",text:"Several offers look like a real effort to meet them, so they push back less. You look flexible without dropping your price, and their pick shows what they care about."}]},{h:"Example",items:[{t:"sit",text:"A couple wants you to photograph their engagement party. You charge \xA3250 for two hours."},{t:"say",who:"You",text:'"\xA3250 for two hours, \xA3375 for three, or \xA3300 for two with a printed album. Which suits you best?"'},{t:"say",who:"Them",text:'"Three hours, please."'},{t:"p",text:"Paid \xA3375, no haggling."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Check each offer is equally good for you.",rest:"More work or cost to you means more money. If one is simply cheaper for them, it's a discount, not an option."},{t:"bad",text:'"\xA390, \xA385 or \xA380." \u2192 three prices for the same thing, so they take \xA380.'},{t:"bad",text:`"\xA390, or \xA375 if that's too much." \u2192 just a discount.`},{t:"tip",n:2,title:"They mix and match? Point them back to your options.",rest:'"The cheap price, but with the extra" is a new offer, not one of yours.'},{t:"sit",text:'The couple replies: "Three hours for \xA3250?"'},{t:"quote",text:`"For three hours it's \xA3375. Or two for \xA3250, your choice."`},{t:"tip",n:3,title:"Only a price? Add parts first:",rest:"when they collect, delivery, an extra, how many they book."}]},{h:"Evidence",items:[{t:"ev",label:"Backed by studies",text:"In six experiments, people who made several equally good offers at once got better deals than people who made one, and both sides ended up with more overall (Leonardelli, Medvec, Galinsky and others, 2019). The other side saw it as a more genuine effort."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["A local dog groomer asks you to make a one-minute promo video. You'd normally charge \xA3410, with two rounds of changes. Which reply gets you the best deal?"],quote:[],options:[{k:"A",t:`"It's \xA3410, which includes two rounds of changes and the music licence."`,ok:!1},{k:"B",t:'"What sort of budget did you have in mind for it?"',ok:!1},{k:"C",t:`"\xA3410, or I could probably do \xA3355 if that's too much."`,ok:!1},{k:"D",t:'"\xA3410 with two rounds of changes, \xA3465 with three, or \xA3355 with one."',ok:!0}],expl:{card:"The card: two or three offers, each equally good for you.",items:[{k:"D",ok:!0,text:`Right. More rounds, more work, more money, so each is fair to you. Say they answer: "One round's fine." Price matters most to them. If they ask for "\xA3355 with two rounds", point them back: "Two rounds is the \xA3410 one."`,subs:[]},{k:"A",ok:!1,text:"One offer, so only price is left.",subs:[]},{k:"B",ok:!1,text:"Asks their limit. You know your rate, so go first (lesson 2.1).",subs:[]},{k:"C",ok:!1,text:"The second offer is just a discount.",subs:[]}]}},{n:2,fmt:"Say it",stem:["You're moving out on Saturday and need your sofa gone by then. You'd be happy with \xA3195 if the buyer collects. Delivering it would cost you \xA320 in fuel for a mate's van. You'd also like the matching armchair gone, because there's no room for it in your new place. Which message makes offers that are all equally good for you?"],quote:[],options:[{k:"A",t:`"\xA3195 if you collect by Saturday, or I could do \xA3165 if you'd rather collect next week."`,ok:!1},{k:"B",t:'"\xA3195 if you collect by Saturday, \xA3215 if I deliver, or \xA3195 with the armchair too."',ok:!0},{k:"C",t:'"\xA3195, \xA3185 or \xA3175, depending on what you can stretch to. Let me know!"',ok:!1},{k:"D",t:'"\xA3195 if you collect it by Saturday, or the same \xA3195 if I deliver it to you."',ok:!1}],expl:{card:"The card: check each offer is equally good for you.",items:[{k:"B",ok:!0,text:`Right. Delivery costs you \xA320, so it's \xA320 more, and you want the armchair gone anyway. Say they answer: "Ooh, I'll take the armchair too." Your flat's cleared for the same \xA3195.`,subs:[]},{k:"A",ok:!1,text:"Worse for you twice: less money, and the sofa's still there after you move.",subs:[]},{k:"C",ok:!1,text:"Three prices for one sofa. You'll usually get \xA3175.",subs:[]},{k:"D",ok:!1,text:"Delivery costs you \xA320: a discount in disguise.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`You're selling your sofa and messaged a buyer: "\xA3195 if you collect by Saturday, \xA3215 if I deliver, or \xA3195 with the armchair too." They reply: "I'll take the \xA3195 one, delivered please!" What's your best reply?`],quote:[],options:[{k:"A",t:'"Go on then, \xA3195 delivered. See you on Saturday."',ok:!1},{k:"B",t:'"How about \xA3205 delivered, then? Meet in the middle?"',ok:!1},{k:"C",t:'"Delivered is the \xA3215 one, or \xA3195 if you collect."',ok:!0},{k:"D",t:`"What's the most you'd pay to have it delivered?"`,ok:!1}],expl:{card:"The card: if they mix and match, point them back to your options.",items:[{k:"C",ok:!0,text:`Right. Friendly, and your own options are back on the table. Say they answer: "Fine, \xA3215 delivered?" That's your full price. If they say "I'll collect, then", you've still got \xA3195.`,subs:[]},{k:"A",ok:!1,text:"Gives away the \xA320 your offers were built to protect.",subs:[]},{k:"B",ok:!1,text:"Splits a gap that only exists because they mixed your offers.",subs:[]},{k:"D",ok:!1,text:'Asks their limit: "Ten quid?"',subs:[]}]}},{n:4,fmt:"Type it",stem:["A parent asks your rate for piano lessons for her daughter. You charge \xA336 an hour. You'd be just as happy with \xA333 an hour if they book 10 lessons in one go, or \xA331 an hour if their daughter comes to you. Type a reply that gives them the options at once."],quote:[],options:[],model:"It's \xA336 an hour, \xA333 if you book 10 lessons, or \xA331 if she comes to me. Which suits you best?",checks:"contains at least two of: 36, 33, 31; if it contains 33, it also contains one of: book, booking, sessions, lessons, block, ten, 10, upfront, in advance, in one go; if it contains 31, it also contains one of: come, comes, coming, to me, to mine, at mine, my place, my house, mine; no number other than 36, 33, 31 or 10; contains none of: budget, afford, lowest, the most, at least, minimum, can't go, below, cheapest; 40 words or fewer. Whole words, any case.",after:["The card: two or three offers at once, each as good for you as the others.",'Say they answer: "\xA333 for ten sounds good. Could it be Tuesdays?" Now you know a regular slot matters more to them than the last \xA33 an hour.','Fails: one price on its own, prices with no reason ("\xA336, \xA333 or \xA331"), and asking their budget.'],modelRaw:`"It's \xA336 an hour, \xA333 if you book 10 lessons, or \xA331 if she comes to me. Which suits you best?"`}],mission:"next time you sell something or quote for a job, write two or three offers that are all equally good for you before you reply. If nothing's coming up, do it for one thing you own and could sell."},{id:"7.4",title:"Bet on what you disagree about",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:'Stuck because you disagree about what will happen? Make the deal depend on it: "If this happens, this price. If not, that price."'}]},{h:"When to use it",items:[{t:"p",text:"You're stuck on a prediction you can both check soon."},{t:"sit",text:"A seller says it works fine, a boss doubts your targets, a client doubts your deadline."}]},{h:"Why it works",items:[{t:"p",text:"Each side gets the deal it believes in, so the thing you were stuck on becomes the deal. And if they won't take the bet, their confidence was probably just talk."}]},{h:"Example",items:[{t:"sit",text:"A buyer offers \xA3150 for your PS5 because he thinks the controller drifts. You know it doesn't."},{t:"say",who:"You",text:'"Test it when you collect. If it drifts, \xA3150. If not, \xA3190."'},{t:"say",who:"Buyer",text:'"Fair enough."'},{t:"p",text:"He tests it, it's fine: \xA3190."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Bet on something you can both check soon.",rest:"A test, a sales figure, a date."},{t:"good",text:'"If it passes a shop check on Saturday, \xA3295. If it needs a new chain, \xA3255."'},{t:"bad",text:'"If the event goes well, could you pay more?" \u2192 "goes well" is whatever they say.'},{t:"tip",n:2,title:"Don't argue, and don't split the difference.",rest:"You disagree about the facts, so the middle is just a guess."},{t:"bad",text:`"It'll definitely fail." \u2192 they defend it.`},{t:"tip",n:3,title:"They suggest the bet? Find out how often it pays out first.",rest:"They may know more than you."},{t:"sit",text:"Your manager offers a \xA31,000 bonus for 120 sales in a month."},{t:"quote",text:'"How many people on the team hit that last year?"'}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Business negotiators call it a contingent deal and use it all the time (Bazerman and Gillespie, Harvard Business Review, 1999). No controlled experiment has tested it."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You're buying a used Peugeot 208 from a private seller for \xA32,400. Its MOT runs out in two weeks. The seller says: "It'll sail through, it's never failed." You think the brakes will need doing, at about \xA3290. He won't drop the price. What's your best move?`],quote:[],options:[{k:"A",t:'"I reckon the brakes will fail, though. Could you do \xA32,110?"',ok:!1},{k:"B",t:'"If it passes its MOT before I buy, \xA32,400. If it fails, \xA32,110."',ok:!0},{k:"C",t:'"Could we split the difference and call it \xA32,255?"',ok:!1},{k:"D",t:`"\xA32,110 now, and another \xA3290 if it's still running fine next year."`,ok:!1}],expl:{card:"The card: bet on something you can both check soon.",items:[{k:"B",ok:!0,text:`Right. If he's sure it'll pass, he expects his \xA32,400, so he should say yes. Say he answers: "Fine, I'll book it in." If he says "I'm not waiting", his confidence was talk: "No problem. As it stands, I'm at \xA32,110."`,subs:[]},{k:"A",ok:!1,text:`Argues who's right: "Brakes are fine, mate."`,subs:[]},{k:"C",ok:!1,text:"Splits a gap that's really about the brakes.",subs:[]},{k:"D",ok:!1,text:'Vague and a year away. "Running fine" is endlessly arguable.',subs:[]}]}},{n:2,fmt:"Say it",stem:[`You've been offered a sales job at a start-up at \xA326,000. Similar sales roles pay \xA326,000 to \xA329,000. You're confident you'll hit your targets. The hiring manager says: "I can't justify more until I've seen what you can do." What's your best reply?`],quote:[],options:[{k:"A",t:'"If I do well in my first few months, could we have another look at the salary then?"',ok:!1},{k:"B",t:`"I'm really confident I'll do well here, so could you start me on \xA329,000 instead?"`,ok:!1},{k:"C",t:'"If I hit my sales target by my three-month review, could it go to \xA329,000?"',ok:!0},{k:"D",t:`"That's fair. A review in a year sounds good to me."`,ok:!1}],expl:{card:"The card: make the deal depend on what you disagree about, with something you can check soon.",items:[{k:"C",ok:!0,text:`Right. They only pay if you deliver, which is their worry. Say they answer: "Hit target three months running and I'll do \xA328,500." That's \xA32,500 a year, tied to something you're sure of.`,subs:[]},{k:"A",ok:!1,text:`Vague: "doing well" is whatever they say. You'll usually get: "We'll see."`,subs:[]},{k:"B",ok:!1,text:"Argues you're right. They still have no reason to believe you.",subs:[]},{k:"D",ok:!1,text:"Accepts a year at \xA326,000 when you'd earn more sooner.",subs:[]}]}},{n:3,fmt:"Say it",stem:[`A gig promoter offers your band a support slot: "\xA3100, plus \xA32 for every ticket we sell over 150." Your band usually gets \xA3180 for a slot like this. You've no idea how many tickets their nights usually sell. What's your best reply?`],quote:[],options:[{k:"A",t:'"How many tickets did your last few nights sell?"',ok:!0},{k:"B",t:`"Sounds good, I'm in. Send me the details."`,ok:!1},{k:"C",t:'"Could you make it \xA33 for every ticket over the 150?"',ok:!1},{k:"D",t:`"What's the most I could make from it?"`,ok:!1}],expl:{card:"The card: they suggest the bet? Find out how often it pays out first.",items:[{k:"A",ok:!0,text:`Right. They know their numbers; you don't. Say they answer: "About 160." The bonus is worth about \xA320, so the real offer is \xA3120: "Could we do \xA3180 flat?" If they say "We sell out at 300", take the bet.`,subs:[]},{k:"B",ok:!1,text:"Takes a bet where they know the odds.",subs:[]},{k:"C",ok:!1,text:"Haggles over the bet before you know it'll pay.",subs:[]},{k:"D",ok:!1,text:"Gets the sell-out figure, not a normal night.",subs:[]}]}},{n:4,fmt:"Type it",stem:["A client wants a website by 1 March, but doubts you can finish in time, so she's only offering \xA3600 instead of your usual \xA3780. You're sure you can do it. Type a reply that turns her doubt into the deal."],quote:[],options:[],model:"If it's live by 1 March, it's \xA3780. If it's late, \xA3600.",checks:"contains one of: if, unless, otherwise; contains 780; contains one of: March, 1st, deadline, on time, in time, late, by then; contains a second amount below 780, or one of: off, less, discount, knock; no number above 780; contains none of: trust me, promise, split, meet in the middle, halfway, lowest, at least, minimum, the most; 35 words or fewer. Whole words, any case.",after:["The card: make the deal depend on what you disagree about, using something you can both check.",`Say she answers: "OK, \xA3780 if it's live by the 1st." That's \xA3180 more for something you were sure of anyway. If she turns down any bet, her worry is the price, not the date, so talk about what \xA3600 would get her.`,`Fails: arguing ("Trust me, I'll make it"), splitting the difference, and a bet with nothing she can check.`],modelRaw:`"If it's live by 1 March, it's \xA3780. If it's late, \xA3600."`}],mission:'think of one disagreement about what will happen (with a flatmate, a manager, a buyer) and write the "If\u2026 then\u2026" deal that would have settled it.'}]},{n:8,title:"Dirty Tactics: Use Them and Beat Them",tagline:"Four tricks people use to squeeze you. Learn to run each one yourself, and to stop it working on you.",lessons:[{id:"8.1",title:'The "check with my boss" trick',guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:`Before your best number, find out who decides, with an "or" so it's easy to admit it isn't them:`},{t:"quote",text:'"Can you agree the price yourself, or does it go to your manager?"'}]},{h:"When to use it",items:[{t:"p",text:"They might not decide alone."},{t:"sit",text:"A salesperson with a manager, a letting agent with a landlord."}]},{h:"Why it works",items:[{t:"p",text:`The trick: you give your best number, they "check with the boss", and come back wanting more. A plain "Are you the one who decides?" gets a yes, because nobody likes admitting they're junior.`}]},{h:"Example",items:[{t:"sit",text:"A letting agent shows you a room at \xA3720."},{t:"say",who:"You",text:'"Can you agree the rent yourself, or does the landlord decide?"'},{t:"say",who:"Agent",text:'"Under \xA3700, the landlord OKs it."'},{t:"p",text:"So get the agent backing your number before it goes up."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"It has to go to someone else? Pin it first, and get them backing you.",rest:""},{t:"sit",text:"A buyer says he'll check your price with his dad."},{t:"good",text:'"If he says yes, have we got a deal?"'},{t:"good",text:'"Will you be recommending it?"'},{t:"bad",text:`"Just let me know what he says." \u2192 a no comes back from someone you can't argue with.`},{t:"tip",n:2,title:`While they're "checking", don't offer more, and don't go over their head.`,rest:""},{t:"sit",text:"The shop assistant's gone to ask her manager."},{t:"bad",text:`"If it helps, I could go a bit lower." \u2192 you've dropped before anyone asked.`},{t:"bad",text:'"Could I just talk to your manager?" \u2192 you lose the one person on your side.'},{t:"tip",n:3,title:"They reopen something you'd agreed? Reopen something too, with a price.",rest:""},{t:"sit",text:"A client agreed \xA3300 for a logo, then comes back wanting three versions, not two."},{t:"quote",text:'"Sure. Three versions is \xA3360."'},{t:"tip",n:4,title:"Use it yourself when you're the one being pushed to decide.",rest:"Say someone who really has a say must agree."},{t:"sit",text:'A phone shop offers a deal "if you sign today". You share the bill with your flatmates.'},{t:"quote",text:`"I'll need to talk it over with my flatmates first."`}]},{h:"Evidence",items:[{t:"ev",label:"Pro trick",text:"Taught by Roger Dawson, Fisher and Ury, and Deepak Malhotra. Never tested in studies."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:["You run a photo booth on the side. The social sec of a uni football club wants it for their end-of-season party, and you'd normally charge \xA3275 for the night. Before you name your price, what's your best question?"],quote:[],options:[{k:"A",t:'"What sort of budget has the club got for the night, roughly?"',ok:!1},{k:"B",t:'"Is this your call, or does the committee have to OK it?"',ok:!0},{k:"C",t:'"Are you the one who makes the final decision on this?"',ok:!1},{k:"D",t:'"Shall I just email the club a full quote first?"',ok:!1}],expl:{card:`The card: find out who decides before your number, with an "or" so it's easy to admit.`,items:[{k:"B",ok:!0,text:'Right. Say they answer: "Anything over \xA3200 goes to the treasurer." Now you can say: "Great. If I quote \xA3275, will you be backing me when it goes to her?"',subs:[]},{k:"A",ok:!1,text:`Lets them name a number first, though you know your rate. You'll usually get "about \xA3150".`,subs:[]},{k:"C",ok:!1,text:'No "or", so people say yes to save face, then check after your price.',subs:[]},{k:"D",ok:!1,text:"Sends your number to people you can't talk to.",subs:[]}]}},{n:2,fmt:"Say it",stem:[`You're selling your old gaming laptop to a colleague. You've agreed \xA3450. Then he says: "Sounds good. I'll just check with my girlfriend tonight, we share money." What's your best reply?`],quote:[],options:[{k:"A",t:'"No worries at all, just let me know what she thinks."',ok:!1},{k:"B",t:'"Course. Could I have a quick chat with her myself, about the specs?"',ok:!1},{k:"C",t:'"Sure, and if it helps, I could probably do \xA3430."',ok:!1},{k:"D",t:`"Sure. If she's happy, is that us agreed at \xA3450?"`,ok:!0}],expl:{card:"The card: pin it before it goes to someone else: if they say yes, it's a deal.",items:[{k:"D",ok:!0,text:`Right. Now "She wants \xA3400" means going back on his word. Say he answers: "Yeah, if she's fine, it's a deal." If he says "I'll see", he's keeping a second go open: "Why not ring her now?"`,subs:[]},{k:"A",ok:!1,text:`Leaves the door open. You'll usually get: "She thinks \xA3400's fairer."`,subs:[]},{k:"B",ok:!1,text:`Goes over his head once he's offered to check: "Nah, I'll handle it."`,subs:[]},{k:"C",ok:!1,text:`Drops \xA320 while he's "checking", before anyone's asked.`,subs:[]}]}},{n:3,fmt:"Say it",stem:[`You and your girlfriend, Ella, are joining a gym together. On the tour, the sales rep says: "If you sign up right now, I'll waive the \xA350 joining fee." You want to compare it with the gym down the road first. What's your best reply?`],quote:[],options:[{k:"A",t:`"Sounds good. I'll just talk it over with Ella first."`,ok:!0},{k:"B",t:'"If I join today, can you sign off the waiver yourself?"',ok:!1},{k:"C",t:'"OK, go on then. Sign me up now, before it goes."',ok:!1},{k:"D",t:'"Can I have a think about it and come back?"',ok:!1}],expl:{card:"The card: being pushed to decide? Say someone who really has a say must agree.",items:[{k:"A",ok:!0,text:`Right. Ella really is joining too, so the rep has nothing to push against. Say they answer: "The waiver's only today." Now you can say: "No problem. If it's still on when we're back, great."`,subs:[]},{k:"B",ok:!1,text:"The who-decides question, used on the wrong side: here you're the one being pushed.",subs:[]},{k:"C",ok:!1,text:"Signs before you've compared, for a \xA350 deadline.",subs:[]},{k:"D",ok:!1,text:`Makes it your doubt, so the rep works on it: "What's holding you back?"`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You've agreed with a florist's manager to build their website for \xA3400, going live on the 30th. She comes back: "The owner's happy with \xA3400, but he wants it live a week earlier." What's your best reply?`],quote:[],options:[{k:"A",t:`"OK, no problem at all. I'll get it done a week earlier."`,ok:!1},{k:"B",t:'"Then the price moves too: you can have it a week early for \xA3450."',ok:!0},{k:"C",t:`"OK, but I might need a bit extra for that, if that's alright with you?"`,ok:!1},{k:"D",t:'"OK. Can he let me know if anything else changes?"',ok:!1}],expl:{card:"The card: they reopen a deal? Reopen something too, with a price.",items:[{k:"B",ok:!0,text:`Right. Their extra demand now has a price. Say the manager answers: "Let me check with him." Often the earlier date quietly disappears, and if he really needs it, you're paid \xA350 for the rush.`,subs:[]},{k:"A",ok:!1,text:"Gives a week of your time away free.",subs:[]},{k:"C",ok:!1,text:`Reopens the price so vaguely it's easy to brush off: "It's only a week, surely?"`,subs:[]},{k:"D",ok:!1,text:`Gives the week away and invites the next squeeze: "Actually, he'd also like a blog page."`,subs:[]}]}},{n:5,fmt:"Type it",stem:[`You're buying an ex-display sofa at a furniture shop. Before you make your offer, type the question you'd ask so the assistant can't "check with the manager" after you've given your best number.`],quote:[],options:[],model:"If we agree a price, can you sign it off, or does it go to your manager?",checks:`contains one of: sign off, sign-off, signs off, sign it off, sign this off, decide, decides, decision, your call, the call, approve, authorise, authorize, OK it, okay it, OK a, okay a, yourself, anyone else, someone else, who else needs, who else has, manager, boss, final say, check with, on your own, upstairs, above you; contains "who" or the word "or"; contains none of: are you the one, are you the person, budget, looking at it, interested, better deal, cheaper, what he'd take, what she'd take, check with your manager for, ask your manager for, lowest, best price, most you, minimum, at least, can't go; no \xA3; contains "?"; 20 words or fewer. Whole words, any case.`,after:[`The card: before your number, find out who decides, with an "or" so it's easy to admit it isn't them.`,'Say they answer: "Anything over \xA3100 off needs my manager." Now you can say: "Could you grab her now, so we can agree it together?"','Fails: questions with no "or" or "who" ("Can you decide the price yourself?", "Are you the one who decides?"), which get a face-saving yes, and anything that invites a second go ("Could you check with your manager for a better deal?").'],modelRaw:'"If we agree a price, can you sign it off, or does it go to your manager?"'}],mission:`next time you're in a shop that can give discounts (a phone shop, a bike shop, a market stall), ask: "Can you agree a discount yourself, or does it go to someone else?" Note what they say.`},{id:"8.2",title:"Use your deadline, test theirs",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Choosing between two options by a set day? Tell them the day, as a plain fact, then make your ask."},{t:"quote",text:`"I'm choosing between this and one other by Friday."`}]},{h:"When to use it",items:[{t:"p",text:"You'll decide on a set day."},{t:"sit",text:"Two flats, two second-hand bikes, two clients who want the same week."}]},{h:"Why it works",items:[{t:"p",text:"Most people hide their deadline, thinking it gives away power. But a real deadline squeezes them too: if the day passes, they lose you."}]},{h:"Example",items:[{t:"sit",text:"Two removal firms have quoted, \xA3280 and \xA3320. You prefer the \xA3320 one, and you're booking one tomorrow."},{t:"say",who:"You",text:`"I'm booking one of two firms tomorrow. Could you do \xA3280?"`},{t:"say",who:"Them",text:`"We could do \xA3290, and we'll bring the boxes."`},{t:"p",text:"\xA330 off, because tomorrow they could lose the job."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:"Only reveal a deadline that costs THEM if it passes.",rest:"Keep these to yourself:"},{t:"bad",text:`"My tenancy ends on the 30th." \u2192 it says you're stuck.`},{t:"bad",text:`"I'm paying for a hotel every night." \u2192 a growing cost tells them stalling works.`},{t:"tip",n:2,title:"Say what happens on the day, as a fact.",rest:""},{t:"good",text:`"I'm signing with one of the two on Friday."`},{t:"bad",text:'"Could you let me know by Friday?" \u2192 missing it costs them nothing.'},{t:"bad",text:`"Agree by Friday or I'll go elsewhere." \u2192 a threat: they dig in.`},{t:"tip",n:3,title:"They set the deadline? Ask what happens if you miss it.",rest:"Never ask whether it's real: they'll say yes."},{t:"sit",text:"A gym says its joining offer ends tonight."},{t:"quote",text:'"What happens if I join on Monday?"'},{t:"p",text:'Fine either way? Say "No rush my side". It answers their deadline; it never replaces yours.'},{t:"tip",n:4,title:"Their deadline's real but too tight? Ask for one short, specific extension, with a reason:",rest:'"Could I confirm by 9pm, after my other viewing?" With a job offer, skip tip 3: do this, sounding keen (lesson 4.5).'}]},{h:"Evidence",items:[{t:"ev",label:"Some evidence",text:"Revealing a real deadline seemed to cut no-deals and win a bigger share, but the results were borderline and a repeat attempt failed (Gino and Moore, 2008). Time pressure making people give in is better tested (Stuhlmacher and colleagues, 1998)."}]}]}],know:!1},questions:[{n:1,fmt:"Say it",stem:[`You edit videos on the side. A caf\xE9 chain wants three short promos for \xA3600, filmed in March. Another client has also asked about March, and you've told them you'll confirm on Friday. The caf\xE9 owner replies to your quote: "Love it! Let us have a think and we'll come back to you." What's your best reply?`],quote:[],options:[{k:"A",t:`"Great! No pressure at all. Just let me know whenever you've decided."`,ok:!1},{k:"B",t:'"Great! Is there any chance you could get back to me by Friday?"',ok:!1},{k:"C",t:`"Great! I'm confirming my March bookings on Friday. Could you let me know by then?"`,ok:!0},{k:"D",t:'"Great! March is looking a bit quiet for me, so the sooner the better."',ok:!1}],expl:{card:"The card: tell them a real deadline that costs them, as a plain fact.",items:[{k:"C",ok:!0,text:`Right. If Friday passes, they lose March to the other client. Say they answer: "Can't you pencil us in?" Now you can say: "Only till 5pm Friday."`,subs:[]},{k:"A",ok:!1,text:"No deadline, so no reason to decide. You'll usually wait weeks.",subs:[]},{k:"B",ok:!1,text:`Nothing behind the day: missing Friday costs them nothing. You'll usually get: "We'll try!"`,subs:[]},{k:"D",ok:!1,text:"A deadline that only costs you: it says you need the work, so you'll usually get a lower offer.",subs:[]}]}},{n:2,fmt:"Sort it",stem:["You're flat-hunting. You like a flat at \xA31,050 a month (similar flats nearby are \xA31,000 to \xA31,075), and you're viewing another one on Thursday. Which of these would you tell the letting agent, and which would you keep to yourself?"],quote:[],options:[],sort:[{t:`"I'm seeing one other on Thursday and deciding on Friday."`,bin:"tell them: if your day passes, they lose you"},{t:`"I've handed in my notice and have to be out by the 30th."`,bin:"keep it: it only puts pressure on you"},{t:`"I'll pay a holding deposit on one of the two on Friday."`,bin:"tell them: if your day passes, they lose you"},{t:'"I need to have somewhere sorted by Friday."',bin:"keep it: it only puts pressure on you"},{t:`"I'm signing for one of the two this week."`,bin:"tell them: if your day passes, they lose you"},{t:`"I'm paying for a storage unit every week I'm waiting."`,bin:"keep it: it only puts pressure on you"}],expl:{card:"The card: only tell them a deadline that costs them if it passes.",items:[{label:"Tell them",text:`"deciding on Friday", "a holding deposit on one of the two" and "signing for one this week". Say the agent answers: "Let me speak to the landlord today." Now you can say: "At \xA31,000, I'd sign this one on Friday."`,subs:[]},{label:"Keep it",text:"",subs:[`"Out by the 30th" and "somewhere sorted by Friday" are your deadlines, not theirs. You'll usually get: "Better grab it, then."`,'"Storage every week" grows, so it tells them waiting works.']}]},bins:["tell them: if your day passes, they lose you","keep it: it only puts pressure on you"]},{n:3,fmt:"Say it",stem:[`You want a used road bike. Two on Marketplace fit you: one listed at \xA3330, and one you prefer at \xA3360. Similar ones sell for \xA3300 to \xA3340. You're seeing both on Saturday morning and will buy one of them that day. The \xA3360 seller hasn't mentioned any deadline. He messages: "Still on for Saturday?" What's your best reply?`],quote:[],options:[{k:"A",t:'"Yes! No rush my end, so if it sells before then, no worries. Would you take \xA3305?"',ok:!1},{k:"B",t:`"Yes! I'm seeing one other that morning and buying one of them. Would you take \xA3305?"`,ok:!0},{k:"C",t:'"Yes! I need one sorted before my new job starts. Would you take \xA3305?"',ok:!1},{k:"D",t:`"Yes! But if it's not \xA3305, I'll just buy the other one instead."`,ok:!1}],expl:{card:'The card: reveal a real deadline that costs them. "Fine either way" only answers theirs.',items:[{k:"B",ok:!0,text:`Right. If Saturday passes, he loses you to the other bike. Say he answers: "Could do \xA3340?" Now you can say: "\xA3312, and I'll bring cash."`,subs:[]},{k:"A",ok:!1,text:`The line for their deadline, throwing yours away. You'll usually get: "No worries, \xA3360 then."`,subs:[]},{k:"C",ok:!1,text:`A deadline that only costs you. You'll usually get: "Better be quick, then."`,subs:[]},{k:"D",ok:!1,text:`The right facts, said as a threat. You'll usually get: "Go for the other one, then."`,subs:[]}]}},{n:4,fmt:"Say it",stem:[`You're in a phone shop looking at SIM-only deals. Online, similar ones are \xA310 to \xA314 a month, and you want to compare them properly tonight. Your current deal runs to the end of next month. The salesperson says: "I can do you \xA312 a month, but that's only today. Tomorrow it's back to \xA315." What's your best reply?`],quote:[],options:[{k:"A",t:`"OK, if it's only today, I'll take the \xA312 now."`,ok:!1},{k:"B",t:'"Is that genuinely only today, or might it last?"',ok:!1},{k:"C",t:`"Come off it, that's just a line to get me to sign."`,ok:!1},{k:"D",t:'"What happens if I come back in on Saturday?"',ok:!0}],expl:{card:"The card: they set the deadline? Ask what happens if you miss it, never whether it's real.",items:[{k:"D",ok:!0,text:`Right. Say they answer: "Probably still on, but no promises." Now you can say: "Great. I'll compare tonight and come back Saturday." If they say "It really ends tonight", you've lost nothing: "If it's gone, it's gone."`,subs:[]},{k:"A",ok:!1,text:"Takes \xA312 before you've compared, because of a clock you can't check.",subs:[]},{k:"B",ok:!1,text:`Asks them to judge their own deadline. You'll usually get: "Yes, only today."`,subs:[]},{k:"C",ok:!1,text:"An accusation. You'll usually get the \xA315.",subs:[]}]}},{n:5,fmt:"Type it",stem:[`You're buying a used car privately. You've test-driven a Ford Fiesta listed at \xA34,200 (similar ones sell for \xA33,700 to \xA34,000). You're seeing another Fiesta on Friday, and you'll buy one of the two on Saturday. The first seller texts: "Any more thoughts on the car?" Type a reply that uses your deadline.`],quote:[],options:[],model:"Still keen! I'm seeing one other on Friday and buying one of the two on Saturday.",checks:"contains one of: decide, deciding, decision, choose, choosing, pick, picking, buy, buying, go with, going with, make my mind up, making my mind up; contains one of: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, fri, sat, tomorrow, tonight, today, this week, the weekend, this weekend; contains one of: other, another, one of, two, second, both, between, else, elsewhere; contains none of: no rush, no hurry, whenever, in your own time, or I'll, otherwise, unless, if you don't, if you can't, if not, or else, last chance, take it or leave it, final offer, need one, need a car, need it, need the car, need to have, have to have, got to have, gotta have, desperate, asap, urgent, for work, for my job, new job, commute, hold it, hold the car, keep it for me, save it, full price, asking price, lowest, best price, most you, minimum, at least, can't go; any \xA3 amount is under \xA34,000; 30 words or fewer. Whole words, any case.",after:["The card: tell them a real deadline that costs them if it passes, as a plain fact.",'The model answer means that if Saturday passes, he loses you to the other car. Say he answers: "Fair. What are you thinking on price?" Now you can say: "I could do \xA33,710, cash on Saturday."',`Fails: deadlines that only cost you ("I need a car for my new job"), threats ("\u2026or I'll buy the other one"), "no rush", and asking him to hold it.`],modelRaw:`"Still keen! I'm seeing one other on Friday and buying one of the two on Saturday."`}],mission:`next time you're choosing between two things (two phone deals, two second-hand listings, two quotes), pick the day you'll decide and tell both sides: "I'm choosing between yours and one other on Friday." Note which one moves first. If nothing's coming up this week, find one "ends tonight" or countdown deal online, check the same page two days later, and see whether it's really gone.`},{id:"8.3",title:"Paying? Talk total. Asking? Shrink it",guess:null,card:{sections:[{n:1,blocks:[{h:"The move",items:[{t:"p",text:"Buying on monthly payments? Don't name a monthly figure. Agree the total price first, with every fee in."},{t:"quote",text:`"What's the total I'd pay, start to finish?"`}]},{h:"When to use it",items:[{t:"p",text:"They ask what monthly payment you're after."},{t:"sit",text:'A car on finance, a phone on contract, a laptop on "pay later".'}]},{h:"Why it works",items:[{t:"p",text:"They can hit almost any monthly figure by stretching how long you pay, while the total climbs. Compare deals by their totals and the trick stops working."}]},{h:"Example",items:[{t:"sit",text:'A shop has a laptop at \xA3899, "or from \xA325 a month".'},{t:"say",who:"Salesperson",text:'"What sort of monthly are you looking for?"'},{t:"say",who:"You",text:`"What's the total I'd pay, start to finish?"`},{t:"say",who:"Salesperson",text:'"\xA325 for 48 months, so \xA31,200."'},{t:"p",text:"Now you can see the \xA3301 the monthly hid."}]}]},{n:2,blocks:[{h:"Get it right",items:[{t:"tip",n:1,title:'Skip "What makes you ask?" here (lesson 1.6).',rest:"You already know why they're asking, so just steer to the total."},{t:"tip",n:2,title:"Never haggle in their small unit.",rest:""},{t:"bad",text:'"Could you do \xA3139 a month?" \u2192 they just add months.'},{t:"p",text:"Comparing deals of different lengths? Compare their totals."},{t:"tip",n:3,title:"Asking people for money? Flip it: shrink the cos
